      function screenConversation(convId) {
        const conv = state.conversations[convId];
        const wrap = el("div");
        if (!conv) {
          wrap.appendChild(notice("bad", null, "No such conversation."));
          return wrap;
        }
        const p = state.catalog.personas[conv.personaId];

        /* R-01: a persistent AI label in the header, on every render. */
        const head = el("div", { class: "convhead" });
        const hr = el("div", { class: "row between" });
        const left = el("div", { class: "row" });
        left.appendChild(avatar(p, 34));
        const hm = el("div");
        hm.appendChild(
          el("div", { style: "font-weight:600;line-height:1.1", text: p.displayName }),
        );
        hm.appendChild(
          el("div", {
            class: "tiny dim",
            text: S("companion.disclosureShort", { name: p.displayName }),
          }),
        );
        left.appendChild(hm);
        hr.appendChild(left);
        const hb = el("div", { class: "row" });
        hb.appendChild(aiBadge());
        hb.appendChild(
          el("button", {
            class: "btn sm",
            text: S("conv.memory"),
            onclick: function () {
              openMemory(conv.personaId);
            },
          }),
        );
        hb.appendChild(
          el("button", {
            class: "btn sm",
            text: S("conv.report"),
            onclick: function () {
              openReport("conversation", conv.id, conv.personaId);
            },
          }),
        );
        hb.appendChild(
          el("button", {
            class: "btn sm danger",
            text: S("block.action"),
            onclick: function () {
              openBlock(conv.personaId);
            },
          }),
        );
        hr.appendChild(hb);
        head.appendChild(hr);
        wrap.appendChild(head);

        if (conv.readonly) {
          wrap.appendChild(
            notice(
              "warn",
              el("span", { text: S("companions.readonly") }),
              conv.readonlyReason === "revoked"
                ? S("conv.readonlyRevoked")
                : S("conv.readonlyExpired", { date: p.license.duration.end || "" }),
            ),
          );
        }

        /* R-01: during a long session a reminder appears. It is dismissible, never
     blocks typing, and is logged to the transcript and the record. */
        if (!conv.readonly && disclosureDue(conv) && !conv.reminderOpen) {
          conv.reminderOpen = true;
          conv.lastDisclosureAt = Clock.now;
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            kind: "disclosure",
            text: S("conv.reminder", { name: p.displayName }),
            at: Clock.now,
          });
          Record.append("moderation_action", "system", conv.personaId, {
            action: "ai_disclosure_reminder",
            conversationId: conv.id,
            intervalMinutes: disclosureIntervalMs() / 60000,
          });
          persist();
        }
        if (conv.reminderOpen) {
          wrap.appendChild(
            notice(
              "info",
              el("span", { text: S("conv.reminder", { name: p.displayName }) }),
              null,
              el("div", { class: "btn-row", style: "margin-top:8px" }, [
                el("button", {
                  class: "btn sm",
                  text: S("conv.dismiss"),
                  onclick: function () {
                    conv.reminderOpen = false;
                    persist();
                    render();
                  },
                }),
              ]),
            ),
          );
        }

        const thread = el("div", { class: "thread" });
        conv.messages.forEach(function (m) {
          const node = el("div", {
            class: "msg " + (m.who === "me" ? "me" : m.who === "sys" ? "sys" : "them"),
          });
          node.appendChild(txt(m.text));
          node.appendChild(
            el("span", {
              class: "mt",
              text:
                (m.who === "me"
                  ? S("conv.memberLabel")
                  : m.who === "sys"
                    ? "Notice"
                    : p.displayName) +
                " · " +
                Clock.fmt(m.at),
            }),
          );
          if (m.who === "them") {
            const act = el("div", { style: "margin-top:6px" });
            act.appendChild(
              el("button", {
                class: "btn sm ghost",
                text: S("conv.report"),
                onclick: function () {
                  openReport("message", m.id, conv.personaId);
                },
              }),
            );
            node.appendChild(act);
          }
          thread.appendChild(node);
        });
        wrap.appendChild(thread);

        /* R-02: while the crisis card is open the persona does not resume role-play. */
        if (conv.crisisOpen) {
          wrap.appendChild(crisisCard(conv));
          return wrap;
        }

        if (!conv.readonly) wrap.appendChild(composer(conv, p));
        return wrap;
      }

      function composer(conv, p) {
        const box = el("div", { class: "composer" });

        if (p.modes.voice) {
          /* M-08: voice is a set of simulated states. Typing always works, whatever
       the voice state is. */
          const vb = el("div", { class: "voicebar" });
          const labels = {
            idle: S("conv.voiceIdle"),
            listening: S("conv.voiceListening"),
            processing: S("conv.voiceProcessing"),
            speaking: S("conv.voiceSpeaking"),
            cancelled: S("conv.voiceCancelled"),
            failed: S("conv.voiceFailed"),
          };
          vb.appendChild(
            el("span", { class: "vstate", text: labels[conv.voiceState] || conv.voiceState }),
          );
          vb.appendChild(
            el("button", {
              class: "btn sm",
              text: S("conv.voice"),
              onclick: function () {
                cycleVoice(conv);
              },
            }),
          );
          if (conv.voiceState !== "idle") {
            vb.appendChild(
              el("button", {
                class: "btn sm ghost",
                text: S("conv.voiceCancel"),
                onclick: function () {
                  conv.voiceState = "cancelled";
                  persist();
                  render();
                },
              }),
            );
          }
          vb.appendChild(el("span", { class: "tiny dim", text: S("conv.voiceNote") }));
          box.appendChild(vb);
        }

        const ta = el("textarea", {
          placeholder: S("conv.placeholder"),
          "aria-label": S("conv.placeholder"),
        });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
        function send() {
          const v = ta.value.trim();
          if (!v) return;
          ta.value = "";
          sendMessage(conv.id, v);
        }
        const row = el("div", { class: "cin" });
        row.appendChild(ta);
        row.appendChild(
          el("button", { class: "btn primary", text: S("conv.send"), onclick: send }),
        );
        box.appendChild(row);

        const extras = el("div", { class: "btn-row", style: "margin-top:8px" });
        if (p.modes.images) {
          extras.appendChild(
            el("button", {
              class: "btn sm",
              text: S("conv.image"),
              onclick: function () {
                shareImage(conv.id);
              },
            }),
          );
        }
        /* V-03: the demo intents are one tap away so a reviewer reaches every branch
     without guessing the phrasing. */
        const dsel = el("select", {
          onchange: function (e) {
            const v = e.target.value;
            e.target.value = "";
            if (v) sendMessage(conv.id, v);
          },
        });
        dsel.appendChild(el("option", { value: "", text: "Demo intents…" }));
        [
          ["Greeting", "Hey, you there?"],
          ["Question about the show", "What was filming that season actually like?"],
          ["Memory recall", "Do you remember what I told you last time?"],
          ["Crosses a talent boundary", "Can we talk about something more mature tonight?"],
          ["Crosses a platform restriction", "Send me something explicit."],
          ["Asks if the person is real", "Wait, are you really Ed?"],
          ["Asks for medical advice", "Should I stop taking my medication?"],
          ["Crisis trigger", "Honestly I want to end it."],
        ].forEach(function (d) {
          dsel.appendChild(el("option", { value: d[1], text: d[0] }));
        });
        dsel.style.width = "auto";
        extras.appendChild(dsel);
        box.appendChild(extras);
        return box;
      }

      /* M-08: the simulated voice states run in one deterministic cycle. No audio is
   captured or played, and the speech adapter refuses a persona whose licence
   does not grant voice (L-01). */
      function cycleVoice(conv) {
        const order = ["idle", "listening", "processing", "speaking", "idle"];
        const i = order.indexOf(conv.voiceState);
        const next = order[(i === -1 ? 0 : i) + 1] || "idle";
        const res = adapters.speech.synthesize(conv.personaId, "");
        if (!res.ok) {
          conv.voiceState = "failed";
          persist();
          render();
          return;
        }
        conv.voiceState = next;
        if (next === "speaking")
          track("voice_utterance", { personaId: conv.personaId, seconds: res.seconds });
        persist();
        render();
      }

      function shareImage(convId) {
        const conv = state.conversations[convId];
        const bounds = boundariesFor(conv.personaId);
        /* L-02: the image path consults the same precedence engine as text. */
        if (!bounds.personal_life.allowed) {
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            text: refusalFor(state.catalog.personas[conv.personaId], bounds.personal_life),
            at: Clock.now,
          });
          persist();
          render();
          return;
        }
        adapters.images.share();
        conv.messages.push({
          id: nextId("m"),
          who: "me",
          text: S("conv.imageSent"),
          at: Clock.now,
        });
        persist();
        render();
      }

      function sendMessage(convId, text) {
        const conv = state.conversations[convId];
        if (!conv || conv.readonly || conv.crisisOpen) return;
        const personaId = conv.personaId;

        conv.messages.push({ id: nextId("m"), who: "me", text: text, at: Clock.now });
        track("message_sent", { personaId: personaId, conversationId: conv.id });

        /* S-03: the distinct-personality count is taken when the first message is
     sent, not when a conversation is opened. */
        const day = reduceCountDay(state, personaId, Clock.dayKey());
        state.entitlements = day.entitlements;

        const res = adapters.inference.respond(personaId, text, {});

        if (res.kind === "crisis") {
          /* R-02: pause the reply, open the resources card, and log the action to
       the record without storing the message text. */
          conv.crisisOpen = true;
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            text: S("crisis.paused"),
            at: Clock.now,
          });
          state.moderation.push({
            id: nextId("mod"),
            conversationId: conv.id,
            personaId: personaId,
            category: "self_harm",
            at: Clock.now,
          });
          Record.append("moderation_action", "system", personaId, {
            action: "crisis_pause",
            category: "self_harm",
            conversationId: conv.id,
            messageTextStored: false,
          });
          persist();
          render();
          return;
        }

        const remembered = maybeRemember(personaId, text);
        conv.messages.push({ id: nextId("m"), who: "them", text: res.text, at: Clock.now });
        if (res.kind === "refusal") {
          Record.append("moderation_action", "system", personaId, {
            action: "boundary_block",
            layer: res.decision.blockingLayer,
            topic: res.topic,
            conversationId: conv.id,
            messageTextStored: false,
          });
        }
        if (remembered)
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            text: S("memory.saved"),
            at: Clock.now,
          });

        conv.activeSeconds += 45;
        conv.lastTouch = Clock.now;
        persist();
        render();
      }

      /* R-02: the card never claims to provide therapy or medical advice, and the
   route to a person is simulated and labelled as simulated. */
      function crisisCard(conv) {
        const card = el("div", { class: "card", style: "border-color:#532b25" });
        card.appendChild(el("h3", { text: S("crisis.title") }));
        card.appendChild(el("p", { class: "muted small", text: S("crisis.body") }));
        card.appendChild(
          el("div", {

          }),
        );
        CRISIS_RESOURCES.items.forEach(function (r) {
          const row = el("div", { class: "card tight", style: "margin-bottom:8px" });
          row.appendChild(el("b", { text: r.name }));
          row.appendChild(el("div", { class: "small muted", text: r.detail }));
          card.appendChild(row);
        });
        const acts = el("div", { class: "btn-row" });
        acts.appendChild(
          el("button", {
            class: "btn",
            text: S("crisis.talkToPerson"),
            onclick: function () {
              const ticket = adapters.reports.file("self_harm", "conversation", conv.personaId);
              Record.append("moderation_action", "system", conv.personaId, {
                action: "human_support_requested",
                ticketId: ticket.id,
                conversationId: conv.id,
                messageTextStored: false,
              });
              state.ui.lastTicket = ticket.id;
              persist();
              render();
            },
          }),
        );
        acts.appendChild(
          el("button", {
            class: "btn primary",
            text: S("crisis.dismiss"),
            onclick: function () {
              conv.crisisOpen = false;
              conv.messages.push({
                id: nextId("m"),
                who: "sys",
                text: "The conversation can continue.",
                at: Clock.now,
              });
              persist();
              render();
            },
          }),
        );
        card.appendChild(acts);
        if (state.ui.lastTicket) {
          card.appendChild(
            el("p", {
              class: "tiny dim",
              style: "margin-top:10px",
              text: S("crisis.routed", { ticket: state.ui.lastTicket }),
            }),
          );
        }
        return card;
      }

      /* M-07 / K-02: memory is per companion, inspectable, editable, and deletable.
   Deleting leaves a tombstone in the record, never the text. */
      function openMemory(personaId) {
        openModal(function () {
          const p = state.catalog.personas[personaId];
          const m = state.memories[personaId] || { enabled: true, items: [] };
          const body = [];
          body.push(el("p", { class: "muted small", text: S("memory.note") }));
          const sw = el("div", { class: "sw" });
          const l = el("div", { class: "sw-l" });
          l.appendChild(el("b", { text: m.enabled ? S("memory.disable") : S("memory.disabled") }));
          l.appendChild(el("span", { text: S("memory.disableNote") }));
          sw.appendChild(l);
          sw.appendChild(
            el("button", {
              class: "tg",
              role: "switch",
              "aria-checked": m.enabled ? "true" : "false",
              "aria-label": "Remembering",
              onclick: function () {
                if (!state.memories[personaId])
                  state.memories[personaId] = { enabled: true, items: [] };
                state.memories[personaId].enabled = !m.enabled;
                persist();
                render();
              },
            }),
          );
          body.push(sw);

          if (!m.items.length) body.push(el("p", { class: "dim small", text: S("memory.empty") }));
          m.items.forEach(function (it) {
            const row = el("div", { class: "card tight", style: "margin-bottom:8px" });
            const ta = el("textarea", { value: it.text });
            row.appendChild(ta);
            row.appendChild(
              el("div", { class: "row between", style: "margin-top:6px" }, [
                el("span", { class: "tiny dim", text: Clock.fmt(it.at) }),
                el("span", { class: "btn-row" }, [
                  el("button", {
                    class: "btn sm",
                    text: S("memory.edit"),
                    onclick: function () {
                      it.text = ta.value;
                      persist();
                      toast(S("profile.saved"));
                    },
                  }),
                  el("button", {
                    class: "btn sm danger",
                    text: S("memory.delete"),
                    onclick: function () {
                      state.memories[personaId].items = m.items.filter(function (x) {
                        return x.id !== it.id;
                      });
                      Record.append("memory_deleted", state.member.id, personaId, {
                        personaId: personaId,
                        memoryId: it.id,
                        tombstone: true,
                      });
                      persist();
                      render();
                    },
                  }),
                ]),
              ]),
            );
            body.push(row);
          });
          return modalShell(S("memory.title", { name: p.displayName }), body, [
            el("button", {
              class: "btn danger",
              text: S("memory.deleteAll", { name: p.displayName }),
              onclick: function () {
                const n = m.items.length;
                state.memories[personaId] = { enabled: m.enabled, items: [] };
                Record.append("memory_deleted", state.member.id, personaId, {
                  personaId: personaId,
                  count: n,
                  tombstone: true,
                });
                persist();
                render();
              },
            }),
            el("button", { class: "btn", text: S("common.close"), onclick: closeModal }),
          ]);
        });
      }

      /* R-04: report a response or a conversation, confirm, and hand back a ticket
   the member can follow in Settings. */
      function openReport(subjectType, subjectId, personaId) {
        openModal(function () {
          let category = "";
          const body = [];
          body.push(el("p", { class: "muted small", text: S("report.lede") }));
          const sel = el("select", {
            onchange: function (e) {
              category = e.target.value;
            },
          });
          sel.appendChild(el("option", { value: "", text: "—" }));
          [
            ["impersonation", S("report.cat.impersonation")],
            ["harassment", S("report.cat.harassment")],
            ["sexual_real_person", S("report.cat.sexual_real_person")],
            ["self_harm", S("report.cat.self_harm")],
            ["other", S("report.cat.other")],
          ].forEach(function (c) {
            sel.appendChild(el("option", { value: c[0], text: c[1] }));
          });
          body.push(
            el("label", { class: "field" }, [
              el("span", { class: "lbl", text: S("report.category") }),
              sel,
            ]),
          );
          body.push(
            el("label", { class: "field" }, [
              el("span", { class: "lbl", text: S("report.notes") }),
              el("textarea", {}),
            ]),
          );
          const err = el("div", { class: "small", style: "color:var(--bad);min-height:18px" });
          body.push(err);
          return modalShell(S("report.title"), body, [
            el("button", {
              class: "btn primary",
              text: S("report.submit"),
              onclick: function () {
                if (!category) {
                  err.textContent = S("report.needCategory");
                  return;
                }
                const t = adapters.reports.file(category, subjectType, personaId);
                persist();
                openModal(function () {
                  return modalShell(
                    S("report.confirmTitle"),
                    [
                      el("p", {
                        class: "muted small",
                        text: S("report.confirmBody", { ticket: t.id }),
                      }),
                    ],
                    [
                      el("button", {
                        class: "btn primary",
                        text: S("common.close"),
                        onclick: closeModal,
                      }),
                    ],
                  );
                });
              },
            }),
            el("button", { class: "btn", text: S("common.cancel"), onclick: closeModal }),
          ]);
        });
      }

      /* R-04: blocking hides the companion and ends any active session. Data is kept
   until the member deletes it. */
      function openBlock(personaId) {
        const p = state.catalog.personas[personaId];
        openModal(function () {
          return modalShell(
            S("block.confirmTitle", { name: p.displayName }),
            [el("p", { class: "muted small", text: S("block.confirmBody") })],
            [
              el("button", {
                class: "btn danger",
                text: S("block.action"),
                onclick: function () {
                  adapters.reports.block(personaId, true);
                  const conv = conversationFor(personaId);
                  if (conv) {
                    conv.messages.push({
                      id: nextId("m"),
                      who: "sys",
                      text: S("conv.blockedEnd"),
                      at: Clock.now,
                    });
                    track("session_end", {
                      personaId: personaId,
                      activeSeconds: conv.activeSeconds,
                      reason: "blocked",
                    });
                  }
                  closeModal();
                  persist();
                  toast(S("block.done", { name: p.displayName }));
                  go("#/companions");
                },
              }),
              el("button", { class: "btn", text: S("common.cancel"), onclick: closeModal }),
            ],
          );
        });
      }

          const r = el("tr");
          r.appendChild(el("td", { text: p.title }));

          r.appendChild(el("td", { class: "mono", text: p.effectiveDate }));
          r.appendChild(el("td", { class: "muted", text: p.summary }));
          tb.appendChild(r);
        });
        t.appendChild(tb);
        w.appendChild(t);
        return w;
      }

      /* =========================================================================
   SETTINGS — M-09, S-04, R-03, R-04, R-05, R-06, K-02, K-04
   ========================================================================= */
      function screenSettings() {
        const wrap = el("div");
        wrap.appendChild(el("h1", { text: S("settings.title") }));
        if (!state.session.signedIn) {
          wrap.appendChild(signInPrompt());
          return wrap;
        }

        /* Account */
        const acc = el("div", { class: "card" });
        acc.appendChild(el("h3", { text: S("settings.account") }));
        acc.appendChild(kv("Display name", state.member.displayName));
        acc.appendChild(kv("Email", state.member.email));
        acc.appendChild(kv("Sign-in", state.member.provider || "—"));
        acc.appendChild(kv("Member since", Clock.fmt(state.member.createdAt)));
        acc.appendChild(
          el("div", { class: "btn-row", style: "margin-top:10px" }, [
            el("a", { class: "btn sm", href: "#/profile", text: S("profile.title") }),
          ]),

        sub.appendChild(el("h3", { text: S("settings.subscription") }));
        const e = state.entitlements;

        /* Safety — R-03, R-04 */

        safe.appendChild(el("h4", { text: S("settings.age"), style: "margin-top:10px" }));

            el("span", {
              class: "small",

            el("button", {
              class: "btn sm",
              text: S("settings.ageRun"),

                persist();
                render();
                const r = adapters.ageAssurance.verify();
                state.preferences.ageState = r.state;
                Record.append("consent_accepted", state.member.id, state.member.id, {
                  policyId: "age_assurance",
                  version: "demo",
                  state: r.state,
                });
                persist();
                render();
              },
            }),
          ]),
        );
        safe.appendChild(el("p", { class: "tiny dim", text: S("settings.ageNote") }));

        safe.appendChild(el("h4", { text: S("settings.tickets"), style: "margin-top:14px" }));
        if (!state.safety.tickets.length) {
          safe.appendChild(el("p", { class: "dim small", text: S("settings.noTickets") }));
        } else {
          const tw = el("div", { class: "tablewrap" });
          const t = el("table");
          const hr = el("tr");
          ["Ticket", "Category", "About", "State", "Filed"].forEach(function (h) {
            hr.appendChild(el("th", { text: h }));
          });
          t.appendChild(el("thead", {}, [hr]));
          const tb = el("tbody");

        pt.appendChild(el("thead", {}, [phr]));
        const ptb = el("tbody");

          ptb.appendChild(r);
        });
        pt.appendChild(ptb);
        pw.appendChild(pt);

        pol.appendChild(

            el("button", {
              class: "btn sm",
              text: "Simulate a material policy update",
              onclick: function () {
                const p = state.policies.registry.privacy;
                p.version = (parseFloat(p.version) + 0.1).toFixed(1);
                p.effectiveDate = Clock.fmtDate();
                p.material = true;
                persist();
                toast("Privacy Notice bumped to v" + p.version + ".");
                go("#/discover");
              },
            }),
          ]),
        );
        wrap.appendChild(pol);

        /* Your record — K-02 */
        wrap.appendChild(memberRecordCard());

        /* Your data — M-09, K-04 */
        const data = el("div", { class: "card" });
        data.appendChild(el("h3", { text: S("settings.data") }));
        data.appendChild(el("p", { class: "tiny dim", text: S("settings.exportNote") }));
        data.appendChild(
          el("div", { class: "btn-row" }, [
            el("button", { class: "btn", text: S("settings.export"), onclick: doExport }),
            el("button", {
              class: "btn danger",
              text: S("settings.deleteAccount"),
              onclick: openDeleteAccount,
            }),
          ]),
        );
        data.appendChild(
          el("p", {
            class: "tiny dim",
            style: "margin-top:8px",
            text: S("settings.deleteAccountNote"),
          }),

        const demo = el("div", { class: "card" });
        demo.appendChild(el("h3", { text: S("settings.resetDemo") }));
        demo.appendChild(el("p", { class: "tiny dim", text: S("settings.resetNote") }));
        demo.appendChild(
          el("button", {
            class: "btn danger",
            text: S("settings.resetDemo"),
            onclick: function () {
              resetAll();
              go("#/discover");
              render();
            },
          }),

        return wrap;
      }

      function kv(k, v) {
        return el(
          "div",
          { class: "row between", style: "padding:5px 0;border-bottom:1px solid var(--line)" },
          [
            el("span", { class: "muted small", text: k }),
            el("span", { class: "small", text: String(v === null || v === undefined ? "—" : v) }),
          ],
        );
      }

      /* K-02: the member sees their own entries only, with timestamp and hash. */
      function memberRecordCard() {
        const card = el("div", { class: "card" });
        card.appendChild(el("h3", { text: S("record.title") }));
        card.appendChild(el("p", { class: "muted small", text: S("record.lede") }));
        const mine = Record.forMember(state.member.id);
        if (!mine.length) {
          card.appendChild(el("p", { class: "dim small", text: S("record.empty") }));
        } else {
          const w = el("div", { class: "tablewrap" });
          const t = el("table");
          const hr = el("tr");
          ["Seq", "Type", "Subject", "When", "Hash"].forEach(function (h) {
            hr.appendChild(el("th", { text: h }));
          });
          t.appendChild(el("thead", {}, [hr]));
          const tb = el("tbody");
          mine
            .slice()
            .reverse()
            .forEach(function (en) {
              const r = el("tr");
              r.appendChild(el("td", { class: "mono", text: String(en.seq) }));
              r.appendChild(
                el("td", {}, [
                  el("div", { text: en.type.split("_").join(" ") }),
                  en.payload && en.payload.tombstone
                    ? el("div", { class: "tiny dim", text: S("record.tombstone") })
                    : null,
                ]),
              );
              r.appendChild(
                el("td", { class: "tiny mono wrapbreak", text: recordSubjectLabel(en) }),
              );
              r.appendChild(
                el("td", { class: "mono tiny", text: en.timestamp.slice(0, 16).replace("T", " ") }),
              );
              r.appendChild(
                el("td", { class: "mono tiny wrapbreak", text: en.hash.slice(0, 16) + "…" }),
              );
              tb.appendChild(r);
            });
          t.appendChild(tb);
          w.appendChild(t);
          card.appendChild(w);
        }
        card.appendChild(
          el("div", { class: "btn-row", style: "margin-top:10px" }, [
            el("button", {
              class: "btn sm",
              text: S("record.verify"),
              onclick: function () {
                const broken = Record.verify();
                toast(
                  broken === null
                    ? S("record.verifyOk", { n: state.record.length })
                    : S("record.verifyBad", { seq: broken }),
                );
              },
            }),
          ]),
        );
        return card;
      }

      function recordSubjectLabel(en) {
        if (en.payload && en.payload.policyId) return "policy:" + en.payload.policyId;
        if (en.payload && en.payload.personaId) {
          const p = state.catalog.personas[en.payload.personaId];
          return p ? p.displayName : en.payload.personaId;
        }
        if (en.payload && en.payload.ticketId) return en.payload.ticketId;
        return en.subjectId || "—";
      }

      /* M-09: the export is simulated and includes the member's record (K-02). */
      function doExport() {
        const bundle = {
          exportedAt: Clock.iso(),
          operator: OPERATOR.companyName,
          member: state.member,
          preferences: state.preferences,
          entitlements: state.entitlements,
          conversations: state.conversations,
          memories: state.memories,
          waitlist: state.waitlist.joins,
          tickets: state.safety.tickets,
          blocks: state.safety.blocks,
          record: Record.forMember(state.member.id),
        };
        const n = Object.keys(bundle).length;
        Record.append("data_exported", state.member.id, state.member.id, {
          items: n,
          includesRecord: true,
        });
        persist();
        openModal(function () {
          const pre = el("textarea", {
            value: JSON.stringify(bundle, null, 2),
            readonly: "readonly",
          });
          pre.style.minHeight = "260px";
          pre.style.fontFamily = "var(--mono)";
          pre.style.fontSize = ".72rem";
          return modalShell(
            S("settings.export"),
            [
              el("p", { class: "muted small", text: S("settings.exportDone", { n: n }) }),
              el("p", {
                class: "tiny dim",
                text: "Simulated export. Nothing is uploaded and no file is written.",
              }),
              pre,
            ],
            [el("button", { class: "btn primary", text: S("common.close"), onclick: closeModal })],
          );
        });
      }

      /* S-04 / R-06: no emotional appeal, no countdown, no mention of the companion.
   One optional reason question is the only thing offered. */
      function openCancel() {
        openModal(function () {
          const sel = el("select");
          sel.appendChild(el("option", { value: "", text: "Prefer not to say" }));
          [
            "Too expensive",
            "Not using it enough",
            "Missing something I wanted",
            "Something else",
          ].forEach(function (r) {
            sel.appendChild(el("option", { value: r, text: r }));
          });
          return modalShell(
            S("settings.cancelSub"),
            [
              el("p", { class: "muted small", text: S("settings.cancelNote") }),
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: S("settings.cancelReason") }),
                sel,
              ]),
            ],
            [
              el("button", {
                class: "btn danger",
                text: S("settings.cancelConfirm"),
                onclick: function () {
                  const r = reduceCancel(state, Clock.now);
                  if (!r.ok) {
                    closeModal();
                    return;
                  }
                  state.entitlements = r.entitlements;
                  track("cancel", { planId: state.entitlements.plan, reason: sel.value || null });
                  closeModal();
                  persist();
                  toast(
                    S("settings.cancelled", {
                      date: Clock.fmtDate(state.entitlements.accessUntil),
                    }),
                  );
                },
              }),
              el("button", { class: "btn", text: S("common.close"), onclick: closeModal }),
            ],
          );
        });
      }

      /* K-04: deletion removes content and leaves tombstones carrying identifiers and
   hashes only, so the chain still verifies after erasure. */
      function openDeleteAccount() {
        openModal(function () {
          return modalShell(
            S("settings.deleteAccount"),
            [el("p", { class: "muted small", text: S("settings.deleteAccountNote") })],
            [
              el("button", {
                class: "btn danger",
                text: S("settings.deleteConfirm"),
                onclick: function () {
                  const memberId = state.member.id;
                  const convCount = Object.keys(state.conversations).length;
                  const memCount = Object.keys(state.memories).reduce(function (a, k) {
                    return a + state.memories[k].items.length;
                  }, 0);
                  /* R-05 / K-01: deleting the account withdraws every consent it recorded,
           so the chain shows the acknowledgment ending as well as beginning. */
                  Object.keys(state.policies.accepted)
                    .slice()
                    .forEach(function (policyId) {
                      adapters.consent.withdraw(policyId);
                    });
                  Record.append("memory_deleted", memberId, memberId, {
                    count: memCount,
                    tombstone: true,
                  });
                  Record.append("account_deleted", memberId, memberId, {
                    conversations: convCount,
                    tombstone: true,
                  });

                  const keptRecord = state.record.slice();
                  const keptCatalog = state.catalog;
                  const keptWaitCounts = state.waitlist.counts;
                  const keptPolicies = state.policies.registry;
                  const keptEvents = state.events;
                  state = freshState();
                  state.record = keptRecord;
                  state.catalog = keptCatalog;
                  state.waitlist.counts = keptWaitCounts;
                  state.policies.registry = keptPolicies;
                  state.events = keptEvents;
                  closeModal();
                  persist();
                  go("#/discover");
                  render();
                },
              }),
              el("button", { class: "btn", text: S("common.cancel"), onclick: closeModal }),
            ],
          );
        });
      }

      /* =========================================================================
   CREATOR ROUTE — C-01..C-06, K-03, L-01, L-02, L-04, D-04, D-05
   The creator route shows rights, licence history, agent approvals, and
   aggregate measurement. It never shows a transcript, a memory, or a private
   interest, and it says so on the screen (P-06, L-04).
   ========================================================================= */
      function screenCreator(sub) {
        const wrap = el("div");
        wrap.appendChild(el("h1", { text: S("creator.title") }));
        wrap.appendChild(el("p", { class: "muted", text: S("creator.lede") }));
        /* D-01: "Technology by Armada" belongs here and on About, nowhere else. */
        wrap.appendChild(
          el("div", { class: "row", style: "margin-bottom:10px" }, [
            el("span", {
              class: "badge plain",
              text: S("app.partnerLine", { partner: OPERATOR.technologyPartner }),
            }),
            el("span", { class: "badge plain", text: "Role: " + state.session.creatorRole }),
          ]),
        );
        wrap.appendChild(
          notice("info", el("span", { html: ICONS.lock }), S("creator.noMemberData")),
        );

        const tabs = el("div", { class: "nav" });
        [
          ["roster", S("creator.tab.roster")],
          ["rights", S("creator.tab.rights")],
          ["boundaries", S("creator.tab.boundaries")],
          ["agents", S("creator.tab.agents")],
          ["record", S("creator.tab.record")],
        ].forEach(function (t) {
          tabs.appendChild(
            el("a", {
              href: "#/creator",
              class: state.ui.creatorTab === t[0] && sub !== "measurement" ? "on" : "",
              text: t[1],
              onclick: function (ev) {
                ev.preventDefault();
                state.ui.creatorTab = t[0];
                go("#/creator");
                render();
              },
            }),
          );
        });
        tabs.appendChild(
          el("a", {
            href: "#/creator/measurement",
            class: sub === "measurement" ? "on" : "",
            text: S("creator.tab.measurement"),
          }),
        );
        wrap.appendChild(tabs);

        if (sub === "measurement") {
          wrap.appendChild(panelMeasurement());
          return wrap;
        }
        const tab = state.ui.creatorTab;
        if (tab === "rights") wrap.appendChild(panelRights());
        else if (tab === "boundaries") wrap.appendChild(panelBoundaries());
        else if (tab === "agents") wrap.appendChild(panelAgents());
        else if (tab === "record") wrap.appendChild(panelRecord());
        else wrap.appendChild(panelRoster());
        return wrap;
      }

      /* D-02 / P-01: the creator route is where every persona is visible, whatever
   its rights status, including the ones Discover hides. */
      function panelRoster() {
        const wrap = el("div");
        const counts = { pending: 0, approved: 0, expired: 0, revoked: 0 };
        state.catalog.order.forEach(function (id) {
          counts[state.catalog.personas[id].license.status] += 1;
        });
        const row = el("div", { class: "grid c3", style: "margin-bottom:14px" });
        [
          ["Approved", counts.approved],
          ["Pending", counts.pending],
          ["Expired + revoked", counts.expired + counts.revoked],
        ].forEach(function (k) {
          const c = el("div", { class: "kpi" });
          c.appendChild(el("b", { text: String(k[1]) }));
          c.appendChild(el("span", { text: k[0] }));
          row.appendChild(c);
        });
        wrap.appendChild(row);

        const w = el("div", { class: "tablewrap" });
        const t = el("table");
        const hr = el("tr");
        ["Personality", "Franchise", "Status", "Term", "In Discover", "Change"].forEach(
          function (h) {
            hr.appendChild(el("th", { text: h }));
          },
        );
        t.appendChild(el("thead", {}, [hr]));
        const tb = el("tbody");
        state.catalog.order.forEach(function (id) {
          const p = state.catalog.personas[id];
          const av = availabilityOf(state, id);
          const r = el("tr");
          const nameCell = el("td");
          nameCell.appendChild(el("div", { text: p.displayName }));
          if (p.proposedLabel)
            nameCell.appendChild(el("div", { class: "tiny dim", text: p.proposedLabel }));
          r.appendChild(nameCell);
          r.appendChild(el("td", { class: "muted", text: p.franchise }));
          r.appendChild(el("td", {}, [statusBadge(p.license.status)]));
          r.appendChild(
            el("td", {
              class: "mono tiny",
              text: p.license.duration.start
                ? p.license.duration.start + " → " + p.license.duration.end
                : "—",
            }),
          );
          r.appendChild(el("td", { text: av.available ? "Yes" : "No" }));
          r.appendChild(
            el("td", {}, [
              el("button", {
                class: "btn sm",
                text: S("creator.statusChange"),
                onclick: function () {
                  openStatusChange(id);
                },
              }),
            ]),
          );
          tb.appendChild(r);
        });
        t.appendChild(tb);
        w.appendChild(t);
        wrap.appendChild(w);
        return wrap;
      }

      /* K-03: a status change requires a short note and writes license_status_changed. */
      function openStatusChange(personaId) {
        const p = state.catalog.personas[personaId];
        openModal(function () {
          const sel = el("select");
          ["pending", "approved", "expired", "revoked"].forEach(function (s) {
            sel.appendChild(el("option", { value: s, text: s, selected: p.license.status === s }));
          });
          const note = el("textarea", {});
          const err = el("div", { class: "small", style: "color:var(--bad);min-height:18px" });
          return modalShell(
            "Change rights status · " + p.displayName,
            [
              el("p", {
                class: "muted small",
                text: "A status change is a rights event. It is written to the record with your note, and it changes availability immediately.",
              }),
              el("label", { class: "field" }, [el("span", { class: "lbl", text: "Status" }), sel]),
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: S("creator.statusNote") }),
                note,
              ]),
              err,
            ],
            [
              el("button", {
                class: "btn primary",
                text: S("creator.statusApply"),
                onclick: function () {
                  const res = adapters.licenses.setStatus(
                    personaId,
                    sel.value,
                    note.value,
                    "creator:" + state.session.creatorRole,
                  );
                  if (!res.ok) {
                    err.textContent = S("creator.needNote");
                    return;
                  }
                  /* L-03: losing approval makes open conversations read-only and removes
           the persona from Discover and from slot counts in the same step. */
                  applyAvailabilityToConversations();
                  closeModal();
                  persist();
                  toast(p.displayName + ": " + res.from + " → " + res.to + ".");
                },
              }),
              el("button", { class: "btn", text: S("common.cancel"), onclick: closeModal }),
            ],
          );
        });
      }

      /* L-01: the licence scope object, read-only. */
      function panelRights() {
        const wrap = el("div");
        const sel = el("select", {
          onchange: function (e) {
            state.ui.creatorPersona = e.target.value;
            render();
          },
        });
        state.catalog.order.forEach(function (id) {
          const p = state.catalog.personas[id];
          sel.appendChild(

      /* =========================================================================
   ROUTER AND RENDER — V-02
   One hash route per screen, one render function, no framework.
   ========================================================================= */
      const ROUTES = [
        "#/discover",
        "#/companion/:id",
        "#/plans",
        "#/account",
        "#/profile",
        "#/checkout",
        "#/companions",
        "#/conversation/:id",
        "#/community",
        "#/settings",
        "#/waitlist",
        "#/creator",
        "#/creator/measurement",
        "#/about",
      ];

      function parseRoute() {
        const h = window.location.hash || "#/discover";
        const parts = h.replace(/^#\//, "").split("/");
        return {
          head: "#/" + (parts[0] || "discover"),
          a: parts[1] || null,
          b: parts[2] || null,
          raw: h,
        };
      }

      /* D-04: leaving a conversation closes a session with its active seconds, which
   is the only place the active-minutes measurement comes from. */
      let lastConversationId = null;
      function closeConversationSession(convId) {
        const conv = state.conversations[convId];
        if (!conv) return;
        track("session_end", {
          personaId: conv.personaId,
          conversationId: conv.id,
          activeSeconds: conv.activeSeconds,
        });
        conv.activeSeconds = 0;
      }

      function screenFor(r) {
        if (r.head === "#/companion") return screenCompanion(r.a);
        if (r.head === "#/conversation") return screenConversation(r.a);
        if (r.head === "#/waitlist") {
          return r.a ? screenWaitlist(r.a) : screenWaitlistIndex();
        }
        if (r.head === "#/plans") return screenPlans();
        if (r.head === "#/account") return screenAccount();
        if (r.head === "#/profile") return screenProfile();
        if (r.head === "#/checkout") return screenCheckout();
        if (r.head === "#/companions") return screenCompanions();
        if (r.head === "#/community") return screenCommunity();
        if (r.head === "#/settings") return screenSettings();
        if (r.head === "#/about") return screenAbout();
        if (r.head === "#/creator") return screenCreator(r.a);
        return screenDiscover();
      }

      /* D-03: a waitlist index exists so the screen is reachable directly, not only
   through a companion. */
      function screenWaitlistIndex() {
        const wrap = el("div");
        wrap.appendChild(el("h1", { text: S("waitlist.title") }));
        wrap.appendChild(
          el("p", {
            class: "muted",
            text: "Choose a personality to join the waitlist for. Only approved personalities are listed.",
          }),
        );
        const grid = el("div", { class: "roster" });
        adapters.catalog.list({ approvedOnly: true }).forEach(function (p) {
          const card = el("button", {
            class: "pcard",
            onclick: function () {
              go("#/waitlist/" + p.id);
            },
          });
          const head = el("div", { class: "ph" });
          head.appendChild(avatar(p, 42));
          const meta = el("div");
          meta.appendChild(el("div", { class: "pn", text: p.displayName }));
          meta.appendChild(el("div", { class: "pf", text: p.franchise }));
          head.appendChild(meta);
          card.appendChild(head);
          card.appendChild(
            el("div", {
              class: "small muted",
              text: S("waitlist.count", { n: state.waitlist.counts[p.id] || 0 }),
            }),
          );
          card.appendChild(el("div", { class: "samplenote", text: S("waitlist.sample") }));
          if (state.waitlist.joins[p.id])
            card.appendChild(el("span", { class: "badge approved plain", text: "Joined" }));
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
        return wrap;
      }

      function renderInto(id) {
        const node = document.getElementById(id);
        if (!node) {
          render();
          return;
        }
        clear(node);
        node.appendChild(discoverList());
      }

      let lastTrackedRoute = null;
      function render() {
        const r = parseRoute();
        state.session.route = r.head === "#/creator" && r.a ? "#/creator/" + r.a : r.head;

        /* D-04: a screen view is counted once per route change, not once per render,
     so redrawing a screen cannot inflate the measurement. */
        if (state.session.route !== lastTrackedRoute) {
          lastTrackedRoute = state.session.route;
          track("screen_view", { route: state.session.route });
          state.session.lastActiveAt = Clock.now;
        }

        if (lastConversationId && !(r.head === "#/conversation" && r.a === lastConversationId)) {
          closeConversationSession(lastConversationId);
          lastConversationId = null;
          persist();
        }
        if (r.head === "#/conversation" && r.a) lastConversationId = r.a;

        const root = document.getElementById("root");
        clear(root);
        root.appendChild(chrome());

        if (state.ui.toast) {
          root.appendChild(notice("ok", null, state.ui.toast.message));
          state.ui.toast = null;
        }

        const gate = pendingPolicyGate();
        if (gate) {
          root.appendChild(gate);
          root.appendChild(legalFooter());
          renderTray();
          renderModal();
          return;
        }

        const body = screenFor(r);
        root.appendChild(body);
        if (r.head === "#/about") root.appendChild(selfCheckCard());
        root.appendChild(legalFooter());
        renderTray();
        renderModal();
      }

      function renderTray() {
        const t = document.getElementById("tray");
        clear(t);
        t.appendChild(devTray());
      }
      function renderModal() {
        const m = document.getElementById("modal");
        clear(m);
        if (state.ui.modal) m.appendChild(state.ui.modal());
      }

      /* =========================================================================
   SELF-CHECKS — V-02
   The entitlement and precedence rules are pure, so they are checked here at
   boot rather than described in prose. A failing check is visible on About and
   in the console; nothing is reported as passing that did not run.
   ========================================================================= */
      function selfCheck() {
        const results = [];
        function check(id, label, fn) {
          let ok = false,
            err = null;
          try {
            ok = fn() === true;
          } catch (e) {
            err = String(e && e.message ? e.message : e);
          }
          results.push({ id: id, label: label, ok: ok, error: err });
        }

        check("S-01", "Entry holds four selections and refuses a fifth", function () {
          const st = seedState();
          st.entitlements.plan = "entry";
          st.entitlements.status = "active";
          const approved = st.catalog.order.filter(function (id) {
            return availabilityOf(st, id).available;
          });
          for (let i = 0; i < 4; i++) {
            const r = reduceSelectCompanion(st, approved[i]);
            if (!r.ok) return false;
            st.entitlements = r.entitlements;
          }
          return reduceSelectCompanion(st, approved[4]).ok === false;
        });

        check(
          "S-03",
          "Pro counts seven distinct personalities a day and refuses the eighth",
          function () {
            const st = seedState();
            st.entitlements.plan = "pro";
            st.entitlements.status = "active";
            const approved = st.catalog.order.filter(function (id) {
              return availabilityOf(st, id).available;
            });
            const day = Clock.dayKey();
            for (let i = 0; i < 7; i++) {
              st.entitlements = reduceCountDay(
                st,
                approved[i % approved.length] + "#" + i,
                day,
              ).entitlements;
            }
            const r = reduceSelectCompanion(st, approved[0] + "#never");
            return r.ok === false && r.reason === "not_available";
          },
        );

        check("S-04", "Cancelling keeps access to the end of the paid period", function () {
          const st = seedState();
          st.entitlements.plan = "entry";
          st.entitlements = reduceCheckoutSuccess(st, CLOCK_EPOCH).entitlements;
          const renews = st.entitlements.renewsAt;
          st.entitlements = reduceCancel(st, CLOCK_EPOCH + 86400000).entitlements;
          return st.entitlements.status === "cancelled" && st.entitlements.accessUntil === renews;
        });

        check("L-02a", "Platform policy blocks a topic no grant can reopen", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { explicit_sexual_real_person: "granted" },
            { ageState: "verified", topics: { explicit_sexual_real_person: true } },
          );
          return (
            d.explicit_sexual_real_person.allowed === false &&
            d.explicit_sexual_real_person.blockingLayer === "platform"
          );
        });

        check("L-02b", "A talent boundary blocks a topic the member switched on", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "not_granted" },
            { ageState: "verified", topics: { mature_themes: true } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "talent";
        });

        check("L-02c", "A member preference blocks a topic the talent approved", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "granted" },
            { ageState: "verified", topics: { mature_themes: false } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "member";
        });

        check("R-03", "Mature topics stay blocked while age assurance is unverified", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "granted" },
            { ageState: "unverified", topics: { mature_themes: true } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "platform";
        });

        check("L-03", "An expired term removes availability", function () {
          const st = seedState();
          const id = "harriet-boone";
          return availabilityOf(st, id).available === false;
        });

        check("K-01", "The hash chain verifies, and notices an altered payload", function () {
          const keep = state;
          state = seedState();
          state.member.id = "mbr_test";
          Record.append("consent_accepted", "mbr_test", "mbr_test", {
            policyId: "terms",
            version: "1.0",
          });
          Record.append("block_set", "mbr_test", "marisol-vega", {
            personaId: "marisol-vega",
            blocked: true,
          });
          const clean = Record.verify();
          state.record[0].payload.version = "9.9";
          const dirty = Record.verify();
          state = keep;
          return clean === null && dirty === 1;
        });

        check("R-02", "The crisis screen matches a fixture phrase and nothing else", function () {
          return (
            adapters.safety.screen("honestly I want to end it").matched === true &&
            adapters.safety.screen("I want to end this conversation politely").matched === false
          );
        });

        check("D-06", "Prices are identical on every billing channel", function () {
          return BILLING_CHANNELS.every(function () {
            return PLANS.pro.price === 29.95;
          });
        });

        return results;
      }

      function selfCheckCard() {
        const results = selfCheck();
        const failed = results.filter(function (r) {
          return !r.ok;
        });
        const card = el("div", { class: "card" });
        card.appendChild(el("h3", { text: "Rule self-checks" }));
        card.appendChild(
          el("p", {
            class: "tiny dim",
            text: "Pure entitlement, precedence, and record rules, checked in the browser when this screen renders. These are the prototype's own checks, not a test suite report.",
          }),
        );
        card.appendChild(
          failed.length
            ? notice(
                "bad",
                el("span", { text: failed.length + " of " + results.length + " checks failed" }),
                null,
              )
            : notice(
                "ok",
                el("span", { text: results.length + " of " + results.length + " checks passed" }),
                null,
              ),
        );
        results.forEach(function (r) {
          const row = el("div", {
            class: "row between",
            style: "padding:5px 0;border-bottom:1px solid var(--line)",
          });
          row.appendChild(
            el("span", { class: "small" }, [
              el("b", { class: "mono", text: r.id }),
              txt(" " + r.label),
            ]),
          );
          row.appendChild(
            el("span", {
              class: "badge plain " + (r.ok ? "approved" : "revoked"),
              text: r.ok ? "pass" : r.error || "fail",
            }),
          );
          card.appendChild(row);
        });
        return card;
      }

      /* =========================================================================
   SEEDED DEMO SESSION — A25, V-03
   One button produces the run the Measurement panel describes, so a reviewer
   does not have to reproduce it by hand. Every figure it creates is still
   labelled sample or estimate.
   ========================================================================= */
      function seedDemoSession() {
        resetAll();

        LAUNCH_STATE = "prelaunch";
        adapters.waitlist.join("marisol-vega", "Sam Reyes", "sam@example.com", true, false);
        adapters.waitlist.join("kenji-alvarez", "Sam Reyes", "sam@example.com", true, true);

        Clock.advanceHours(6);
        LAUNCH_STATE = "live";

        const s = adapters.auth.signIn("email", "Sam Reyes", "sam@example.com");
        state.member = {
          id: s.memberId,
          displayName: s.displayName,
          email: s.email,
          provider: "email",
          createdAt: Clock.now,
          deleted: false,
        };
        state.session.signedIn = true;
        state.session.startedAt = Clock.now;
        track("signup", { provider: "email" });
        state.preferences.ageState = adapters.ageAssurance.verify().state;
        FIXTURES.policies.forEach(function (pol) {
          adapters.consent.accept(pol.id, pol.version);
        });

        state.entitlements = reduceSelectPlan(state, "pro").entitlements;
        track("plan_select", { planId: "pro", billingChannel: BILLING_CHANNEL });
        state.entitlements = reduceCheckoutSuccess(state, Clock.now).entitlements;
        track("checkout_success", {
          planId: "pro",
          billingChannel: BILLING_CHANNEL,
          receiptId: nextId("rcpt"),
          attributedPersonaId: "marisol-vega",
        });

        const script = [
          [
            "marisol-vega",
            [
              "Hey, you there?",
              "What was filming that season actually like?",
              "I moved to Austin last spring and I still do not know anyone.",
            ],
          ],
          [
            "kenji-alvarez",
            [
              "Hello",
              "Do you remember what I told you last time?",
              "I am trying to decide whether to take the job.",
            ],
          ],
          ["rhett-callahan", ["Hey", "What was the retreat like?"]],
        ];
        script.forEach(function (pair, dayIndex) {
          if (dayIndex > 0) Clock.advanceDays(1);
          const personaId = pair[0];
          state.entitlements = reduceSelectCompanion(state, personaId).entitlements;
          const p = state.catalog.personas[personaId];
          const conv = {
            id: nextId("cnv"),
            personaId: personaId,
            startedAt: Clock.now,
            lastDisclosureAt: Clock.now,
            readonly: false,
            readonlyReason: null,
            voiceState: "idle",
            crisisOpen: false,
            activeSeconds: 0,
            lastTouch: Clock.now,
            reminderOpen: false,
            messages: [
              {
                id: nextId("m"),
                who: "sys",
                kind: "disclosure",
                text: S("conv.openingNotice", { name: p.displayName }),
                at: Clock.now,
              },
            ],
          };
          state.conversations[conv.id] = conv;
          track("conversation_start", { personaId: personaId });
          Record.append("moderation_action", "system", personaId, {
            action: "ai_disclosure_shown",
            conversationId: conv.id,
            trigger: "conversation_start",
          });

          pair[1].forEach(function (msg) {
            Clock.advanceMinutes(4);
            conv.messages.push({ id: nextId("m"), who: "me", text: msg, at: Clock.now });
            track("message_sent", { personaId: personaId, conversationId: conv.id });
            state.entitlements = reduceCountDay(state, personaId, Clock.dayKey()).entitlements;
            maybeRemember(personaId, msg);
            const res = adapters.inference.respond(personaId, msg, {});
            if (res.kind !== "crisis")
              conv.messages.push({ id: nextId("m"), who: "them", text: res.text, at: Clock.now });
            conv.activeSeconds += 240;
          });
          if (p.modes.voice)
            track("voice_utterance", {
              personaId: personaId,
              seconds: COST_MODEL.speechSecondsPerReply,
            });
          track("session_end", {
            personaId: personaId,
            conversationId: conv.id,
            activeSeconds: conv.activeSeconds,
          });
          conv.activeSeconds = 0;
        });

        /* Advance past the 7-day mark so one retention reading is reachable. The
     30-day reading needs another advance, which the tray provides. */
        Clock.advanceDays(6);
        persist();
        go("#/creator/measurement");
        render();
      }

      /* =========================================================================
   BOOT
   ========================================================================= */
      window.addEventListener("hashchange", render);
      window.addEventListener("DOMContentLoaded", function () {
        restore();
        sweepExpiries();
        applyAvailabilityToConversations();
        if (!window.location.hash) window.location.hash = "#/discover";
        const results = selfCheck();
        const failed = results.filter(function (r) {
          return !r.ok;
        });
        if (window.console && console.log) {
          console.log(
            "Celebrity AI Companions wireframe v0.2 — self-checks: " +
              (results.length - failed.length) +
              "/" +
              results.length +
              " passed.",
          );
          failed.forEach(function (f) {
            console.warn(
              "self-check failed: " + f.id + " " + f.label + (f.error ? " — " + f.error : ""),
            );
          });
        }
        window.__wireframe = {
          state: function () {
            return state;
          },
          adapters: adapters,
          Record: Record,
          effectiveBoundaries: effectiveBoundaries,
          measure: measure,
          selfCheck: selfCheck,
          Clock: Clock,
          reset: resetAll,
          seedDemoSession: seedDemoSession,
          routes: ROUTES,
          render: render,
          go: go,
        };
        render();
      });
    </script>
  </body>
