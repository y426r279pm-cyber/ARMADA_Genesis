        const bar = el("div", { class: "row between", style: "margin-bottom:12px" });
        bar.appendChild(el("h3", { style: "margin:0", text: "Operator-visible entries" }));

   One hash route per screen, one render function, no framework.
   ========================================================================= */
      const ROUTES = [
        "#/welcome",
        "#/discover",
        "#/companion/:id",
        "#/waitlist/:id",
        "#/plans",
        "#/account",
        "#/profile",
        "#/checkout",
        "#/companions",
        "#/conversation/:id",
        "#/community",
        "#/settings",
        "#/about",
        "#/demo",
        "#/studio/pipeline",
        "#/studio/pipeline/:id",
        "#/studio/rights",
        "#/studio/training",
        "#/studio/training/:tab",
        "#/studio/agents",
        "#/studio/agents/:tab",
        "#/studio/coverage",
        "#/studio/crisis",
        "#/studio/measurement",
        "#/studio/record",
      ];

      function parseRoute() {
        const h = window.location.hash || "#/discover";
        const parts = h.replace(/^#\//, "").split("/");
        if (parts[0] === "studio")
          return {
            head: "#/studio/" + (parts[1] || "pipeline"),
            a: parts[2] || null,
            raw: h,
            studio: true,
          };
        return {
          head: "#/" + (parts[0] || "discover"),
          a: parts[1] || null,
          raw: h,
          studio: false,
        };
      }

      /* D-04: leaving a conversation closes a session with its active seconds, which
   is the only place the active-minutes measurement comes from. */
      let lastConversationId = null;
      function closeConversationSession(id) {
        const c = state.conversations[id];
        if (!c) return;
        track("session_end", {
          personaId: c.personaId,
          conversationId: c.id,
          activeSeconds: c.activeSeconds,
        });
        c.activeSeconds = 0;
      }

      function screenFor(r) {
        if (r.studio) {
          const sec = r.head.replace("#/studio/", "");
          if (sec === "pipeline") return screenPipeline(r.a);
          if (sec === "rights") return screenRights();
          if (sec === "training") return screenTraining(r.a);
          if (sec === "agents") return screenAgents(r.a);
          if (sec === "coverage") return screenCoverage();
          if (sec === "crisis") return screenCrisis();
          if (sec === "measurement") return screenMeasurement();
          if (sec === "record") return screenRecord();
          return screenPipeline(null);
        }
        if (r.head === "#/welcome") return screenOnboard();
        if (r.head === "#/companion") return screenCompanion(r.a);
        if (r.head === "#/waitlist") return r.a ? screenWaitlist(r.a) : screenWaitlistIndex();
        if (r.head === "#/conversation") return screenConversation(r.a);
        if (r.head === "#/plans") return screenPlans();
        if (r.head === "#/account") return screenAccount();
        if (r.head === "#/profile") return screenProfile();
        if (r.head === "#/checkout") return screenCheckout();
        if (r.head === "#/companions") return screenCompanions();
        if (r.head === "#/community") return screenCommunity();
        if (r.head === "#/settings") return screenSettings();
        if (r.head === "#/about") return screenAbout();
        if (r.head === "#/demo") return screenDemo();
        return screenDiscover();
      }

      function repaint(id, builder) {
        const n = document.getElementById(id);
        if (!n) {
          render();
          return;
        }
        clear(n);
        n.appendChild(builder());
      }

      let lastTrackedRoute = null;
      function render() {
        const r = parseRoute();
        state.session.route = r.studio ? r.head : r.head;

        /* D-04: one screen view per route change, not per render, so redrawing a
     screen cannot inflate the measurement. */
        const routeKey = r.head + (r.a ? "/" + r.a : "");
        if (routeKey !== lastTrackedRoute) {
          lastTrackedRoute = routeKey;
          track("screen_view", { route: r.head });
        }
        if (lastConversationId && !(r.head === "#/conversation" && r.a === lastConversationId)) {
          closeConversationSession(lastConversationId);
          lastConversationId = null;
          persist();
        }
        if (r.head === "#/conversation" && r.a) lastConversationId = r.a;

        const app = document.getElementById("app");
        clear(app);

        /* The welcome flow is full-bleed: no rail, no tabs, nothing to click but the
     thing being explained. */
        if (
          r.head === "#/welcome" ||
          (!state.session.onboarded &&
            r.head === "#/discover" &&
            !state.session.signedIn &&
            state.events.length < 3)
        ) {
          app.className = "";
          app.appendChild(screenOnboard());
          renderOverlay();
          return;
        }

        app.className = "app" + (r.studio ? " studio" : "");
        app.appendChild(rail());
        const canvas = el("div", { class: "canvas" });
        canvas.appendChild(topbar());
        const inner = el("div", { class: "canvas-in" + (r.studio ? " wide" : "") });

        const gate = pendingPolicyGate();
        if (gate) inner.appendChild(gate);
        else inner.appendChild(screenFor(r));
        inner.appendChild(legalFooter());
        canvas.appendChild(inner);
        app.appendChild(canvas);
        app.appendChild(tabbar());
        renderOverlay();
      }

      /* =========================================================================
   SELF-CHECKS — V-02
   The pure rules are checked here rather than described in prose. The first
   block is the entitlement and record maths; the second is the set of guards
   that keep a real, unlicensed person out of every generative path. A failure
   is visible on About and in the console.
   ========================================================================= */
      function selfCheck() {
        const out = [];
        function check(id, label, fn) {
          let ok = false,
            err = null;
          try {
            ok = fn() === true;
          } catch (e) {
            err = String(e && e.message ? e.message : e);
          }
          out.push({ id: id, label: label, ok: ok, error: err });
        }

        check("S-01", "Entry holds four selections and refuses a fifth", function () {
          const st = seedState();
          st.entitlements.plan = "entry";
          st.entitlements.status = "active";
          const ap = st.catalog.order.filter(function (id) {
            return availabilityOf(st, id).available;
          });
          for (let i = 0; i < 4; i++) {
            const r = reduceSelectCompanion(st, ap[i]);
            if (!r.ok) return false;
            st.entitlements = r.entitlements;
          }
          return reduceSelectCompanion(st, ap[4]).ok === false;
        });
        check(
          "S-03",
          "Pro counts seven distinct personalities a day and refuses the eighth",
          function () {
            const st = seedState();
            st.entitlements.plan = "pro";
            st.entitlements.status = "active";
            const ap = st.catalog.order.filter(function (id) {
              return availabilityOf(st, id).available;
            });
            const day = Clock.dayKey();
            for (let i = 0; i < 7; i++)
              st.entitlements = reduceCountDay(st, ap[i % ap.length] + "#" + i, day).entitlements;
            const r = reduceSelectCompanion(st, ap[0] + "#never");
            return r.ok === false && r.reason === "not_available";
          },
        );
        check("S-04", "Cancelling keeps access to the end of the paid period", function () {
          const st = seedState();
          st.entitlements.plan = "entry";
          st.entitlements = reduceCheckoutSuccess(st, CLOCK_EPOCH).entitlements;
          const renews = st.entitlements.renewsAt;
          st.entitlements = reduceCancel(st, CLOCK_EPOCH + 86400000).entitlements;
          return st.entitlements.status === "cancelled" && st.entitlements.accessUntil === renews;
        });
        check("L-02a", "Platform policy blocks a topic no grant can reopen", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { explicit_sexual_real_person: "granted" },
            { ageState: "verified", topics: { explicit_sexual_real_person: true } },
          );
          return (
            d.explicit_sexual_real_person.allowed === false &&
            d.explicit_sexual_real_person.blockingLayer === "platform"
          );
        });
        check("L-02b", "A talent boundary blocks a topic the member switched on", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "not_granted" },
            { ageState: "verified", topics: { mature_themes: true } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "talent";
        });
        check("L-02c", "A member preference blocks a topic the talent approved", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "granted" },
            { ageState: "verified", topics: { mature_themes: false } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "member";
        });
        check("R-03", "Mature topics stay blocked while age assurance is unverified", function () {
          const d = effectiveBoundaries(
            PLATFORM_POLICY,
            { mature_themes: "granted" },
            { ageState: "unverified", topics: { mature_themes: true } },
          );
          return d.mature_themes.allowed === false && d.mature_themes.blockingLayer === "platform";
        });
        check("L-03", "An expired term removes availability", function () {
          return availabilityOf(seedState(), "harriet-boone").available === false;
        });
        check("K-01", "The hash chain verifies, and notices an altered payload", function () {
          const keep = state;
          state = seedState();
          state.member.id = "mbr_test";
          Record.append("consent_accepted", "mbr_test", "mbr_test", {
            policyId: "terms",
            version: "1.0",
          });
          Record.append("block_set", "mbr_test", "marisol-vega", {
            personaId: "marisol-vega",
            blocked: true,
          });
          const clean = Record.verify();
          state.record[0].payload.version = "9.9";
          const dirty = Record.verify();
          state = keep;
          return clean === null && dirty === 1;
        });
        check("R-02", "The crisis screen matches a fixture phrase and nothing else", function () {
          return (
            adapters.safety.screen("honestly I want to end it").matched === true &&
            adapters.safety.screen("I want to end this conversation politely").matched === false
          );
        });
        check("D-06", "Prices are identical on every billing channel", function () {
          return BILLING_CHANNELS.every(function () {
            return PLANS.pro.price === 29.95;
          });
        });

        /* ---- The guards that matter most in this iteration ---- */
        check(
          "G-01",
          "A real person can never be conversation-available, even if the status field says approved",
          function () {
            const st = seedState();
            st.catalog.personas["ed-brown"].license.status = "approved";
            st.catalog.personas["ed-brown"].license.duration = {
              start: "2026-01-01",
              end: "2099-01-01",
            };
            const av = availabilityOf(st, "ed-brown");
            return (
              av.available === false &&
              av.reason === "real_person_guard" &&
              RIGHTS_GATE(st.catalog.personas["ed-brown"]) === false
            );
          },
        );
        check("G-02", "No real person appears in Discover", function () {
          const keep = state;
          state = seedState();
          state.catalog.personas["ed-brown"].license.status = "approved";
          state.catalog.personas["ed-brown"].license.duration = {
            start: "2026-01-01",
            end: "2099-01-01",
          };
          const listed = adapters.catalog.list({ approvedOnly: true }).filter(function (p) {
            return p.isRealPerson;
          });
          state = keep;
          return listed.length === 0;
        });
        check("G-03", "The licence dropdown refuses to approve a real person", function () {
          const keep = state;
          state = seedState();
          const r = adapters.licenses.setStatus(
            "ed-brown",
            "approved",
            "Trying it on.",
            "creator:operator",
          );
          state = keep;
          return r.ok === false && r.code === "real_person_requires_executed_agreement";
        });
        check("G-04", "An agent bound to a real person is forced into the team voice", function () {
          const st = seedState();
          const vm = agentVoiceMode(st.pipeline.entries["pl-ed-brown"], "first_person");
          return vm.mode === "team" && vm.forced === true;
        });
        check(
          "G-05",
          "An agent on an unapproved persona cannot speak in the first person",
          function () {
            const st = seedState();
            const vm = agentVoiceMode(st.catalog.personas["harriet-boone"], "first_person");
            return vm.mode === "team" && vm.forced === true;
          },
        );
        check("G-06", "High and critical registers cannot auto-publish", function () {
          return (
            approvalModeFor(toneById("argumentative"), "auto").mode === "human" &&
            approvalModeFor(toneById("bombastic"), "auto").mode === "human" &&
            approvalModeFor(toneById("crisis"), "auto").mode === "two_human" &&
            approvalModeFor(toneById("promotional"), "auto").mode === "auto"
          );
        });
        check(
          "G-07",
          "Training refuses a real person, and refuses uncleared material",
          function () {
            const st = seedState();
            const a = personaCorpusReady(st.catalog.personas["ed-brown"]);
            const b = personaCorpusReady(st.catalog.personas["yara-belhadj"]);
            return (
              a.ok === false &&
              a.code === "real_person_not_licensed" &&
              b.ok === false &&
              b.code === "revoked"
            );
          },
        );
        check(
          "G-08",
          "Voice enrolment refuses when source recordings are not granted",
          function () {
            const st = seedState();
            const r = voiceReady(st.catalog.personas["dax-holloway"]);
            return r.ok === false && r.code === "source_recordings_not_granted";
          },
        );
        check("G-09", "A checkpoint below a blocking safety gate cannot be promoted", function () {
          const keep = state;
          state = seedState();
          const p = state.catalog.personas["marisol-vega"];
          p.model.versions.push({
            version: "vTest",
            loss: 0.5,
            inChar: 0.95,
            boundary: 0.5,
            disclosure: 0.99,
            refusal: 0.95,
            promoted: false,
          });
          const r = trainingPromote("marisol-vega", "vTest", "Trying it on.");
          state = keep;
          return r.ok === false && r.code === "eval_below_gate";
        });
        check("G-10", "Signal is registered with no automation capability", function () {
          const p = platformById("signal");
          return (
            platformSupportsAnything(p) === false &&
            coverageCell("marisol-vega", "signal").cls === "na"
          );
        });
        check("G-11", "A critical-register draft needs two named approvals", function () {
          const keep = state;
          state = seedState();
          seedAgents();
          const crisisAgent = state.agents.list.filter(function (a) {
            return a.tone === "crisis";
          })[0];
          const d = generateDraft(crisisAgent.id, "impersonation", "instagram", "test");
          const first = decideDraft(d.draft.id, "approve", "one", "Reviewer A");
          const second = decideDraft(d.draft.id, "approve", "two", "Reviewer B");
          state = keep;
          return (
            first.ok === false && first.code === "second_reviewer_required" && second.ok === true
          );
        });
        check("G-12", "An incident cannot be closed without a named person", function () {
          const keep = state;
          state = seedState();
          const inc = openIncident("marisol-vega", "leak", "test");
          const bad = closeIncident(inc.id, "done", "");
          const good = closeIncident(inc.id, "done", "A. Person");
          state = keep;
          return bad.ok === false && bad.code === "requires_human" && good.ok === true;
        });
        check("G-13", "The record never stores message, draft, or incident content", function () {
          const keep = state;
          state = seedState();
          seedAgents();
          const blob = JSON.stringify(state.record);
          const leaks = [
            "asking for money",
            "visa process",
            "Biggest week",
            "never even legally married",
          ].some(function (s) {
            return blob.indexOf(s) !== -1;
          });
          state = keep;
          return leaks === false;
        });
        check(
          "G-14",
          "Member memory is never readable from the training queue without an opt-in",
          function () {
            const keep = state;
            state = seedState();
            state.preferences.trainingOptIn = false;
            state.memories["marisol-vega"] = { enabled: true, items: [] };
            const before = state.training.memoryQueue.length;
            maybeRemember("marisol-vega", "I moved to Austin last spring and I know nobody.");
            const after = state.training.memoryQueue.length;
            state = keep;
            return before === after;
          },
        );
        return out;

        c.appendChild(

                  })
                  .join(", "),

            : notice("ok", res.length + " of " + res.length + " checks passed", null),

          const conv = {
            id: nextId("cnv"),
            personaId: pid,
            startedAt: Clock.now,
            lastDisclosureAt: Clock.now,
            readonly: false,
            readonlyReason: null,
            voiceState: "idle",
            crisisOpen: false,
            activeSeconds: 0,
            lastTouch: Clock.now,
            reminderOpen: false,
            messages: [
              {
                id: nextId("m"),
                who: "sys",
                kind: "disclosure",
                text: S("room.open", { name: p.displayName }),
                at: Clock.now,
              },
            ],
          };
          if ((p.memorySeeds || []).length)
            state.memories[pid] = {
              enabled: true,
              items: p.memorySeeds.map(function (t) {
                return {
                  id: nextId("mem"),
                  text: t,
                  at: Clock.now - 86400000,
                  source: "earlier conversation",
                };
              }),
            };
          state.conversations[conv.id] = conv;
          track("conversation_start", { personaId: pid });
          Record.append("moderation_action", "system", pid, {
            action: "ai_disclosure_shown",
            conversationId: conv.id,
            trigger: "conversation_start",
          });
          pair[1].forEach(function (msg) {
            Clock.advanceMinutes(4);
            conv.messages.push({ id: nextId("m"), who: "me", text: msg, at: Clock.now });
            track("message_sent", { personaId: pid, conversationId: conv.id });
            state.entitlements = reduceCountDay(state, pid, Clock.dayKey()).entitlements;
            maybeRemember(pid, msg);
            const res = adapters.inference.respond(pid, msg);
            if (res.kind !== "crisis")
              conv.messages.push({ id: nextId("m"), who: "them", text: res.text, at: Clock.now });
            conv.activeSeconds += 240;
          });
          if (p.modes.voice)
            track("voice_utterance", { personaId: pid, seconds: COST_MODEL.speechSecondsPerReply });
          track("session_end", {
            personaId: pid,
            conversationId: conv.id,
            activeSeconds: conv.activeSeconds,
          });
          conv.activeSeconds = 0;
        });

        /* A completed training cycle, so the studio has a fresh checkpoint waiting
     on a promotion decision. */
        const run = trainingStart("priya-raman", { epochs: 7, note: "Seeded demo cycle." });
        if (run.ok) {
          Clock.advanceHours(2);
          tickTraining();
        }
        Clock.advanceDays(6);
        notify(
          "Seeded session ready",
          "Three days of conversation, a Pro checkout, a finished training run, and a live agent estate.",
          "#/studio/measurement",
          "Open Measurement",
        );
        persist();
        go("#/studio/measurement");
        render();
      }

      /* =========================================================================
   BOOT
   ========================================================================= */
      window.addEventListener("hashchange", render);
      window.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          state.ui.cmdk = !state.ui.cmdk;
          renderOverlay();
        } else if (e.key === "Escape" && (state.ui.cmdk || state.ui.modal)) {
          state.ui.cmdk = false;
          state.ui.modal = null;
          renderOverlay();
        }
      });
      window.addEventListener("DOMContentLoaded", function () {
        restore();
        applyPrefsToDom();
        installFavicon();
        sweepExpiries();
        applyAvailabilityToConversations();
        tickTraining();
        if (!window.location.hash)
          window.location.hash = state.session.onboarded ? "#/discover" : "#/welcome";
        const res = selfCheck();
        const failed = res.filter(function (r) {
          return !r.ok;
        });
        if (window.console && console.log) {
          console.log(
            "perSONA AI v0.3 — self-checks: " +
              (res.length - failed.length) +
              "/" +
              res.length +
              " passed.",
          );
          failed.forEach(function (f) {
            console.warn(
              "self-check failed: " + f.id + " " + f.label + (f.error ? " — " + f.error : ""),
            );
          });
        }
        window.__persona = {
          state: function () {
            return state;
          },
          adapters: adapters,
          Record: Record,
          measure: measure,
          effectiveBoundaries: effectiveBoundaries,
          selfCheck: selfCheck,
          Clock: Clock,
          reset: resetAll,
          seedDemoSession: seedDemoSession,
          render: render,
          go: go,
          routes: ROUTES,
          agents: {
            create: createAgent,
            draft: generateDraft,
            decide: decideDraft,
            coverage: coverageSummary,
            fillGaps: fillCoverageGaps,
            freezeAll: freezeAll,
            voiceMode: agentVoiceMode,
            approvalMode: approvalModeFor,
          },
          training: {
            start: trainingStart,
            complete: trainingComplete,
            promote: trainingPromote,
            tick: tickTraining,
            corpusReady: personaCorpusReady,
            voiceReady: voiceReady,
            gates: gateReport,
          },
          guards: {
            RIGHTS_GATE: RIGHTS_GATE,
            availabilityOf: function (id) {
              return availabilityOf(state, id);
            },
          },
        };
        render();
      });
    </script>
  </body>
</html>
