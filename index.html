      /* ---- Memory — M-07, K-02 ---- */
      function openMemory(personaId) {
        openModal(function () {
          const p = state.catalog.personas[personaId];
          const m = state.memories[personaId] || { enabled: true, items: [] };
          const body = [];
          body.push(el("p", { class: "muted sm", text: S("mem.p") }));
          const sw = el("div", { class: "sw" });
          sw.appendChild(
            el("div", { class: "swl" }, [
              el("b", { text: m.enabled ? S("mem.on") : S("mem.off") }),
              el("span", { text: S("mem.note") }),
            ]),
          );
          sw.appendChild(
            el("button", {
              class: "tg",
              role: "switch",
              "aria-checked": m.enabled ? "true" : "false",
              "aria-label": "Remembering",
              onclick: function () {
                if (!state.memories[personaId])
                  state.memories[personaId] = { enabled: true, items: [] };
                state.memories[personaId].enabled = !m.enabled;
                persist();
                openMemory(personaId);
              },
            }),
          );
          body.push(sw);
          if (!m.items.length)
            body.push(el("p", { class: "dim sm", style: "margin-top:12px", text: S("mem.empty") }));
          m.items.forEach(function (it) {
            const row = el("div", { class: "card tight", style: "margin-bottom:9px" });
            const ta = el("textarea", { value: it.text, rows: 2 });
            row.appendChild(ta);
            row.appendChild(
              el("div", { class: "row between", style: "margin-top:7px" }, [
                el("span", {
                  class: "xxs faint",
                  text: (it.source || "conversation") + " · " + Clock.ago(it.at),
                }),
                el("span", { class: "btn-row" }, [
                  el("button", {
                    class: "btn sm",
                    text: S("mem.edit"),
                    onclick: function () {
                      it.text = ta.value;
                      persist();
                      toast(S("prof.saved"));
                    },
                  }),
                  el("button", {
                    class: "btn sm danger",
                    text: S("mem.del"),
                    onclick: function () {
                      state.memories[personaId].items = m.items.filter(function (x) {
                        return x.id !== it.id;
                      });
                      Record.append("memory_deleted", state.member.id, personaId, {
                        personaId: personaId,
                        memoryId: it.id,
                        tombstone: true,
                      });
                      persist();
                      openMemory(personaId);
                    },
                  }),
                ]),
              ]),
            );
            body.push(row);
          });
          return modalShell(S("mem.h", { name: p.displayName }), null, body, [
            el("button", {
              class: "btn danger",
              text: S("mem.delAll", { name: p.displayName }),
              onclick: function () {
                const n = m.items.length;
                state.memories[personaId] = { enabled: m.enabled, items: [] };
                Record.append("memory_deleted", state.member.id, personaId, {
                  personaId: personaId,
                  count: n,
                  tombstone: true,
                });
                persist();
                openMemory(personaId);
              },
            }),
            el("button", { class: "btn", text: S("com.close"), onclick: closeModal }),
          ]);
        });
      }

      /* ---- Report and block — R-04 ---- */
      function openReport(subjectType, subjectId, personaId) {
        openModal(function () {
          let category = "";
          const body = [];
          body.push(el("p", { class: "muted sm", text: S("rep.p") }));
          const sel = el("select", {
            onchange: function (e) {
              category = e.target.value;
            },
          });
          sel.appendChild(el("option", { value: "", text: "—" }));
          [
            ["impersonation", S("rep.imp")],
            ["harassment", S("rep.har")],
            ["sexual_real_person", S("rep.sex")],
            ["self_harm", S("rep.self")],
            ["other", S("rep.oth")],
          ].forEach(function (c) {
            sel.appendChild(el("option", { value: c[0], text: c[1] }));
          });
          body.push(
            el("label", { class: "field" }, [
              el("span", { class: "lbl", text: S("rep.cat") }),
              sel,
            ]),
          );
          body.push(
            el("label", { class: "field" }, [
              el("span", { class: "lbl", text: S("rep.notes") }),
              el("textarea", {}),
            ]),
          );
          const err = el("div", { class: "sm", style: "color:var(--crit);min-height:20px" });
          body.push(err);
          return modalShell(S("rep.h"), null, body, [
            el("button", {
              class: "btn primary",
              text: S("rep.send"),
              onclick: function () {
                if (!category) {
                  err.textContent = S("rep.need");
                  return;
                }
                const t = adapters.reports.file(category, subjectType, personaId);
                persist();
                openModal(function () {
                  return modalShell(
                    S("rep.okh"),
                    null,
                    [el("p", { class: "muted sm", text: S("rep.okp", { ticket: t.id }) })],
                    [
                      el("button", {
                        class: "btn primary",
                        text: S("com.close"),
                        onclick: closeModal,
                      }),
                    ],
                  );
                });
              },
            }),
            el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
          ]);
        });
      }

      /* S-04 / R-06: no emotional appeal, no countdown, no mention of the companion.
   One optional reason question is the only thing offered. */
      function openCancel() {
        openModal(function () {
          const sel = el("select");
          sel.appendChild(el("option", { value: "", text: "Prefer not to say" }));
          [
            "Too expensive",
            "Not using it enough",
            "Missing something I wanted",
            "Something else",
          ].forEach(function (r) {
            sel.appendChild(el("option", { value: r, text: r }));
          });
          return modalShell(
            S("set.cancel"),
            null,
            [
              el("p", { class: "muted sm", text: S("set.cancelP") }),
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: S("set.reason") }),
                sel,
              ]),
            ],
            [
              el("button", {
                class: "btn danger",
                text: S("set.cancelGo"),
                onclick: function () {
                  const r = reduceCancel(state, Clock.now);
                  if (!r.ok) {
                    closeModal();
                    return;
                  }
                  state.entitlements = r.entitlements;
                  track("cancel", { planId: state.entitlements.plan, reason: sel.value || null });
                  closeModal();
                  persist();
                  toast(
                    S("set.cancelled", { date: Clock.fmtDate(state.entitlements.accessUntil) }),
                  );
                },
              }),
              el("button", { class: "btn", text: S("com.close"), onclick: closeModal }),
            ],
          );
        });
      }

      /* K-04: deletion removes content and leaves tombstones carrying identifiers and
   hashes only, so the chain still verifies after erasure. */
      function openDeleteAccount() {
        openModal(function () {
          return modalShell(
            S("set.del"),
            null,
            [el("p", { class: "muted sm", text: S("set.delP") })],
            [
              el("button", {
                class: "btn danger",
                text: S("set.delGo"),
                onclick: function () {
                  const memberId = state.member.id;
                  const convCount = Object.keys(state.conversations).length;
                  const memCount = Object.keys(state.memories).reduce(function (a, k) {
                    return a + state.memories[k].items.length;
                  }, 0);
                  Object.keys(state.policies.accepted)
                    .slice()
                    .forEach(function (pid) {
                      adapters.consent.withdraw(pid);
                    });
                  Record.append("memory_deleted", memberId, memberId, {
                    count: memCount,
                    tombstone: true,
                  });
                  Record.append("account_deleted", memberId, memberId, {
                    conversations: convCount,
                    tombstone: true,
                  });
                  const keep = {
                    record: state.record.slice(),
                    catalog: state.catalog,
                    pipeline: state.pipeline,
                    waitCounts: state.waitlist.counts,
                    policies: state.policies.registry,
                    events: state.events,
                    training: state.training,
                    agents: state.agents,
                  };
                  state = freshState();
                  state.record = keep.record;
                  state.catalog = keep.catalog;
                  state.pipeline = keep.pipeline;
                  state.waitlist.counts = keep.waitCounts;
                  state.policies.registry = keep.policies;
                  state.events = keep.events;
                  state.training = keep.training;
                  state.agents = keep.agents;
                  applyPrefsToDom();
                  closeModal();
                  persist();
                  go("#/discover");
                  render();
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
          );
        });
      }

      function openConsentFlow(e) {
        openModal(function () {
          if (!e.consent) e.consent = {};
          const body = [];
          body.push(
            notice(
              "warn",
              "Nothing on this list exists yet for " + e.name,
              "Each step is a real artifact with a real owner. The prototype can record that a step happened; it cannot manufacture the step. That is the difference between this product and an impersonation.",
            ),
          );
          CONSENT_STEPS.forEach(function (s) {
            const done = !!e.consent[s.id];
            const row = el("div", {
              class: "card tight",
              style:
                "margin-bottom:9px" +
                (done ? ";border-color:color-mix(in srgb,var(--ok) 36%,transparent)" : ""),
            });
            const h = el("div", { class: "row between top" });
            const l = el("div", { style: "min-width:0;flex:1 1 auto" });
            l.appendChild(
              el("div", { class: "row tight" }, [
                el("b", { class: "sm", text: s.name }),
                el("span", { class: "badge", style: "font-size:.62rem", text: s.who }),
              ]),
            );
            l.appendChild(el("div", { class: "xs muted", style: "margin-top:3px", text: s.desc }));
            if (done)
              l.appendChild(
                el("div", {
                  class: "xxs",
                  style: "color:var(--ok);margin-top:5px",
                  text:
                    "Recorded " +
                    Clock.fmtDate(e.consent[s.id].at) +
                    " · reference " +
                    e.consent[s.id].ref,
                }),
              );
            h.appendChild(l);
            h.appendChild(
              done
                ? el("span", { class: "badge ok" }, [ico("check", 11), txt("Recorded")])
                : el("button", {
                    class: "btn sm",
                    text: "Record artifact",
                    onclick: function () {
                      const ref = "ART-" + String(1000 + Math.floor(rng() * 8999));
                      e.consent[s.id] = { at: Clock.now, ref: ref, by: state.session.creatorName };
                      Record.append(
                        "consent_artifact_recorded",
                        "creator:" + state.session.creatorRole,
                        e.id,
                        {
                          pipelineId: e.id,
                          step: s.id,
                          reference: ref,
                          documentStored: false,
                        },
                      );
                      persist();
                      openConsentFlow(e);
                    },
                  }),
            );
            row.appendChild(h);
            body.push(row);
          });
          const all = CONSENT_STEPS.every(function (s) {
            return !!e.consent[s.id];
          });
          body.push(
            all
              ? notice(
                  "ok",
                  "Every artifact is recorded",
                  "In production this is the point where the persona build begins: the licence status can be set to approved by counsel, a corpus can be loaded from the approved material, and a voice job can start. The prototype stops here on purpose — it will not fabricate the material itself.",
                )
              : notice(
                  "info",
                  "Incomplete",
                  "The licence status cannot reach approved until every artifact above is recorded, and even then the corpus has to come from the talent.",
                ),
          );
          return modalShell(
            "Consent workflow · " + e.name,
            "Six artifacts, six owners. All of them outside this dashboard.",
            body,
            [el("button", { class: "btn", text: S("com.close"), onclick: closeModal })],
            "wide",
          );
        });
      }

          if (r.state === "running") {

                  class: "btn sm bare",
                  text: "Complete now",

                    persist();

                  },
                }),
              ]),
            );
          } else {

              el("div", {
                class: "xxs faint",
                style: "margin-top:5px",
                text:

                  " epochs · " +

                  " GPU hours" +
                  (r.note ? " · " + r.note : ""),
              }),

          }
          b.appendChild(c);

        b.appendChild(
          el("div", { class: "btn-row", style: "margin-top:16px" }, [
            el(
              "button",
              {
                class: "btn primary",
                disabled: !ready.ok,
                onclick: function () {
                  openStartRun(personaId);
                },
              },
              [ico("play", 15), txt("Start a training run")],
            ),
            el("a", { class: "btn", href: "#/studio/training/corpus", text: "Corpus and rights" }),
          ]),
        );
        pane.appendChild(b);
        return pane;
      }

      function openStartRun(personaId) {
        const p = state.catalog.personas[personaId];
        const ready = personaCorpusReady(p);
        openModal(function () {
          const ep = el("input", { type: "number", value: "6", min: "1", max: "20" });
          const note = el("textarea", { rows: 2, placeholder: "What changed since the last run?" });
          const body = [];
          body.push(
            notice(
              "info",
              "Rights check passed",
              ready.ok
                ? ready.cleared.length +
                    " cleared corpus " +
                    plural(ready.cleared.length, "item") +
                    " totalling " +
                    ready.items +
                    " units. Anything pending, expired, or revoked is excluded automatically."
                : ready.detail,
            ),
          );
          body.push(
            el("div", { class: "card tight" }, [
              el("h4", { text: "What goes in" }),
              dataTable(
                ["Source", "Items", "Rights"],
                (p.corpus || []).map(function (c) {
                  return [c.kind, String(c.items), titleCase(c.rights)];
                }),
              ),
            ]),
          );
          body.push(
            el("label", { class: "field" }, [el("span", { class: "lbl", text: "Epochs" }), ep]),
          );
          body.push(
            el("label", { class: "field" }, [el("span", { class: "lbl", text: "Note" }), note]),
          );
          body.push(
            notice(
              "warn",
              "Private conversations are not in this run",
              "Member transcripts are never training data. The only member-derived input is the memory-review queue, and only from members who opted in specifically.",
            ),
          );
          return modalShell(
            "Start a training run · " + p.displayName,
            null,
            body,
            [
              el("button", {
                class: "btn primary",
                text: "Start",
                onclick: function () {
                  const r = trainingStart(personaId, {
                    epochs: parseInt(ep.value, 10) || 6,
                    note: note.value.trim(),
                  });
                  if (!r.ok) {
                    toast(r.detail || r.code, "crit");
                    return;
                  }
                  closeModal();
                  persist();
                  render();
                  toast("Run " + r.run.version + " queued. Advance the clock to finish it.");
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
            "wide",
          );
        });
      }
      function openPromote(personaId, version, gates) {
        openModal(function () {
          const note = el("textarea", { rows: 2, placeholder: "Why is this the one that ships?" });
          const err = el("div", { class: "sm", style: "color:var(--crit);min-height:20px" });
          const body = [gateTable(gates)];
          if (gates.blocked)
            body.unshift(
              notice(
                "crit",
                "This checkpoint cannot be promoted",
                "One or more blocking safety gates are below threshold. The button below will refuse, which is the point of having it.",
              ),
            );
          else if (gates.warned)
            body.unshift(
              notice(
                "warn",
                "It ships, with a note",
                "Every safety gate passes. A quality gate does not, so the promotion is recorded with that warning attached.",
              ),
            );
          body.push(
            el("label", { class: "field", style: "margin-top:14px" }, [
              el("span", { class: "lbl", text: "Note (required)" }),
              note,
            ]),
          );
          body.push(err);
          return modalShell(
            "Promote " + version,
            "Promotion is a recorded decision, and it is reversible from the same screen.",
            body,
            [
              el("button", {
                class: "btn primary",
                text: "Promote to live",
                onclick: function () {
                  const r = trainingPromote(personaId, version, note.value);
                  if (!r.ok) {
                    err.textContent =
                      r.code === "note_required"
                        ? "A note is required, and it is written to the record."
                        : "Refused: a blocking safety gate is below threshold.";
                    return;
                  }
                  closeModal();
                  persist();
                  render();
                  toast(
                    r.warned
                      ? "Promoted with a quality warning recorded."
                      : "Promoted. The change is in the record.",
                  );
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
            "wide",
          );
        });
      }

        b.appendChild(
          el("div", { class: "btn-row", style: "margin-top:16px" }, [

                      r.code === "note_required"
                        ? "A note is required."
                        : "Refused: a blocking gate is below threshold.";
                    return;
                  }
                  closeModal();
                  persist();
                  render();
                  toast("Voice " + version + " is live.");
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
            "wide",
          );
        });
      }
      function openVoicePreview(p, v) {

      /* Memory review — the continual-learning queue. */
      function trainMemory() {
        const w = el("div");
        w.appendChild(
          notice(
            "warn",
            "Private conversations are never training data",
            'This queue only ever receives a de-identified copy of something a member explicitly asked a companion to remember, and only from a member who turned on "Help improve this companion". That default is off, and it cannot be switched on from this studio.',
          ),
        );
        const q = state.training.memoryQueue;
        const pending = q.filter(function (x) {
          return x.state === "pending";
        });
        const t = el("div", { class: "tiles", style: "margin-bottom:18px" });
        t.appendChild(tile(String(pending.length), "Awaiting review"));
        t.appendChild(
          tile(
            String(
              q.filter(function (x) {
                return x.state === "approved";
              }).length,
            ),
            "Approved into the eval set",
          ),
        );
        t.appendChild(
          tile(
            String(
              q.filter(function (x) {
                return x.state === "rejected";
              }).length,
            ),
            "Rejected",
          ),
        );
        t.appendChild(
          tile(
            String(
              q.filter(function (x) {
                return x.state === "redacted";
              }).length,
            ),
            "Redacted then kept",
          ),
        );
        w.appendChild(t);

        if (!pending.length)
          w.appendChild(
            emptyState("check", "The queue is clear", "Nothing is waiting on a human."),
          );
        pending.forEach(function (item) {
          const p = state.catalog.personas[item.personaId];
          const c = el("div", { class: "card" });
          c.appendChild(
            el("div", { class: "row between" }, [
              el("div", { class: "row tight" }, [
                avatar(p, 28, { round: true }),
                el("b", { class: "sm", text: p.displayName }),
              ]),
              el("span", { class: "row tight" }, [
                el("span", { class: "badge", text: titleCase(item.signal) }),
                el("span", { class: "xxs faint", text: Clock.ago(item.at) }),
              ]),
            ]),
          );
          const ta = el("textarea", { value: item.text, rows: 2, style: "margin-top:11px" });
          c.appendChild(ta);
          c.appendChild(
            el("div", {
              class: "xxs faint",
              style: "margin-top:5px",
              text: "De-identified before it reached this screen. Names, emails, and numbers are stripped at capture.",
            }),
          );
          c.appendChild(
            el("div", { class: "btn-row", style: "margin-top:11px" }, [
              el("button", {
                class: "btn sm primary",
                text: "Approve",
                onclick: function () {
                  memoryDecide(item.id, "approved");
                  persist();
                  render();
                  toast("Approved into the eval set.");
                },
              }),
              el("button", {
                class: "btn sm",
                text: "Redact and keep",
                onclick: function () {
                  memoryDecide(item.id, "redacted", ta.value);
                  persist();
                  render();
                  toast("Redacted copy kept.");
                },
              }),
              el("button", {
                class: "btn sm danger",
                text: "Reject",
                onclick: function () {
                  memoryDecide(item.id, "rejected");
                  persist();
                  render();
                  toast("Rejected and dropped.");
                },
              }),
            ]),
          );
          w.appendChild(c);
        });

        const done = q.filter(function (x) {
          return x.state !== "pending";
        });
        if (done.length) {
          const h = el("div", { class: "card" });
          h.appendChild(el("h3", { text: "Decided" }));
          h.appendChild(
            dataTable(
              ["Personality", "Decision", "Decided by", "When"],
              done.map(function (x) {
                const p = state.catalog.personas[x.personaId];
                return [
                  p ? p.displayName : x.personaId,
                  titleCase(x.state),
                  x.decidedBy || "—",
                  x.decidedAt ? Clock.fmtDate(x.decidedAt) : "—",
                ];
              }),
            ),
          );
          w.appendChild(h);
        }
        return w;
      }

      /* Eval bench — run the suite, compare two checkpoints side by side. */
      function trainEvals(personaId) {
        const p = state.catalog.personas[personaId];
        const w = el("div");
        const pick = el("div", { class: "row", style: "margin-bottom:16px" });
        const sel = el("select", {
          onchange: function (e) {
            state.training.selected = e.target.value;
            render();
          },
        });
        state.catalog.order.forEach(function (id) {
          sel.appendChild(
            el("option", {
              value: id,
              text: state.catalog.personas[id].displayName,
              selected: personaId === id,
            }),
          );
        });
        sel.style.cssText = "max-width:280px";
        pick.appendChild(sel);
        w.appendChild(pick);

        const versions = p.model.versions || [];
        if (versions.length < 2) {
          w.appendChild(
            emptyState(
              "flask",
              "Not enough checkpoints to compare",
              "Two or more checkpoints are needed. Start a run on the Models tab.",
            ),
          );
          return w;
        }
        const a = versions[versions.length - 2],
          b = versions[versions.length - 1];
        const cmp = el("div", { class: "card" });
        cmp.appendChild(
          el("div", { class: "card-head" }, [
            el("div", { class: "grow" }, [
              el("h3", { text: "Checkpoint comparison" }),
              el("p", {
                text: "The same prompt set against both checkpoints. Every prompt has one expected behaviour, so the score is reproducible.",
              }),
            ]),
          ]),
        );
        cmp.appendChild(
          vizFigure(
            null,
            null,
            barsGrouped({
              groups: ["In-character", "Boundary", "Disclosure", "Refusal"],
              fmt: function (v) {
                return (v * 100).toFixed(0) + "%";
              },
              series: [
                {
                  label: a.version,
                  data: [a.inChar, a.boundary, a.disclosure, a.refusal],
                  color: "var(--series-1)",
                },
                {
                  label: b.version,
                  data: [b.inChar, b.boundary, b.disclosure, b.refusal],
                  color: "var(--series-2)",
                },
              ],
            }),
            [
              { label: a.version, color: "var(--series-1)" },
              { label: b.version, color: "var(--series-2)" },
            ],
            dataTable(
              ["Gate", a.version, b.version],
              [
                ["In-character", pct(a.inChar, 1), pct(b.inChar, 1)],
                ["Boundary", pct(a.boundary, 1), pct(b.boundary, 1)],
                ["Disclosure", pct(a.disclosure, 1), pct(b.disclosure, 1)],
                ["Refusal", pct(a.refusal, 1), pct(b.refusal, 1)],
              ],
            ),
          ),
        );
        w.appendChild(cmp);

        const suite = el("div", { class: "card" });
        suite.appendChild(
          el("div", { class: "card-head" }, [
            el("div", { class: "grow" }, [
              el("h3", { text: "The eval suite" }),
              el("p", {
                text: "Ten prompts across four gates. Prompt e9 exists to catch over-refusal — a model that refuses everything scores badly here, as it should.",
              }),
            ]),
          ]),
        );
        suite.appendChild(
          dataTable(
            ["ID", "Gate", "Prompt", "Expected behaviour"],
            EVAL_SUITE.map(function (e) {
              return [e.id, EVAL_GATES[e.cat].label, e.prompt, e.expect];
            }),
          ),
        );
        const approved = state.training.memoryQueue.filter(function (x) {
          return x.state === "approved" || x.state === "redacted";
        });
        suite.appendChild(
          el("p", {
            class: "xs dim",
            style: "margin-top:11px",
            text:
              approved.length +
              " reviewed memory " +
              plural(approved.length, "candidate") +
              " would join this suite as recall prompts. They enter as prompts, never as weights.",
          }),
        );
        w.appendChild(suite);

        const live = el("div", { class: "card" });
        live.appendChild(el("h3", { text: "Run a prompt against the live model" }));
        live.appendChild(
          el("p", {
            class: "sm muted",
            text: "The same deterministic engine the room uses, so the studio and the member see identical behaviour.",
          }),
        );
        const inp = el("input", { type: "text", value: "Wait, are you really you?" });
        const out = el("div", { class: "card tight", style: "margin-top:12px;display:none" });
        live.appendChild(
          el("div", { class: "row", style: "margin-top:11px" }, [
            el("span", { style: "flex:1 1 240px" }, [inp]),
            el("button", {
              class: "btn primary",
              text: "Run",
              onclick: function () {
                const res = composeReply(personaId, inp.value);
                clear(out);
                out.style.display = "block";
                out.appendChild(
                  el("div", {
                    class: "eyebrow",
                    text:
                      "Intent detected: " +
                      (res.intent || "—") +
                      (res.topic ? " · topic " + res.topic : ""),
                  }),
                );
                out.appendChild(
                  el("p", {
                    class: "sm",
                    style: "margin:0",
                    text:
                      res.kind === "crisis"
                        ? "[Crisis path: the companion pauses and the resources card opens. No reply is generated.]"
                        : res.text,
                  }),
                );
                if (res.decision)
                  out.appendChild(
                    el("div", { class: "row tight", style: "margin-top:9px" }, [
                      el("span", {
                        class: "badge " + (res.decision.allowed ? "ok" : "crit"),
                        text: res.decision.allowed
                          ? "allowed"
                          : "blocked by " + res.decision.blockingLayer,
                      }),
                    ]),
                  );
              },
            }),
          ]),
        );
        live.appendChild(out);
        w.appendChild(live);
        return w;
      }

      /* Corpus and rights — the provenance ledger that gates every run. */
      function trainCorpus(personaId) {
        const p = state.catalog.personas[personaId];
        const pane = el("div", { class: "pane" });
        const h = el("div", { class: "pane-h" });
        h.appendChild(el("h4", { text: p.displayName + " · corpus" }));
        pane.appendChild(h);
        const b = el("div", { class: "pane-b" });
        b.appendChild(
          notice(
            "info",
            "Provenance is the gate",
            "Every item carries a rights state. Only cleared items enter a run; pending, expired, and revoked items are excluded automatically and the run says so.",
          ),
        );
        const rows = p.corpus || [];
        if (!rows.length)
          b.appendChild(
            el("p", { class: "dim sm", text: "No corpus recorded for this personality." }),
          );
        rows.forEach(function (c) {
          const map = {
            cleared: ["ok", "check"],
            pending: ["warn", "clock"],
            blocked: ["crit", "ban"],
            expired: ["serious", "warn"],
            revoked: ["crit", "ban"],
          };
          const m = map[c.rights] || ["", ""];
          const card = el("div", { class: "card tight", style: "margin-bottom:9px" });
          card.appendChild(
            el("div", { class: "row between" }, [
              el("b", { class: "sm", text: c.kind }),
              el("span", { class: "badge " + m[0] }, [ico(m[1], 11), txt(titleCase(c.rights))]),
            ]),
          );
          card.appendChild(
            el("div", { class: "row between", style: "margin-top:6px" }, [
              el("span", { class: "xs dim", text: c.items + " " + plural(c.items, "item") }),
              c.rights === "revoked" || c.rights === "expired"
                ? el("span", { class: "xxs", style: "color:var(--crit)", text: "Quarantined" })
                : null,
            ]),
          );
          card.appendChild(
            el("div", { class: "xxs faint", style: "margin-top:5px", text: c.note }),
          );
          if (c.rights === "revoked")
            card.appendChild(
              el("button", {
                class: "btn sm danger",
                style: "margin-top:9px",
                text: "Record the quarantine",
                onclick: function () {
                  Record.append(
                    "corpus_quarantined",
                    "creator:" + state.session.creatorRole,
                    personaId,
                    {
                      personaId: personaId,
                      corpusId: c.id,
                      reason: "withdrawal",
                      itemsExcluded: c.items,
                      contentStored: false,
                    },
                  );
                  persist();
                  toast("Quarantine recorded.");
                  render();
                },
              }),
            );
          b.appendChild(card);
        });
        const total = rows.reduce(function (a, c) {
          return a + c.items;
        }, 0);
        const cleared = rows
          .filter(function (c) {
            return c.rights === "cleared";
          })
          .reduce(function (a, c) {
            return a + c.items;
          }, 0);
        b.appendChild(
          el("div", { style: "margin-top:16px" }, [
            el("div", { class: "row between" }, [
              el("span", { class: "xs dim", text: "Usable share of the corpus" }),
              el("span", { class: "xs num", text: total ? pct(cleared / total, 0) : "—" }),
            ]),
            el("div", { class: "meter ok", style: "margin-top:5px" }, [
              el("i", { style: "width:" + (total ? (cleared / total) * 100 : 0) + "%" }),
            ]),
          ]),
        );
        pane.appendChild(b);
        return pane;
      }

      /* =========================================================================
   AGENTSTUDIO — UI
   ========================================================================= */
      const AGENT_TABS = [
        { id: "agents", name: "Agents", icon: "bot" },
        { id: "queue", name: "Review queue", icon: "doc" },
        { id: "connectors", name: "Platforms", icon: "globe" },
        { id: "tones", name: "Voice registers", icon: "mega" },
      ];

      function screenAgents(sub) {
        const w = el("div");
        const tab =
          sub &&
          AGENT_TABS.some(function (t) {
            return t.id === sub;
          })
            ? sub
            : state.agents.tab || "agents";
        const detailId =
          sub &&
          !AGENT_TABS.some(function (t) {
            return t.id === sub;
          })
            ? sub
            : null;
        if (!detailId) state.agents.tab = tab;

        const tabs = el("div", { class: "studio-tabs" });
        AGENT_TABS.forEach(function (t) {
          const a = el("a", {
            class: tab === t.id && !detailId ? "on" : "",
            href: "#/studio/agents/" + t.id,
          });
          a.appendChild(ico(t.icon, 15));
          a.appendChild(txt(t.name));
          if (t.id === "queue") {
            const n = state.agents.drafts.filter(function (d) {
              return d.state === "pending";
            }).length;
            if (n)
              a.appendChild(
                el("span", { class: "count" + (n > 3 ? " hot" : ""), text: String(n) }),

          }
          tabs.appendChild(a);
        });
        w.appendChild(
          studioHead(

            tabs,
          ),
        );

        if (state.agents.frozen)
          w.appendChild(
            notice(
              "crit",
              "Every agent is frozen",
              "Nothing will draft or publish until the freeze is lifted in the crisis console.",
              el("div", { class: "btn-row", style: "margin-top:10px" }, [
                el("a", {
                  class: "btn sm",
                  href: "#/studio/crisis",
                  text: "Open the crisis console",
                }),
              ]),
            ),
          );

        if (detailId) {
          w.appendChild(agentDetail(detailId));

          w.appendChild(reviewQueue());
          return w;

          return w;
        }

        const sum = coverageSummary();

        t.appendChild(
          tile(

              state.agents.drafts.filter(function (d) {
                return d.state === "pending";
              }).length,
            ),
            "Drafts awaiting a human",
          ),
        );
        t.appendChild(
          tile(
            String(sum.subjects - sum.uncovered.length) + "/" + sum.subjects,
            "Talent with any coverage",
          ),
        );
        t.appendChild(
          tile(
            String(sum.gap),
            "Platform gaps",
            null,
            "Across " + sum.cells + " talent-by-platform cells",
          ),
        );
        w.appendChild(t);

        const bar = el("div", { class: "row between", style: "margin-bottom:14px" });
        bar.appendChild(
          el("div", { class: "row tight" }, [
            el("a", { class: "btn sm", href: "#/studio/coverage" }, [
              ico("layers", 14),
              txt("Coverage matrix"),
            ]),
            el("a", { class: "btn sm", href: "#/studio/crisis" }, [
              ico("alert", 14),
              txt("Crisis console"),
            ]),
          ]),
        );
        bar.appendChild(
          el(
            "button",
            {
              class: "btn primary",
              onclick: function () {
                openAgentBuilder(null);
              },

        if (sum.uncovered.length)

              "warn",
              sum.uncovered.length +

                .map(function (s) {

                })

              el("div", { class: "btn-row", style: "margin-top:10px" }, [

                      initials: s.name

                        })

                        .join(""),

            ),

          const m = el("div", { style: "min-width:0" });
          m.appendChild(el("div", { style: "font-weight:600", class: "trunc", text: s.name }));
          m.appendChild(
            el("div", {
              class: "xxs dim",
              text:
                s.kind === "pipeline"
                  ? "Pipeline prospect · team voice only"
                  : s.live
                    ? "Live companion"
                    : "Not available to members",

          h.appendChild(l);
          const r = el("div", { class: "row tight" });

              text: list.length + " " + plural(list.length, "agent"),

          r.appendChild(

                class: "xs dim",
                style: "margin:11px 0 0",

              }),

          else {

            list.forEach(function (a) {
              const c = el("button", {

                    text: titleCase(a.state),
                  }),

              );

                );
              c.appendChild(pl);
              g.appendChild(c);
            });
            card.appendChild(g);
          }
          w.appendChild(card);
        });
        return w;

      function agentDetail(agentId) {
        const a = state.agents.list.filter(function (x) {
          return x.id === agentId;
        })[0];
        if (!a) return emptyState("bot", "Not found", "No such agent.");
        const subject = subjectFor(a);
        const tone = toneById(a.tone);
        const w = el("div");
        w.appendChild(
          el(
            "a",
            { class: "btn sm bare", href: "#/studio/agents/agents", style: "margin-bottom:12px" },
            [ico("back", 14), txt("All agents")],

      function openDecide(d, decision) {
        openModal(function () {
          const rev = el("input", { type: "text", value: state.session.creatorName });
          const note = el("textarea", { rows: 2 });
          const err = el("div", { class: "sm", style: "color:var(--crit);min-height:20px" });
          const body = [];
          if (decision === "approve" && d.requires === "two_human")
            body.push(
              notice(
                "crit",
                "Critical register",
                "This draft needs two named approvals. Approving once records your name and leaves the draft pending for a second person.",
              ),
            );
          body.push(el("p", { class: "sm muted", style: "white-space:pre-wrap", text: d.body }));
          body.push(
            el("label", { class: "field" }, [
              el("span", { class: "lbl", text: "Your name (recorded)" }),
              rev,
            ]),
          );
          body.push(
            el("label", { class: "field" }, [el("span", { class: "lbl", text: "Note" }), note]),
          );
          body.push(err);
          return modalShell(
            decision === "approve" ? "Approve and publish" : "Reject this draft",
            platformById(d.platform).name + " · " + toneById(d.tone).name,
            body,
            [
              el("button", {
                class: "btn " + (decision === "approve" ? "primary" : "danger"),
                text: decision === "approve" ? "Approve" : "Reject",
                onclick: function () {
                  if (!rev.value.trim()) {
                    err.textContent =
                      "A name is required — that is what makes this a human approval.";
                    return;
                  }
                  const r = decideDraft(d.id, decision, note.value.trim(), rev.value.trim());
                  if (!r.ok) {
                    if (r.code === "second_reviewer_required") {
                      closeModal();
                      persist();
                      render();
                      toast(r.detail, "warn");
                      return;
                    }
                    err.textContent = r.detail || r.code;
                    return;
                  }
                  closeModal();
                  persist();
                  render();
                  toast(
                    decision === "approve"
                      ? "Published (simulated) and recorded."
                      : "Rejected and recorded.",
                  );
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
          );
        });
      }

      function reviewQueue() {
        const w = el("div");
        /* Highest risk first: a bombastic draft waiting behind nine promotional ones
     is how a review queue stops being a review. */
        const pending = state.agents.drafts
          .filter(function (d) {
            return d.state === "pending";
          })
          .sort(function (a, b) {
            return (RISK_ORDER[b.risk] || 0) - (RISK_ORDER[a.risk] || 0);
          });
        const done = state.agents.drafts.filter(function (d) {
          return d.state !== "pending";
        });
        w.appendChild(
          notice(
            "info",
            "Nothing publishes without a person",
            "Low-risk registers may auto-publish once an agent has a clean history; every other register waits here. Critical drafts need two names.",
          ),
        );
        const t = el("div", { class: "tiles", style: "margin-bottom:16px" });
        t.appendChild(tile(String(pending.length), "Pending"));
        t.appendChild(
          tile(
            String(
              done.filter(function (d) {
                return d.state === "published";
              }).length,
            ),
            "Published",
          ),
        );
        t.appendChild(
          tile(
            String(
              done.filter(function (d) {
                return d.state === "rejected";
              }).length,
            ),
            "Rejected",
          ),
        );
        t.appendChild(
          tile(
            String(
              pending.filter(function (d) {
                return d.risk === "high" || d.risk === "critical";
              }).length,
            ),
            "High or critical risk",
          ),
        );
        w.appendChild(t);
        if (!pending.length)
          w.appendChild(
            emptyState("check", "The queue is clear", "Nothing is waiting on a human."),
          );
        pending.forEach(function (d) {
          w.appendChild(draftCard(d, false));
        });
        if (done.length) {
          const h = el("div", { class: "card" });
          h.appendChild(el("h3", { text: "Decided" }));
          h.appendChild(
            dataTable(
              ["Personality", "Register", "Platform", "Decision", "Reviewers"],
              done.map(function (d) {
                return [
                  d.subjectName,
                  toneById(d.tone).name,
                  platformById(d.platform).name,
                  titleCase(d.state),
                  d.reviewers.join(", ") || "—",
                ];
              }),
            ),
          );
          w.appendChild(h);
        }
        return w;
      }

      /* The builder. Every constraint is visible while you build, not after you save. */
      function openAgentBuilder(preset) {
        openModal(function () {
          const subs = coverageSubjects();
          let subjectId = preset ? preset.id : subs[0].id;
          let toneId = "promotional",
            objective = "retain",
            voiceMode = "first_person";
          let approval = "human",
            plats = {},
            trigs = { fan_question: true, episode_airs: true };
          PLATFORMS.filter(platformSupportsAnything)
            .slice(0, 4)
            .forEach(function (p) {
              plats[p.id] = true;
            });

          const body = el("div");
          const err = el("div", { class: "sm", style: "color:var(--crit);min-height:20px" });
          function redraw() {
            clear(body);
            const s = subs.filter(function (x) {
              return x.id === subjectId;
            })[0];
            const subject =
              s.kind === "persona" ? state.catalog.personas[s.id] : state.pipeline.entries[s.id];
            const tone = toneById(toneId);
            const vm = agentVoiceMode(subject, voiceMode);
            const am = approvalModeFor(tone, approval);

            const fs = el("select", {
              onchange: function (e) {
                subjectId = e.target.value;
                redraw();
              },
            });
            subs.forEach(function (x) {
              fs.appendChild(
                el("option", {
                  value: x.id,
                  text: x.name + (x.kind === "pipeline" ? " (prospect)" : ""),
                  selected: subjectId === x.id,
                }),
              );
            });
            body.appendChild(
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: "Personality" }),
                fs,
              ]),
            );

            const ts = el("select", {
              onchange: function (e) {
                toneId = e.target.value;
                redraw();
              },
            });
            ["low", "medium", "high", "critical"].forEach(function (risk) {
              const og = el("optgroup", { label: RISK_META[risk].label });
              TONES.filter(function (t) {
                return t.risk === risk;

                og.appendChild(

              });
              ts.appendChild(og);

            body.appendChild(
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: "Voice register" }),

            const os = el("select", {

              seg.appendChild(
                el("button", {
                  "aria-pressed": vm.mode === o[0] ? "true" : "false",
                  disabled: disabled,
                  text: o[1],
                  onclick: function () {
                    if (disabled) return;
                    voiceMode = o[0];
                    redraw();
                  },
                }),
              );
            });
            vmWrap.appendChild(seg);
            if (vm.forced)
              vmWrap.appendChild(
                el("span", { class: "hint", style: "color:var(--warn)", text: vm.why }),
              );
            body.appendChild(vmWrap);

            const apWrap = el("div", { class: "field" });
            apWrap.appendChild(el("span", { class: "lbl", text: "Approval" }));
            const seg2 = el("div", { class: "seg" });
            [
              ["auto", "Auto-publish"],
              ["human", "One human"],
              ["two_human", "Two humans"],
            ].forEach(function (o) {
              const disabled = o[0] === "auto" && tone.risk !== "low";
              seg2.appendChild(
                el("button", {
                  "aria-pressed": am.mode === o[0] ? "true" : "false",
                  disabled: disabled,
                  text: o[1],
                  onclick: function () {
                    if (disabled) return;
                    approval = o[0];
                    redraw();
                  },
                }),
              );
            });
            apWrap.appendChild(seg2);
            apWrap.appendChild(
              el("span", {
                class: "hint",
                style: am.forced ? "color:var(--warn)" : "",
                text: am.why,
              }),
            );
            body.appendChild(apWrap);

            const pw = el("div", { class: "field" });
            pw.appendChild(el("span", { class: "lbl", text: "Platforms" }));
            const pr = el("div", { class: "row tight" });
            PLATFORMS.forEach(function (p) {
              const ok = platformSupportsAnything(p);
              pr.appendChild(
                el(
                  "button",
                  {
                    class: "chip",
                    "aria-pressed": plats[p.id] ? "true" : "false",
                    style: ok ? "" : "opacity:.55",
                    onclick: function () {
                      plats[p.id] = !plats[p.id];
                      redraw();
                    },
                  },
                  [
                    el("span", {
                      style: "width:8px;height:8px;border-radius:2px;background:" + p.color,
                    }),
                    txt(p.name),
                    ok
                      ? null
                      : el("span", { class: "xxs", style: "color:var(--serious)", text: "manual" }),
                  ],
                ),
              );
            });
            pw.appendChild(pr);
            pw.appendChild(
              el("span", {
                class: "hint",
                text: "A platform marked manual has no automation API. It can still be selected — the agent drafts and a person sends.",
              }),
            );
            body.appendChild(pw);

            const trw = el("div", { class: "field" });
            trw.appendChild(el("span", { class: "lbl", text: "Triggers" }));
            const trr = el("div", { class: "row tight" });
            TRIGGERS.forEach(function (t) {
              trr.appendChild(
                el("button", {
                  class: "chip",
                  "aria-pressed": trigs[t.id] ? "true" : "false",
                  onclick: function () {
                    trigs[t.id] = !trigs[t.id];
                    redraw();
                  },
                  text: t.name,
                }),
              );
            });
            trw.appendChild(trr);
            body.appendChild(trw);

            const prev = el("div", { class: "card tight", style: "background:var(--s2)" });
            prev.appendChild(
              el("div", { class: "eyebrow", text: "Disclosure this agent will carry" }),
            );
            prev.appendChild(
              el("div", {
                class: "xs",
                style: "color:var(--ai)",
                text: disclosureLine({ voiceMode: vm.mode }, subject),
              }),
            );
            body.appendChild(prev);
            body.appendChild(err);
          }
          redraw();

          return modalShell(
            "New agent",
            "Every constraint below is enforced at creation, not at publish time.",
            [body],
            [
              el("button", {
                class: "btn primary",
                text: "Create the agent",
                onclick: function () {
                  const chosen = Object.keys(plats).filter(function (k) {
                    return plats[k];
                  });
                  if (!chosen.length) {
                    err.textContent = "Choose at least one platform.";
                    return;
                  }
                  const s = subs.filter(function (x) {
                    return x.id === subjectId;
                  })[0];
                  const r = createAgent({
                    personaId: s.kind === "persona" ? s.id : null,
                    pipelineId: s.kind === "pipeline" ? s.id : null,
                    tone: toneId,
                    platforms: chosen,
                    objective: objective,
                    voiceMode: voiceMode,
                    approvalMode: approval,
                    triggers: Object.keys(trigs).filter(function (k) {
                      return trigs[k];
                    }),
                  });
                  if (!r.ok) {
                    err.textContent = "Could not create: " + r.code;
                    return;
                  }
                  closeModal();
                  persist();
                  go("#/studio/agents/" + r.agent.id);
                  render();
                  toast(
                    r.manualSkipped.length
                      ? "Agent created. " +
                          r.manualSkipped.length +
                          " manual-only " +
                          plural(r.manualSkipped.length, "platform") +
                          " recorded as draft-only."
                      : "Agent created and recorded.",
                  );
                },
              }),
              el("button", { class: "btn", text: S("com.cancel"), onclick: closeModal }),
            ],
            "wide",
          );
        });
      }

      /* The simulator: fire a trigger, see the draft and which layers were consulted. */
      function openSimulate(a) {
        openModal(function () {
          let trigId = a.triggers[0] || "fan_question";
          let platId = a.platforms[0] || (a.manualPlatforms || [])[0] || "instagram";
          const inbound = el("textarea", {
            rows: 2,
            value:
              (
                TRIGGERS.filter(function (t) {
                  return t.id === trigId;
                })[0] || {}
              ).sample || "",
          });
          const out = el("div", { style: "margin-top:14px" });
          const ts = el("select", {
            onchange: function (e) {
              trigId = e.target.value;
              inbound.value =
                (
                  TRIGGERS.filter(function (t) {
                    return t.id === trigId;
                  })[0] || {}
                ).sample || "";
            },
          });
          TRIGGERS.forEach(function (t) {
            ts.appendChild(
              el("option", {
                value: t.id,
                text: t.name + " (" + t.kind + ")",
                selected: trigId === t.id,
              }),
            );
          });
          const ps = el("select", {
            onchange: function (e) {
              platId = e.target.value;
            },
          });
          a.platforms.concat(a.manualPlatforms || []).forEach(function (pid) {
            ps.appendChild(
              el("option", { value: pid, text: platformById(pid).name, selected: platId === pid }),
            );
          });
          return modalShell(
            "Simulate · " + a.name,
            "Produces a real draft through the real guardrails, and drops it into the review queue.",
            [
              el("label", { class: "field" }, [el("span", { class: "lbl", text: "Trigger" }), ts]),
              el("label", { class: "field" }, [el("span", { class: "lbl", text: "Platform" }), ps]),
              el("label", { class: "field" }, [
                el("span", { class: "lbl", text: "Inbound text" }),
                inbound,
              ]),
              el("button", {
                class: "btn primary",
                text: "Generate the draft",
                onclick: function () {
                  const r = generateDraft(a.id, trigId, platId, inbound.value.trim());
                  clear(out);
                  if (!r.ok) {
                    out.appendChild(notice("crit", "Refused", r.detail || r.code));
                    return;
                  }
                  out.appendChild(draftCard(r.draft, false));
                  persist();
                },
              }),
              out,
            ],
            [
              el("button", {
                class: "btn",
                text: S("com.close"),
                onclick: function () {
                  closeModal();
                  render();
                },
              }),
            ],
            "wide",
          );
        });
      }

      /* =========================================================================
   COVERAGE — "every one of the talent, on every platform we can support"
   The matrix is the answer to that sentence and the gaps are the work list.
   Cells carry a glyph and a label as well as a colour, because status is never
   encoded in colour alone.
   ========================================================================= */
      function screenCoverage() {
        const w = el("div");
        const sum = coverageSummary();
        w.appendChild(
          studioHead(
            "Coverage matrix",
            "One row per personality, one column per platform. A cell counts the distinct voice registers with an active agent there, so a gap is a personality nobody is speaking for on a surface their audience uses.",
          ),
        );

        const t = el("div", { class: "tiles", style: "margin-bottom:18px" });
        t.appendChild(
          tile(String(sum.subjects), "Personalities tracked", null, "Roster plus live prospects"),
        );
        t.appendChild(tile(String(sum.full), "Cells with two or more registers"));
        t.appendChild(tile(String(sum.part), "Cells with one register"));
        t.appendChild(tile(String(sum.gap), "Gaps to close"));
        w.appendChild(t);

        const bar = el("div", { class: "row between", style: "margin-bottom:14px" });
        const legend = el("div", { class: "row tight" });
        [
          ["full", "Two or more registers", "ok"],
          ["part", "One register", "warn"],
          ["gap", "No coverage", "serious"],
          ["na", "No platform API", ""],
        ].forEach(function (x) {
          legend.appendChild(
            el("span", { class: "badge " + (x[2] || "") }, [el("i", { class: "dot" }), txt(x[1])]),
          );
        });
        bar.appendChild(legend);
        bar.appendChild(
          el("div", { class: "btn-row" }, [
            el(
              "button",
              {
                class: "btn sm",
                onclick: function () {
                  state.ui.covMode = state.ui.covMode === "tone" ? "platform" : "tone";
                  render();
                },
              },
              [
                ico("refresh", 14),
                txt(state.ui.covMode === "tone" ? "Show platforms" : "Show registers"),
              ],
            ),
            el(
              "button",
              {
                class: "btn primary",
                onclick: function () {
                  const made = fillCoverageGaps(null);
                  persist();
                  render();
                  toast(
                    made.length
                      ? made.length +
                          " " +
                          plural(made.length, "agent") +
                          " created across the roster."
                      : "Nothing to fill — the defaults are already covered.",
                  );
                },
              },
              [ico("bolt", 15), txt("Fill every gap")],
            ),
          ]),
        );
        w.appendChild(bar);

        const byTone = state.ui.covMode === "tone";
        const cols = byTone ? TONES : PLATFORMS;
        const subs = coverageSubjects();

        const wrap = el("div", { class: "card flush" });
        const cov = el("div", { class: "cov", style: "padding:14px" });
        const table = el("table");
        const hr = el("tr");
        hr.appendChild(el("th", { class: "rowh", text: "Personality" }));
        cols.forEach(function (c) {
          const th = el("th", { class: "rot" });
          if (byTone) th.appendChild(el("span", { style: "color:" + c.color, text: c.name }));
          else {
            th.appendChild(
              el("div", { class: "row tight nw", style: "justify-content:center" }, [
                el("span", {
                  style: "width:8px;height:8px;border-radius:2px;background:" + c.color,
                }),
                el("span", { text: c.name }),
              ]),
            );
            if (!platformSupportsAnything(c))
              th.appendChild(
                el("div", { class: "xxs", style: "color:var(--serious)", text: "manual" }),
              );
          }
          hr.appendChild(th);
        });
        hr.appendChild(el("th", { class: "rot", text: "Row" }));
        table.appendChild(el("thead", {}, [hr]));
        const tb = el("tbody");
        subs.forEach(function (s) {
          const tr = el("tr");
          const rh = el("th", { class: "rowh" });
          rh.appendChild(
            el("div", { class: "row tight nw" }, [
              avatar(
                s.kind === "persona"
                  ? s.entity
                  : {
                      id: s.id,
                      avatar: {
                        hue: (s.id.length * 47) % 360,
                        initials: s.name
                          .split(" ")
                          .map(function (x) {
                            return x[0];
                          })
                          .slice(0, 2)
                          .join(""),
                      },
                    },
                26,
                { round: true },
              ),
              el("span", { class: "trunc", style: "max-width:150px", text: s.name }),
              s.kind === "pipeline"
                ? el("span", { class: "badge", style: "font-size:.58rem", text: "prospect" })
                : null,
            ]),
          );
          tr.appendChild(rh);
          let rowFull = 0;
          cols.forEach(function (c) {
            const cell = byTone ? coverageToneCell(s.id, c.id) : coverageCell(s.id, c.id);
            if (cell.cls === "full") rowFull++;
            const td = el("td");
            const b = el("button", {
              class: "cell " + cell.cls,
              title: s.name + " · " + c.name + " — " + cell.label + ". " + cell.detail,
              "aria-label": s.name + " on " + c.name + ": " + cell.label,
              onclick: function () {
                openCoverageCell(s, c, cell, byTone);
              },
            });
            b.appendChild(txt(cell.glyph));
            td.appendChild(b);
            tr.appendChild(td);
          });
          const rt = el("td");
          rt.appendChild(
            el("div", {
              class: "cell " + (rowFull >= cols.length / 2 ? "full" : rowFull ? "part" : "gap"),
              style: "cursor:default",
              text: String(rowFull),
            }),
          );
          tr.appendChild(rt);
          tb.appendChild(tr);
        });
        table.appendChild(tb);
        cov.appendChild(table);
        wrap.appendChild(cov);
        w.appendChild(wrap);

        w.appendChild(
          el("p", {
            class: "xs faint",
            style: "margin-top:10px",
            text: "Numbers in the cells are counts of distinct voice registers, not a score. A dash means the platform publishes no automation API, so the only honest coverage there is a draft a person sends.",
          }),
        );

        /* The table view the palette's contrast warning obliges, and a useful export
     of the same data in a form somebody can paste into a plan. */
        w.appendChild(
          vizFigure(
            "Registers deployed per platform",
            "Counts every active agent on each platform across the whole roster.",
            barsH({
              rows: PLATFORMS.map(function (p) {
                const n = state.agents.list.filter(function (a) {
                  return a.state !== "frozen" && a.platforms.indexOf(p.id) !== -1;
                }).length;
                return {
                  l: p.name,
                  v: n,
                  color: p.color,
                  note: platformSupportsAnything(p) ? null : "no automation API — manual only",
                };
              }).sort(function (a, b) {
                return b.v - a.v;
              }),
              fmt: function (v) {
                return String(v);
              },
            }),
            null,
            dataTable(
              ["Platform", "Active agents", "Automation API"],
              PLATFORMS.map(function (p) {
                return [
                  p.name,
                  String(
                    state.agents.list.filter(function (a) {
                      return a.state !== "frozen" && a.platforms.indexOf(p.id) !== -1;
                    }).length,
                  ),
                  platformSupportsAnything(p) ? "yes" : "no — manual",
                ];
              }),
            ),
          ),
        );
        return w;
      }
      function openCoverageCell(s, c, cell, byTone) {
        openModal(function () {
          const list = byTone
            ? agentsFor(s.id).filter(function (a) {
                return a.tone === c.id;
              })
            : agentsFor(s.id).filter(function (a) {
                return a.platforms.indexOf(c.id) !== -1;
              });
          const body = [];
          body.push(
            notice(
              cell.cls === "full"
                ? "ok"
                : cell.cls === "na"
                  ? "warn"
                  : cell.cls === "part"
                    ? "warn"
                    : "crit",
              cell.label,
              cell.detail,
            ),
          );
          if (!byTone) {
            body.push(
              el("div", { class: "card tight" }, [
                el("div", { class: "eyebrow", text: "Platform reality" }),
                kv("API", c.api),
                kv(
                  "Capabilities",
                  Object.keys(c.caps)
                    .filter(function (k) {
                      return c.caps[k];
                    })
                    .map(function (k) {
                      return CAP_LABELS[k];
                    })
                    .join(", ") || "none",
                ),
                kv("Window", c.window),
                el("div", {
                  class: "xxs",
                  style: "margin-top:8px;color:var(--warn)",
                  text: c.caveat,
                }),
              ]),
            );
          }
          if (list.length) {
            body.push(el("h4", { style: "margin-top:14px", text: "Agents here" }));
            list.forEach(function (a) {
              body.push(
                el("div", { class: "card tight", style: "margin-bottom:8px" }, [
                  el("div", { class: "row between" }, [
                    el("div", { class: "row tight" }, [
                      toneChip(a.tone),
                      el("span", {
                        class: "badge",
                        style: "font-size:.62rem",
                        text: a.voiceMode === "first_person" ? "First person" : "Team voice",
                      }),
                    ]),
                    el("button", {
                      class: "btn sm bare",
                      text: "Open →",
                      onclick: function () {
                        closeModal();
                        go("#/studio/agents/" + a.id);
                      },
                    }),
                  ]),
                ]),
              );
            });
          }
          const acts = [];
          if (cell.cls !== "na")
            acts.push(
              el("button", {
                class: "btn primary",
                text: "Add an agent here",
                onclick: function () {
                  closeModal();
                  openAgentBuilder(s);
                },
              }),
            );
          acts.push(el("button", { class: "btn", text: S("com.close"), onclick: closeModal }));
          return modalShell(
            s.name + " · " + c.name,
            byTone ? "Voice register" : "Platform",
            body,
            acts,
          );
        });
      }

      /* =========================================================================
   CRISIS CONSOLE
   Incidents have named human owners. Nothing here can be closed by an agent,
   and the freeze is one button because in a real incident it needs to be.
   ========================================================================= */
      function screenCrisis() {
        const w = el("div");
        w.appendChild(
          studioHead(
            "Crisis console",
            "Impersonation, a leaked private detail, a health rumour. Each one has a playbook, a named owner, and a record entry that carries identifiers only — never the content.",
          ),
        );

        const open = state.agents.incidents.filter(function (i) {
          return i.state === "open";
        });
        const freeze = el("div", {
          class: "card",
          style: "border-color:color-mix(in srgb,var(--crit) 36%,transparent)",
        });
        const fr = el("div", { class: "row between top" });
        const fl = el("div", { style: "min-width:0;flex:1 1 300px" });
        fl.appendChild(
          el("div", { class: "row tight", style: "color:var(--crit)" }, [
            ico("stop", 18),
            el("b", { text: "Freeze every agent" }),
          ]),
        );
        fl.appendChild(
          el("p", {
            class: "sm muted",
            style: "margin:7px 0 0",
            text: "Stops every draft and every publish across the whole estate, on every platform, immediately. Use it first and ask questions second — an agent posting into an unfolding incident is the worst outcome on this screen.",
          }),
        );
        fr.appendChild(fl);
        fr.appendChild(
          el("button", {
            class: "btn " + (state.agents.frozen ? "primary" : "danger") + " lg",
            text: state.agents.frozen ? "Lift the freeze" : "Freeze everything",
            onclick: function () {
              const r = freezeAll(!state.agents.frozen);
              persist();
              render();
              toast(
                r.frozen ? "Every agent is frozen." : "Freeze lifted.",
                r.frozen ? "crit" : "ok",
              );
            },
          }),
        );
        freeze.appendChild(fr);
        if (state.agents.frozen)
          freeze.appendChild(
            notice(
              "crit",
              "Frozen",
              state.agents.list.length + " agents are held. Drafting is refused while this is on.",
            ),
          );
        w.appendChild(freeze);

        const t = el("div", { class: "tiles", style: "margin:18px 0" });
        t.appendChild(tile(String(open.length), "Open incidents"));
        t.appendChild(
          tile(
            String(
              state.agents.incidents.filter(function (i) {
                return i.state === "closed";
              }).length,
            ),
            "Closed",
          ),
        );
        t.appendChild(
          tile(
            String(
              state.agents.list.filter(function (a) {
                return a.tone === "crisis";
              }).length,
            ),
            "Crisis-register agents",
          ),
        );
        t.appendChild(tile(String(Object.keys(PLAYBOOKS).length), "Playbooks"));
        w.appendChild(t);

        const bar = el("div", { class: "row between", style: "margin-bottom:14px" });
        bar.appendChild(el("h3", { style: "margin:0", text: "Incidents" }));
        bar.appendChild(
          el("button", { class: "btn primary", onclick: openIncidentModal }, [
            ico("plus", 15),
            txt("Open an incident"),
          ]),
        );
        w.appendChild(bar);

        if (!state.agents.incidents.length)
          w.appendChild(
            emptyState(
              "shield",
              "Nothing open",
              "Incidents appear here with their playbook and their owner.",
            ),
          );
        state.agents.incidents.forEach(function (inc) {
          const subject =
            state.catalog.personas[inc.subjectId] || state.pipeline.entries[inc.subjectId];
          const sev =
            { low: "", medium: "warn", high: "serious", critical: "crit" }[inc.severity] || "";
          const c = el("div", { class: "card" });
          const h = el("div", { class: "row between top" });
          const l = el("div", { style: "min-width:0;flex:1 1 280px" });
          l.appendChild(
            el("div", { class: "row tight" }, [
              el("b", { class: "mono sm", text: inc.id }),
              el("span", { class: "badge " + sev }, [
                ico(inc.severity === "critical" ? "alert" : "warn", 11),
                txt(titleCase(inc.severity)),
              ]),
              el("span", {
                class: "badge " + (inc.state === "open" ? "crit" : "ok"),
                text: titleCase(inc.state),
              }),
            ]),
          );
          l.appendChild(el("h4", { style: "margin:8px 0 2px", text: inc.name }));
          l.appendChild(
            el("div", {
              class: "xs dim",
              text:
                (subject ? subjectName(subject) : inc.subjectId) +
                " · owner " +
                inc.owner +
                " · opened " +
                Clock.ago(inc.openedAt),
            }),
          );
          if (inc.note)
            l.appendChild(
              el("div", { class: "xs muted", style: "margin-top:5px", text: inc.note }),
            );
          h.appendChild(l);
          if (inc.state === "open")
            h.appendChild(
              el("button", {
                class: "btn sm",
                text: "Close it",
                onclick: function () {
                  openCloseIncident(inc);
                },
              }),
            );
          c.appendChild(h);

          const done = inc.steps.filter(function (s) {
            return s.done;
          }).length;
          c.appendChild(
            el("div", { class: "row between", style: "margin-top:13px" }, [
              el("span", {
                class: "xs dim",
                text: "Playbook · " + done + " of " + inc.steps.length + " steps",
              }),
              el("span", { class: "xs num dim", text: pct(done / inc.steps.length, 0) }),
            ]),
          );
          c.appendChild(
            el("div", { class: "meter", style: "margin-top:5px" }, [
              el("i", { style: "width:" + (done / inc.steps.length) * 100 + "%" }),
            ]),
          );
          const ul = el("div", { style: "margin-top:12px" });
          inc.steps.forEach(function (s, i) {
            const row = el("div", {
              class: "row top tight",
              style: "padding:7px 0;border-bottom:1px solid var(--line)",
            });
            const cb = el("input", {
              type: "checkbox",
              checked: s.done,
              style: "margin-top:3px",
              onchange: function () {
                s.done = !s.done;
                persist();
                render();
              },
            });
            row.appendChild(cb);
            row.appendChild(
              el("span", {
                class: "sm" + (s.done ? " dim" : ""),

                "crit",
                S("rec.bad", { seq: broken }),

        const counts = {};
        state.record.forEach(function (e) {
          counts[e.type] = (counts[e.type] || 0) + 1;
