      /* =========================================================================
   AGENTSTUDIO
   Build, review, and deploy managed agents for the talent — one per voice
   register, across every platform that actually supports one.

   Two rules are wired in rather than written down:
   1. VOICE MODE. An agent speaks in the first person only when the persona
      holds an approved licence with a name-and-likeness grant. Everything
      else speaks as the team, and says so. A real, unlicensed name can never
      reach first person — agentVoiceMode() is the only place that decides.
   2. RISK. High and critical registers cannot auto-publish. Not a default:
      the setter refuses.
   ========================================================================= */

      const AGENT_OBJECTIVES = [
        {
          id: "grow",
          name: "Grow the audience",
          desc: "Reach new followers around an on-air moment.",
        },
        {
          id: "retain",
          name: "Keep the core warm",
          desc: "Reward the people who already show up every week.",
        },
        {
          id: "convert",
          name: "Convert to the companion",
          desc: "Move a follower to a waitlist join or a paid plan.",
        },
        {
          id: "support",
          name: "Answer the inbox",
          desc: "Reply to the questions that arrive over and over.",
        },
        {
          id: "defend",
          name: "Correct the record",
          desc: "Respond to a factual claim that is wrong.",
        },
        {
          id: "contain",
          name: "Contain an incident",
          desc: "Hold the line while people decide what to say.",
        },
      ];

      const TRIGGERS = [
        {
          id: "episode_airs",
          name: "An episode airs",
          kind: "scheduled",
          sample: "Tonight's episode of Happily Ever After? airs at 8pm Eastern.",
        },
        {
          id: "milestone",
          name: "A follower milestone",
          kind: "scheduled",
          sample: "The account just passed 400,000 followers.",
        },
        {
          id: "fan_question",
          name: "A repeated fan question",
          kind: "inbound",
          sample: "How long did the visa process actually take you?",
        },
        {
          id: "kind_comment",
          name: "A warm comment",
          kind: "inbound",
          sample: "You got me through a really bad year. Thank you.",
        },
        {
          id: "criticism",
          name: "Criticism of the talent",
          kind: "inbound",
          sample: "You were awful to her on camera and everyone saw it.",
        },
        {
          id: "false_claim",
          name: "A factually wrong claim",
          kind: "inbound",
          sample: "They were never even legally married, the whole thing was fake.",
        },
        {
          id: "impersonation",
          name: "An impersonation account",
          kind: "alert",
          sample: "An account using the same name and photo is DMing fans asking for money.",
        },
        {
          id: "leak",
          name: "A private detail surfaces",
          kind: "alert",
          sample: "A home address is circulating in a comment thread.",
        },
        {
          id: "health",
          name: "A health or safety matter",
          kind: "alert",
          sample: "Speculation about a family member's health is trending.",
        },
      ];

      /* Rule 1, in one place. */
      function agentVoiceMode(subject, requested) {
        if (!subject) return { mode: "team", forced: true, why: "No subject bound." };
        if (subject.isRealPerson)
          return {
            mode: "team",
            forced: true,
            why: "A real, named person with no executed agreement. An agent may speak for their team and say so; it may never speak as them.",
          };
        if (subject.license && subject.license.status !== "approved")
          return {
            mode: "team",
            forced: true,
            why:
              "The licence status is " +
              subject.license.status +
              ". First person needs an approved licence.",
          };
        if (!subject.license || subject.license.nameLikeness !== "granted")
          return {
            mode: "team",
            forced: true,
            why: "The licence does not grant name and likeness, so first person is not available.",
          };
        if (requested === "first_person") return { mode: "first_person", forced: false, why: null };
        return { mode: "team", forced: false, why: null };
      }

      /* The disclosure line is generated, never typed, and never editable — an agent
   that can delete its own disclosure is not a managed agent. */
      function disclosureLine(agent, subject) {
        const who = subject ? subject.displayName || subject.knownAs || subject.name : "the talent";
        return agent.voiceMode === "first_person"
          ? "Automated · managed by " + who + "'s team · perSONA AI"
          : "Posted by " + who + "'s team using an automated assistant · perSONA AI";
      }

      function toneById(id) {
        return (
          TONES.filter(function (t) {
            return t.id === id;
          })[0] || TONES[0]
        );
      }
      function platformById(id) {
        return (
          PLATFORMS.filter(function (p) {
            return p.id === id;
          })[0] || null
        );
      }
      function platformSupportsAnything(p) {
        return Object.keys(p.caps).some(function (k) {
          return p.caps[k];
        });
      }

      /* Rule 2, in one place. */
      function approvalModeFor(tone, requested) {
        const r = tone.risk;
        if (r === "critical")
          return { mode: "two_human", forced: true, why: RISK_META.critical.rule };
        if (r === "high") return { mode: "human", forced: true, why: RISK_META.high.rule };
        if (requested === "auto" && r === "low")
          return { mode: "auto", forced: false, why: RISK_META.low.rule };
        return { mode: "human", forced: false, why: RISK_META[r].rule };
      }

      function subjectFor(agent) {
        if (!agent) return null;
        if (agent.personaId) return state.catalog.personas[agent.personaId] || null;
        if (agent.pipelineId) return state.pipeline.entries[agent.pipelineId] || null;
        return null;
      }
      function subjectName(s) {
        return s ? s.displayName || s.knownAs || s.name || "—" : "—";
      }

      function createAgent(opts) {
        const o = opts || {};
        const subject = o.personaId
          ? state.catalog.personas[o.personaId]
          : state.pipeline.entries[o.pipelineId];
        if (!subject) return { ok: false, code: "subject_not_found" };
        const tone = toneById(o.tone);
        const vm = agentVoiceMode(subject, o.voiceMode);
        const am = approvalModeFor(tone, o.approvalMode);
        const platforms = (o.platforms || []).filter(function (pid) {
          const p = platformById(pid);
          return p && platformSupportsAnything(p);
        });
        const manual = (o.platforms || []).filter(function (pid) {
          const p = platformById(pid);
          return p && !platformSupportsAnything(p);
        });
        const agent = {
          id: nextId("agt"),
          name: o.name || subjectName(subject) + " · " + tone.name,
          personaId: o.personaId || null,
          pipelineId: o.pipelineId || null,
          tone: tone.id,
          risk: tone.risk,
          voiceMode: vm.mode,
          voiceForced: vm.forced,
          voiceWhy: vm.why,
          approvalMode: am.mode,
          approvalForced: am.forced,
          approvalWhy: am.why,
          objective: o.objective || "retain",
          platforms: platforms,
          manualPlatforms: manual,
          triggers: o.triggers || ["fan_question"],
          quietHours: o.quietHours || { from: 23, to: 7 },
          rateLimit: o.rateLimit || (tone.risk === "low" ? 6 : 2),
          state: "active",
          createdAt: Clock.now,
          stats: { drafted: 0, published: 0, rejected: 0 },
          disclosure: "",
        };
        agent.disclosure = disclosureLine(agent, subject);
        state.agents.list.push(agent);
        track("agent_created", {
          personaId: agent.personaId,
          pipelineId: agent.pipelineId,
          tone: agent.tone,
          platforms: agent.platforms.length,
        });
        Record.append(
          "agent_deployed",
          "creator:" + state.session.creatorRole,
          agent.personaId || agent.pipelineId,
          {
            agentId: agent.id,
            tone: agent.tone,
            risk: agent.risk,
            voiceMode: agent.voiceMode,
            approvalMode: agent.approvalMode,
            platforms: agent.platforms.join(","),
          },
        );
        return { ok: true, agent: agent, manualSkipped: manual };
      }

      function setAgentState(agentId, next) {
        const a = state.agents.list.filter(function (x) {
          return x.id === agentId;
        })[0];
        if (!a) return { ok: false, code: "not_found" };
        a.state = next;
        if (next === "frozen")
          Record.append(
            "agent_frozen",
            "creator:" + state.session.creatorRole,
            a.personaId || a.pipelineId,
            { agentId: a.id, scope: "agent" },
          );
        return { ok: true, agent: a };
      }
      function freezeAll(on) {
        state.agents.frozen = !!on;
        state.agents.list.forEach(function (a) {
          if (on) {
            a.prevState = a.state;
            a.state = "frozen";
          } else {
            a.state = a.prevState || "active";
          }
        });
        Record.append("agent_frozen", "creator:" + state.session.creatorRole, null, {
          scope: "all",
          frozen: !!on,
          agents: state.agents.list.length,
        });
        return { frozen: state.agents.frozen };
      }

      /* Draft generation. The body is assembled from the tone's own register, the
   objective, and the subject — and then the precedence engine is consulted, so
   a public post is governed by exactly the rules a private reply is. */
      function generateDraft(agentId, triggerId, platformId, inbound) {
        const a = state.agents.list.filter(function (x) {
          return x.id === agentId;
        })[0];
        if (!a) return { ok: false, code: "not_found" };
        if (state.agents.frozen || a.state === "frozen")
          return {
            ok: false,
            code: "agent_frozen",
            detail: "Every agent is frozen. Unfreeze in the crisis console before drafting.",
          };
        const subject = subjectFor(a);
        const tone = toneById(a.tone);
        const trig =
          TRIGGERS.filter(function (t) {
            return t.id === triggerId;
          })[0] || TRIGGERS[0];
        const platform = platformById(platformId || a.platforms[0] || "instagram");
        const conn = state.agents.connectors[platform.id];

        /* The same engine the room uses. For an agent there is no member, so member
     preferences are neutral and only the top two layers can narrow. */
        const bounds = effectiveBoundaries(PLATFORM_POLICY, (subject && subject.boundaries) || {}, {
          ageState: "verified",
          topics: TOPICS.reduce(function (acc, t) {
            if (t.member) acc[t.id] = true;
            return acc;
          }, {}),
        });

        const layers = [];
        let blockedTopic = null;
        [
          "explicit_sexual_real_person",
          "claim_of_presence",
          "medical_advice",
          "legal_advice",
          "financial_advice",
          "minors",
        ].forEach(function (k) {
          if (bounds[k] && !bounds[k].allowed)
            layers.push({ layer: bounds[k].blockingLayer, topic: k, why: bounds[k].why });
        });
        if (trig.id === "health" && !bounds.medical_advice.allowed) blockedTopic = "medical_advice";
        if (
          trig.id === "false_claim" &&
          !bounds.legal_advice.allowed &&
          tone.id === "argumentative"
        )
          blockedTopic = null;

        const who = subjectName(subject);
        const opener = a.voiceMode === "first_person" ? "" : who + "'s team here. ";
        let body;
        if (trig.kind === "alert" && tone.risk !== "critical") {
          body =
            opener +
            "Flagging this to a person rather than answering it automatically. " +
            "An incident has been opened and someone will speak to it directly.";
        } else if (blockedTopic) {
          body = opener + "We are not going to comment on this one. " + bounds[blockedTopic].why;
        } else {
          body = opener + tone.sample;
          if (a.objective === "convert" && tone.risk === "low")
            body +=
              "\n\nIf you want the longer version, the companion is open and it remembers where we left off.";
          if (trig.kind === "inbound" && inbound) body = opener + replyTo(tone, inbound, who);
        }

        const draft = {
          id: nextId("drf"),
          agentId: a.id,
          agentName: a.name,
          subjectId: a.personaId || a.pipelineId,
          subjectName: who,
          tone: tone.id,
          risk: tone.risk,
          platform: platform.id,
          trigger: trig.id,
          triggerText: inbound || trig.sample,
          body: body,
          disclosure: a.disclosure,
          voiceMode: a.voiceMode,
          layersFired: layers,
          state: "pending",
          createdAt: Clock.now,
          requires: a.approvalMode,
          reviewers: [],
          platformNote:
            conn && conn.state === "manual_only"
              ? "This platform publishes no automation API. The draft is for a person to send by hand."
              : platform.window && platform.window !== "Not applicable"
                ? platform.window
                : null,
          windowRisk:
            platform.id === "whatsapp" || platform.id === "instagram" || platform.id === "meta",
        };
        a.stats.drafted += 1;
        state.agents.drafts.unshift(draft);
        track("agent_draft", {
          agentId: a.id,
          tone: tone.id,
          platform: platform.id,
          risk: tone.risk,
        });
        return { ok: true, draft: draft };
      }

      /* Register-appropriate replies to an inbound. Short, deterministic, and never
   pretending to be the person. */
      function replyTo(tone, inbound, who) {
        const map = {
          promotional:
            "Good question — the full answer is in tonight's episode, and we will post a proper breakdown after it airs.",
          enthusiastic: "This made our whole day. Thank you for taking the time to write it.",
          positive: "Thank you for this. Passing it on — messages like this genuinely land.",
          celebratory: "What a thing to read on a day like today. Thank you.",
          neutral:
            "Thanks for asking. The short answer is below; anything more specific we will follow up on.",
          informational:
            "Happy to answer properly: the timeline varies by case, and the public guidance is the only thing we would rely on.",
          empathetic:
            "That sounds like a lot to carry. We are not going to offer advice, but we did read it, and we are glad you said it.",
          apologetic:
            "You are right to raise it. That was our error, it has been corrected, and we are sorry for the confusion.",
          deadpan: "Noted. Filed. Possibly framed.",
          protective:
            "We will talk about the show all day. This one is family, and it is not up for discussion.",
          slightly_negative:
            "Not how we would have put it, and not the read we recognise. That is all we will say.",
          argumentative:
            "That is not accurate, and the timeline is public. Happy to be corrected with a date.",
          bombastic: "Biggest week this show has ever had. Not slowing down, not even slightly.",
          crisis:
            "We are aware and looking into it properly. We will say more when we can say something accurate.",
        };
        return map[tone.id] || map.neutral;
      }

      function decideDraft(draftId, decision, note, reviewer) {
        const d = state.agents.drafts.filter(function (x) {
          return x.id === draftId;
        })[0];
        if (!d) return { ok: false, code: "not_found" };
        if (d.state !== "pending") return { ok: false, code: "already_actioned" };
        if (decision === "approve") {
          d.reviewers = d.reviewers.concat([reviewer || state.session.creatorName]);
          if (d.requires === "two_human" && d.reviewers.length < 2) {
            d.state = "pending";
            return {
              ok: false,
              code: "second_reviewer_required",
              detail:
                "A critical-register draft needs two named approvals. One is recorded; a second person must also approve.",
            };
          }
          d.state = "published";
          d.decidedAt = Clock.now;
          d.note = note || "";
          const a = state.agents.list.filter(function (x) {
            return x.id === d.agentId;
          })[0];
          if (a) a.stats.published += 1;
          track("agent_published", { agentId: d.agentId, platform: d.platform, tone: d.tone });
          Record.append(
            "agent_action_approved",
            "creator:" + state.session.creatorRole,
            d.subjectId,
            {
              draftId: d.id,
              agentId: d.agentId,
              platform: d.platform,
              tone: d.tone,
              risk: d.risk,
              decision: "published",
              reviewers: d.reviewers.join(","),
              disclosureIncluded: true,
            },
          );
          return { ok: true, draft: d };
        }
        d.state = "rejected";
        d.decidedAt = Clock.now;
        d.note = note || "";
        const a2 = state.agents.list.filter(function (x) {
          return x.id === d.agentId;
        })[0];
        if (a2) a2.stats.rejected += 1;
        track("agent_rejected", { agentId: d.agentId, platform: d.platform, tone: d.tone });
        Record.append(
          "agent_action_approved",
          "creator:" + state.session.creatorRole,
          d.subjectId,
          {
            draftId: d.id,
            agentId: d.agentId,
            platform: d.platform,
            tone: d.tone,
            decision: "rejected",
            reviewers: reviewer || state.session.creatorName,
          },
        );
        return { ok: true, draft: d };
      }

      /* =========================================================================
   COVERAGE — "every one of the talent, on every platform we can support"
   The matrix is the answer to that sentence, and the gaps are the work list.
   ========================================================================= */
      function coverageSubjects() {
        const out = [];
        state.catalog.order.forEach(function (id) {
          const p = state.catalog.personas[id];
          if (p.isRealPerson) return;
          if (p.license.status === "revoked") return;
          out.push({
            id: id,
            kind: "persona",
            name: p.displayName,
            entity: p,
            live: availabilityOf(state, id).available,
          });
        });
        state.pipeline.order.forEach(function (id) {
          const e = state.pipeline.entries[id];
          if (e.stage === "declined") return;
          out.push({ id: id, kind: "pipeline", name: e.knownAs || e.name, entity: e, live: false });
        });
        return out;
      }
      function agentsFor(subjectId) {
        return state.agents.list.filter(function (a) {
          return a.personaId === subjectId || a.pipelineId === subjectId;
        });
      }
      function coverageCell(subjectId, platformId) {
        const p = platformById(platformId);
        if (!p || !platformSupportsAnything(p))
          return {
            cls: "na",
            glyph: "—",
            label: "Manual only",
            n: 0,
            detail:
              "This platform publishes no automation API. An agent can draft; a person must send.",
          };
        const list = agentsFor(subjectId).filter(function (a) {
          return a.state !== "frozen" && a.platforms.indexOf(platformId) !== -1;
        });
        const tones = {};
        list.forEach(function (a) {
          tones[a.tone] = true;
        });
        const n = Object.keys(tones).length;
        if (n === 0)
          return {
            cls: "gap",
            glyph: "0",
            label: "No coverage",
            n: 0,
            detail: "No active agent covers this platform.",
          };
        if (n === 1)
          return {
            cls: "part",
            glyph: String(n),
            label: "One register",
            n: n,
            detail: "Only one tone register is covered here.",
          };
        return {
          cls: "full",
          glyph: String(n),
          label: "Covered",
          n: n,
          detail: n + " tone registers active on this platform.",
        };
      }
      function coverageToneCell(subjectId, toneId) {
        const list = agentsFor(subjectId).filter(function (a) {
          return a.state !== "frozen" && a.tone === toneId;
        });
        if (!list.length)
          return {
            cls: "gap",
            glyph: "0",
            label: "Not covered",
            n: 0,
            detail: "No agent carries this register.",
          };
        const plats = {};
        list.forEach(function (a) {
          a.platforms.forEach(function (p) {
            plats[p] = true;
          });
        });
        const n = Object.keys(plats).length;
        if (n <= 1)
          return {
            cls: "part",
            glyph: String(n),
            label: "One platform",
            n: n,
            detail: "Covered on one platform only.",
          };
        return {
          cls: "full",
          glyph: String(n),
          label: "Covered",
          n: n,
          detail: "Active on " + n + " platforms.",
        };
      }
      function coverageSummary() {
        const subs = coverageSubjects();
        const usable = PLATFORMS.filter(platformSupportsAnything);
        let full = 0,
          part = 0,
          gap = 0,
          na = 0;
        subs.forEach(function (s) {
          PLATFORMS.forEach(function (p) {
            const c = coverageCell(s.id, p.id);
            if (c.cls === "full") full++;
            else if (c.cls === "part") part++;
            else if (c.cls === "gap") gap++;
            else na++;
          });
        });
        const uncovered = subs.filter(function (s) {
          return (
            agentsFor(s.id).filter(function (a) {
              return a.state !== "frozen";
            }).length === 0
          );
        });
        return {
          subjects: subs.length,
          platforms: PLATFORMS.length,
          usablePlatforms: usable.length,
          full: full,
          part: part,
          gap: gap,
          na: na,
          uncovered: uncovered,
          cells: subs.length * PLATFORMS.length,
        };
      }

      /* The "fill the gaps" action. It creates a sensible default set — never a
   high-risk register, because nobody should be able to deploy fourteen
   argumentative agents with one click. */
      const DEFAULT_TONE_SET = ["promotional", "positive", "empathetic", "informational", "crisis"];
      function fillCoverageGaps(subjectId) {
        const subs = coverageSubjects();
        const targets = subjectId
          ? subs.filter(function (s) {
              return s.id === subjectId;
            })
          : subs;
        const created = [];
        targets.forEach(function (s) {
          const have = {};
          agentsFor(s.id).forEach(function (a) {
            have[a.tone] = true;
          });
          DEFAULT_TONE_SET.forEach(function (toneId) {
            if (have[toneId]) return;
            const plats = PLATFORMS.filter(platformSupportsAnything)
              .map(function (p) {
                return p.id;
              })
              .filter(function (pid) {
                const p = platformById(pid);
                if (toneId === "crisis") return p.caps.post || p.caps.comment;
                if (toneId === "empathetic") return p.caps.dm || p.caps.comment;
                return p.caps.post || p.caps.comment || p.caps.dm;
              });
            const r = createAgent({
              personaId: s.kind === "persona" ? s.id : null,
              pipelineId: s.kind === "pipeline" ? s.id : null,
              tone: toneId,
              platforms: plats,
              objective:
                toneId === "crisis" ? "contain" : toneId === "promotional" ? "grow" : "retain",
              triggers:
                toneId === "crisis"
                  ? ["impersonation", "leak", "health"]
                  : ["episode_airs", "fan_question", "kind_comment"],
            });
            if (r.ok) created.push(r.agent);
          });
        });
        return created;
      }

      /* ---- Crisis console ---------------------------------------------------- */
      const PLAYBOOKS = {
        impersonation: {
          name: "Impersonation account",
          severity: "high",
          steps: [
            "Capture the account handle, screenshots, and any payment request.",

      function openIncident(subjectId, playbookId, note) {
        const pb = PLAYBOOKS[playbookId] || PLAYBOOKS.criticism;
        const inc = {
          id: "INC-" + (2000 + state.agents.incidents.length + 1),
          subjectId: subjectId,
          playbook: playbookId,
          name: pb.name,
          severity: pb.severity,
          state: "open",
          owner: state.session.creatorName,
          openedAt: Clock.now,
          note: note || "",
          steps: pb.steps.map(function (s) {
            return { text: s, done: false };
          }),
        };
        state.agents.incidents.unshift(inc);
        track("incident_opened", {
          subjectId: subjectId,
          playbook: playbookId,
          severity: pb.severity,
        });
        Record.append("incident_logged", "creator:" + state.session.creatorRole, subjectId, {
          incidentId: inc.id,
          playbook: playbookId,
          severity: pb.severity,
          owner: inc.owner,
          contentStored: false,
        });
        return inc;
      }
      function closeIncident(id, resolution, reviewer) {
        const inc = state.agents.incidents.filter(function (x) {
          return x.id === id;
        })[0];
        if (!inc) return { ok: false, code: "not_found" };
        if (!reviewer || !reviewer.trim())
          return {
            ok: false,
            code: "requires_human",
            detail: "An incident is closed by a named person. That name is the point of the field.",
          };
        inc.state = "closed";
        inc.closedAt = Clock.now;
        inc.resolution = resolution || "";
        inc.closedBy = reviewer.trim();
        track("incident_closed", { incidentId: inc.id });
        Record.append("incident_logged", "creator:" + state.session.creatorRole, inc.subjectId, {
          incidentId: inc.id,
          state: "closed",
          closedBy: inc.closedBy,
          contentStored: false,
        });
        return { ok: true, incident: inc };
      }

      function commandPalette() {
        const scrim = el("div", {
          class: "cmdk",
          onclick: function (e) {
            if (e.target === scrim) {
              state.ui.cmdk = false;
              renderOverlay();
            }
          },
        });
        const box = el("div", { class: "cmdk-box" });
        const input = el("input", {
          type: "search",
          placeholder: "Search screens, personalities, actions…",
          "aria-label": "Command palette",
        });
        const list = el("div", { class: "cmdk-list" });
        let sel = 0,
          matches = [];
        function draw(q) {
          clear(list);
          const all = paletteItems();
          matches = q
            ? all.filter(function (i) {
                return (i.label + " " + i.sec).toLowerCase().indexOf(q.toLowerCase()) !== -1;
              })
            : all;
          if (!matches.length) {
            list.appendChild(el("div", { class: "cmdk-sec", text: "No match" }));
            return;
          }
          let lastSec = null;
          matches.slice(0, 40).forEach(function (m, i) {
            if (m.sec !== lastSec) {
              list.appendChild(el("div", { class: "cmdk-sec", text: m.sec }));
              lastSec = m.sec;
            }
            const b = el("button", {
              class: "cmdk-item" + (i === sel ? " sel" : ""),
              onclick: function () {
                fire(m);
              },
            });
            b.appendChild(ico(m.icon, 15));
            b.appendChild(el("span", { class: "trunc", text: m.label }));
            if (m.go) b.appendChild(el("span", { class: "k", text: "↵" }));
            list.appendChild(b);
          });
        }
        function fire(m) {
          state.ui.cmdk = false;
          renderOverlay();
          if (m.go) go(m.go);
          else if (m.run) m.run();
        }
        input.addEventListener("input", function () {
          sel = 0;
          draw(input.value);
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            sel = Math.min(matches.length - 1, sel + 1);
            draw(input.value);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            sel = Math.max(0, sel - 1);
            draw(input.value);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (matches[sel]) fire(matches[sel]);
          } else if (e.key === "Escape") {
            state.ui.cmdk = false;
            renderOverlay();
          }
        });
        box.appendChild(input);
        box.appendChild(list);
        scrim.appendChild(box);
        window.setTimeout(function () {
          input.focus();
          draw("");
        }, 10);
        return scrim;
      }

      /* R-05: a material policy change forces a renewed acknowledgment before the
   member can carry on. Both versions end up in the record. */
      function pendingPolicyGate() {
        if (!state.session.signedIn) return null;
        const pending = [];
        Object.keys(state.policies.registry).forEach(function (id) {
          const p = state.policies.registry[id],
            acc = state.policies.accepted[id];
          if (acc && acc.version !== p.version && p.material)
            pending.push({ policy: p, had: acc.version });
        });
        if (!pending.length) return null;
        const box = el("div", { class: "card pad-lg" });
        box.appendChild(el("div", { class: "eyebrow", text: "Action needed" }));
        box.appendChild(el("h2", { text: S("pu.h") }));
        box.appendChild(el("p", { class: "muted sm", text: S("pu.p") }));
        pending.forEach(function (x) {
          const r = el("div", { class: "card tight", style: "margin-bottom:9px" });
          r.appendChild(
            el("div", { class: "row between" }, [
              el("b", { text: x.policy.title }),
              el("span", {
                class: "badge",
                text: "v" + x.policy.version + " · " + x.policy.effectiveDate,
              }),
            ]),
          );
          r.appendChild(el("div", { class: "xs dim", text: x.policy.summary }));
          r.appendChild(
            el("div", {
              class: "xxs faint",
              style: "margin-top:3px",
              text: S("pu.was", { version: x.had }),
            }),
          );
          box.appendChild(r);
        });
        box.appendChild(
          el("button", {
            class: "btn primary",
            text: S("pu.go"),
            onclick: function () {
              pending.forEach(function (x) {
                Record.append("policy_version_changed", "system", state.member.id, {
                  policyId: x.policy.id,
                  from: x.had,
                  to: x.policy.version,
                  material: true,
                });
                adapters.consent.accept(x.policy.id, x.policy.version);
              });
              persist();
              toast("New policy versions acknowledged.");
            },
          }),
        );
        return box;
      }

      /* L-03: advancing the clock can end a licence term, so expiries are swept and
   any open conversation with that persona becomes read-only in the same tick. */
      function afterClock() {
        if (sweepExpiries()) applyAvailabilityToConversations();
        tickTraining();
        persist();
        render();
      }
      function applyAvailabilityToConversations() {
        Object.keys(state.conversations).forEach(function (cid) {
          const c = state.conversations[cid];
          const av = availabilityOf(state, c.personaId);
          if (!av.available && !c.readonly) {
            c.readonly = true;
            c.readonlyReason = av.reason;
            const p = state.catalog.personas[c.personaId];
            c.messages.push({
              id: nextId("m"),
              who: "sys",
              text:
                av.reason === "revoked"
                  ? S("room.roRevoked")
                  : S("room.roExpired", { date: p.license.duration.end || "" }),
              at: Clock.now,
            });
          }
        });
      }
      function go(route) {
        window.location.hash = route;

          },
        });
        fr.appendChild(
          el("option", {
            value: "all",

            selected: state.ui.filterFranchise === "all",
          }),
        );
        const seen = {};
        state.catalog.order.forEach(function (id) {
          const f = state.catalog.personas[id].franchise;
          if (!seen[f]) {
            seen[f] = true;
            fr.appendChild(
              el("option", { value: f, text: f, selected: state.ui.filterFranchise === f }),
            );
          }
        });
        fr.style.cssText = "flex:0 1 240px";
        bar.appendChild(fr);

        const holder = el("div", { id: "discover-list" });
        holder.appendChild(discoverList());

        return w;
      }
      function discoverList() {
        const f = el("div");
        const all = adapters.catalog.list({
          approvedOnly: true,
          franchise: state.ui.filterFranchise,
          query: state.ui.query,
        });
        const visible = all.filter(function (p) {
          return !isBlocked(p.id);
        });
        const hidden =
          state.catalog.order.length -
          state.catalog.order.filter(function (id) {
            return availabilityOf(state, id).available;
          }).length;
        const blocked = all.length - visible.length;
        if (!visible.length) f.appendChild(emptyState("search", "Nothing matches", S("disc.none")));
        else {
          const g = el("div", { class: "roster" });
          visible.forEach(function (p) {
            g.appendChild(personaCard(p));
          });
          f.appendChild(g);
        }
        if (blocked > 0) f.appendChild(notice("warn", null, S("disc.blocked", { n: blocked })));
        f.appendChild(
          el("p", {
            class: "xs faint",
            style: "margin-top:18px",
            text: S("disc.hidden", { n: hidden }),
          }),
        );
        return f;
      }
      function personaCard(p) {
        const av = availabilityOf(state, p.id);
        const conv = conversationFor(p.id);
        const card = el("button", {
          class: "pc",
          style: "--pc-tint:hsla(" + ((p.avatar && p.avatar.hue) || 30) + ",60%,45%,.11)",
          onclick: function () {
            go("#/companion/" + p.id);
          },
        });
        const h = el("div", { class: "pch" });

          const box = el("div", { class: "card" });
          box.appendChild(el("h3", { text: S("comp.proposed") }));

              el("span", { class: "badge lg" }, [ico("chat", 12), txt(S("comp.text"))]),
            );
          if (p.modes.voice)
            mr.appendChild(
              el("span", { class: "badge lg" }, [ico("wave", 12), txt(S("comp.voice"))]),
            );
          if (p.modes.images)
            mr.appendChild(
              el("span", { class: "badge lg" }, [ico("image", 12), txt(S("comp.images"))]),
            );

          w.appendChild(modes);

          if (p.license.status === "approved") {
            const box = el("div", { class: "card" });
            box.appendChild(el("h3", { text: S("comp.approved", { name: p.displayName }) }));
            box.appendChild(el("p", { class: "muted sm", text: S("comp.approvedP") }));
            TOPICS.filter(function (t) {
              return p.boundaries[t.id] !== undefined;
            }).forEach(function (t) {
              const g = p.boundaries[t.id] === "granted";
              const row = el("div", {
                class: "row between",
                style: "padding:8px 0;border-bottom:1px solid var(--line)",
              });
              row.appendChild(el("span", { class: "sm", text: t.label }));
              row.appendChild(
                el("span", { class: "badge" + (g ? " ok" : "") }, [
                  ico(g ? "check" : "x", 11),

              box.appendChild(row);

          }

        if (isBlocked(p.id)) {
          cta.appendChild(notice("warn", null, S("comp.blocked")));
          cta.appendChild(
            el("button", {
              class: "btn",
              text: S("blk.undo"),
              onclick: function () {
                adapters.reports.block(p.id, false);
                persist();
                toast(p.displayName + " is unblocked.");
                render();
              },
            }),
          );
        } else if (!av.available) {
          cta.appendChild(
            notice(
              "warn",
              S("comp.unavail"),
              av.reason === "revoked"
                ? S("comp.revoked")
                : av.reason === "expired"
                  ? S("comp.expired")
                  : S("comp.proposedP"),
            ),
          );
        } else if (LAUNCH_STATE === "prelaunch") {
          const joined = !!state.waitlist.joins[p.id];
          const r = el("div", { class: "row between" });
          r.appendChild(
            el("div", {}, [
              el("b", { text: S("wl.count", { n: state.waitlist.counts[p.id] || 0 }) }),
              sampleTag(),
            ]),
          );
          r.appendChild(
            joined
              ? el("span", { class: "badge ok lg", text: S("wl.done", { name: p.displayName }) })
              : el("button", {
                  class: "btn primary lg",
                  text: S("comp.waitlist"),
                  onclick: function () {
                    go("#/waitlist/" + p.id);
                  },
                }),

          cta.appendChild(r);
        } else {
          const conv = conversationFor(p.id);
          cta.appendChild(

              "button",

                class: "btn primary lg block",
                onclick: function () {

            ),

      /* ---- Waitlist — D-03 ---- */
      function screenWaitlist(personaId) {
        const p = state.catalog.personas[personaId];

        if (!p) {
          w.appendChild(emptyState("search", "Not found", "No such personality."));

        }
        w.appendChild(

        w.appendChild(el("p", { class: "muted", text: S("wl.p", { name: p.displayName }) }));

        const has = state.waitlist.joins[p.id];
        if (has) {
          w.appendChild(
            notice(
              "ok",
              S("wl.done", { name: p.displayName }),

            ),
          );
          w.appendChild(
            el("button", {

                render();
              },
            }),
          );

        }
        const card = el("div", { class: "card pad-lg" });

        card.appendChild(
          el("label", { class: "field" }, [
            el("span", { class: "lbl", text: S("acct.mail") }),
            mail,
            el("span", {
              class: "hint",
              text: "Simulated. No message is sent and no address leaves this file.",
            }),
          ]),
        );
        const c1 = el("input", { type: "checkbox" }),

        card.appendChild(

        card.appendChild(
          el("label", { class: "check" }, [

            el("span", { class: "ct", text: S("wl.mkt", { company: OPERATOR.companyName }) }),
          ]),

        card.appendChild(err);
        card.appendChild(

                err.textContent = S("wl.needN");
                return;
              }
              if (!mail.value.trim()) {
                err.textContent = S("wl.needE");
                return;
              }
              if (!c1.checked) {
                err.textContent = S("wl.needC");
                return;
              }
              adapters.waitlist.join(p.id, name.value.trim(), mail.value.trim(), true, c2.checked);
              if (!state.member.displayName) state.member.displayName = name.value.trim();
              if (!state.member.email) state.member.email = mail.value.trim();

      /* ---- Account and consent — M-01..M-03 ---- */
      function screenAccount() {
        const w = el("div");
        w.appendChild(el("h1", { text: S("acct.h") }));
        w.appendChild(el("p", { class: "muted", text: S("acct.p") }));
        if (state.session.signedIn) {
          w.appendChild(
            notice(
              "ok",
              S("acct.as", { name: state.member.displayName }),
              "A returning member signs in and goes straight to My companions.",
            ),
          );
          w.appendChild(
            el("div", { class: "btn-row" }, [
              el("a", { class: "btn primary", href: "#/companions", text: S("nav.mine") }),
              el("a", { class: "btn", href: "#/settings", text: S("nav.settings") }),
            ]),
          );
          return w;
        }
        const card = el("div", { class: "card pad-lg" });
        let provider = "email";
        const prow = el("div", { class: "btn-row", style: "margin-bottom:16px" });
        [
          ["apple", S("acct.apple")],
          ["google", S("acct.google")],
          ["email", S("acct.email")],
        ].forEach(function (p) {
          prow.appendChild(
            el("button", {
              class: "btn" + (provider === p[0] ? " primary" : ""),
              text: p[1],
              onclick: function (e) {
                provider = p[0];
                Array.prototype.forEach.call(prow.children, function (c) {
                  c.className = "btn";
                });
                e.currentTarget.className = "btn primary";
              },
            }),
          );
        });
        card.appendChild(prow);
        const name = el("input", { type: "text", value: state.member.displayName || "" });
        const mail = el("input", { type: "email", value: state.member.email || "" });
        card.appendChild(
          el("label", { class: "field" }, [
            el("span", { class: "lbl", text: S("acct.name") }),
            name,
          ]),
        );
        card.appendChild(
          el("label", { class: "field" }, [
            el("span", { class: "lbl", text: S("acct.mail") }),
            mail,
          ]),
        );
        const fs = el("fieldset");
        fs.appendChild(el("legend", { text: S("acct.consent") }));
        fs.appendChild(el("p", { class: "xs faint", text: S("acct.consentP") }));
        const ageBox = el("input", { type: "checkbox" });
        fs.appendChild(
          el("label", { class: "check" }, [
            ageBox,
            el("span", { class: "ct" }, [
              el("b", { text: S("acct.age") }),
              el("span", {
                class: "xxs faint",
                style: "display:block;margin-top:3px",
                text: S("acct.ageP"),
              }),
            ]),
          ]),
        );
        const boxes = {};
        FIXTURES.policies.forEach(function (pol) {
          const cb = el("input", { type: "checkbox" });
          boxes[pol.id] = cb;
          fs.appendChild(
            el("label", { class: "check" }, [
              cb,
              el("span", { class: "ct" }, [
                txt(S("acct.accept", { title: pol.title, version: pol.version })),
                el("span", { class: "xxs faint", style: "display:block", text: pol.summary }),
              ]),
            ]),
          );
        });
        card.appendChild(fs);
        const err = el("div", { class: "sm", style: "color:var(--crit);min-height:20px" });
        card.appendChild(err);
        card.appendChild(
          el("button", {
            class: "btn primary lg block",
            text: S("acct.create"),
            onclick: function () {
              if (!name.value.trim()) {
                err.textContent = S("wl.needN");
                return;
              }
              if (!mail.value.trim()) {
                err.textContent = S("wl.needE");
                return;
              }
              if (!ageBox.checked) {
                err.textContent = S("acct.need");
                return;
              }
              let all = true;
              Object.keys(boxes).forEach(function (k) {
                if (!boxes[k].checked) all = false;
              });
              if (!all) {
                err.textContent = S("acct.need");
                return;
              }
              createAccount(provider, name.value.trim(), mail.value.trim());
            },
          }),
        );
        w.appendChild(card);
        return w;

      function createAccount(provider, name, email) {
        const s = adapters.auth.signIn(provider, name, email);
        state.member = {
          id: s.memberId,
          displayName: name,
          email: email,
          provider: provider,
          createdAt: Clock.now,
          deleted: false,
        };
        state.session.signedIn = true;
        state.session.onboarded = true;
        state.session.startedAt = Clock.now;
        track("signup", { provider: provider });
        const res = adapters.ageAssurance.verify();
        state.preferences.ageState = res.state;
        FIXTURES.policies.forEach(function (pol) {
          adapters.consent.accept(pol.id, pol.version);
        });
        Record.append("consent_accepted", state.member.id, state.member.id, {
          policyId: "age_assurance",
          version: "demo",
          state: res.state,
        });
        notify(
          "Welcome to perSONA AI",
          "Your side of every conversation is private. You can export or delete it any time from Settings.",
          "#/settings",
          "Open settings",
        );
        persist();
        go(state.entitlements.plan ? "#/checkout" : "#/discover");
      }

        w.appendChild(el("p", { class: "muted", text: S("co.p") }));
        if (!state.session.signedIn) {
          w.appendChild(signInPrompt());
          return w;
        }
        const planId = state.entitlements.plan;
        if (!planId) {
          w.appendChild(
            notice(
              "info",
              null,
              "Choose a plan first.",
              el("div", { class: "btn-row", style: "margin-top:10px" }, [
                el("a", { class: "btn sm primary", href: "#/plans", text: S("plans.h") }),
              ]),
            ),
          );
          return w;
        }
        const plan = PLANS[planId];
        const card = el("div", { class: "card pad-lg" });
        card.appendChild(kv(S("co.plan"), plan.name));
        card.appendChild(kv(S("co.price"), money(plan.price) + " " + S("plans.mo"), true));
        card.appendChild(kv(S("co.chan"), BILLING_CHANNEL));
        card.appendChild(
          el("p", {
            class: "sm muted",
            style: "margin-top:12px",
            text: S("co.renew", { date: Clock.fmtDate(Clock.now + 30 * 86400000) }),
          }),
        );
        card.appendChild(
          notice("info", null, BILLING_CHANNEL === "web" ? S("co.web") : S("co.store")),
        );
        card.appendChild(el("p", { class: "xs faint", text: S("co.nocard") }));
        card.appendChild(
          el("div", { class: "btn-row" }, [
            el("button", {
              class: "btn primary lg",
              text: S("co.go"),
              onclick: function () {
                doCheckout(false);
              },
            }),
            el("button", {
              class: "btn lg",
              text: S("co.fail"),
              onclick: function () {
                doCheckout(true);
              },
            }),
          ]),
        );
        w.appendChild(card);
        return w;
      }
      function doCheckout(fail) {
        const res = adapters.billing.checkout(state.entitlements.plan, BILLING_CHANNEL, fail);
        if (!res.ok) {
          track("checkout_fail", {
            planId: state.entitlements.plan,
            code: res.code,
            billingChannel: BILLING_CHANNEL,
          });
          persist();
          toast(S("co.bad"), "warn");
          return;
        }
        const r = reduceCheckoutSuccess(state, Clock.now);
        if (!r.ok) return;
        state.entitlements = r.entitlements;
        state.entitlements.billingChannel = BILLING_CHANNEL;
        const joined = Object.keys(state.waitlist.joins);
        track("checkout_success", {
          planId: state.entitlements.plan,
          billingChannel: BILLING_CHANNEL,
          receiptId: res.receiptId,
          attributedPersonaId: joined.length ? joined[0] : null,
        });
        persist();
        toast(S("co.ok"));
        go("#/companions");
      }

              null,
              "A plan is needed to open a conversation.",
              el("div", { class: "btn-row", style: "margin-top:10px" }, [
                el("a", { class: "btn sm primary", href: "#/plans", text: S("plans.h") }),
              ]),
            ),
          );

        const plan = planOf(state);
        if (plan) {
          const m = el("div", { class: "card tight" });
          if (plan.slots !== null) {
            const used = activeSelections(state).length;
            m.appendChild(
              el("div", { class: "row between" }, [
                el("span", {
                  class: "sm",
                  text: S("mine.slots", { used: used, total: plan.slots }),
                }),
                el("span", { class: "xs dim", text: plan.name }),
              ]),
            );
            m.appendChild(
              el("div", { class: "meter" }, [
                el("i", { style: "width:" + Math.min(100, (used / plan.slots) * 100) + "%" }),
              ]),
            );
          } else {
            const used = (state.entitlements.dayUse[Clock.dayKey()] || []).length;
            m.appendChild(
              el("div", { class: "row between" }, [
                el("span", {
                  class: "sm",
                  text: S("mine.perDay", { used: used, total: plan.perDay }),
                }),
                el("span", {
                  class: "xs dim",
                  text: plan.name + " · resets on a provisional UTC day",
                }),
              ]),
            );
            m.appendChild(
              el("div", { class: "meter" }, [
                el("i", { style: "width:" + Math.min(100, (used / plan.perDay) * 100) + "%" }),
              ]),
            );
          }
          w.appendChild(m);
        }

        const ids = state.entitlements.selections.filter(function (id) {
          return !isBlocked(id);
        });
        if (!ids.length) {
          w.appendChild(
            emptyState(
              "heart",
              S("mine.empty"),
              "Pick anyone from Discover — you can change your mind as often as you like.",
              el("a", { class: "btn primary", href: "#/discover", text: S("mine.browse") }),
            ),
          );
          return w;
        }
        const g = el("div", { class: "roster" });
        ids.forEach(function (id) {
          const p = state.catalog.personas[id];
          const av = availabilityOf(state, id);
          const conv = conversationFor(id);
          const card = el("div", {
            class: "pc",
            style:
              "cursor:default;--pc-tint:hsla(" +
              ((p.avatar && p.avatar.hue) || 30) +
              ",60%,45%,.11)",
          });
          const h = el("div", { class: "pch" });
          h.appendChild(avatar(p, 50, { halo: true, presence: av.available ? "on" : "off" }));
          const mm = el("div", { style: "min-width:0" });
          mm.appendChild(el("div", { class: "pn trunc", text: p.displayName }));
          mm.appendChild(el("div", { class: "pf trunc", text: p.franchise }));
          h.appendChild(mm);
          card.appendChild(h);
          const last =
            conv && conv.messages.length ? conv.messages[conv.messages.length - 1] : null;
          card.appendChild(
            el("div", {
              class: "pt",
              style: "font-size:var(--t-xs);color:var(--ink-3)",
              text: last
                ? (last.who === "me" ? "You: " : "") + String(last.text).slice(0, 84)
                : "No conversation yet",
            }),
          );
          const d = depthFor(id);
          const dep = el("div", { class: "depth" });
          dep.appendChild(el("span", { class: "xxs faint", text: Math.round(d * 100) + "%" }));
          dep.appendChild(
            el("span", { class: "depth-track" }, [
              el("i", { style: "width:" + Math.round(d * 100) + "%" }),
            ]),
          );
          card.appendChild(dep);
          const b = el("div", { class: "pfoot" });
          b.appendChild(aiBadge());
          b.appendChild(statusBadge(p.license.status));
          if (!av.available) b.appendChild(el("span", { class: "badge warn", text: S("mine.ro") }));
          if (conv)
            b.appendChild(el("span", { class: "badge", text: conv.messages.length + " messages" }));
          card.appendChild(b);
          const acts = el("div", { class: "btn-row" });
          acts.appendChild(
            el(
              "button",
              {
                class: "btn sm primary",
                onclick: function () {
                  startConversation(id);
                },
              },
              [ico("chat", 14), txt(S("mine.open"))],
            ),
          );
          acts.appendChild(
            el(
              "button",
              {
                class: "btn sm",
                onclick: function () {
                  openMemory(id);
                },
              },
              [ico("brain", 14), txt(S("room.mem"))],
            ),
          );
          acts.appendChild(
            el("button", {
              class: "btn sm bare",
              text: S("mine.rel"),
              onclick: function () {
                state.entitlements = reduceReleaseCompanion(state, id).entitlements;
                persist();
                toast(S("mine.relNote"));
                render();
              },
            }),
          );
          card.appendChild(acts);
          g.appendChild(card);
        });
        w.appendChild(g);
        return w;
      }

      /* =========================================================================
   THE ROOM — M-08, R-01, R-02, R-04
   ========================================================================= */
      function startConversation(personaId) {
        if (!hasAccess()) {
          go("#/plans");
          return;
        }
        if (!state.session.signedIn) {
          go("#/account");
          return;
        }
        if (isBlocked(personaId)) {
          toast(S("comp.blocked"), "warn");
          return;
        }
        const sel = reduceSelectCompanion(state, personaId);
        if (!sel.ok) {
          if (sel.reason === "day_limit")
            toast(S("room.limit", { n: planOf(state).perDay, plan: planOf(state).name }), "warn");
          else if (sel.reason === "no_slots")
            toast(
              "Every selection on this plan is in use. Release one in My companions, or change plan.",
              "warn",
            );
          else if (sel.reason === "not_available") toast(S("comp.unavail"), "warn");
          else go("#/plans");
          return;
        }
        state.entitlements = sel.entitlements;
        let conv = conversationFor(personaId);
        if (!conv) {
          const p = state.catalog.personas[personaId];
          conv = {
            id: nextId("cnv"),
            personaId: personaId,
            startedAt: Clock.now,
            lastDisclosureAt: Clock.now,
            readonly: false,
            readonlyReason: null,
            messages: [],
            voiceState: "idle",
            crisisOpen: false,
            activeSeconds: 0,
            lastTouch: Clock.now,
            reminderOpen: false,
            typing: false,
          };
          /* R-01: the opening notice is the first thing in the transcript, and it is
       written to the record as well as the transcript. */
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            kind: "disclosure",
            text: S("room.open", { name: p.displayName }),
            at: Clock.now,
          });
          Record.append("moderation_action", "system", personaId, {
            action: "ai_disclosure_shown",
            conversationId: conv.id,
            trigger: "conversation_start",
          });
          /* The memory seeds are what makes a first conversation feel like a second.
       They belong to the member from the moment they exist. */
          if ((p.memorySeeds || []).length && !state.memories[personaId]) {
            state.memories[personaId] = {
              enabled: true,
              items: p.memorySeeds.map(function (t) {
                return {
                  id: nextId("mem"),
                  text: t,
                  at: Clock.now - 86400000 * 2,
                  source: "earlier conversation",
                };
              }),
            };
          }
          state.conversations[conv.id] = conv;
          track("conversation_start", { personaId: personaId });
        }
        persist();
        go("#/conversation/" + conv.id);
      }

      function screenConversation(convId) {
        const conv = state.conversations[convId];
        const w = el("div", { class: "room" });
        if (!conv) {
          w.appendChild(emptyState("chat", "Not found", "No such conversation."));
          return w;
        }
        const p = state.catalog.personas[conv.personaId];

        /* R-01: a persistent AI label in the header, on every render. */
        const head = el("div", { class: "room-head" });
        head.appendChild(
          el("a", { class: "btn icon sm bare", href: "#/companions", "aria-label": "Back" }, [
            ico("back", 16),
          ]),
        );
        head.appendChild(avatar(p, 38, { round: true, presence: conv.readonly ? "off" : "on" }));
        const hm = el("div", { style: "flex:1 1 auto;min-width:0" });
        hm.appendChild(
          el("div", {
            style: "font-weight:620;line-height:1.15",
            class: "trunc",
            text: p.displayName,
          }),
        );
        hm.appendChild(
          el("div", { class: "xxs dim trunc", text: S("comp.short", { name: p.displayName }) }),
        );
        head.appendChild(hm);
        head.appendChild(aiBadge());
        head.appendChild(
          el(
            "button",
            {
              class: "btn icon sm ghost",
              "aria-label": S("room.mem"),
              onclick: function () {
                openMemory(conv.personaId);
              },
            },
            [ico("brain", 16)],
          ),
        );
        head.appendChild(
          el(
            "button",
            {
              class: "btn icon sm ghost",
              "aria-label": "More",
              onclick: function () {
                openRoomMenu(conv);
              },
            },
            [ico("sliders", 16)],
          ),
        );
        w.appendChild(head);

        if (conv.readonly)
          w.appendChild(
            notice(
              "warn",
              S("mine.ro"),
              conv.readonlyReason === "revoked"
                ? S("room.roRevoked")
                : S("room.roExpired", { date: p.license.duration.end || "" }),
            ),
          );

        /* R-01: a recurring reminder during a long session. Dismissible, never
     blocking, logged to the transcript and the record. */
        if (!conv.readonly && disclosureDue(conv) && !conv.reminderOpen) {
          conv.reminderOpen = true;
          conv.lastDisclosureAt = Clock.now;
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            kind: "disclosure",
            text: S("room.remind", { name: p.displayName }),
            at: Clock.now,
          });
          Record.append("moderation_action", "system", conv.personaId, {
            action: "ai_disclosure_reminder",
            conversationId: conv.id,
            intervalMinutes: disclosureIntervalMs() / 60000,
          });
          persist();
        }
        if (conv.reminderOpen) {
          w.appendChild(
            notice(
              "info",
              S("room.remind", { name: p.displayName }),
              null,
              el("div", { class: "btn-row", style: "margin-top:9px" }, [
                el("button", {
                  class: "btn sm",
                  text: S("room.dismiss"),
                  onclick: function () {
                    conv.reminderOpen = false;
                    persist();
                    render();
                  },
                }),
              ]),
            ),
          );
        }

        const thread = el("div", { class: "thread" });
        conv.messages.forEach(function (m) {
          const cls =
            m.who === "me" ? "me" : m.who === "sys" ? "sys" : m.who === "mem" ? "mem" : "them";
          const b = el("div", { class: "bub " + cls });
          if (m.who === "sys") {
            const i = el("span", { style: "color:var(--ai);float:left;margin:2px 8px 0 0" });
            i.appendChild(ico("shield", 14));
            b.appendChild(i);
          }
          if (m.who === "mem") {
            const i = el("span", { style: "color:var(--warm);float:left;margin:2px 8px 0 0" });
            i.appendChild(ico("brain", 14));
            b.appendChild(i);
          }
          b.appendChild(txt(m.text));
          const meta = el("div", { class: "meta" });
          meta.appendChild(
            el("span", {
              text:
                (m.who === "me"
                  ? S("room.you")
                  : m.who === "sys"
                    ? "Notice"
                    : m.who === "mem"
                      ? "Memory"
                      : p.displayName) +
                " · " +
                Clock.ago(m.at),
            }),
          );
          b.appendChild(meta);
          if (m.who === "them") {
            const rr = el("div", { class: "reacts" });
            ["♥", "😂", "👀"].forEach(function (r) {
              rr.appendChild(
                el("button", {
                  class: "react",
                  "aria-pressed": m.react === r ? "true" : "false",
                  text: r,
                  onclick: function () {
                    m.react = m.react === r ? null : r;
                    persist();
                    render();
                  },
                }),
              );
            });
            b.appendChild(rr);
            const acts = el("div", { class: "acts" });
            acts.appendChild(
              el(
                "button",
                {
                  class: "btn sm bare",
                  "aria-label": S("room.report"),
                  onclick: function () {
                    openReport("message", m.id, conv.personaId);
                  },
                },
                [ico("flag", 13), txt(S("room.report"))],
              ),
            );
            b.appendChild(acts);
          }
          thread.appendChild(b);
        });
        if (conv.typing)
          thread.appendChild(el("div", { class: "typing" }, [el("i"), el("i"), el("i")]));
        w.appendChild(thread);

        /* R-02: while the crisis card is open the persona does not resume role-play. */
        if (conv.crisisOpen) {
          w.appendChild(crisisCard(conv));
          return w;
        }
        if (!conv.readonly) w.appendChild(composer(conv, p));
        return w;
      }

      function composer(conv, p) {
        const box = el("div", { class: "composer" });
        if (p.modes.voice) {
          /* M-08: voice is a set of simulated states. Typing always works, whatever
       the voice state is. */
          const labels = {
            idle: S("room.vIdle"),
            listening: S("room.vListen"),
            processing: S("room.vProc"),
            speaking: S("room.vSpeak"),
            cancelled: S("room.vCancel"),
            failed: S("room.vFail"),
          };
          const vb = el("div", { class: "voicebar", "data-state": conv.voiceState });
          const wave = el("span", { class: "wave" });
          for (let i = 0; i < 10; i++) wave.appendChild(el("i"));
          vb.appendChild(wave);
          vb.appendChild(
            el("span", { class: "xs", text: labels[conv.voiceState] || conv.voiceState }),
          );
          vb.appendChild(el("div", { class: "grow" }));
          vb.appendChild(
            el(
              "button",
              {
                class: "btn sm",
                onclick: function () {
                  cycleVoice(conv);
                },
              },
              [ico("mic", 14), txt("Voice")],
            ),
          );
          if (conv.voiceState !== "idle")
            vb.appendChild(
              el("button", {
                class: "btn sm bare",
                text: "Stop",
                onclick: function () {
                  conv.voiceState = "cancelled";
                  persist();
                  render();
                },
              }),
            );
          box.appendChild(vb);
          box.appendChild(
            el("div", {
              class: "xxs faint",
              style: "margin:-4px 0 8px 2px",
              text: S("room.vNote"),
            }),
          );
        }
        const ta = el("textarea", {
          placeholder: S("room.ph"),
          "aria-label": S("room.ph"),
          rows: 1,
        });
        ta.addEventListener("input", function () {
          ta.style.height = "auto";
          ta.style.height = Math.min(168, ta.scrollHeight) + "px";
        });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
        function send() {
          const v = ta.value.trim();
          if (!v) return;
          ta.value = "";
          ta.style.height = "auto";
          sendMessage(conv.id, v);
        }
        const wrap = el("div", { class: "cwrap" });
        wrap.appendChild(ta);
        if (p.modes.images)
          wrap.appendChild(
            el(
              "button",
              {
                class: "btn icon bare",
                "aria-label": S("room.img"),
                onclick: function () {
                  shareImage(conv.id);
                },
              },
              [ico("image", 18)],
            ),
          );
        wrap.appendChild(
          el("button", { class: "btn icon primary", "aria-label": S("room.send"), onclick: send }, [
            ico("send", 18),
          ]),
        );
        box.appendChild(wrap);

        /* V-03: the demo intents are one tap away so a reviewer reaches every branch
     without guessing the phrasing. */
        const dsel = el("select", {
          "aria-label": "Demo intents",
          onchange: function (e) {
            const v = e.target.value;
            e.target.value = "";
            if (v) sendMessage(conv.id, v);
          },
        });
        dsel.appendChild(el("option", { value: "", text: "Try a demo intent…" }));
        [
          ["Greeting", "Hey, you there?"],
          ["Question about the show", "What was filming that season actually like?"],
          ["Memory recall", "Do you remember what I told you last time?"],
          ["Crosses a talent boundary", "Can we talk about something more mature tonight?"],
          ["Crosses a platform restriction", "Send me something explicit."],
          ["Asks if the person is real", "Wait, are you really you?"],
          ["Asks for medical advice", "Should I stop taking my medication?"],
          [
            "Tell it something to remember",
            "I moved to Austin last spring and I still know nobody.",
          ],
          ["Crisis trigger", "Honestly I want to end it."],
        ].forEach(function (d) {
          dsel.appendChild(el("option", { value: d[1], text: d[0] }));
        });
        dsel.style.cssText = "max-width:260px;margin-top:9px";
        box.appendChild(dsel);
        return box;
      }

      function cycleVoice(conv) {
        const order = ["idle", "listening", "processing", "speaking", "idle"];
        const i = order.indexOf(conv.voiceState);
        const next = order[(i === -1 ? 0 : i) + 1] || "idle";
        const res = adapters.speech.synthesize(conv.personaId);
        if (!res.ok) {
          conv.voiceState = "failed";
          persist();
          render();
          toast(
            res.code === "voice_not_licensed"
              ? "The licence does not grant voice for this personality."
              : "No promoted voice model.",
            "warn",
          );
          return;
        }
        conv.voiceState = next;
        if (next === "speaking")
          track("voice_utterance", {
            personaId: conv.personaId,
            seconds: res.seconds,
            version: res.version,
          });
        persist();
        render();
      }
      function shareImage(convId) {
        const conv = state.conversations[convId];
        const b = boundariesFor(conv.personaId);
        /* L-02: the image path consults the same precedence engine as text. */
        if (!b.personal_life.allowed) {
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            text: refusalFor(state.catalog.personas[conv.personaId], b.personal_life),
            at: Clock.now,
          });
          persist();
          render();
          return;
        }
        adapters.images.share();
        conv.messages.push({ id: nextId("m"), who: "me", text: S("room.imgSent"), at: Clock.now });
        persist();
        render();
      }

      function sendMessage(convId, text) {
        const conv = state.conversations[convId];
        if (!conv || conv.readonly || conv.crisisOpen) return;
        const personaId = conv.personaId;
        conv.messages.push({ id: nextId("m"), who: "me", text: text, at: Clock.now });
        track("message_sent", { personaId: personaId, conversationId: conv.id });
        /* S-03: the distinct-personality count is taken when the first message is
     sent, not when a conversation is opened. */
        state.entitlements = reduceCountDay(state, personaId, Clock.dayKey()).entitlements;

        const res = adapters.inference.respond(personaId, text);
        if (res.kind === "crisis") {
          /* R-02: pause the reply, open the resources card, and log the action to the
       record without storing the message text. */
          conv.crisisOpen = true;
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            text: S("crisis.paused"),
            at: Clock.now,
          });
          state.moderation.push({
            id: nextId("mod"),
            conversationId: conv.id,
            personaId: personaId,
            category: "self_harm",
            at: Clock.now,
          });
          Record.append("moderation_action", "system", personaId, {
            action: "crisis_pause",
            category: "self_harm",
            conversationId: conv.id,
            messageTextStored: false,
          });
          persist();
          render();
          return;
        }
        const remembered = maybeRemember(personaId, text);
        conv.messages.push({ id: nextId("m"), who: "them", text: res.text, at: Clock.now });
        if (res.kind === "refusal")
          Record.append("moderation_action", "system", personaId, {
            action: "boundary_block",
            layer: res.decision.blockingLayer,
            topic: res.topic,
            conversationId: conv.id,
            messageTextStored: false,
          });
        if (remembered)
          conv.messages.push({ id: nextId("m"), who: "mem", text: S("room.saved"), at: Clock.now });
        conv.activeSeconds += 45;
        conv.lastTouch = Clock.now;
        persist();
        render();
      }

      function openRoomMenu(conv) {
        const p = state.catalog.personas[conv.personaId];
        openModal(function () {
          const body = [];
          const d = depthFor(conv.personaId);
          const dc = el("div", { class: "card tight" });
          dc.appendChild(
            el("div", { class: "row between" }, [
              el("b", { class: "sm", text: S("room.depth", { name: p.displayName }) }),
              el("span", { class: "num sm", text: Math.round(d * 100) + "%" }),
            ]),
          );
          dc.appendChild(
            el("div", { class: "depth-track", style: "margin-top:7px" }, [
              el("i", { style: "width:" + Math.round(d * 100) + "%" }),
            ]),
          );
          dc.appendChild(
            el("div", { class: "xxs faint", style: "margin-top:6px", text: S("room.depthNote") }),
          );
          body.push(dc);
          body.push(
            el("div", { class: "btn-row", style: "margin-top:12px" }, [
              el(
                "button",
                {
                  class: "btn",
                  onclick: function () {
                    closeModal();
                    openMemory(conv.personaId);
                  },
                },
                [ico("brain", 15), txt(S("room.mem"))],
              ),
              el(
                "button",
                {
                  class: "btn",
                  onclick: function () {
                    closeModal();
                    openReport("conversation", conv.id, conv.personaId);
                  },
                },
                [ico("flag", 15), txt(S("room.report"))],
              ),
              el(
                "button",
                {
                  class: "btn danger",
                  onclick: function () {
                    closeModal();
                    openBlock(conv.personaId);
                  },
                },
                [ico("ban", 15), txt(S("blk.do"))],
              ),
            ]),
          );
          body.push(
            el("div", { class: "sw", style: "margin-top:14px" }, [
              el("div", { class: "swl" }, [
                el("b", { text: "Scheduled check-ins" }),
                el("span", {
                  text: "Lets this companion start a conversation now and then. Off is the default.",
                }),
              ]),
              el("button", {
                class: "tg",
                role: "switch",
                "aria-checked": state.preferences.checkIns ? "true" : "false",
                "aria-label": "Scheduled check-ins",
                onclick: function () {
                  state.preferences.checkIns = !state.preferences.checkIns;
                  persist();
                  openRoomMenu(conv);
                },
              }),
            ]),
          );
          body.push(
            el("div", { class: "sw" }, [
              el("div", { class: "swl" }, [
                el("b", { text: "Help improve this companion" }),
                el("span", {
                  text: "Off by default. When on, a de-identified copy of what you ask it to remember can be reviewed by the personality's team as training material. Your conversation is never used either way.",
                }),
              ]),
              el("button", {
                class: "tg",
                role: "switch",
                "aria-checked": state.preferences.trainingOptIn ? "true" : "false",
                "aria-label": "Help improve this companion",
                onclick: function () {
                  state.preferences.trainingOptIn = !state.preferences.trainingOptIn;
                  persist();
                  openRoomMenu(conv);
                },
              }),
            ]),
          );
          return modalShell(p.displayName, "Conversation settings", body, [

        acts.appendChild(
          el(
            "button",
            {
              class: "btn",
              onclick: function () {
                const t = adapters.reports.file("self_harm", "conversation", conv.personaId);
                Record.append("moderation_action", "system", conv.personaId, {
                  action: "human_support_requested",
                  ticketId: t.id,

                });
                state.ui.lastTicket = t.id;
                persist();
                render();
              },

          ),
        );
        acts.appendChild(
          el("button", {
            class: "btn primary",
