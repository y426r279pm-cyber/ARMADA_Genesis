<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="perSONA AI — licensed AI versions of the personalities fans already follow. High-fidelity prototype on a simulated backend."
    />
    <title>perSONA AI</title>
    <!--
  perSONA AI — high-fidelity prototype (the deck's "4K prototype" gate).
  v0.3 = v0.1 brief + v0.2 addendum + this iteration: TrainingStudio, AgentStudio,
  the real-name talent pipeline, and the 4K design system.

  Coding rules carried forward from v0.1 (see CLAUDE.md):
    - One self-contained file. No network call of any kind, ever.
    - Every service is a deterministic mock behind the adapter registry.
    - No external font, script, or stylesheet. SHA-256 and all art are inline.
    - User content is written with textContent. innerHTML only ever receives
      literal inline SVG authored in this file.
    - T-04 comment convention: every block comment opens with the requirement IDs
      it serves and says WHY the rule exists, never what the next line does.
    - Simulated numbers are labelled. Nothing is reported as measured.

  THE LINE THIS BUILD DRAWS, and why it is drawn in code rather than in a doc:
    Real, identifiable people appear ONLY in the talent pipeline, as sourced
    public business facts. They are never given a voice, a personality, a
    memory, or a first-person agent. Conversation, voice cloning and in-persona
    posting all require license status "approved", which no real name holds.
    "No participation, no persona" is the product's own promise; here it is an
    enforced code path with self-checks, not a policy paragraph.
-->
    <style>
      /* =====================================================================
   DESIGN TOKENS — the perSONA AI system.
   Two surfaces share one token set: COMPANION (warm, intimate, cinematic)
   for members, STUDIO (cool, dense, instrument-like) for the talent side.
   The audience difference is real, so the surfaces are allowed to differ.
   ===================================================================== */
      :root {
        color-scheme: dark;

        /* Base — warm charcoal, never cold blue-grey. Members sit here for an hour. */
        --bg: #0a0b0d;
        --bg-deep: #07080a;
        --s1: #111317; /* card / chart surface */
        --s2: #171a1f;
        --s3: #1e2229;
        --s4: #262b34;
        --line: #262b33;
        --line-2: #343b46;
        --line-3: #47505e;

        /* Ink */
        --ink: #f4f1ec;
        --ink-2: #b3b8c2;
        --ink-3: #7d8492;
        --ink-4: #5b616d;

        /* Brand chrome — amber. Reserved for identity and action.
     Never a chart series colour (see the viz tokens below). */
        --brand: #e8b96a;
        --brand-2: #d4a04b;
        --brand-3: #c98500;
        --brand-ink: #1a1206;
        --brand-dim: rgba(232, 185, 106, 0.12);
        --brand-glow: rgba(232, 185, 106, 0.22);

        /* Companion accent — rose. Emotional / relational states. */
        --warm: #e08a92;
        --warm-dim: rgba(224, 138, 146, 0.13);

        /* AI / system accent — cyan. Anything the machine says about itself. */
        --ai: #6fd2e0;
        --ai-dim: rgba(111, 210, 224, 0.12);

        /* Status — reserved. Always shipped with an icon and a word, never colour alone. */
        --ok: #199e70;
        --ok-dim: rgba(25, 158, 112, 0.13);
        --warn: #c98500;
        --warn-dim: rgba(201, 133, 0, 0.14);
        --serious: #d95926;
        --serious-dim: rgba(217, 89, 38, 0.14);
        --crit: #e34948;
        --crit-dim: rgba(227, 73, 72, 0.14);

        /* Chart series — validated set. Order is the CVD-safety mechanism:
     magenta → violet → green → blue clears every adjacent gate in both
     modes, and the first three clear all-pairs for cells and scatter. */
        --series-1: #d55181;
        --series-2: #9085e9;
        --series-3: #008300;
        --series-4: #3987e5;
        --grid: #22262e;
        --axis: #3a4150;

        /* Sequential (one hue, near-zero recedes toward the dark surface) */
        --seq-1: #0d366b;
        --seq-2: #184f95;
        --seq-3: #256abf;
        --seq-4: #3987e5;
        --seq-5: #6da7ec;
        --seq-6: #9ec5f4;
        --seq-7: #cde2fb;

        /* Diverging */
        --div-neg: #3987e5;
        --div-mid: #383835;
        --div-pos: #e34948;

        /* Geometry — companion surface is round and soft; studio tightens it. */
        --r-xs: 8px;
        --r-sm: 12px;
        --r-md: 16px;
        --r-lg: 22px;
        --r-xl: 30px;
        --r-pill: 999px;

        /* Type. No external font is loaded (build rule), so the stack leans on the
     most geometric faces a system is likely to have and tightens tracking to
     sit under the wordmark. */
        --sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo, Consolas,
          "Liberation Mono", monospace;

        /* Fluid type — the same file has to read on a phone and fill a 4K panel. */
        --t-display: clamp(2rem, 1.2rem + 2.6vw, 3.4rem);
        --t-h1: clamp(1.5rem, 1.1rem + 1.3vw, 2.1rem);
        --t-h2: clamp(1.16rem, 1rem + 0.5vw, 1.45rem);
        --t-h3: clamp(1rem, 0.95rem + 0.22vw, 1.12rem);
        --t-body: clamp(0.94rem, 0.9rem + 0.14vw, 1.02rem);
        --t-sm: clamp(0.82rem, 0.8rem + 0.1vw, 0.88rem);
        --t-xs: 0.76rem;
        --t-2xs: 0.69rem;

        /* Layout */
        --rail: 244px;
        --shell: 1280px;
        --shell-wide: 1840px;
        --shell-4k: 2560px;
        --tap: 44px;

        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 8px 28px -10px rgba(0, 0, 0, 0.65);
        --shadow-3: 0 26px 70px -22px rgba(0, 0, 0, 0.8);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --dur: 0.19s;
      }

      /* Light mode is a selected set of steps, not an inversion. */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f3f1ec;
        --bg-deep: #e8e5de;
        --s1: #f7f6f3;
        --s2: #fffefb;
        --s3: #f0eee8;
        --s4: #e6e3db;
        --line: #dcd8cf;
        --line-2: #c7c2b6;
        --line-3: #a9a396;
        --ink: #16181c;
        --ink-2: #4b5059;
        --ink-3: #6c7280;
        --ink-4: #8b909c;
        --brand: #8a6512;
        --brand-2: #9c7418;
        --brand-3: #c98500;
        --brand-ink: #fffdf7;
        --brand-dim: rgba(138, 101, 18, 0.1);
        --brand-glow: rgba(138, 101, 18, 0.14);
        --warm: #b4525c;
        --warm-dim: rgba(180, 82, 92, 0.1);
        --ai: #186b78;
        --ai-dim: rgba(24, 107, 120, 0.1);
        --ok: #1baf7a;
        --warn: #eda100;
        --serious: #eb6834;
        --crit: #e34948;
        --series-1: #e87ba4;
        --series-2: #4a3aa7;
        --series-3: #008300;
        --series-4: #2a78d6;
        --grid: #e2ded4;
        --axis: #b6b0a2;
        --seq-1: #cde2fb;
        --seq-2: #9ec5f4;
        --seq-3: #6da7ec;
        --seq-4: #3987e5;
        --seq-5: #256abf;
        --seq-6: #184f95;
        --seq-7: #0d366b;
        --div-mid: #f0efec;
        --shadow-2: 0 8px 28px -12px rgba(40, 34, 20, 0.22);
        --shadow-3: 0 26px 70px -24px rgba(40, 34, 20, 0.3);
      }
      :root[data-contrast="high"] {
        --ink: #ffffff;
        --ink-2: #e2e5ea;
        --ink-3: #c3c8d2;
        --line: #4a525f;
        --line-2: #697382;
        --s1: #0d0f13;
      }
      :root[data-contrast="high"][data-theme="light"] {
        --ink: #000;
        --ink-2: #23262b;
        --ink-3: #3d424a;
        --line: #8c8578;
      }
      :root[data-text="large"] {
        --t-body: 1.1rem;
        --t-sm: 1rem;
        --t-xs: 0.9rem;
        --t-2xs: 0.82rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
      :root[data-motion="off"] *,
      :root[data-motion="off"] *::before,
      :root[data-motion="off"] *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      /* =====================================================================
   RESET
   ===================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: var(--t-body);
        line-height: 1.55;
        letter-spacing: -0.006em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100vh;
        overflow-x: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
      }
      h1,
      h2,
      h3,
      h4,
      h5 {
        margin: 0 0 0.35em;
        line-height: 1.14;
        font-weight: 640;
        letter-spacing: -0.024em;
      }
      h1 {
        font-size: var(--t-h1);
      }
      h2 {
        font-size: var(--t-h2);
      }
      h3 {
        font-size: var(--t-h3);
      }
      h4 {
        font-size: var(--t-sm);
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 0.7em;
      }
      a {
        color: var(--brand);
        text-underline-offset: 3px;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      ::selection {
        background: var(--brand-glow);
        color: var(--ink);
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 4px;
      }
      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-2);
        border-radius: 99px;
        border: 3px solid var(--bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--line-3);
      }

      /* =====================================================================
   APP FRAME — rail + canvas + optional inspector.
   At 4K the inspector opens instead of the canvas simply growing wider:
   a 2500px-wide paragraph is not a feature.
   ===================================================================== */
      .app {
        display: flex;
        min-height: 100vh;
      }
      .rail {
        position: sticky;
        top: 0;
        align-self: flex-start;
        height: 100vh;
        flex: 0 0 var(--rail);
        background: linear-gradient(180deg, var(--bg-deep), var(--bg));
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 18px 12px 12px;
        gap: 4px;
        overflow-y: auto;
        z-index: 30;
      }
      .canvas {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .canvas-in {
        width: 100%;
        max-width: var(--shell);
        margin: 0 auto;
        padding: 26px 28px 120px;
        flex: 1 1 auto;
      }
      .canvas-in.wide {
        max-width: var(--shell-wide);
      }
      .canvas-in.full {
        max-width: var(--shell-4k);
      }
      @media (min-width: 2200px) {
        :root {
          --rail: 280px;
        }
        .canvas-in {
          padding: 40px 48px 140px;
        }
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 28px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px) saturate(1.3);
      }
      .topbar .grow {
        flex: 1 1 auto;
      }
      /* The rail already carries the wordmark on desktop; two lockups is one too many. */
      @media (min-width: 901px) {
        .topbar .logo {
          display: none;
        }
      }

      /* Mobile: rail becomes a bottom tab bar. Thumb reach is the whole point. */
      .tabbar {
        display: none;
      }
      @media (max-width: 900px) {
        .app {
          flex-direction: column;
        }
        .rail {
          display: none;
        }
        .canvas-in {
          padding: 18px 16px calc(96px + env(safe-area-inset-bottom));
        }
        .topbar {
          padding: 10px 16px;
        }
        .tabbar {
          display: flex;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 40;
          background: color-mix(in srgb, var(--bg-deep) 94%, transparent);
          backdrop-filter: blur(16px);
          border-top: 1px solid var(--line);
          padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        }
        .tabbar a {
          flex: 1 1 0;
          min-width: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          padding: 7px 2px;
          text-decoration: none;
          color: var(--ink-3);
          font-size: var(--t-2xs);
          border-radius: var(--r-sm);
          min-height: var(--tap);
        }
        .tabbar a.on {
          color: var(--brand);
          background: var(--brand-dim);
        }
        .tabbar a svg {
          width: 21px;
          height: 21px;
        }
      }

      /* =====================================================================
   BRAND
   ===================================================================== */
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        min-width: 0;
      }
      .logo img {
        height: 26px;
        width: auto;
      }
      :root[data-theme="light"] .logo img {
        filter: invert(1) brightness(0.22);
      }
      .logo .sub {
        font-size: var(--t-2xs);
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--ink-3);
        border-left: 1px solid var(--line-2);
        padding-left: 10px;
        white-space: nowrap;
      }
      @media (max-width: 560px) {
        .logo .sub {
          display: none;
        }
      }
      .mark {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
      }

      /* =====================================================================
   NAV
   ===================================================================== */
      .nav-group {
        margin: 10px 0 4px;
      }
      .nav-group > span {
        display: block;
        font-size: var(--t-2xs);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--ink-4);
        padding: 0 10px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: var(--r-sm);
        text-decoration: none;
        color: var(--ink-2);
        font-size: var(--t-sm);
        min-height: 38px;
        transition:
          background var(--dur) var(--ease),
          color var(--dur) var(--ease);
        position: relative;
      }
      .nav-item svg {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        opacity: 0.85;
      }
      .nav-item:hover {
        background: var(--s2);
        color: var(--ink);
      }
      .nav-item.on {
        background: var(--brand-dim);
        color: var(--brand);
        font-weight: 560;
      }
      .nav-item.on::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 18px;
        background: var(--brand);
        border-radius: 0 3px 3px 0;
      }
      .nav-item .count {
        margin-left: auto;
        font-family: var(--mono);
        font-size: var(--t-2xs);
        background: var(--s3);
        color: var(--ink-2);
        padding: 1px 6px;
        border-radius: var(--r-pill);
      }
      .nav-item .count.hot {
        background: var(--crit-dim);
        color: var(--crit);
      }

      /* =====================================================================
   CARDS & SURFACES
   ===================================================================== */
      .card {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 18px;
        margin: 0 0 16px;
      }
      .card.soft {
        background: linear-gradient(160deg, var(--s2), var(--s1));
      }
      .card.pad-lg {
        padding: 24px;
      }
      .card.tight {
        padding: 13px;
      }
      .card.flush {
        padding: 0;
        overflow: hidden;
      }
      .card.dashed {
        border-style: dashed;
        background: transparent;
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 0 0 14px;
      }
      .card-head .grow {
        flex: 1 1 auto;
        min-width: 0;
      }
      .card-head h3 {
        margin: 0;
      }
      .card-head p {
        margin: 2px 0 0;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }

      .grid {
        display: grid;
        gap: 16px;
      }
      .g2 {
        grid-template-columns: 1fr;
      }
      .g3 {
        grid-template-columns: 1fr;
      }
      .g4 {
        grid-template-columns: 1fr 1fr;
      }
      @media (min-width: 680px) {
        .g2 {
          grid-template-columns: 1fr 1fr;
        }
        .g3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .g4 {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (min-width: 1100px) {
        .g23 {
          grid-template-columns: 1.6fr 1fr;
        }
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row.nw {
        flex-wrap: nowrap;
      }
      .row.between {
        justify-content: space-between;
      }
      .row.top {
        align-items: flex-start;
      }
      .row.tight {
        gap: 6px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stack.tight {
        gap: 7px;
      }
      .spacer {
        flex: 1 1 auto;
      }

      .eyebrow {
        font-size: var(--t-2xs);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-4);
        margin: 0 0 7px;
      }
      .muted {
        color: var(--ink-2);
      }
      .dim {
        color: var(--ink-3);
      }
      .faint {
        color: var(--ink-4);
      }
      .sm {
        font-size: var(--t-sm);
      }
      .xs {
        font-size: var(--t-xs);
      }
      .xxs {
        font-size: var(--t-2xs);
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      .break {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .trunc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .center {
        text-align: center;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* =====================================================================
   BUTTONS
   ===================================================================== */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: var(--tap);
        padding: 10px 16px;
        border-radius: var(--r-sm);
        background: var(--s3);
        border: 1px solid var(--line-2);
        color: var(--ink);
        font-size: var(--t-sm);
        font-weight: 520;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition:
          background var(--dur) var(--ease),
          border-color var(--dur) var(--ease),
          transform var(--dur) var(--ease);
      }
      .btn:hover {
        background: var(--s4);
        border-color: var(--line-3);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled,
      .btn[aria-disabled="true"] {
        opacity: 0.42;
        cursor: not-allowed;
        transform: none;
      }
      .btn svg {
        width: 16px;
        height: 16px;
      }
      .btn.primary {
        background: linear-gradient(175deg, var(--brand), var(--brand-2));
        border-color: var(--brand-2);
        color: var(--brand-ink);
        font-weight: 640;
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.warm {
        background: linear-gradient(175deg, var(--warm), #c9737b);
        border-color: #c9737b;
        color: #1c0c0e;
        font-weight: 620;
      }
      .btn.ghost {
        background: transparent;
        border-color: var(--line-2);
      }
      .btn.ghost:hover {
        background: var(--s2);
      }
      .btn.bare {
        background: transparent;
        border-color: transparent;
        color: var(--ink-2);
      }
      .btn.bare:hover {
        background: var(--s2);
        color: var(--ink);
      }
      .btn.danger {
        background: transparent;
        border-color: color-mix(in srgb, var(--crit) 44%, transparent);
        color: var(--crit);
      }
      .btn.danger:hover {
        background: var(--crit-dim);
      }
      .btn.sm {
        min-height: 32px;
        padding: 5px 11px;
        font-size: var(--t-xs);
        border-radius: var(--r-xs);
      }
      .btn.sm svg {
        width: 14px;
        height: 14px;
      }
      .btn.lg {
        min-height: 52px;
        padding: 14px 24px;
        font-size: 1.02rem;
        border-radius: var(--r-md);
      }
      .btn.block {
        width: 100%;
      }
      .btn.icon {
        padding: 0;
        width: var(--tap);
        min-height: var(--tap);
      }
      .btn.icon.sm {
        width: 32px;
        min-height: 32px;
      }
      .btn-row {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }

      .seg {
        display: inline-flex;
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--ink-3);
        padding: 6px 13px;
        border-radius: var(--r-xs);
        font-size: var(--t-xs);
        cursor: pointer;
        min-height: 32px;
        white-space: nowrap;
      }
      .seg button[aria-pressed="true"] {
        background: var(--s4);
        color: var(--ink);
        font-weight: 560;
      }
      .seg.scroll {
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .seg.scroll::-webkit-scrollbar {
        display: none;
      }

      /* =====================================================================
   BADGES / CHIPS / STATUS
   ===================================================================== */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line-2);
        background: var(--s2);
        color: var(--ink-2);
        font-size: var(--t-2xs);
        font-weight: 540;
        white-space: nowrap;
        letter-spacing: 0.02em;
      }
      .badge svg {
        width: 11px;
        height: 11px;
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: 0 0 auto;
      }
      .badge.up {
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }
      .badge.ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 42%, transparent);
        background: var(--ok-dim);
      }
      .badge.warn {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 42%, transparent);
        background: var(--warn-dim);
      }
      .badge.serious {
        color: var(--serious);
        border-color: color-mix(in srgb, var(--serious) 42%, transparent);
        background: var(--serious-dim);
      }
      .badge.crit {
        color: var(--crit);
        border-color: color-mix(in srgb, var(--crit) 44%, transparent);
        background: var(--crit-dim);
      }
      .badge.ai {
        color: var(--ai);
        border-color: color-mix(in srgb, var(--ai) 40%, transparent);
        background: var(--ai-dim);
      }
      .badge.brand {
        color: var(--brand);
        border-color: color-mix(in srgb, var(--brand) 40%, transparent);
        background: var(--brand-dim);
      }
      .badge.warm {
        color: var(--warm);
        border-color: color-mix(in srgb, var(--warm) 40%, transparent);
        background: var(--warm-dim);
      }
      .badge.lg {
        padding: 5px 12px;
        font-size: var(--t-xs);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line-2);
        background: var(--s2);
        color: var(--ink-2);
        font-size: var(--t-xs);
        cursor: pointer;
        min-height: 32px;
      }
      .chip:hover {
        border-color: var(--line-3);
        color: var(--ink);
      }
      .chip[aria-pressed="true"] {
        background: var(--brand-dim);
        border-color: color-mix(in srgb, var(--brand) 45%, transparent);
        color: var(--brand);
      }
      .chip.static {
        cursor: default;
      }

      /* Sample-data marker. Every simulated figure in this file wears one. */
      .sample {
        font-size: var(--t-2xs);
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-4);
      }
      .sample::before {
        content: "◦ ";
      }

      /* =====================================================================
   NOTICES
   ===================================================================== */
      .notice {
        display: flex;
        gap: 11px;
        padding: 13px 15px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-2);
        background: var(--s2);
        font-size: var(--t-sm);
        margin: 0 0 14px;
      }
      .notice > svg {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        margin-top: 2px;
      }
      .notice .nb {
        min-width: 0;
        flex: 1 1 auto;
      }
      .notice .nb b {
        display: block;
        margin-bottom: 2px;
        font-weight: 600;
      }
      .notice .nb p {
        margin: 0;
        color: var(--ink-2);
      }
      .notice.info {
        border-color: color-mix(in srgb, var(--ai) 34%, transparent);
        background: var(--ai-dim);
      }
      .notice.info > svg {
        color: var(--ai);
      }
      .notice.ok {
        border-color: color-mix(in srgb, var(--ok) 36%, transparent);
        background: var(--ok-dim);
      }
      .notice.ok > svg {
        color: var(--ok);
      }
      .notice.warn {
        border-color: color-mix(in srgb, var(--warn) 38%, transparent);
        background: var(--warn-dim);
      }
      .notice.warn > svg {
        color: var(--warn);
      }
      .notice.crit {
        border-color: color-mix(in srgb, var(--crit) 40%, transparent);
        background: var(--crit-dim);
      }
      .notice.crit > svg {
        color: var(--crit);
      }
      .notice.brand {
        border-color: color-mix(in srgb, var(--brand) 36%, transparent);
        background: var(--brand-dim);
      }
      .notice.brand > svg {
        color: var(--brand);
      }

      /* =====================================================================
   FORMS
   ===================================================================== */
      .field {
        display: block;
        margin: 0 0 15px;
      }
      .field > .lbl {
        display: block;
        font-size: var(--t-xs);
        font-weight: 560;
        color: var(--ink-2);
        margin: 0 0 6px;
      }
      .field > .hint {
        display: block;
        font-size: var(--t-2xs);
        color: var(--ink-4);
        margin-top: 5px;
      }
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="search"],
      input[type="tel"],
      select,
      textarea {
        width: 100%;
        background: var(--s2);
        border: 1px solid var(--line-2);
        color: var(--ink);
        border-radius: var(--r-sm);
        padding: 11px 13px;
        min-height: var(--tap);
        transition:
          border-color var(--dur) var(--ease),
          background var(--dur) var(--ease);
      }
      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--line-3);
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--brand);
        outline-offset: 1px;
        background: var(--s3);
      }
      textarea {
        resize: vertical;
        min-height: 84px;
        line-height: 1.5;
      }
      select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
          linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
        background-position:
          calc(100% - 17px) 50%,
          calc(100% - 12px) 50%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
        padding-right: 34px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--brand);
        height: var(--tap);
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 15px;
        margin: 0 0 15px;
      }
      legend {
        font-size: var(--t-2xs);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--ink-4);
        padding: 0 7px;
      }
      .check {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        margin: 0 0 13px;
        cursor: pointer;
      }
      .check input {
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        margin-top: 2px;
        accent-color: var(--brand);
      }
      .check .ct {
        font-size: var(--t-sm);
        color: var(--ink-2);
        min-width: 0;
      }
      .check .ct b {
        color: var(--ink);
        font-weight: 560;
      }
      .check.off {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .sw {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .sw:last-child {
        border-bottom: 0;
      }
      .sw .swl {
        flex: 1 1 auto;
        min-width: 0;
      }
      .sw .swl b {
        display: block;
        font-weight: 560;
        font-size: var(--t-sm);
      }
      .sw .swl span {
        display: block;
        font-size: var(--t-xs);
        color: var(--ink-3);
        margin-top: 1px;
      }
      .tg {
        flex: 0 0 auto;
        width: 48px;
        height: 28px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line-2);
        background: var(--s3);
        position: relative;
        cursor: pointer;
        padding: 0;
        transition:
          background var(--dur) var(--ease),
          border-color var(--dur) var(--ease);
      }
      .tg::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--ink-3);
        transition:
          transform var(--dur) var(--ease),
          background var(--dur) var(--ease);
      }
      .tg[aria-checked="true"] {
        background: var(--brand-dim);
        border-color: var(--brand);
      }
      .tg[aria-checked="true"]::after {
        transform: translateX(20px);
        background: var(--brand);
      }
      .tg:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* =====================================================================
   AVATARS — generated art only. No real likeness is ever embedded.
   ===================================================================== */
      .av {
        position: relative;
        border-radius: var(--r-md);
        overflow: hidden;
        flex: 0 0 auto;
        background: var(--s3);
      }
      .av.round {
        border-radius: 50%;
      }
      .av.glow::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
        border-radius: inherit;
      }
      .av-halo {
        position: relative;
        display: inline-flex;
      }
      .av-halo::before {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: inherit;
        background: radial-gradient(
          circle at 50% 40%,
          var(--halo, var(--brand-glow)),
          transparent 68%
        );
        filter: blur(9px);
        z-index: -1;
      }
      .presence {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2.5px solid var(--s1);
        background: var(--ok);
      }
      .presence.off {
        background: var(--ink-4);
      }

      /* =====================================================================
   PERSONA CARDS
   ===================================================================== */
      .roster {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 600px) {
        .roster {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 1000px) {
        .roster {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1700px) {
        .roster {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (min-width: 2400px) {
        .roster {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .pc {
        display: flex;
        flex-direction: column;
        gap: 11px;
        text-align: left;
        width: 100%;
        background: linear-gradient(165deg, var(--s2), var(--s1));
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        transition:
          border-color var(--dur) var(--ease),
          transform var(--dur) var(--ease),
          box-shadow var(--dur) var(--ease);
        position: relative;
        overflow: hidden;
      }
      .pc::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 96px;
        background: radial-gradient(
          120% 100% at 18% 0%,
          var(--pc-tint, transparent),
          transparent 72%
        );
        pointer-events: none;
      }
      .pc:hover {
        border-color: var(--line-3);
        transform: translateY(-2px);
        box-shadow: var(--shadow-2);
      }
      .pc .pch {
        display: flex;
        gap: 12px;
        align-items: center;
        position: relative;
      }
      .pc .pn {
        font-weight: 620;
        letter-spacing: -0.018em;
      }
      .pc .pf {
        font-size: var(--t-xs);
        color: var(--ink-3);
      }
      .pc .pt {
        font-size: var(--t-sm);
        color: var(--ink-2);
        flex: 1 1 auto;
      }
      .pc .pfoot {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* =====================================================================
   CONVERSATION — the room. Warm, roomy, unhurried.
   ===================================================================== */
      .room {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 62px);
      }
      .room-head {
        position: sticky;
        top: 62px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(12px);
      }
      @media (max-width: 900px) {
        .room-head {
          top: 54px;
        }
        .room {
          min-height: auto;
        }
      }
      .thread {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 22px 0 10px;
        flex: 1 1 auto;
      }
      .bub {
        max-width: min(74ch, 82%);
        padding: 12px 16px;
        border-radius: var(--r-lg);
        font-size: var(--t-body);
        line-height: 1.58;
        white-space: pre-wrap;
        position: relative;
        animation: rise 0.3s var(--ease) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .bub.them {
        background: var(--s2);
        border: 1px solid var(--line);
        border-bottom-left-radius: 6px;
        align-self: flex-start;
      }
      .bub.me {
        background: linear-gradient(
          170deg,
          color-mix(in srgb, var(--brand) 24%, var(--s3)),
          color-mix(in srgb, var(--brand) 13%, var(--s3))
        );
        border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent);
        border-bottom-right-radius: 6px;
        align-self: flex-end;
      }
      .bub.sys {
        align-self: stretch;
        max-width: 100%;
        background: var(--ai-dim);
        border: 1px solid color-mix(in srgb, var(--ai) 26%, transparent);
        color: var(--ink-2);
        font-size: var(--t-sm);
        border-radius: var(--r-sm);
      }
      .bub.mem {
        align-self: stretch;
        max-width: 100%;
        background: var(--warm-dim);
        border: 1px dashed color-mix(in srgb, var(--warm) 34%, transparent);
        color: var(--ink-2);
        font-size: var(--t-sm);
        border-radius: var(--r-sm);
      }
      .bub .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
        font-size: var(--t-2xs);
        color: var(--ink-4);
      }
      .bub .acts {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        opacity: 0;
        transition: opacity var(--dur);
      }
      .bub:hover .acts,
      .bub:focus-within .acts {
        opacity: 1;
      }
      @media (hover: none) {
        .bub .acts {
          opacity: 1;
        }
      }
      .reacts {
        display: flex;
        gap: 4px;
        margin-top: 7px;
      }
      .react {
        border: 1px solid var(--line-2);
        background: var(--s3);
        border-radius: var(--r-pill);
        padding: 2px 8px;
        font-size: var(--t-2xs);
        cursor: pointer;
        min-height: 26px;
      }
      .react[aria-pressed="true"] {
        background: var(--warm-dim);
        border-color: color-mix(in srgb, var(--warm) 42%, transparent);
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 13px 17px;
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        border-bottom-left-radius: 6px;
        align-self: flex-start;
      }
      .typing i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-3);
        animation: bounce 1.25s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .composer {
        position: sticky;
        bottom: 0;
        padding: 14px 0 18px;
        background: linear-gradient(180deg, transparent, var(--bg) 26%);
      }
      /* A sticky composer sits at its own place in the flow, so the thread needs room
   below it or the last bubble scrolls underneath. */
      .thread {
        padding-bottom: 8px;
      }
      @media (max-width: 900px) {
        .composer {
          bottom: calc(64px + env(safe-area-inset-bottom));
        }
        .room {
          padding-bottom: calc(176px + env(safe-area-inset-bottom));
        }
      }
      .composer .cwrap {
        display: flex;
        gap: 9px;
        align-items: flex-end;
        background: var(--s2);
        border: 1px solid var(--line-2);
        border-radius: var(--r-lg);
        padding: 7px 7px 7px 14px;
        transition: border-color var(--dur) var(--ease);
      }
      .composer .cwrap:focus-within {
        border-color: var(--brand);
      }
      .composer textarea {
        background: transparent;
        border: 0;
        padding: 9px 0;
        min-height: 26px;
        max-height: 168px;
        resize: none;
      }
      .composer textarea:focus {
        outline: none;
        background: transparent;
      }

      .voicebar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 13px;
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .wave {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 26px;
      }
      .wave i {
        width: 3px;
        border-radius: 2px;
        background: var(--ink-4);
        height: 5px;
        transition:
          height 0.13s var(--ease),
          background 0.13s;
      }
      .voicebar[data-state="listening"] .wave i {
        background: var(--warm);
        animation: vw 1.05s ease-in-out infinite;
      }
      .voicebar[data-state="speaking"] .wave i {
        background: var(--ai);
        animation: vw 0.78s ease-in-out infinite;
      }
      .voicebar[data-state="processing"] .wave i {
        background: var(--brand);
        animation: vw 1.7s ease-in-out infinite;
      }
      .wave i:nth-child(2) {
        animation-delay: 0.09s;
      }
      .wave i:nth-child(3) {
        animation-delay: 0.18s;
      }
      .wave i:nth-child(4) {
        animation-delay: 0.27s;
      }
      .wave i:nth-child(5) {
        animation-delay: 0.36s;
      }
      .wave i:nth-child(6) {
        animation-delay: 0.2s;
      }
      .wave i:nth-child(7) {
        animation-delay: 0.11s;
      }
      .wave i:nth-child(8) {
        animation-delay: 0.3s;
      }
      .wave i:nth-child(9) {
        animation-delay: 0.05s;
      }
      .wave i:nth-child(10) {
        animation-delay: 0.24s;
      }
      @keyframes vw {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 23px;
        }
      }

      /* Relationship depth — the thing this audience actually cares about. */
      .depth {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .depth-track {
        flex: 1 1 auto;
        height: 6px;
        border-radius: 99px;
        background: var(--s3);
        overflow: hidden;
        min-width: 70px;
      }
      .depth-track > i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--warm), var(--brand));
      }

      /* =====================================================================
   TABLES
   ===================================================================== */
      .tw {
        overflow-x: auto;
        border-radius: var(--r-sm);
        border: 1px solid var(--line);
      }
      .tw table {
        font-size: var(--t-sm);
      }
      th,
      td {
        text-align: left;
        padding: 10px 13px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      thead th {
        background: var(--s2);
        font-size: var(--t-2xs);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-4);
        font-weight: 600;
        position: sticky;
        top: 0;
        z-index: 1;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: var(--s2);
      }
      td.n,
      th.n {
        text-align: right;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .tw.scroll-y {
        max-height: 460px;
        overflow-y: auto;
      }

      /* =====================================================================
   STAT TILES & METERS
   ===================================================================== */
      .tiles {
        display: grid;
        gap: 13px;
        grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      }
      .tile {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 15px;
      }
      .tile .tv {
        font-family: var(--mono);
        font-size: clamp(1.42rem, 1.2rem+0.7vw, 1.95rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .tile .tl {
        font-size: var(--t-xs);
        color: var(--ink-3);
        margin-top: 4px;
      }
      .tile .td {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: var(--t-2xs);
        margin-top: 7px;
      }
      .meter {
        height: 7px;
        border-radius: 99px;
        background: var(--s3);
        overflow: hidden;
      }
      .meter > i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--brand);
        transition: width 0.4s var(--ease);
      }
      .meter.ok > i {
        background: var(--ok);
      }
      .meter.warn > i {
        background: var(--warn);
      }
      .meter.crit > i {
        background: var(--crit);
      }

      /* =====================================================================
   CHARTS — figure wrapper, legend, tooltip, table-view toggle.
   Every chart with two or more series ships a legend and a table view.
   ===================================================================== */
      figure.viz {
        margin: 0;
      }
      figure.viz figcaption {
        font-size: var(--t-xs);
        color: var(--ink-3);
        margin-top: 9px;
      }
      .viz-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 3px;
      }
      .viz-head h4 {
        margin: 0;
        font-size: var(--t-sm);
        font-weight: 600;
      }
      .viz-legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: var(--t-xs);
        color: var(--ink-2);
        margin: 9px 0 0;
      }
      .viz-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .viz-legend i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: 0 0 auto;
      }
      .viz-legend i.ln {
        height: 3px;
        border-radius: 2px;
        width: 14px;
      }
      .viz-wrap {
        position: relative;
      }
      .viz-wrap svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .viz-tip {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        background: var(--s4);
        border: 1px solid var(--line-3);
        border-radius: var(--r-xs);
        padding: 8px 11px;
        font-size: var(--t-xs);
        box-shadow: var(--shadow-2);
        min-width: 118px;
        opacity: 0;
        transform: translate(-50%, -112%);
        transition: opacity 0.11s;
      }
      .viz-tip.on {
        opacity: 1;
      }
      .viz-tip .tt {
        font-weight: 600;
        margin-bottom: 5px;
        font-size: var(--t-2xs);
        color: var(--ink-3);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .viz-tip .tr {
        display: flex;
        align-items: center;
        gap: 7px;
        justify-content: space-between;
      }
      .viz-tip .tr i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .viz-tip .tr b {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      text.vl {
        font-family: var(--sans);
        font-size: 10.5px;
        fill: var(--ink-4);
      }
      text.vl.v {
        font-family: var(--mono);
        fill: var(--ink-2);
      }
      line.vg {
        stroke: var(--grid);
        stroke-width: 1;
      }
      line.va {
        stroke: var(--axis);
        stroke-width: 1;
      }
      .hit {
        fill: transparent;
        cursor: crosshair;
      }

      /* Coverage matrix — status cells, each with a glyph as well as a colour. */
      .cov {
        overflow-x: auto;
      }
      .cov table {
        border-collapse: separate;
        border-spacing: 2px;
      }
      .cov th {
        background: transparent;
        position: static;
        padding: 5px 7px;
      }
      .cov th.rot {
        font-size: var(--t-2xs);
        white-space: nowrap;
      }
      .cov td {
        padding: 0;
        border: 0;
      }
      .cov .cell {
        width: 100%;
        min-width: 44px;
        height: 38px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--t-2xs);
        font-weight: 700;
        font-family: var(--mono);
        transition: transform var(--dur) var(--ease);
      }
      .cov .cell:hover {
        transform: scale(1.07);
      }
      .cov .cell.full {
        background: var(--ok-dim);
        color: var(--ok);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 38%, transparent);
      }
      .cov .cell.part {
        background: var(--warn-dim);
        color: var(--warn);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 38%, transparent);
      }
      .cov .cell.gap {
        background: var(--serious-dim);
        color: var(--serious);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--serious) 38%, transparent);
      }
      .cov .cell.na {
        background: var(--s2);
        color: var(--ink-4);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .cov th.rowh {
        text-align: left;
        font-size: var(--t-xs);
        color: var(--ink-2);
        text-transform: none;
        letter-spacing: 0;
        padding-right: 12px;
        white-space: nowrap;
      }

      /* =====================================================================
   OVERLAYS
   ===================================================================== */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(4, 5, 7, 0.74);
        backdrop-filter: blur(5px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fade 0.16s var(--ease);
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: var(--s1);
        border: 1px solid var(--line-2);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-3);
        width: 100%;
        max-width: 600px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        animation: pop 0.2s var(--ease) both;
      }
      .modal.wide {
        max-width: 940px;
      }
      .modal.xl {
        max-width: 1240px;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-h {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--line);
      }
      .modal-h .grow {
        flex: 1 1 auto;
        min-width: 0;
      }
      .modal-h h3 {
        margin: 0;
      }
      .modal-h p {
        margin: 3px 0 0;
        font-size: var(--t-sm);
        color: var(--ink-3);
      }
      .modal-b {
        padding: 18px 20px;
        overflow-y: auto;
        flex: 1 1 auto;
      }
      .modal-f {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        padding: 14px 20px 18px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      @media (max-width: 620px) {
        .modal-f {
          flex-direction: column-reverse;
        }
        .modal-f .btn {
          width: 100%;
        }
      }

      .sheet {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 100;
        background: var(--s1);
        border-top: 1px solid var(--line-2);
        border-radius: var(--r-xl) var(--r-xl) 0 0;
        box-shadow: var(--shadow-3);
        max-height: 86vh;
        display: flex;
        flex-direction: column;
        animation: up 0.24s var(--ease) both;
      }
      @keyframes up {
        from {
          transform: translateY(100%);
        }
        to {
          transform: none;
        }
      }

      .toast-stack {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 120;
        display: flex;
        flex-direction: column;
        gap: 9px;
        max-width: 380px;
      }
      @media (max-width: 900px) {
        .toast-stack {
          right: 12px;
          left: 12px;
          bottom: calc(76px + env(safe-area-inset-bottom));
          max-width: none;
        }
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 13px 15px;
        background: var(--s3);
        border: 1px solid var(--line-3);
        border-radius: var(--r-sm);
        box-shadow: var(--shadow-2);
        font-size: var(--t-sm);
        animation: slide 0.22s var(--ease) both;
      }
      @keyframes slide {
        from {
          opacity: 0;
          transform: translateX(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast > svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        margin-top: 2px;
      }
      .toast.ok > svg {
        color: var(--ok);
      }
      .toast.warn > svg {
        color: var(--warn);
      }
      .toast.crit > svg {
        color: var(--crit);
      }

      /* Command palette */
      .cmdk {
        position: fixed;
        inset: 0;
        z-index: 110;
        background: rgba(4, 5, 7, 0.7);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 11vh 18px 18px;
      }
      .cmdk-box {
        width: 100%;
        max-width: 620px;
        background: var(--s1);
        border: 1px solid var(--line-3);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-3);
        overflow: hidden;
        animation: pop 0.17s var(--ease) both;
      }
      .cmdk-box input {
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 17px 19px;
        font-size: 1.02rem;
        min-height: 56px;
      }
      .cmdk-box input:focus {
        outline: none;
        background: transparent;
      }
      .cmdk-list {
        max-height: min(58vh, 440px);
        overflow-y: auto;
        padding: 7px;
      }
      .cmdk-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        background: transparent;
        border-radius: var(--r-xs);
        color: var(--ink-2);
        font-size: var(--t-sm);
        text-align: left;
        cursor: pointer;
        min-height: 42px;
      }
      .cmdk-item:hover,
      .cmdk-item.sel {
        background: var(--s3);
        color: var(--ink);
      }
      .cmdk-item svg {
        width: 15px;
        height: 15px;
        opacity: 0.75;
        flex: 0 0 auto;
      }
      .cmdk-item .k {
        margin-left: auto;
        font-size: var(--t-2xs);
        color: var(--ink-4);
        font-family: var(--mono);
      }
      .cmdk-sec {
        font-size: var(--t-2xs);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-4);
        padding: 11px 12px 5px;
      }
      kbd {
        font-family: var(--mono);
        font-size: var(--t-2xs);
        background: var(--s3);
        border: 1px solid var(--line-2);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 5px;
        color: var(--ink-2);
      }

      /* =====================================================================
   STUDIO SURFACE — same tokens, tighter geometry, more density.
   ===================================================================== */
      .studio {
        --r-md: 12px;
        --r-lg: 14px;
        --r-sm: 9px;
      }
      .studio .card {
        background: var(--s1);
      }
      .studio .pc {
        border-radius: var(--r-md);
      }
      .studio h1 {
        letter-spacing: -0.028em;
      }
      .studio-tabs {
        display: flex;
        gap: 3px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        margin: 0 0 20px;
        scrollbar-width: none;
      }
      .studio-tabs::-webkit-scrollbar {
        display: none;
      }
      .studio-tabs a {
        padding: 11px 15px;
        font-size: var(--t-sm);
        color: var(--ink-3);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .studio-tabs a:hover {
        color: var(--ink);
      }
      .studio-tabs a.on {
        color: var(--brand);
        border-bottom-color: var(--brand);
        font-weight: 560;
      }
      .studio-tabs a .count {
        font-family: var(--mono);
        font-size: var(--t-2xs);
        background: var(--s3);
        padding: 1px 6px;
        border-radius: var(--r-pill);
      }

      /* Two-pane studio layout: list + inspector. */
      .panes {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 1080px) {
        .panes {
          grid-template-columns: minmax(300px, 380px) 1fr;
          align-items: start;
        }
      }
      @media (min-width: 2000px) {
        .panes {
          grid-template-columns: 400px 1fr minmax(340px, 440px);
        }
      }
      .pane {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        overflow: hidden;
      }
      .pane-h {
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
        background: var(--s2);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .pane-h h4 {
        margin: 0;
        flex: 1 1 auto;
      }
      .pane-b {
        padding: 15px;
      }
      .pane-list {
        max-height: min(62vh, 620px);
        overflow-y: auto;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 12px 15px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
        color: inherit;
        font: inherit;
        min-height: 58px;
      }
      .li:hover {
        background: var(--s2);
      }
      .li[aria-selected="true"] {
        background: var(--brand-dim);
        box-shadow: inset 3px 0 0 var(--brand);
      }
      .li .lib {
        flex: 1 1 auto;
        min-width: 0;
      }
      .li .lit {
        font-weight: 560;
        font-size: var(--t-sm);
      }
      .li .lis {
        font-size: var(--t-2xs);
        color: var(--ink-3);
      }

      /* Timeline / log */
      .tl {
        list-style: none;
        margin: 0;
        padding: 0 0 0 20px;
        border-left: 1px solid var(--line-2);
      }
      .tl li {
        position: relative;
        padding: 0 0 17px 14px;
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: -25px;
        top: 5px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--line-2);
      }
      .tl li.on::before {
        border-color: var(--brand);
        background: var(--brand);
      }
      .tl li.bad::before {
        border-color: var(--crit);
        background: var(--crit);
      }

      /* Kanban / pipeline board */
      .board {
        display: grid;
        gap: 13px;
        grid-auto-flow: column;
        grid-auto-columns: minmax(252px, 1fr);
        overflow-x: auto;
        padding-bottom: 8px;
      }
      @media (max-width: 900px) {
        .board {
          grid-auto-flow: row;
          grid-auto-columns: auto;
        }
      }
      .col {
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 11px;
        min-height: 130px;
      }
      .col-h {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 10px;
        font-size: var(--t-xs);
      }
      .col-h b {
        flex: 1 1 auto;
        font-weight: 600;
      }
      .pcard-sm {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 11px;
        margin-bottom: 8px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .pcard-sm:hover {
        border-color: var(--line-3);
      }

      /* Agent tone swatch */
      .tone {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: var(--r-pill);
        font-size: var(--t-2xs);
        font-weight: 600;
        border: 1px solid;
        white-space: nowrap;
      }

      /* Code / payload */
      pre.code {
        background: var(--bg-deep);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 13px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: var(--t-xs);
        line-height: 1.6;
        margin: 0 0 12px;
        color: var(--ink-2);
      }

      /* Onboarding hero */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 20px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        width: min(120vw, 1100px);
        height: min(120vw, 1100px);
        border-radius: 50%;
        background: radial-gradient(circle, var(--brand-glow), transparent 62%);
        top: -42%;
        filter: blur(38px);
        pointer-events: none;
      }
      .hero::after {
        content: "";
        position: absolute;
        width: min(90vw, 760px);
        height: min(90vw, 760px);
        border-radius: 50%;
        background: radial-gradient(circle, var(--warm-dim), transparent 64%);
        bottom: -34%;
        right: -14%;
        filter: blur(44px);
        pointer-events: none;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero .logo img {
        height: clamp(38px, 8vw, 64px);
      }
      .hero h1 {
        font-size: var(--t-display);
        max-width: 20ch;
        margin: 26px 0 12px;
      }
      .hero p.lede {
        font-size: clamp(1rem, 0.95rem+0.4vw, 1.16rem);
        color: var(--ink-2);
        max-width: 56ch;
        margin: 0 0 30px;
      }
      .steps {
        display: flex;
        gap: 7px;
        justify-content: center;
        margin: 0 0 26px;
      }
      .steps i {
        width: 30px;
        height: 4px;
        border-radius: 99px;
        background: var(--line-2);
      }
      .steps i.on {
        background: var(--brand);
      }

      .empty {
        text-align: center;
        padding: 44px 20px;
        color: var(--ink-3);
      }
      .empty svg {
        width: 40px;
        height: 40px;
        margin: 0 auto 14px;
        opacity: 0.4;
      }

      footer.legal {
        border-top: 1px solid var(--line);
        margin-top: 34px;
        padding: 18px 0 0;
        font-size: var(--t-xs);
        color: var(--ink-4);
      }
      footer.legal a {
        color: var(--ink-3);
      }
      .token {
        font-family: var(--mono);
        background: var(--brand-dim);
        color: var(--brand);
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px dashed color-mix(in srgb, var(--brand) 45%, transparent);
        font-size: 0.86em;
      }

      @media print {
        .rail,
        .tabbar,
        .topbar,
        .composer,
        .toast-stack {
          display: none !important;
        }
        body {
          background: #fff;
          color: #000;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
    <script>
      "use strict";

      /* =========================================================================
   BRAND ASSETS — build rule: nothing is fetched. The wordmark is the supplied
   PNG inlined as a data URI; every other glyph is a path authored here.
   ========================================================================= */

      function histModel(seed, n, baseLoss) {
        const out = [];
        let loss = baseLoss;
        for (let i = 1; i <= n; i++) {
          loss = Math.max(0.41, loss - (0.17 + ((seed * i) % 7) / 100));
          out.push({
            version: "v" + i + ".0",
            loss: Math.round(loss * 1000) / 1000,
            inChar: Math.min(0.97, 0.71 + i * 0.043 + ((seed + i) % 5) / 200),
            boundary: Math.min(0.999, 0.93 + i * 0.016),
            disclosure: Math.min(1, 0.96 + i * 0.012),
            refusal: Math.min(0.99, 0.81 + i * 0.035),
            epochs: 3 + i,
            tokens: 180000 + i * 46000,
            gpuHours: Math.round((2.1 + i * 0.7) * 10) / 10,
            promoted: i === n,
          });
        }
        return out;

            wer: Math.max(0.02, 0.09 - i * 0.017),
            minutes: 12 + i * 9,
            promoted: i === n,

        }

          (s < 34 ? 19 : 17) +

        if (o.presence)
          w.appendChild(el("i", { class: "presence" + (o.presence === "off" ? " off" : "") }));

          const wrap = el("span", { class: "av-halo", style: "--halo:hsla(" + h + ",60%,55%,.3)" });
