<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Celebrity AI Companions — wireframe v0.2</title>
    <!--
  Celebrity AI Companion Platform — interactive wireframe.
  v0.2 = claude-build-requirements-v0.1 (reconstructed: see README.md) + Addendum v0.2 (D, R, K, L, V).

  T-04 comment convention: every block comment opens with the requirement IDs it serves.
  Comments say WHY a rule exists, never what the next line does. No commented-out code.

  V-05: no external fonts, scripts, or stylesheets. SHA-256 and all icons are inline.
  Nothing in this file talks to a network. Every service is a deterministic mock.
-->
    <style>
      /* ---- T-01/T-02: one stylesheet, system fonts only, no network requests ---- */
      :root {
        --bg: #0b0d10;
        --bg-1: #121519;
        --bg-2: #181c22;
        --bg-3: #1f242b;
        --line: #2a3039;
        --line-2: #3a424e;
        --ink: #eef1f5;
        --ink-2: #aab3c0;
        --ink-3: #77818f;
        --accent: #e8b96a;
        --accent-ink: #1a1206;
        --ok: #5fbf8f;
        --warn: #e5a94a;
        --bad: #e2725f;
        --info: #6fa8dc;
        --pending: #b39ddb;
        --radius: 14px;
        --radius-s: 9px;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --sans:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans", sans-serif;
        --shell: 960px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        padding-bottom: env(safe-area-inset-bottom);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0 0 0.4em;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 1.55rem;
      }
      h2 {
        font-size: 1.2rem;
      }
      h3 {
        font-size: 1rem;
      }
      h4 {
        font-size: 0.88rem;
      }
      p {
        margin: 0 0 0.8em;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 18px 0;
      }

      /* ---- Shell ---- */
      .app {
        max-width: var(--shell);
        margin: 0 auto;
        padding: 0 16px 120px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(11, 13, 16, 0.93);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        margin: 0 -16px 16px;
        padding: 10px 16px;
      }
      .topbar-in {
        max-width: var(--shell);
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand .mark {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 0.66rem;
        color: var(--ink-3);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .topbar .spacer {
        flex: 1 1 auto;
      }

      /* ---- Nav ---- */
      .nav {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -16px;
        padding: 0 16px 10px;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav a {
        white-space: nowrap;
        text-decoration: none;
        color: var(--ink-2);
        font-size: 0.82rem;
        padding: 6px 11px;
        border-radius: 99px;
        border: 1px solid transparent;
      }
      .nav a:hover {
        color: var(--ink);
        background: var(--bg-2);
      }
      .nav a.on {
        color: var(--accent);
        border-color: var(--line-2);
        background: var(--bg-2);
      }

      /* ---- Cards & layout ---- */
      .card {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin: 0 0 14px;
      }
      .card.tight {
        padding: 12px;
      }
      .card.flat {
        background: transparent;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 620px) {
        .grid.c2 {
          grid-template-columns: 1fr 1fr;
        }
        .grid.c3 {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row.between {
        justify-content: space-between;
      }
      .row.top {
        align-items: flex-start;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .muted {
        color: var(--ink-2);
      }
      .dim {
        color: var(--ink-3);
      }
      .small {
        font-size: 0.8rem;
      }
      .tiny {
        font-size: 0.72rem;
      }
      .mono {
        font-family: var(--mono);
        font-size: 0.76rem;
      }
      .eyebrow {
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 0 0 6px;
      }
      .center {
        text-align: center;
      }
      .wrapbreak {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      /* ---- Buttons ---- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        color: var(--ink);
        padding: 9px 14px;
        border-radius: var(--radius-s);
        cursor: pointer;
        font-size: 0.86rem;
        text-decoration: none;
        min-height: 38px;
      }
      .btn:hover {
        border-color: var(--ink-3);
      }
      .btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        border-color: #5c2f2a;
        color: #f0a99b;
      }
      .btn.danger:hover {
        background: #2a1815;
      }
      .btn.sm {
        padding: 5px 10px;
        min-height: 30px;
        font-size: 0.78rem;
      }
      .btn.block {
        width: 100%;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---- Badges & pills ---- */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 99px;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        background: var(--bg-2);
        white-space: nowrap;
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.approved {
        color: var(--ok);
        border-color: #274a3a;
      }
      .badge.pending {
        color: var(--pending);
        border-color: #3d3455;
      }
      .badge.expired {
        color: var(--warn);
        border-color: #4c3c1e;
      }
      .badge.revoked {
        color: var(--bad);
        border-color: #532b25;
      }
      .badge.ai {
        color: var(--info);
        border-color: #26405c;
        background: #101821;
      }
      .badge.sample {
        color: var(--ink-3);
      }
      .badge.plain {
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.72rem;
      }

      /* ---- Sample / estimate labels (D-03, D-04, D-05) ---- */
      .samplenote {
        font-size: 0.7rem;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      /* ---- Notice strips ---- */
      .notice {
        border: 1px solid var(--line-2);
        background: var(--bg-2);
        border-radius: var(--radius-s);
        padding: 11px 13px;
        font-size: 0.84rem;
        margin: 0 0 12px;
      }
      .notice.info {
        border-color: #26405c;
        background: #101821;
      }
      .notice.warn {
        border-color: #4c3c1e;
        background: #1c1710;
      }
      .notice.bad {
        border-color: #532b25;
        background: #1e1311;
      }
      .notice.ok {
        border-color: #274a3a;
        background: #101a16;
      }
      .notice .n-head {
        font-weight: 600;
        margin-bottom: 3px;
        display: flex;
        gap: 7px;
        align-items: center;
      }

      /* ---- Forms ---- */
      label.field {
        display: block;
        margin: 0 0 12px;
      }
      label.field > span.lbl {
        display: block;
        font-size: 0.78rem;
        color: var(--ink-2);
        margin: 0 0 5px;
      }
      input[type="text"],
      input[type="email"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        color: var(--ink);
        border-radius: var(--radius-s);
        padding: 9px 11px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
        min-height: 70px;
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 0 0 12px;
        cursor: pointer;
      }
      .check input {
        margin-top: 3px;
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      .check .ctext {
        font-size: 0.84rem;
        color: var(--ink-2);
      }
      .check.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        padding: 12px;
        margin: 0 0 12px;
      }
      legend {
        font-size: 0.76rem;
        color: var(--ink-3);
        padding: 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* ---- Toggle switch ---- */
      .sw {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .sw:last-child {
        border-bottom: 0;
      }
      .sw .sw-l {
        flex: 1 1 auto;
        min-width: 0;
      }
      .sw .sw-l b {
        display: block;
        font-weight: 500;
        font-size: 0.88rem;
      }
      .sw .sw-l span {
        display: block;
        font-size: 0.76rem;
        color: var(--ink-3);
      }
      .sw button.tg {
        flex: 0 0 auto;
        width: 46px;
        height: 26px;
        border-radius: 99px;
        border: 1px solid var(--line-2);
        background: var(--bg-3);
        position: relative;
        cursor: pointer;
        padding: 0;
      }
      .sw button.tg::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--ink-3);
        transition:
          transform 0.14s,
          background 0.14s;
      }
      .sw button.tg[aria-checked="true"] {
        background: #3a3016;
        border-color: var(--accent);
      }
      .sw button.tg[aria-checked="true"]::after {
        transform: translateX(20px);
        background: var(--accent);
      }
      .sw button.tg:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ---- Roster ---- */
      .roster {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 620px) {
        .roster {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 860px) {
        .roster {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .pcard {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 13px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        text-align: left;
        cursor: pointer;
        width: 100%;
        font: inherit;
        color: inherit;
      }
      .pcard:hover {
        border-color: var(--line-2);
      }
      .pcard .ph {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .pcard .pn {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .pcard .pf {
        font-size: 0.74rem;
        color: var(--ink-3);
      }
      .avatar {
        border-radius: 12px;
        overflow: hidden;
        flex: 0 0 auto;
        background: var(--bg-3);
        display: block;
      }
      .avatar.lg {
        border-radius: 18px;
      }

      /* ---- Conversation ---- */
      .thread {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px 0 10px;
      }
      .msg {
        max-width: 84%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 0.9rem;
        white-space: pre-wrap;
      }
      .msg.them {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
        align-self: flex-start;
      }
      .msg.me {
        background: #2c2415;
        border: 1px solid #47391d;
        border-bottom-right-radius: 4px;
        align-self: flex-end;
      }
      .msg.sys {
        align-self: stretch;
        max-width: 100%;
        background: transparent;
        border: 1px dashed var(--line-2);
        color: var(--ink-2);
        font-size: 0.78rem;
        border-radius: var(--radius-s);
      }
      .msg .mt {
        display: block;
        font-size: 0.66rem;
        color: var(--ink-3);
        margin-top: 5px;
      }
      .composer {
        position: sticky;
        bottom: 0;
        background: linear-gradient(180deg, rgba(11, 13, 16, 0), var(--bg) 22%);
        padding: 12px 0 14px;
        margin-top: 6px;
      }
      .composer .cin {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .composer textarea {
        min-height: 44px;
        max-height: 120px;
      }
      .voicebar {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.78rem;
        color: var(--ink-2);
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .vstate {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 99px;
        border: 1px solid var(--line-2);
        background: var(--bg-2);
        font-size: 0.74rem;
      }
      .convhead {
        position: sticky;
        top: 57px;
        z-index: 30;
        background: var(--bg);
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        margin-bottom: 10px;
      }

      /* ---- Tables ---- */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th,
      td {
        text-align: left;
        padding: 7px 9px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--ink-3);
        font-weight: 500;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      td.num,
      th.num {
        text-align: right;
        font-family: var(--mono);
      }
      .tablewrap {
        overflow-x: auto;
        margin: 0 -4px;
      }

      /* ---- Timeline ---- */
      .tl {
        list-style: none;
        margin: 0;
        padding: 0 0 0 18px;
        border-left: 1px solid var(--line-2);
      }
      .tl li {
        position: relative;
        padding: 0 0 14px 12px;
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: -23px;
        top: 5px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--line-2);
      }
      .tl li.on::before {
        border-color: var(--accent);
      }

      /* ---- Modal ---- */
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 8, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 100;
      }
      .modal {
        background: var(--bg-1);
        border: 1px solid var(--line-2);
        border-radius: var(--radius);
        padding: 18px;
        max-width: 520px;
        width: 100%;
        max-height: 86vh;
        overflow: auto;
      }

      /* ---- Dev / clock tray ---- */
      .tray {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: rgba(18, 21, 25, 0.97);
        border-top: 1px solid var(--line-2);
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      }
      .tray-in {
        max-width: var(--shell);
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 0.74rem;
        color: var(--ink-2);
      }
      .tray .btn {
        min-height: 28px;
        padding: 4px 9px;
        font-size: 0.74rem;
      }

      /* ---- Meter bars ---- */
      .meter {
        height: 7px;
        border-radius: 99px;
        background: var(--bg-3);
        overflow: hidden;
      }
      .meter > i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .bars {
        display: flex;
        height: 22px;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid var(--line-2);
      }
      .bars > i {
        display: block;
        height: 100%;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 0.72rem;
        color: var(--ink-2);
        margin-top: 7px;
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 5px;
      }

      .kpi {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        padding: 11px;
      }
      .kpi b {
        display: block;
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-family: var(--mono);
      }
      .kpi span {
        display: block;
        font-size: 0.74rem;
        color: var(--ink-3);
      }

      .token {
        font-family: var(--mono);
        background: #3a2f12;
        color: var(--accent);
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 0.82em;
        border: 1px dashed #5a4a1d;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      footer.legal {
        border-top: 1px solid var(--line);
        margin-top: 26px;
        padding-top: 14px;
        font-size: 0.74rem;
        color: var(--ink-3);
      }
    </style>
  </head>
  <body>
    <div id="root" class="app"></div>
    <div id="tray"></div>
    <div id="modal"></div>
    <script>
      "use strict";
      /* =========================================================================
   CONFIGURATION — D-01, D-03, D-05, D-06, R-01, S-01..S-05
   Every unresolved business rule lives in this block so a reviewer can change
   a number without reading the application. Anything marked TBD or {{TOKEN}}
   is an open decision recorded in ASSUMPTIONS.md, not a value we invented.
   ========================================================================= */

      /* D-01: the operator is the talent-side company; Armada is the paid technology
   partner, never a member-facing brand. The company name is unresolved, so the
   placeholder token renders visibly wherever the name would appear. */
      const OPERATOR = {
        companyName: "{{COMPANY_NAME}}",
        legalEntity: "TBD",
        technologyPartner: "Armada Inc.",
        partnerLine: "Technology by Armada",
      };

      /* D-03: prelaunch routes the companion action to the waitlist, because the
   Phase 0 number is paid conversion of a personality's waitlisted fans. */
      let LAUNCH_STATE = "prelaunch"; /* "prelaunch" | "live" */

      /* S-01..S-03: proposed prices, not validated by the market. "assumption: true"
   fields are prototype readings the deck flags as unresolved, never approved
   entitlements. */
      const PLANS = {
        entry: {
          id: "entry",
          name: "Entry",
          price: 6.95,
          slots: 4,
          perDay: null,
          blurb:
            "Community access and unlimited conversations with an initial 90 Day personality, plus the ability to switch to up to three others, each keeping its own memory.",
          reading:
            "Four selected personalities in total. A selected personality can be replaced; its history stays unless the member deletes it. How often a swap is allowed is unresolved.",
          assumption: false,
          catalog: "limited",
        },
        expanded: {

      function canonicalJSON(value) {

            .map(function (k) {

      /* =========================================================================
   DETERMINISTIC SIMULATION — V-03
   One seeded generator and one simulated clock, so two runs of the prototype
   produce the same roster order, the same ids, and the same measurements.
   ========================================================================= */
      function makeRng(seed) {

          return s / 4294967296;

      let rng = makeRng(RNG_SEED);

      const Clock = {
        now: CLOCK_EPOCH,
        reset: function () {
          this.now = CLOCK_EPOCH;

        advanceMinutes: function (m) {

        advanceHours: function (h) {
          this.advanceMinutes(h * 60);
        },
        advanceDays: function (d) {
          this.advanceMinutes(d * 1440);
        },
        iso: function () {
          return new Date(this.now).toISOString();
        },
        dayKey: function (t) {
          return new Date(t === undefined ? this.now : t).toISOString().slice(0, 10);
        },
        fmt: function (t) {
          const d = new Date(t === undefined ? this.now : t);
          return d.toISOString().slice(0, 16).replace("T", " ") + " UTC";
        },
        fmtDate: function (t) {
          return new Date(t === undefined ? this.now : t).toISOString().slice(0, 10);

      };

      let idCounter = 0;
      function nextId(prefix) {
        idCounter += 1;
        return prefix + "_" + idCounter.toString(36) + Math.floor(rng() * 1296).toString(36);
      }

      /* =========================================================================
   DOM HELPERS — T-03
   Every helper writes user content with textContent. Nothing in this file
   assigns innerHTML with a value that could carry member input.
   ========================================================================= */
      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            const v = attrs[k];

            if (k === "class") node.className = v;
            else if (k === "text") node.textContent = v;
            else if (k === "html")
              node.innerHTML = v; /* only ever called with literal inline SVG */
            else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), v);

            else node.setAttribute(k, v);

        (children || []).forEach(function (c) {
          if (c === null || c === undefined || c === false) return;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        });

      }
      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }
      function txt(s) {
        return document.createTextNode(s);
      }

      /* V-05: icons are inline SVG. They carry no member content, so the literal
   markup assignment above is safe. */
      const ICONS = {
        mark: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="#e8b96a" stroke-width="1.6" d="M12 2.6 21 7.4v9.2L12 21.4 3 16.6V7.4z"/><circle cx="12" cy="12" r="3.1" fill="#e8b96a"/></svg>',

        lock: '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.2" y="7" width="9.6" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.6 7V5.2a2.4 2.4 0 0 1 4.8 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
      };

      /* D-02: neutral placeholder portraits, generated from the persona's own hue and
   initials so no image file and no real likeness is ever embedded. */
      function avatar(persona, size) {

          class: "avatar" + (s > 70 ? " lg" : ""),

          s +

          h +
          ',30%,30%)"/><stop offset="1" stop-color="hsl(' +
          ((h + 40) % 360) +
          ',26%,17%)"/>' +
          "</linearGradient></defs>" +
          '<rect width="64" height="64" fill="url(#g' +
          persona.id +

          '<circle cx="32" cy="25" r="10" fill="hsl(' +
          h +

      /* =========================================================================
   STATE — V-02
   One object with named slices. Reducers below are pure: they take state and
   an argument and return the change, so an entitlement rule can be checked
   without a browser.
   ========================================================================= */
      let state = null;

      function freshState() {
        return {
          schemaVersion: SCHEMA_VERSION,
          session: {
            signedIn: false,
            startedAt: null,
            lastActiveAt: null,
            route: "#/discover",
            creatorRole: "talent_manager",
          },
          member: {
            id: null,
            displayName: "",
            email: "",
            provider: null,
            createdAt: null,
            deleted: false,
          },
          entitlements: {
            plan: null,
            status: "none",
            startedAt: null,
            renewsAt: null,
            cancelledAt: null,
            accessUntil: null,
            billingChannel: BILLING_CHANNEL,
            selections: [],
            dayUse: {},
          },
          catalog: { personas: {}, order: [] },
          conversations: {},
          memories: {},
          preferences: { interests: "", topics: {}, ageState: "unverified" },
          waitlist: { joins: {}, counts: {} },
          record: [],
          events: [],

          moderation: [],

      }

      /* V-03 / D-02: seeding copies the fixtures into state so a status change during
   the demo mutates state, never the fixture table. */
      function seedState() {
        const s = freshState();
        rng = makeRng(RNG_SEED);
        idCounter = 0;
        Clock.reset();
        FIXTURES.roster.forEach(function (p) {
          s.catalog.personas[p.id] = JSON.parse(JSON.stringify(p));
          s.catalog.order.push(p.id);
          s.waitlist.counts[p.id] = p.waitlistCount;
        });
        FIXTURES.policies.forEach(function (p) {
          s.policies.registry[p.id] = JSON.parse(JSON.stringify(p));
        });
        TOPICS.forEach(function (t) {
          if (t.member) s.preferences.topics[t.id] = false;
        });
        return s;
      }

      /* T-03: one reset clears storage and reseeds, so a reviewer can always get back
   to the state the report describes. */
      function resetAll() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          /* storage may be unavailable */
        }

        LAUNCH_STATE = "prelaunch";
        BILLING_CHANNEL = "web";
        state.entitlements.billingChannel = "web";
        persist();
      }

      /* V-02: persistence carries a schema version and a migration stub, because a
   stored shape from an older build must not silently half-load. */
      function migrate(raw) {
        if (!raw || typeof raw !== "object") return null;
        if (raw.schemaVersion === SCHEMA_VERSION) return raw;
        /* No released schema precedes version 2. A real migration lands here. */
        return null;
      }
      function persist() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              schemaVersion: SCHEMA_VERSION,
              state: state,
              clock: Clock.now,
              launchState: LAUNCH_STATE,
              billingChannel: BILLING_CHANNEL,
              idCounter: idCounter,
            }),
          );
        } catch (e) {
          /* a full or blocked store must not break the prototype */
        }

          raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        } catch (e) {

        const ok = migrate(raw);
        if (!ok) {
          state = seedState();
          return false;
        }
        state = ok.state;
        Clock.now = ok.clock || CLOCK_EPOCH;
        LAUNCH_STATE = ok.launchState || "prelaunch";
        BILLING_CHANNEL = ok.billingChannel || "web";
        idCounter = ok.idCounter || 0;
        return true;
      }

      /* =========================================================================
   EVENTS — D-04
   Append-only and typed. Everything the Measurement panel reports is computed
   from this array and the simulated clock; nothing is counted anywhere else.
   ========================================================================= */
      const EVENT_TYPES = [
        "screen_view",
        "waitlist_join",
        "signup",
        "consent_accept",
        "plan_select",
        "checkout_success",
        "checkout_fail",
        "conversation_start",
        "message_sent",
        "voice_utterance",
        "session_end",
        "memory_save",
        "report_filed",
        "cancel",
      ];
      function track(type, payload) {
        if (EVENT_TYPES.indexOf(type) === -1) throw new Error("unknown event type: " + type);
        state.events.push({
          seq: state.events.length + 1,
          type: type,
          at: Clock.now,
          day: Clock.dayKey(),
          memberId: state.member.id,
          payload: payload || {},
        });
      }

      /* =========================================================================
   THE RECORD — K-01, K-04
   Append-only, hash-chained, identifiers and statuses only. Deleting content
   leaves a tombstone so the chain stays verifiable after erasure.
   ========================================================================= */
      const RECORD_TYPES = [
        "consent_accepted",
        "consent_withdrawn",
        "policy_version_changed",
        "license_status_changed",
        "moderation_action",
        "report_filed",
        "block_set",
        "agent_action_approved",
        "data_exported",
        "memory_deleted",
        "account_deleted",
      ];
      const Record = {
        append: function (type, actorId, subjectId, payload) {
          if (RECORD_TYPES.indexOf(type) === -1) throw new Error("unknown record type: " + type);
          const prev = state.record[state.record.length - 1];
          const entry = {
            seq: state.record.length + 1,
            type: type,
            actorId: actorId || "system",

            payload: payload || {},

              type: entry.type,

                seq: e.seq,
                type: e.type,
                actorId: e.actorId,
                subjectId: e.subjectId,
                payload: e.payload,
                timestamp: e.timestamp,
                prevHash: e.prevHash,

            prevHash = e.hash;

            return e.actorId === memberId || e.subjectId === memberId;

      /* =========================================================================
   PRECEDENCE ENGINE — L-02
   One pure function. Platform policy first, then the talent's approved
   boundaries, then the member's preference. A lower layer can only narrow.
   Every response path in this file calls it, including voice and images.
   ========================================================================= */
      function effectiveBoundaries(platformPolicy, talentBoundaries, memberPreferences) {
        const out = {};
        TOPICS.forEach(function (t) {
          const pol = platformPolicy[t.id] || {
            allowed: false,
            why: "Topic is not in platform policy.",
          };
          let allowed = pol.allowed === true;
          let layer = allowed ? null : "platform";
          let why = allowed ? null : pol.why || "Platform policy does not allow this.";

          if (allowed && pol.requiresAgeVerified && memberPreferences.ageState !== "verified") {
            allowed = false;
            layer = "platform";
            why = "Age assurance is not verified, so mature topics stay unavailable.";
          }
          if (allowed) {
            const grant = talentBoundaries ? talentBoundaries[t.id] : undefined;
            if (grant !== "granted") {
              allowed = false;
              layer = "talent";
              why = "This is outside the boundaries the personality approved.";
            }
          }
          if (allowed && t.member) {
            if (memberPreferences.topics[t.id] !== true) {
              allowed = false;
              layer = "member";
              why = "Your own preference keeps this off.";
            }
          }
          out[t.id] = {
            topic: t.id,
            label: t.label,
            allowed: allowed,
            blockingLayer: layer,
            why: why,
          };
        });
        return out;
      }

      function boundariesFor(personaId) {
        const p = state.catalog.personas[personaId];
        return effectiveBoundaries(PLATFORM_POLICY, p ? p.boundaries : {}, state.preferences);
      }

      /* =========================================================================
   ENTITLEMENT REDUCERS — S-01..S-04, L-03
   Pure functions over a state-like object. selfCheck() at the bottom of the
   file exercises them, so the rules are testable without the UI.
   ========================================================================= */
      function planOf(st) {
        return st.entitlements.plan ? PLANS[st.entitlements.plan] : null;
      }

      function reduceSelectPlan(st, planId) {
        if (!PLANS[planId]) return { ok: false, reason: "unknown_plan" };
        return {
          ok: true,
          entitlements: Object.assign({}, st.entitlements, {
            plan: planId,
            status: "pending_checkout",
          }),
        };
      }
      function reduceCheckoutSuccess(st, now) {
        if (!st.entitlements.plan) return { ok: false, reason: "no_plan" };
        const renews = now + 30 * 86400000;
        return {
          ok: true,
          entitlements: Object.assign({}, st.entitlements, {
            status: "active",
            startedAt: now,
            renewsAt: renews,
            accessUntil: renews,
            cancelledAt: null,
          }),
        };
      }
      function reduceCancel(st, now) {
        if (st.entitlements.status !== "active") return { ok: false, reason: "not_active" };
        return {
          ok: true,
          entitlements: Object.assign({}, st.entitlements, {
            status: "cancelled",
            cancelledAt: now,
            accessUntil: st.entitlements.renewsAt,
          }),
        };
      }
      /* S-01/S-02: slot plans hold a fixed number of selections. L-03: a persona
   whose rights ended stops counting against the total. */
      function activeSelections(st) {
        return st.entitlements.selections.filter(function (id) {
          return availabilityOf(st, id).available;
        });
      }
      function reduceSelectCompanion(st, personaId) {
        const plan = st.entitlements.plan ? PLANS[st.entitlements.plan] : null;
        if (!plan || st.entitlements.status === "none") return { ok: false, reason: "no_plan" };
        if (!availabilityOf(st, personaId).available) return { ok: false, reason: "not_available" };
        if (st.entitlements.selections.indexOf(personaId) !== -1)
          return { ok: true, entitlements: st.entitlements };
        if (plan.slots !== null && activeSelections(st).length >= plan.slots)
          return { ok: false, reason: "no_slots" };
        if (plan.perDay !== null) {
          const key = Clock.dayKey();
          const used = st.entitlements.dayUse[key] || [];
          if (used.indexOf(personaId) === -1 && used.length >= plan.perDay)
            return { ok: false, reason: "day_limit" };
        }
        return {
          ok: true,
          entitlements: Object.assign({}, st.entitlements, {
            selections: st.entitlements.selections.concat([personaId]),
          }),
        };
      }
      function reduceReleaseCompanion(st, personaId) {
        return {
          ok: true,
          entitlements: Object.assign({}, st.entitlements, {
            selections: st.entitlements.selections.filter(function (id) {
              return id !== personaId;
            }),
          }),
        };
      }
      /* S-03: Pro counts a distinct personality on the day its first message is sent. */
      function reduceCountDay(st, personaId, dayKey) {
        const used = (st.entitlements.dayUse[dayKey] || []).slice();
        if (used.indexOf(personaId) === -1) used.push(personaId);
        const dayUse = Object.assign({}, st.entitlements.dayUse);
        dayUse[dayKey] = used;
        return { ok: true, entitlements: Object.assign({}, st.entitlements, { dayUse: dayUse }) };
      }

      /* L-03: availability is the rights status and the licence end date, nothing
   else. A badge is never rendered from any other field (L-01). */
      function availabilityOf(st, personaId) {
        const p = st.catalog.personas[personaId];
        if (!p) return { available: false, reason: "unknown" };
        const lic = p.license;
        if (lic.status !== "approved") return { available: false, reason: lic.status };
        if (lic.duration.end && Date.parse(lic.duration.end + "T23:59:59Z") < Clock.now) {
          return { available: false, reason: "expired" };
        }
        return { available: true, reason: null };
      }
      /* L-03: expiry by the clock is a status change in its own right, so the record
   and Discover agree even if nobody opened the creator route. */
      function sweepExpiries() {
        let changed = false;
        state.catalog.order.forEach(function (id) {
          const p = state.catalog.personas[id];
          if (
            p.license.status === "approved" &&
            p.license.duration.end &&
            Date.parse(p.license.duration.end + "T23:59:59Z") < Clock.now
          ) {
            p.license.status = "expired";
            Record.append("license_status_changed", "system", id, {
              personaId: id,
              from: "approved",
              to: "expired",
              note: "Licence term ended.",
              automatic: true,
            });
            changed = true;
          }
        });
        return changed;
      }

      function isBlocked(personaId) {
        return state.safety.blocks.indexOf(personaId) !== -1;
      }
      function hasAccess() {
        const e = state.entitlements;
        if (e.status === "active") return true;
        if (e.status === "cancelled" && e.accessUntil && Clock.now <= e.accessUntil) return true;
        return false;
      }
      /* S-01/S-02: catalogue reach differs by plan; Pro reaches everything approved. */
      function planIncludes(personaId) {
        const e = state.entitlements;
        if (!e.plan) return false;
        if (e.plan === "pro") return true;
        if (e.selections.indexOf(personaId) !== -1) return true;
        const plan = PLANS[e.plan];
        return plan.slots !== null && activeSelections(state).length < plan.slots;
      }

      /* =========================================================================
   ADAPTER REGISTRY — V-01 (extends T-05)
   Every boundary this product will one day cross is declared here with the
   same shape, so the production team inherits a contract list rather than a
   search through the UI. Each entry says where the real implementation runs:
   "rack" is hardware the operator owns, "vendor" is a third party.
   ========================================================================= */
      function contract(o) {
        return {
          method: o.method,
          input: o.input,
          output: o.output,
          errors: o.errors || [],
          authorization: o.authorization || "member session",
          sensitiveFields: o.sensitiveFields || [],
          caller: o.caller || "client",
        };
      }

      const adapters = {
        auth: {
          mode: "mock",

      /* =========================================================================
   CONVERSATION ENGINE — L-02, R-01, R-02, V-03
   Deterministic. The same message to the same persona in the same state always
   produces the same reply, so a reviewer and the report see one behaviour.
   Every reply passes through the precedence engine, including voice and image
   replies, because a boundary that only guards text is not a boundary.
   ========================================================================= */

      function detectIntent(text) {
        const t = String(text || "").toLowerCase();
        const screen = adapters.safety.screen(t);
        if (screen.matched) return { id: "crisis", topic: null, screen: screen };
        for (let i = 0; i < DEMO_INTENTS.length; i++) {
          const it = DEMO_INTENTS[i];
          if (!it.match) continue;
          for (let j = 0; j < it.match.length; j++) {
            if (t.indexOf(it.match[j]) !== -1)
              return { id: it.id, topic: it.topic, screen: screen };
          }
        }
        return { id: "smalltalk", topic: "personal_life", screen: screen };
      }

      /* V-03: picking a line by a hash of the input keeps replies varied without
   making them random, so the prototype is reproducible. */
      function pick(list, salt) {
        if (!list || !list.length) return "";
        let n = 0;
        const s = String(salt);
        for (let i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0;
        return list[n % list.length];
      }

      /* L-02: one refusal shape per blocking layer. The member is told which layer
   said no, because "the personality did not approve this" and "the platform
   forbids this" are different facts and hiding the difference is the thing
   that makes these products feel dishonest. */
      function refusalFor(persona, decision) {
        if (decision.blockingLayer === "platform") {
          return (
            "I can't go there. " +
            decision.why +
            " That rule sits above anything either of us prefers."
          );
        }
        if (decision.blockingLayer === "talent") {
          return (
            "That's outside what " +
            persona.displayName +
            " approved for this companion, so I'll leave it. " +
            "You can see the full approved list on the companion's page."
          );
        }
        return (
          "You've got that switched off in your preferences, so I'll steer around it. " +
          "You can change it in Profile and preferences whenever you want."
        );
      }

      function composeReply(personaId, text, ctx) {
        const persona = state.catalog.personas[personaId];
        const intent = detectIntent(text);
        const bounds = boundariesFor(personaId);
        const salt = personaId + "|" + String(text).slice(0, 48);

        if (intent.id === "crisis") {
          return { kind: "crisis", intent: "crisis", category: intent.screen.category };
        }

        const decision = intent.topic ? bounds[intent.topic] : null;
        if (decision && !decision.allowed) {
          return {
            kind: "refusal",
            intent: intent.id,
            topic: intent.topic,
            decision: decision,
            text: refusalFor(persona, decision),
          };
        }

        const style = persona.style || { greet: [], showTalk: [], memoryRecall: [], smallTalk: [] };
        let body;
        if (intent.id === "greeting") body = pick(style.greet, salt);
        else if (intent.id === "show_question") body = pick(style.showTalk, salt);
        else if (intent.id === "memory_recall") {
          const items = adapters.memory.list(personaId);
          if (items.length) {
            body =
              pick(style.memoryRecall, salt) +
              "\n\nWhat I have written down: " +
              items
                .slice(-3)
                .map(function (i) {
                  return i.text;
                })
                .join("; ") +
              ".";
          } else {
            body =
              "I don't have anything written down for you yet. Tell me something and I'll keep it — you can read, edit, or delete it any time.";
          }
        } else if (intent.id === "presence_claim") {
          /* R-01 / L-02: this is the one question the product must never fudge. */
          body =
            "No. I'm an AI version of " +
            persona.displayName +
            ". I'm not " +
            persona.displayName +
            ", and " +
            persona.displayName +
            " does not read this conversation.";
        } else {
          body = pick(style.smallTalk, salt);
        }
        return {
          kind: "reply",
          intent: intent.id,
          topic: intent.topic,
          decision: decision,
          text: body,
        };
      }

      /* M-07: memory is written from plain statements only, and the member is told
   the moment something is saved. */
      function maybeRemember(personaId, text) {
        const t = String(text || "").trim();
        if (t.length < 12) return null;
        const low = t.toLowerCase();
        const markers = ["i ", "my ", "we ", "i'm ", "im "];
        let hit = false;
        markers.forEach(function (m) {
          if (low.indexOf(m) === 0 || low.indexOf(" " + m) !== -1) hit = true;
        });
        if (!hit) return null;
        const res = adapters.memory.save(personaId, t.slice(0, 140));
        if (!res.ok) return null;
        track("memory_save", { personaId: personaId });
        return true;
      }

      /* =========================================================================
   DISCLOSURE CADENCE — R-01
   The interval is configuration, not a constant in the render path, because
   counsel sets the production number and the demo needs a reachable one.
   ========================================================================= */
      let DISCLOSURE_MODE = "demo"; /* "demo" | "production" */
      function disclosureIntervalMs() {
        return (
          (DISCLOSURE_MODE === "production"
            ? DISCLOSURE.productionIntervalMinutes
            : DISCLOSURE.demoIntervalMinutes) * 60000
        );
      }
      function disclosureDue(conv) {
        if (!conv || conv.readonly) return false;
        const last = conv.lastDisclosureAt || conv.startedAt;
        return Clock.now - last >= disclosureIntervalMs();
      }

      /* =========================================================================
   MEASUREMENT — D-04, D-05
   Everything here is derived from state.events and the simulated clock. No
   figure is stored; no figure leaves the file.
   ========================================================================= */
      function measure() {
        const ev = state.events;
        const by = function (t) {
          return ev.filter(function (e) {
            return e.type === t;
          });
        };

        /* D-04: waitlist to paid conversion per personality is the Phase 0 number. */
        const joins = by("waitlist_join");
        const paid = by("checkout_success");
        const conversionByPersona = {};
        state.catalog.order.forEach(function (id) {
          const j = joins.filter(function (e) {
            return e.payload.personaId === id;
          }).length;
          const c = paid.filter(function (e) {
            return (e.payload.attributedPersonaId || null) === id;
          }).length;
          if (j || c) conversionByPersona[id] = { joins: j, paid: c, rate: j ? c / j : null };
        });

        /* D-04: active minutes come from session_end events only, so an open tab
     cannot inflate the number. */
        const sessions = by("session_end");
        const minutesByDay = {};
        sessions.forEach(function (e) {
          const d = e.day;
          minutesByDay[d] = (minutesByDay[d] || 0) + (e.payload.activeSeconds || 0) / 60;
        });
        const days = Object.keys(minutesByDay).sort();
        const totalMinutes = days.reduce(function (a, d) {
          return a + minutesByDay[d];
        }, 0);
        const avgMinutesPerMemberDay = days.length ? totalMinutes / days.length : 0;

        const msgs = by("message_sent");
        const convStarts = by("conversation_start");
        const messagesPerSession = convStarts.length ? msgs.length / convStarts.length : 0;

        const distinctByDay = {};
        msgs.forEach(function (e) {
          if (!distinctByDay[e.day]) distinctByDay[e.day] = {};
          if (e.payload.personaId) distinctByDay[e.day][e.payload.personaId] = true;
        });
        const distinctDays = Object.keys(distinctByDay);
        const avgDistinctPerMemberDay = distinctDays.length
          ? distinctDays.reduce(function (a, d) {
              return a + Object.keys(distinctByDay[d]).length;
            }, 0) / distinctDays.length
          : 0;

        /* D-04: retention of paying members. In a single-member prototype this reads
     1 or 0, which is exactly what the label "Sample data" is there to admit. */
        function retentionAt(dayOffset) {
          if (!paid.length) return { cohort: 0, retained: 0, rate: null };
          const cohort = paid.length;
          let retained = 0;
          paid.forEach(function (p) {
            const target = p.at + dayOffset * 86400000;
            const stillPaying =
              state.entitlements.status === "active" ||
              (state.entitlements.accessUntil && state.entitlements.accessUntil >= target);
            const reached = Clock.now >= target;
            if (reached && stillPaying) retained += 1;
          });
          const reachedAny = Clock.now >= paid[0].at + dayOffset * 86400000;
          return {
            cohort: cohort,
            retained: retained,
            rate: reachedAny ? retained / cohort : null,
          };
        }

        /* D-05: the cost scenarios behind S-05. A blank assumption stays blank; a
     guessed number here would be the exact mistake the deck warns about. */
        const replies = msgs.length;
        const voiceUtterances = by("voice_utterance").length;
        const speechMinutes = (voiceUtterances * COST_MODEL.speechSecondsPerReply) / 60;
        const tokens =
          replies * (COST_MODEL.tokensPerTurnPrompt + COST_MODEL.tokensPerTurnCompletion);
        const monthFactor = days.length ? 30 / days.length : 30;

        const rentedVoice = speechMinutes * COST_MODEL.rentedVoicePerMinute * monthFactor;
        const rentedLlm =
          COST_MODEL.rentedLlmPer1kTokens === null
            ? null
            : (tokens / 1000) * COST_MODEL.rentedLlmPer1kTokens * monthFactor;
        const ownedRack =
          COST_MODEL.ownedRackPerMinute === null
            ? null
            : (speechMinutes + totalMinutes) * COST_MODEL.ownedRackPerMinute * monthFactor;
        const moderation =
          (replies / 1000) * COST_MODEL.moderationMinutesPer1kMessages * monthFactor;

        return {
          conversionByPersona: conversionByPersona,
          totalJoins: joins.length,
          totalPaid: paid.length,
          avgMinutesPerMemberDay: avgMinutesPerMemberDay,
          totalMinutes: totalMinutes,
          messagesPerSession: messagesPerSession,
          avgDistinctPerMemberDay: avgDistinctPerMemberDay,
          retention7: retentionAt(7),
          retention30: retentionAt(30),
          cost: {
            replies: replies,
            tokens: tokens,
            speechMinutes: speechMinutes,
            monthFactor: monthFactor,
            rentedVoice: rentedVoice,
            rentedLlm: rentedLlm,
            rentedTotal: rentedLlm === null ? null : rentedVoice + rentedLlm,
            ownedRack: ownedRack,
            moderationMinutes: moderation,
          },
          eventCount: ev.length,
          days: days.length,
        };
      }

      /* R-05: a material policy change forces a renewed acknowledgment before the
   member can carry on. Both versions end up in the record. */
      function pendingPolicyGate() {
        if (!state.session.signedIn) return null;
        const pending = [];
        Object.keys(state.policies.registry).forEach(function (id) {
          const p = state.policies.registry[id];
          const acc = state.policies.accepted[id];
          if (acc && acc.version !== p.version && p.material)
            pending.push({ policy: p, had: acc.version });
        });
        if (!pending.length) return null;

        const box = el("div", { class: "card" });
        box.appendChild(el("div", { class: "eyebrow", text: "Action needed" }));
        box.appendChild(el("h2", { text: S("policyUpdate.title") }));
        box.appendChild(el("p", { class: "muted small", text: S("policyUpdate.body") }));
        pending.forEach(function (x) {
          const row = el("div", { class: "card tight", style: "margin-bottom:8px" });
          row.appendChild(
            el("div", { class: "row between" }, [
              el("b", { text: x.policy.title }),
              el("span", {
                class: "badge plain",
                text: "v" + x.policy.version + " · " + x.policy.effectiveDate,
              }),
            ]),
          );
          row.appendChild(el("div", { class: "small muted", text: x.policy.summary }));
          row.appendChild(
            el("div", { class: "tiny dim", text: S("policyUpdate.was", { version: x.had }) }),
          );
          box.appendChild(row);
        });
        box.appendChild(
          el("button", {
            class: "btn primary",
            text: S("policyUpdate.accept"),
            onclick: function () {
              pending.forEach(function (x) {
                Record.append("policy_version_changed", "system", state.member.id, {
                  policyId: x.policy.id,
                  from: x.had,
                  to: x.policy.version,
                  material: true,
                });
                adapters.consent.accept(x.policy.id, x.policy.version);
              });
              persist();
              toast("New policy versions acknowledged.");
            },
          }),
        );
        return box;
      }

      /* L-03: advancing the clock can end a licence term, so expiries are swept and
   any open conversation with that persona becomes read-only in the same tick. */
      function afterClock() {
        if (sweepExpiries()) applyAvailabilityToConversations();
        persist();
        render();
      }
      function applyAvailabilityToConversations() {
        Object.keys(state.conversations).forEach(function (cid) {
          const c = state.conversations[cid];
          const av = availabilityOf(state, c.personaId);
          if (!av.available && !c.readonly) {
            c.readonly = true;
            c.readonlyReason = av.reason;
            c.messages.push({
              id: nextId("m"),
              who: "sys",
              text:
                av.reason === "revoked"
                  ? S("conv.readonlyRevoked")
                  : S("conv.readonlyExpired", {
                      date: state.catalog.personas[c.personaId].license.duration.end || "",
                    }),
              at: Clock.now,
            });
          }
        });
      }

      /* =========================================================================
   MEMBER SCREENS, PART ONE — M-01..M-06, D-03, D-06, L-01, L-03, R-03, R-05
   One function per screen. Each returns a node; none of them touch the DOM
   outside the node they build.
   ========================================================================= */

      function screenDiscover() {
        const wrap = el("div");
        wrap.appendChild(el("h1", { text: S("discover.title") }));
        wrap.appendChild(el("p", { class: "muted", text: S("discover.lede") }));

        const controls = el("div", { class: "row", style: "margin-bottom:14px" });
        const q = el("input", {
          type: "text",
          value: state.ui.query,
          placeholder: S("discover.search"),
          "aria-label": S("discover.search"),
          oninput: function (e) {
            state.ui.query = e.target.value;
            renderInto("discover-list");
          },
        });
        q.style.flex = "1 1 220px";
        controls.appendChild(q);

        const fr = el("select", {
          "aria-label": S("discover.filterFranchise"),
          onchange: function (e) {
            state.ui.filterFranchise = e.target.value;
            renderInto("discover-list");
          },
        });
        fr.appendChild(
          el("option", {
            value: "all",
            text: S("discover.filterAll"),
            selected: state.ui.filterFranchise === "all",
          }),
        );
        const seen = {};
        state.catalog.order.forEach(function (id) {
          const f = state.catalog.personas[id].franchise;
          if (!seen[f]) {
            seen[f] = true;
            fr.appendChild(
              el("option", { value: f, text: f, selected: state.ui.filterFranchise === f }),
            );
          }
        });
        fr.style.flex = "0 1 220px";
        controls.appendChild(fr);
        wrap.appendChild(controls);

        const list = el("div", { id: "discover-list" });
        list.appendChild(discoverList());
        wrap.appendChild(list);
        return wrap;
      }

      function discoverList() {
        const frag = el("div");
        /* L-03: Discover shows approved, unexpired personas and nothing else. */
        const all = adapters.catalog.list({
          approvedOnly: true,
          franchise: state.ui.filterFranchise,
          query: state.ui.query,
        });
        const visible = all.filter(function (p) {
          return !isBlocked(p.id);
        });
        const hidden =
          state.catalog.order.length -
          state.catalog.order.filter(function (id) {
            return availabilityOf(state, id).available;
          }).length;
        const blockedVisible = all.length - visible.length;

        if (!visible.length) {
          frag.appendChild(notice("info", null, S("discover.empty")));
        } else {
          const grid = el("div", { class: "roster" });
          visible.forEach(function (p) {
            grid.appendChild(personaCard(p));
          });
          frag.appendChild(grid);
        }
        if (blockedVisible > 0) {
          frag.appendChild(notice("warn", null, S("discover.blockedNote", { n: blockedVisible })));
        }
        frag.appendChild(
          el("p", {
            class: "tiny dim",
            style: "margin-top:14px",
            text: S("discover.hiddenNote", { n: hidden }),
          }),
        );
        return frag;
      }

      function screenCompanion(id) {

        const wrap = el("div");
        if (!p) {
          wrap.appendChild(notice("bad", null, "No such personality."));

        wrap.appendChild(
          el("a", { href: "#/discover", class: "small", text: "← " + S("companion.back") }),
        );
        const head = el("div", { class: "row top", style: "margin:14px 0" });
        head.appendChild(avatar(p, 84));
        const meta = el("div", { style: "flex:1 1 240px" });
        meta.appendChild(el("h1", { text: p.displayName, style: "margin-bottom:2px" }));
        if (p.realName) meta.appendChild(el("div", { class: "muted small", text: p.realName }));
        meta.appendChild(el("div", { class: "muted small", text: p.franchise }));
        const badges = el("div", { class: "row", style: "margin-top:8px" });

        wrap.appendChild(

            "Every conversation is labelled AI. Nothing here is presented as the person live, and the person does not read it.",
          ),
        );

        const av = availabilityOf(state, p.id);

        if (p.license.status === "pending") {
          /* D-02 / L-01: a pending persona shows no approval language, no boundaries,
       and no invented biography or storyline. */
          const box = el("div", { class: "card" });
          box.appendChild(el("h3", { text: S("companion.proposedTitle") }));
          box.appendChild(el("p", { class: "muted small", text: S("companion.proposedNote") }));

        } else {

          modes.appendChild(el("div", { class: "eyebrow", text: S("companion.modes") }));
          const mrow = el("div", { class: "row" });
          if (p.modes.text)
            mrow.appendChild(el("span", { class: "badge plain", text: S("companion.modeText") }));
          if (p.modes.voice)
            mrow.appendChild(el("span", { class: "badge plain", text: S("companion.modeVoice") }));
          if (p.modes.images)
            mrow.appendChild(el("span", { class: "badge plain", text: S("companion.modeImages") }));
          modes.appendChild(mrow);
          wrap.appendChild(modes);

          if (p.license.status === "approved") {
            const box = el("div", { class: "card" });
            box.appendChild(
              el("h3", { text: S("companion.approvedTitle", { name: p.displayName }) }),

            TOPICS.filter(function (x) {

        const form = el("div", { class: "card" });

      function createAccount(provider, name, email) {
        const s = adapters.auth.signIn(provider, name, email);
        state.member = {
          id: s.memberId,
          displayName: name,
          email: email,
          provider: provider,
          createdAt: Clock.now,
          deleted: false,
        };
        state.session.signedIn = true;
        state.session.startedAt = Clock.now;
        state.session.lastActiveAt = Clock.now;
        track("signup", { provider: provider });

        /* R-03: the M-03 checkbox produces verified (demo). The state, never a
     document, is what the prototype stores. */
        const res = adapters.ageAssurance.verify();
        state.preferences.ageState = res.state;

        FIXTURES.policies.forEach(function (pol) {
          adapters.consent.accept(pol.id, pol.version);
        });
        Record.append("consent_accepted", state.member.id, state.member.id, {
          policyId: "age_assurance",
          version: "demo",
          state: res.state,
        });

        persist();
        go(state.entitlements.plan ? "#/checkout" : "#/profile");
      }

      function doCheckout(fail) {
        const res = adapters.billing.checkout(state.entitlements.plan, BILLING_CHANNEL, fail);
        if (!res.ok) {
          track("checkout_fail", {
            planId: state.entitlements.plan,
            code: res.code,
            billingChannel: BILLING_CHANNEL,
          });
          persist();
          toast(S("checkout.failed"));
          return;
        }
        const r = reduceCheckoutSuccess(state, Clock.now);
        if (!r.ok) return;
        state.entitlements = r.entitlements;
        state.entitlements.billingChannel = BILLING_CHANNEL;
        /* D-04: conversion is attributed to the personality the member waitlisted,
     because the Phase 0 number is per personality, not per app. */
        const joined = Object.keys(state.waitlist.joins);
        track("checkout_success", {
          planId: state.entitlements.plan,
          billingChannel: BILLING_CHANNEL,
          receiptId: res.receiptId,
          attributedPersonaId: joined.length ? joined[0] : null,
        });
        persist();
        toast(S("checkout.success"));
        go("#/companions");
      }

      /* =========================================================================
   MEMBER SCREENS, PART TWO — M-07..M-09, R-01, R-02, R-04, R-06, K-02, L-03
   ========================================================================= */

      function screenCompanions() {
        const wrap = el("div");
        wrap.appendChild(el("h1", { text: S("companions.title") }));
        wrap.appendChild(el("p", { class: "muted", text: S("companions.lede") }));
        if (!state.session.signedIn) {
          wrap.appendChild(signInPrompt());
          return wrap;
        }
        if (!hasAccess()) {
          wrap.appendChild(
            notice(
              "info",
              null,
              "A plan is needed to open a conversation.",
              el("div", { class: "btn-row", style: "margin-top:10px" }, [
                el("a", { class: "btn primary", href: "#/plans", text: S("plans.title") }),
              ]),
            ),
          );
        }

        const plan = planOf(state);
        if (plan) {
          const meter = el("div", { class: "card tight" });
          if (plan.slots !== null) {
            /* S-01/S-02 with L-03: a persona whose rights ended no longer counts. */
            const used = activeSelections(state).length;
            meter.appendChild(
              el("div", { class: "row between" }, [
                el("span", {
                  class: "small",
                  text: S("companions.slots", { used: used, total: plan.slots }),
                }),
                el("span", { class: "tiny dim", text: plan.name }),
              ]),
            );
            meter.appendChild(
              el("div", { class: "meter" }, [
                el("i", { style: "width:" + Math.min(100, (used / plan.slots) * 100) + "%" }),
              ]),
            );
          } else {
            const used = (state.entitlements.dayUse[Clock.dayKey()] || []).length;
            meter.appendChild(
              el("div", { class: "row between" }, [
                el("span", {
                  class: "small",
                  text: S("companions.perDay", { used: used, total: plan.perDay }),
                }),
                el("span", {
                  class: "tiny dim",
                  text: plan.name + " · resets on a provisional UTC day",
                }),
              ]),
            );
            meter.appendChild(
              el("div", { class: "meter" }, [
                el("i", { style: "width:" + Math.min(100, (used / plan.perDay) * 100) + "%" }),
              ]),
            );
          }
          wrap.appendChild(meter);
        }

        const ids = state.entitlements.selections.filter(function (id) {
          return !isBlocked(id);
        });
        if (!ids.length) {
          wrap.appendChild(
            notice(
              "info",
              null,
              S("companions.empty"),
              el("div", { class: "btn-row", style: "margin-top:10px" }, [
                el("a", { class: "btn primary", href: "#/discover", text: S("companions.browse") }),
              ]),
            ),
          );
          return wrap;
        }

        const grid = el("div", { class: "roster" });
        ids.forEach(function (id) {
          const p = state.catalog.personas[id];
          const av = availabilityOf(state, id);
          const conv = conversationFor(id);
          const card = el("div", { class: "pcard", style: "cursor:default" });
          const head = el("div", { class: "ph" });
          head.appendChild(avatar(p, 46));
          const meta = el("div");
          meta.appendChild(el("div", { class: "pn", text: p.displayName }));
          meta.appendChild(el("div", { class: "pf", text: p.franchise }));
          head.appendChild(meta);
          card.appendChild(head);
          const badges = el("div", { class: "row" });
          badges.appendChild(aiBadge());
          badges.appendChild(statusBadge(p.license.status));
          if (!av.available)
            badges.appendChild(
              el("span", { class: "badge plain", text: S("companions.readonly") }),
            );
          card.appendChild(badges);
          card.appendChild(
            el("div", {
              class: "tiny dim",
              text: conv ? conv.messages.length + " messages · own memory" : "No conversation yet",
            }),
          );
          const acts = el("div", { class: "btn-row", style: "margin-top:auto" });
          acts.appendChild(
            el("button", {
              class: "btn sm primary",
              text: S("companions.open"),
              onclick: function () {
                startConversation(id);
              },
            }),
          );
          acts.appendChild(
            el("button", {
              class: "btn sm",
              text: S("companions.release"),
              onclick: function () {
                const r = reduceReleaseCompanion(state, id);
                state.entitlements = r.entitlements;
                persist();
                toast(S("companions.releaseNote"));
              },
            }),
          );
          card.appendChild(acts);
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
        return wrap;
      }

      function conversationFor(personaId) {
        const ids = Object.keys(state.conversations);
        for (let i = 0; i < ids.length; i++) {
          if (state.conversations[ids[i]].personaId === personaId)
            return state.conversations[ids[i]];
        }
        return null;
      }

      function startConversation(personaId) {
        /* M-02..M-06: the journey runs Discover, companion detail, plan, account and
     consent, checkout — so a member without a plan meets Plans first. */
        if (!hasAccess()) {
          go("#/plans");
          return;
        }
        if (!state.session.signedIn) {
          go("#/account");
          return;
        }
        if (isBlocked(personaId)) {
          toast(S("companion.blockedNotice"));
          return;
        }

        const sel = reduceSelectCompanion(state, personaId);
        if (!sel.ok) {
          if (sel.reason === "day_limit") {
            toast(S("conv.limitReached", { n: planOf(state).perDay, plan: planOf(state).name }));
          } else if (sel.reason === "no_slots") {
            toast(
              "Every selection on this plan is in use. Release one in My companions, or change plan.",
            );
          } else if (sel.reason === "not_available") {
            toast(S("companion.unavailable"));
          } else {
            go("#/plans");
          }
          return;
        }
        state.entitlements = sel.entitlements;

        let conv = conversationFor(personaId);
        if (!conv) {
          const p = state.catalog.personas[personaId];
          conv = {
            id: nextId("cnv"),
            personaId: personaId,
            startedAt: Clock.now,
            lastDisclosureAt: Clock.now,
            readonly: false,
            readonlyReason: null,
            messages: [],
            voiceState: "idle",
            crisisOpen: false,
            activeSeconds: 0,
            lastTouch: Clock.now,
            reminderOpen: false,
          };
          /* R-01: the opening notice is the first thing in the transcript, and it is
       written to the record as well as the transcript. */
          conv.messages.push({
            id: nextId("m"),
            who: "sys",
            kind: "disclosure",
            text: S("conv.openingNotice", { name: p.displayName }),
            at: Clock.now,
          });
          Record.append("moderation_action", "system", personaId, {
            action: "ai_disclosure_shown",
            conversationId: conv.id,
            trigger: "conversation_start",
          });
          state.conversations[conv.id] = conv;
          track("conversation_start", { personaId: personaId });
