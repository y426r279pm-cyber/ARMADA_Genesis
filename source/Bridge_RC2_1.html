      .join("")}</tbody></table></div>`;
  if (w.step === 6)
    body = `<div class="card"><p class="sub">${esc(L("One record, read from the provider and from the cluster, compared field by field. Nothing is written.", "Un registro, leído del proveedor y del clúster, comparado campo por campo. No se escribe nada."))}</p><button class="btn" data-wiz-dry>${esc(L("Run dry run", "Ejecutar simulación"))}</button>${w.dry ? `<table class="diff" style="margin-top:14px"><thead><tr><th>${esc(L("Field", "Campo"))}</th><th>${esc(L("External", "Externo"))}</th><th>${esc(L("Cluster", "Clúster"))}</th><th>${esc(L("Result", "Resultado"))}</th></tr></thead><tbody>${w.dry.map((r) => `<tr><td><b>${esc(r.k)}</b></td><td>${esc(String(r.ext))}</td><td>${esc(r.cl === undefined ? "—" : String(r.cl))}</td><td class="${r.res}">${esc(r.res === "same" ? L("match", "coincide") : r.res === "miss" ? L("not in cluster", "no está en el clúster") : L("differs", "difiere"))}</td></tr>`).join("")}</tbody></table><p class="sub" style="margin-top:10px">${esc(L("Differences are expected on first connection; commit records the mapping and the first sync reconciles them, sealed.", "Las diferencias son esperables en la primera conexión; confirmar registra el mapeo y la primera sincronización las concilia, sellado."))}</p>` : ""}</div>`;
  if (w.step === 7)
    body = `<div class="card"><h2>${esc(tpl.name)}</h2><p>${esc(L("Family", "Familia"))}: ${esc(state.lang === "es" ? fam.es : fam.en)} · ${esc(L("Test", "Prueba"))}: ${w.test?.ok ? "OK" : "—"} · ${Object.keys(tpl.record).length} ${esc(L("fields mapped", "campos mapeados"))}</p><div class="field" style="margin-bottom:12px"><label>${esc(L("Display name", "Nombre para mostrar"))}</label><input data-wiz-name value="${esc(w.name || tpl.name)}"/></div><p class="sub">${esc(L("Commit writes the integration, sends the secrets to the key store, and seals the event.", "Confirmar escribe la integración, envía los secretos al almacén de llaves y sella el evento."))}</p><button class="btn primary" data-wiz-commit>${esc(L("Commit and seal", "Confirmar y sellar"))}</button></div>`;
  const canNext = {
    1: !!w.family,
    2: !!w.template,
    3: tpl && tpl.fields.every(([k, type]) => w.values[k] && !VALID[type](w.values[k])),
    4: !!(w.test && w.test.ok),
    5: true,
    6: !!w.dry,
    7: false,
  }[w.step];
  return `<div class="card" style="margin-bottom:16px">${bar}${body}<div class="row spread" style="margin-top:16px"><button class="btn" data-wiz-back>${esc(w.step === 1 ? L("‹ Leave", "‹ Salir") : L("Back", "Volver"))}</button>${w.step < 7 ? `<button class="btn primary" data-wiz-next ${canNext ? "" : "disabled"}>${esc(L("Continue", "Continuar"))}</button>` : ""}</div></div>`;
}

/** Paste a record (JSON) and validate it against the template's field types and against the cluster store. */

function validateRecordDialog(integration) {
  const fam = FAMILIES.find((f) => f.id === integration.family);
  const tpl = fam.templates.find((x) => x.name === integration.template) || fam.templates[0];
  const dlg = document.createElement("dialog");
  dlg.style.maxWidth = "680px";
  dlg.innerHTML = `<h2>${esc(L("Validate a record against both databases", "Validar un registro contra ambas bases"))}</h2><p class="sub">${esc(L("Paste JSON from the provider. Each field is checked for type and compared with the cluster's store.", "Pegue el JSON del proveedor. Cada campo se verifica por tipo y se compara con el almacén del clúster."))}</p>
    <div class="field"><textarea rows="5" id="valIn">${esc(JSON.stringify(tpl.record, null, 2))}</textarea></div><div id="valOut" style="margin-top:12px"></div>
    <div class="row spread" style="margin-top:12px"><button class="btn" data-x>${esc(t("cancel"))}</button><button class="btn primary" data-run>${esc(L("Validate", "Validar"))}</button></div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  dlg.querySelector("[data-x]").onclick = () => {
    dlg.close();
    dlg.remove();
  };
  dlg.querySelector("[data-run]").onclick = () => {
    let obj;
    try {
      obj = JSON.parse(dlg.querySelector("#valIn").value);
    } catch {
      dlg.querySelector("#valOut").innerHTML =
        `<p style="color:var(--crit)">${esc(L("That is not valid JSON.", "Eso no es JSON válido."))}</p>`;
      return;
    }
    const rows = Object.keys(tpl.record).map((k) => {
      const ext = obj[k];
      const typeOk = ext !== undefined && typeof ext === typeof tpl.record[k];
      const path = (integration.mapping || tpl.map)[k];
      const cl = path ? clusterValue(path) : undefined;
      return {
        k,
        ext,
        typeOk,
        cl,
        res: !typeOk ? "miss" : cl === undefined ? "miss" : String(cl) === String(ext) ? "same" : "diff",
      };
    });
    dlg.querySelector("#valOut").innerHTML =
      `<table class="diff"><thead><tr><th>${esc(L("Field", "Campo"))}</th><th>${esc(L("Type", "Tipo"))}</th><th>${esc(L("External", "Externo"))}</th><th>${esc(L("Cluster", "Clúster"))}</th><th>${esc(L("Result", "Resultado"))}</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${esc(r.k)}</b></td><td>${r.typeOk ? "✓" : "✗"}</td><td>${esc(String(r.ext))}</td><td>${esc(r.cl === undefined ? "—" : String(r.cl))}</td><td class="${r.res}">${esc(r.res)}</td></tr>`).join("")}</tbody></table>`;
    seal(`registro validado contra ${integration.name}`, `record validated against ${integration.name}`, actor(), {
      key: integration.name,
    });
  };
}
/* ==========================================================================
   SECTION 8 · EVENTS · one delegated listener; every mutation lives here
   --------------------------------------------------------------------------
   FOR THE NOVICE: instead of attaching a handler to every button, one
   listener on the whole app catches every tap and looks at the data-*
   attribute of what was tapped. Each line below is one action and reads the
   same way: find the record → change it → DB.put (save) → seal (write it to
   the chain) → toast (tell the user) → render (redraw the screen). Lines are
   deliberately kept to one action each so the list can be scanned like a table.
   Read-only roles are stopped early, before any action that changes data.
   ========================================================================== */

const app = document.getElementById("app");

/* Draws the current screen into the page and sets the document language. */

function render() {
  if (!SCREENS[state.route]) state.route = "home";
  app.innerHTML = SCREENS[state.route]();
  document.documentElement.lang = state.lang;
}

/* Finds a record in a store by id. */

const find = (store, id) => {
  const r = S[store].find((d) => d.id === id);
  if (!r) throw new Error(L("That record no longer exists.", "Ese registro ya no existe."));
  return r;
};

/* Opens an incident and saves it. */

async function addIncident(title, sev) {
  await DB.put("incidents", { id: uid(), title, sev, status: "open", at: nowISO(), assignee: "" });
}

/* The delegated click handler: every tap in the app arrives here and is routed by its data-attribute. */

app.addEventListener("click", async (e) => {

  /* buttons and links first; rows, cards, and chips carry data-open. A button inside a tappable row wins over the row. */

  const el = e.target.closest("button, a") || e.target.closest("[data-open]");
  if (!el) return;
  const d = el.dataset;
  try {

    /* navigation, language, session */

    if (d.lang) {
      state.lang = d.lang;
      return render();
    }

    /* Go back through Bridge's own history. */

    if ("back" in d) return back();

    /* Jump to a breadcrumb. */

    if (d.crumb !== undefined) {
      const idx = +d.crumb;
      const target = state.stack[idx];
      if (!target) return back();
      state.stack = state.stack.slice(0, idx);
      state.route = target.route;
      state.params = target.params;
      state.filter = target.filter || "";
      return render();
    }

    /* Open a detail screen (route:id) or a screen by name. */

    if (d.open !== undefined) {
      const [route, id] = d.open.split(":");
      return go(route, id === undefined ? {} : route === "conectar" ? { preset: id } : { id });
    }

    /* Filter the invoice list by stage; tap again to clear. */

    if (d.stage !== undefined) {
      state.stageFilter = state.stageFilter === d.stage ? "" : d.stage;
      return render();
    }

    /* Copy a literal to the clipboard. */

    if (d.copyText !== undefined) {
      await navigator.clipboard?.writeText(d.copyText);
      return toast(L("Copied", "Copiado"));
    }

    /* Navigate to a screen; entering Chat may auto-load the cached on-device model. */

    if (d.go === "chat") {
      const cfg = aiCfg();
      if (cfg.device.auto && Device.status === "idle" && Device.supported()) {
        Device.cached(cfg.device.model).then((yes) => {
          if (yes && Device.status === "idle")
            bringTaylorIn(cfg.device.model)
              .then(() => render())
              .catch(() => {});
        });
      }
    }

    /* Navigate to a screen; entering Chat may auto-load the cached on-device model. */

    if (d.go) return go(d.go);

    /* Sign in with the chosen role, clear the history, seal the event. */

    if ("login" in d) {
      state.role = document.getElementById("roleSel").value;
      state.user = (document.getElementById("userIn").value || "m.rios").trim();
      state.stack = [];
      await seal(`inicio de sesión (${state.role})`, `sign-in (${state.role})`, state.user);
      return go("home", {}, true);
    }

    /* Sign out, seal the event, return to the front door. */

    if ("logout" in d) {
      await seal("cierre de sesión", "sign-out", actor());
      state.role = null;
      state.stack = [];
      return go("login", {}, true);
    }

    /* Open a node from the health grid. */

    if (d.node) {
      state.nodeFocus = d.node;
      return go("nodo", { id: d.node });
    }

    /* Copy an input's value to the clipboard. */

    if (d.copy) {
      const v = document.querySelector(d.copy)?.value || "";
      await navigator.clipboard?.writeText(v);
      return toast(L("Copied", "Copiado"));
    }
    if (
      !canWrite() &&
      !d.exportDb &&
      !("dossier" in d) &&
      !("verifyChain" in d) &&
      !("auditCsv" in d) &&
      !("chatClear" in d) &&
      !("tokenRotate" in d)
    )

      /* read-only roles stop here */

      return;

    /* ---- Collections ---- */

    if (d.acctNew)
      return formDialog(
        L("New account", "Nueva cuenta"),
        [
          { k: "name", label: L("Account", "Cuenta") },
          { k: "uuid", label: "UUID", value: "…" },
        ],
        async (v) => {
          if (!v.name) return;
          await DB.put("accounts", {
            id: uid(),
            name: v.name,
            uuid: v.uuid,
            next: "09:00",
            status: "ok",
            touchesToday: 0,
            paused: false,
            escalated: false,
            history: [],
          });
          await seal(`cuenta creada: ${v.name}`, `account created: ${v.name}`, actor());
          render();
        }
      );

    /* Send one touch to an account; the two-a-day limit is enforced here as on the server. */

    if (d.touch) {
      const a = find("accounts", d.touch);
      if (a.touchesToday >= 2) return toast(L("Limit: two touches a day.", "Límite: dos toques al día."), true);
      a.touchesToday++;
      a.history.push(nowISO());
      await DB.put("accounts", a);
      await seal(`toque enviado · ${a.name}`, `touch sent · ${a.name}`, actor(), { key: a.uuid });
      toast(L("Touch sent and sealed.", "Toque enviado y sellado."));
      return render();
    }

    /* Pause or resume an account. */

    if (d.pause) {
      const a = find("accounts", d.pause);
      a.paused = !a.paused;
      await DB.put("accounts", a);
      await seal(
        `${a.paused ? "pausa" : "reanudación"} · ${a.name}`,
        `${a.paused ? "paused" : "resumed"} · ${a.name}`,
        actor()
      );
      return render();
    }

    /* Escalate an account to Kimi and open an incident. */

    if (d.escalate) {
      const a = find("accounts", d.escalate);
      a.escalated = true;
      await DB.put("accounts", a);
      await addIncident(`${a.name} · ${L("escalated to Kimi", "escalado a Kimi")}`, "warn");
      await seal(`escalación a Kimi · ${a.name}`, `escalation to Kimi · ${a.name}`, actor());
      toast(L("Escalated; an incident was opened.", "Escalado; se abrió un incidente."));
      return render();
    }

    /* Archive an account (typed confirmation). */

    if (d.acctDel) {
      const a = find("accounts", d.acctDel);
      return confirmTyped("ARCHIVAR", `${L("Archive account", "Archivar cuenta")} ${a.name}`, async () => {
        await DB.del("accounts", a.id);
        await seal(`cuenta archivada: ${a.name}`, `account archived: ${a.name}`, actor());
        back();
      });
    }

    /* ---- Invoices ---- */

    if (d.invAdvance) {
      const i = find("invoices", d.invAdvance);
      i.stage = i.stage === "issued" ? "confirmed" : "paid";
      await DB.put("invoices", i);
      await seal(`factura ${i.uuid} → ${i.stage}`, `invoice ${i.uuid} → ${i.stage}`, actor(), { key: i.uuid });
      return render();

      /* [TIE-IN: bank feed] a matched payment advances the stage */

    }

    /* Cancel a CFDI (typed confirmation). */

    if (d.invCancel) {
      const i = find("invoices", d.invCancel);
      return confirmTyped("CANCELAR", `${L("Cancel CFDI", "Cancelar CFDI")} ${i.uuid}`, async () => {
        i.stage = "cancelled";
        await DB.put("invoices", i);
        await seal(`CFDI cancelado: ${i.uuid}`, `CFDI cancelled: ${i.uuid}`, actor(), { key: i.uuid });
        toast(L("Cancellation sent to the PAC and sealed.", "Cancelación enviada al PAC y sellada."));
        render();
      });
    }

    /* Request the payment complement through the PAC; the invoice moves to REP sealed. */

    if (d.rep) {
      const i = find("invoices", d.rep);
      i.stage = "rep_sealed";
      i.repDay = 0;
      await DB.put("invoices", i);
      await seal(`REP solicitado y sellado · ${i.uuid}`, `REP requested and sealed · ${i.uuid}`, actor(), {
        key: i.uuid,
      });
      toast(L("REP requested through the PAC and sealed.", "REP solicitado por el PAC y sellado."));
      return render();

      /* [TIE-IN: PAC] REP request */

    }

    /* Verify an invoice UUID against the SAT (mock). */

    if (d.verify) {
      const i = find("invoices", d.verify);
      const ok = i.uuid.length % 2 === 0;
      await seal(
        `UUID verificado · ${i.uuid} · ${ok ? "vigente" : "cancelado"}`,
        `UUID verified · ${i.uuid} · ${ok ? "valid" : "cancelled"}`,
        actor(),
        { key: i.uuid }
      );
      return toast(
        `${i.uuid}: ${ok ? L("valid at SAT", "vigente en el SAT") : L("cancelled at SAT", "cancelado en el SAT")}`,
        !ok
      );

      /* [TIE-IN: SAT consulta CFDI] */

    }

    /* ---- Agents ---- */

    if ("agentPublish" in d || "agentDraft" in d) {
      const name = document.getElementById("agName").value.trim();
      if (!name) return toast(L("Give the agent a name.", "Póngale nombre al agente."), true);
      const a = {
        id: uid(),
        name,
        kind: document.getElementById("agKind").value,
        tone: document.getElementById("agTone").value,
        count: 0,
        version: 1,
        status: "agentPublish" in d ? "active" : "draft",
        limits: "2/día",
        publishedAt: nowISO(),
      };
      await DB.put("agents", a);
      if (a.status === "active")
        await seal(
          `agente publicado: ${name} (guardarraíl v${S.settings[0].guardrailsVersion})`,
          `agent published: ${name} (guardrail v${S.settings[0].guardrailsVersion})`,
          actor()
        );
      toast(
        a.status === "active"
          ? L("Agent published and sealed.", "Agente publicado y sellado.")
          : L("Draft saved.", "Borrador guardado.")
      );
      return render();
    }

    /* Pause or resume an agent. */

    if (d.agentToggle) {
      const a = find("agents", d.agentToggle);
      a.status = a.status === "active" ? "paused" : "active";
      await DB.put("agents", a);
      await seal(
        `agente ${a.status === "active" ? "reanudado" : "pausado"}: ${a.name}`,
        `agent ${a.status}: ${a.name}`,
        actor()
      );
      return render();
    }

    /* Edit an agent's tone (new version). */

    if (d.agentEdit) {
      const a = find("agents", d.agentEdit);
      return formDialog(a.name, [{ k: "tone", label: L("Tone", "Tono"), value: a.tone }], async (v) => {
        a.tone = v.tone;
        a.version++;
        await DB.put("agents", a);
        await seal(`agente editado: ${a.name} v${a.version}`, `agent edited: ${a.name} v${a.version}`, actor());
        render();
      });
    }

    /* Retire an agent (typed confirmation). */

    if (d.agentRetire) {
      const a = find("agents", d.agentRetire);
      return confirmTyped("RETIRAR", `${L("Retire agent", "Retirar agente")} ${a.name}`, async () => {
        await DB.del("agents", a.id);
        await seal(`agente retirado: ${a.name}`, `agent retired: ${a.name}`, actor());
        render();
      });
    }

    /* Filter agents by status. */

    if (d.agentFilter !== undefined) {
      state.agentFilter = d.agentFilter;
      return render();
    }

    /* Duplicate an agent as a draft. */

    if (d.agentDup) {
      const a = find("agents", d.agentDup);
      const c = {
        ...a,
        id: uid(),
        name: a.name + " (copia)",
        status: "draft",
        version: 1,
        count: 0,
        publishedAt: nowISO(),
      };
      await DB.put("agents", c);
      await seal(`agente duplicado: ${a.name}`, `agent duplicated: ${a.name}`, actor());
      return render();
    }

    /* Open an agent in AgentStudio, prefilled. */

    if (d.agentStudio) {
      const a = find("agents", d.agentStudio);
      state.studio = {
        ...studioDefault(),
        ...(a.spec || {}),
        scope: (a.spec && a.spec.scope) || { kind: "account", id: "" },
        name: a.name,
        tone: (a.spec && a.spec.tone) || "courteous",
        role: a.kind,
        editing: a.id,
        step: 1,
        chat: [],
        rehearsals: {},
      };
      return go("studio");
    }

    /* ---- AgentStudio ---- */

    if ("stBack" in d) {
      if (state.studio.step === 1) {
        state.studio = null;
        return back();
      }
      state.studio.step -= 1;
      return render();
    }

    /* AgentStudio: next step. */

    if ("stNext" in d) {
      state.studio.step = Math.min(7, state.studio.step + 1);
      return render();
    }

    /* AgentStudio: choose the agent's scope; a store scope preselects the planogram template. */

    if (d.stScope) {
      state.studio.scope = { kind: d.stScope, id: "" };

      /* AgentStudio: choose the agent's scope; a store scope preselects the planogram template. */

      if (d.stScope === "store" && !state.studio.capabilities.includes("planogram"))
        state.studio.capabilities = ["planogram"];
      return render();
    }

    /* AgentStudio: toggle a capability. */

    if (d.stCap) {
      const c = state.studio.capabilities;
      state.studio.capabilities = c.includes(d.stCap) ? c.filter((x) => x !== d.stCap) : [...c, d.stCap];
      return render();
    }

    /* AgentStudio: toggle a channel. */

    if (d.stChan) {
      const c = state.studio.channels;
      state.studio.channels = c.includes(d.stChan) ? c.filter((x) => x !== d.stChan) : [...c, d.stChan];
      return render();
    }

    /* AgentStudio: nudge a limit within the guardrails' caps. */

    if (d.stLim) {
      const [k, dir] = d.stLim.split(":");
      const caps = { touches: [1, 2], escalateAfter: [1, 4], maxWords: [40, 200] }[k] || [1, 999];
      state.studio.limits[k] = Math.min(
        caps[1],
        Math.max(caps[0], state.studio.limits[k] + +dir * (k === "maxWords" ? 20 : 1))
      );
      return render();

      /* touches never exceed the guardrails' two a day */

    }

    /* AgentStudio: toggle a data permission. */

    if (d.stData) {
      state.studio.data[d.stData] = !state.studio.data[d.stData];
      return render();
    }

    /* AgentStudio: run a rehearsal scenario. */

    if (d.stRun) {
      state.studio.rehearsals[d.stRun] = rehearse(state.studio, d.stRun);
      return render();
    }

    /* AgentStudio: save the draft. */

    if ("stDraft" in d || "stPublish" in d) {
      const s = state.studio;
      const a = studioAnalyze(s);
      const publish = "stPublish" in d;
      if (publish) {
        if (
          !s.name.trim() ||
          a.conflicts.length ||
          Object.keys(s.rehearsals).length < SCENARIOS().length ||
          !Object.values(s.rehearsals).every((r) => r.pass)
        )
          return toast(
            L(
              "Finish the review first: a name, no conflicts, every rehearsal passed.",
              "Termine la revisión: un nombre, sin conflictos, todos los ensayos aprobados."
            ),
            true
          );
        const ok = await authenticate(`${L("Publish agent", "Publicar agente")} ${s.name}`);
        if (!ok) return toast(L("Not approved; nothing was published.", "No aprobado; nada se publicó."), true);
      }
      const spec = {
        scope: s.scope,
        capabilities: s.capabilities,
        channels: s.channels,
        tone: s.tone,
        lang: s.lang,
        instructions: s.instructions,
        limits: s.limits,
        data: s.data,
        rehearsals: Object.entries(s.rehearsals).map(([id, r]) => ({ id, pass: r.pass })),
        guardrails: policyOf("guardrails").version,
        guidelines: (policyOf("guidelines") || {}).version,
      };
      let rec = s.editing ? find("agents", s.editing) : null;
      if (rec) {
        rec.name = s.name.trim();
        rec.tone = TONES().find(([id]) => id === s.tone)[1];
        rec.spec = spec;
        if (publish) {
          rec.version += 1;
          rec.status = "active";
        }
      } else
        rec = {
          id: uid(),
          name: s.name.trim() || L("Untitled agent", "Agente sin nombre"),
          kind: s.capabilities[0] || "reminder",
          tone: TONES().find(([id]) => id === s.tone)[1],
          count: 0,
          version: 1,
          status: publish ? "active" : "draft",
          limits: `${s.limits.touches}/día`,
          publishedAt: nowISO(),
          spec,
        };
      await DB.put("agents", rec);
      if (s.scope.kind === "store" && s.scope.id) {
        const st = S.stores.find((x) => x.id === s.scope.id);
        if (st) {
          st.agent = rec.id;
          await DB.put("stores", st);
        }
      }
      if (publish)
        await seal(
          `agente publicado desde AgentStudio: ${rec.name} v${rec.version} (guardarraíl v${spec.guardrails}, ${spec.rehearsals.length} ensayos)`,
          `agent published from AgentStudio: ${rec.name} v${rec.version} (guardrails v${spec.guardrails}, ${spec.rehearsals.length} rehearsals)`,
          actor(),
          { key: rec.name }
        );
      state.studio = null;
      toast(
        publish
          ? `${rec.name} v${rec.version} ${L("published and sealed.", "publicado y sellado.")}`
          : L("Draft saved.", "Borrador guardado.")
      );
      return go("agente", { id: rec.id }, true);
    }

    /* ---- Enterprise: cases, stores, topology ---- */

    if ("caseNew" in d)
      return formDialog(
        L("Open a case", "Abrir caso"),
        [
          {
            k: "invoice",
            label: L("Supplier CFDI (UUID)", "CFDI del proveedor (UUID)"),
            type: "select",
            value: "",
            options: S.invoices
              .filter((i) => i.type === "payable")
              .slice(0, 40)
              .map((i) => [i.id, i.uuid + " · " + i.client]),
          },
          { k: "title", label: L("What disagrees", "Qué no coincide") },
        ],
        async (v) => {
          const inv = find("invoices", v.invoice);
          await DB.put("cases", {
            id: "CASE-" + (100 + S.cases.length + 1),
            invoice: inv.id,
            po: inv.po,
            supplier: inv.supplier,
            status: "open",
            title: v.title || L("opened by hand", "abierto a mano"),
            owner: "",
            opened: nowISO(),
            minutes: 0,
            agent: "",
            actions: [],
            finding: "",
          });
          await seal(`caso abierto sobre ${inv.uuid}`, `case opened on ${inv.uuid}`, actor(), { key: inv.uuid });
          render();
        }
      );

    /* Take a case: the person becomes its owner. */

    if (d.caseAttend) {
      const c = find("cases", d.caseAttend);
      c.status = "attending";
      c.owner = actor();
      c.actions.push({ at: nowISO(), by: actor(), what: L("took the case", "tomó el caso") });
      await DB.put("cases", c);
      await seal(`caso ${c.id} tomado`, `case ${c.id} taken`, actor(), { key: c.id });
      return render();
    }

    /* Record one of the four case actions (inquiry, evidence, flag, route); the clock adds six minutes. */

    if (d.caseAct) {
      const [id, what] = d.caseAct.split(":");
      const c = find("cases", id);
      const label = {
        inquiry: L(
          "supplier inquiry drafted with the receiving record attached",
          "consulta al proveedor redactada con el registro de recepción adjunto"
        ),
        evidence: L("delivery evidence requested", "evidencia de entrega solicitada"),
        flag: L("receiving mismatch flagged", "discrepancia de recepción marcada"),
        route: L("routed to the regional team", "enviado al equipo regional"),
      }[what];
      c.actions.push({ at: nowISO(), by: actor(), what: label });
      c.minutes += 6;
      if (c.status === "open") {
        c.status = "attending";
        c.owner = actor();
      }
      await DB.put("cases", c);
      await seal(`caso ${c.id}: ${label}`, `case ${c.id}: ${label}`, actor(), { key: c.id });
      toast(label);
      return render();
    }

    /* Approve for payment: every check green, a typed word, then the authenticator; sealed with the gate named. */

    if (d.caseApprove) {
      const c = find("cases", d.caseApprove);
      if (!caseChecks(c).every((k) => k.ok))
        return toast(
          L(
            "Every check must be green before the gate opens.",
            "Todas las verificaciones deben estar en verde antes de abrir la compuerta."
          ),
          true
        );
      return confirmTyped("APROBAR", `${L("Approve for payment", "Aprobar para pago")} ${c.id}`, async () => {
        const ok = await authenticate(`${L("Approve for payment", "Aprobar para pago")} ${c.id}`);
        if (!ok)
          return toast(L("Not approved; nothing was sent to payment.", "No aprobado; nada se envió a pago."), true);
        c.status = "resolved";
        c.closed = nowISO();
        c.actions.push({
          at: nowISO(),
          by: actor(),
          what: L("approved for payment at the gate", "aprobado para pago en la compuerta"),
        });
        await DB.put("cases", c);
        await seal(
          `caso ${c.id} aprobado para pago (compuerta: palabra escrita + autenticador)`,
          `case ${c.id} approved for payment (gate: typed word + authenticator)`,
          actor(),
          { key: c.id }
        );
        toast(
          L(
            "Approved and sealed; the ERP's own controls still apply.",
            "Aprobado y sellado; los controles propios del ERP siguen aplicando."
          )
        );
        render();
      });
    }

    /* Close a case with a credit note reference. */

    if (d.caseClose) {
      const c = find("cases", d.caseClose);
      return formDialog(
        L("Close with a credit note", "Cerrar con nota de crédito"),
        [{ k: "note", label: L("Credit note reference", "Referencia de la nota de crédito"), value: "" }],
        async (v) => {
          c.status = "resolved";
          c.closed = nowISO();
          c.actions.push({
            at: nowISO(),
            by: actor(),
            what: `${L("closed with credit note", "cerrado con nota de crédito")} ${v.note || "—"}`,
          });
          await DB.put("cases", c);
          await seal(
            `caso ${c.id} cerrado con nota de crédito ${v.note}`,
            `case ${c.id} closed with credit note ${v.note}`,
            actor(),
            { key: c.id }
          );
          render();
        }
      );
    }

    /* Reopen a resolved case. */

    if (d.caseReopen) {
      const c = find("cases", d.caseReopen);
      c.status = "open";
      c.closed = null;
      c.actions.push({ at: nowISO(), by: actor(), what: L("reopened", "reabierto") });
      await DB.put("cases", c);
      await seal(`caso ${c.id} reabierto`, `case ${c.id} reopened`, actor(), { key: c.id });
      return render();
    }

    /* Sync a store's queued records now and seal the count. */

    if (d.storeSync) {
      const s = find("stores", d.storeSync);
      const n = s.queued;
      s.queued = 0;
      s.connector = "online";
      await DB.put("stores", s);
      await seal(`tienda ${s.id}: ${n} registros sincronizados`, `store ${s.id}: ${n} records synced`, actor(), {
        key: s.id,
      });
      toast(`${n} ${L("records synced and sealed.", "registros sincronizados y sellados.")}`);
      return render();
    }

    /* Simulate a store losing its connection (records queue) or coming back (syncing). */

    if (d.storeOffline) {
      const s = find("stores", d.storeOffline);
      if (s.connector === "online") {
        s.connector = "queued";
        s.queued = 12 + (s.tickets % 30);
      } else {
        s.connector = "syncing";
      }
      await DB.put("stores", s);
      await seal(`tienda ${s.id}: conector ${s.connector}`, `store ${s.id}: connector ${s.connector}`, actor(), {
        key: s.id,
      });
      return render();
    }

    /* Assign an existing store-scoped agent to a store. */

    if (d.storeAssign) {
      const [sid, aid] = d.storeAssign.split(":");
      const s = find("stores", sid);
      s.agent = aid;
      await DB.put("stores", s);
      await seal(`agente asignado a ${s.id}`, `agent assigned to ${s.id}`, actor(), { key: s.id });
      return render();
    }

    /* Remove the agent from a store. */

    if (d.storeUnassign) {
      const s = find("stores", d.storeUnassign);
      s.agent = "";
      await DB.put("stores", s);
      await seal(`agente desasignado de ${s.id}`, `agent unassigned from ${s.id}`, actor(), { key: s.id });
      return render();
    }

    /* ---- Models ---- */

    if (d.modelStage) {
      const m = find("models", d.modelStage);
      const next = "v" + (parseFloat(m.version.replace(/[^\d.]/g, "")) + 0.1).toFixed(1);
      m.history.push(m.version);
      m.version = next;
      m.status = "ok";
      await DB.put("models", m);
      await seal(`modelo activado por etapas: ${m.name} ${next}`, `model staged: ${m.name} ${next}`, actor());
      return render();

      /* [TIE-IN: model registry] N17 first */

    }

    /* Revert an installed model to its previous version. */

    if (d.modelRevert) {
      const m = find("models", d.modelRevert);
      const prev = m.history.pop();
      if (!prev) return;
      m.version = prev;
      await DB.put("models", m);
      await seal(`reversa: ${m.name} → ${prev}`, `revert: ${m.name} → ${prev}`, actor());
      toast(L("Reverted and sealed.", "Revertido y sellado."));
      return render();
    }

    /* ---- Chain, audit ---- */

    if ("verifyChain" in d) {
      const r = await verifyChain();
      return toast(
        r.ok
          ? `${L("Chain intact", "Cadena íntegra")}: ${r.length} ${L("events", "eventos")}`
          : `${L("Chain broken at", "Cadena rota en")} #${r.brokenAt}`,
        !r.ok
      );
    }

    /* Export the sealed dossier with its verification. */

    if ("dossier" in d) {
      const r = await verifyChain();
      download(
        `bridge-dossier-${today()}.json`,
        JSON.stringify(
          { exportedAt: nowISO(), by: actor(), verified: r, events: [...S.ledger].sort((a, b) => a.seq - b.seq) },
          null,
          2
        )
      );
      if (canWrite()) await seal("dossier exportado", "dossier exported", actor());
      return toast(L("Dossier exported.", "Dossier exportado."));
    }

    /* Export the audit CSV. */

    if ("auditCsv" in d) {
      const rows = [...S.ledger].sort((a, b) => a.seq - b.seq);
      download(
        `bridge-audit-${today()}.csv`,
        "seq,at,actor,event_es,event_en,prevHash,hash\n" +
          rows.map((e) => [e.seq, e.at, e.actor, `"${e.es}"`, `"${e.en}"`, e.prevHash, e.hash].join(",")).join("\n"),
        "text/csv"
      );
      return;
    }

    /* ---- Data ---- */

    if ("arco" in d)
      return formDialog(
        L("ARCO erasure", "Borrado ARCO"),
        [{ k: "subject", label: L("Data subject", "Titular"), value: "" }],
        async (v) => {
          if (!v.subject) return;
          await DB.put("jobs", { id: uid(), kind: "arco", subject: v.subject, keys: [], status: "open", at: nowISO() });
          await seal(`solicitud ARCO abierta: ${v.subject}`, `ARCO request opened: ${v.subject}`, actor());
          render();
        }
      );

    /* A custodian turns a key. */

    if (d.arcoKey) {
      const j = S.jobs.find((x) => x.kind === "arco" && x.status !== "done");
      j.keys.push(+d.arcoKey);
      await DB.put("jobs", j);
      await seal(
        `custodio ${d.arcoKey} giró llave · ${j.subject}`,
        `custodian ${d.arcoKey} turned key · ${j.subject}`,
        actor()
      );
      return render();
    }

    /* Execute the crypto-shred (typed confirmation). */

    if ("arcoExec" in d) {
      const j = S.jobs.find((x) => x.kind === "arco" && x.status !== "done");
      return confirmTyped("ARCO", L("Execute crypto-shred", "Ejecutar crypto-shred") + " · " + j.subject, async () => {
        j.status = "done";
        await DB.put("jobs", j);
        await seal(`crypto-shred ejecutado · ${j.subject}`, `crypto-shred executed · ${j.subject}`, actor());
        toast(L("Erasure executed and sealed.", "Borrado ejecutado y sellado."));
        render();
      });
    }

    /* Export the store as JSON. */

    if ("exportDb" in d) return download(`bridge-store-${today()}.json`, JSON.stringify(DB.export(), null, 2));

    /* Erase the store and reload the seed (typed confirmation). */

    if ("resetDb" in d)
      return confirmTyped(
        "RESET",
        L(
          "Erase every record in this browser and reload the seed?",
          "¿Borrar todos los registros de este navegador y recargar la semilla?"
        ),
        async () => {
          await DB.clearAll();
          await seed();
          toast(L("Seed restored.", "Semilla restaurada."));
          render();
        }
      );

    /* ---- Chat and Taylor ---- */

    if ("chatDrawer" in d) {
      state.chatDrawer = !state.chatDrawer;
      return render();
    }

    /* Start a new chat. */

    if ("chatNew" in d) {
      state.chatId = null;
      await ensureChat();
      state.chatDrawer = false;
      return render();
    }

    /* Open a chat from the drawer. */

    if (d.chatOpen) {
      state.chatId = d.chatOpen;
      state.chatDrawer = false;
      return render();
    }

    /* Rename a chat. */

    if (d.chatRename) {
      const c = find("chats", d.chatRename);
      return formDialog(
        L("Rename chat", "Renombrar chat"),
        [{ k: "title", label: L("Title", "Título"), value: c.title }],
        async (v) => {
          if (v.title.trim()) {
            c.title = v.title.trim();
            await DB.put("chats", c);
            render();
          }
        }
      );
    }

    /* Delete a chat and its messages (typed confirmation). */

    if (d.chatDel) {
      const c = find("chats", d.chatDel);
      return confirmTyped("BORRAR", `${L("Delete chat", "Eliminar chat")} "${c.title}"`, async () => {
        for (const m of S.chat.filter((x) => x.chatId === c.id)) await DB.del("chat", m.id);
        await DB.del("chats", c.id);
        if (state.chatId === c.id) state.chatId = null;
        render();
      });
    }

    /* Open Taylor's story. */

    if ("taylorAbout" in d) return taylorAbout();

    /* Clear every message. */

    if ("chatClear" in d) {
      for (const m of [...S.chat]) await DB.del("chat", m.id);
      return render();
    }

    /* Bring the on-device model in. */

    if ("devBring" in d) {
      const cfg = aiCfg();
      try {
        await bringTaylorIn(cfg.device.model);
        await seal(
          `modelo en el dispositivo cargado: ${Device.modelId}`,
          `on-device model loaded: ${Device.modelId}`,
          actor()
        );
      } catch (err) {
        toast(err.message, true);
      }
      return render();
    }

    /* Save the provider settings. */

    if ("aiSave" in d) {
      const c = aiCfg();
      document.querySelectorAll("[data-ai]").forEach((el) => {
        if (el.type === "radio" && !el.checked) return;
        const [g, k] = el.dataset.ai.split(".");
        c[g] = c[g] || {};
        c[g][k] = el.value.trim();
      });
      const auto = document.querySelector("[data-ai-auto]");
      if (auto) c.device.auto = auto.checked;
      const pu = document.querySelector("[data-ai-puter]");
      c.puter = { on: !!(pu && pu.checked) };
      await DB.put("settings", c);
      await seal("proveedores de Taylor actualizados", "Taylor providers updated", actor());
      toast(L("Providers saved.", "Proveedores guardados."));
      return render();
    }

    /* Test the provider ladder and report which rung answered. */

    if ("aiTest" in d) {
      toast(L("Testing the ladder…", "Probando la escalera…"));
      const r = await askTaylor([{ who: "user", text: "Reply with the single word: ready" }], null, null);
      return toast(
        `${L("Answered by", "Respondió")} ${r.name} · "${r.text.slice(0, 60)}"${r.tried.length ? ` · ${L("skipped", "omitidos")}: ${r.tried.join("; ")}` : ""}`,
        r.via === "mock"
      );
    }

    /* ---- Health, nodes ---- */

    if ("drill" in d) {
      const l4 = find("nodes", "L4");
      l4.status = "down";
      await DB.put("nodes", l4);
      await addIncident(L("Drill: L4 withdrawn, N17 assuming", "Simulacro: L4 retirado, N17 asumiendo"), "warn");
      toast(L("Drill: L4 withdrawn. N17 assuming the role…", "Simulacro: L4 retirado. N17 asumiendo el rol…"));
      render();
      setTimeout(async () => {
        l4.status = "ok";
        await DB.put("nodes", l4);
        const inc = S.incidents.find((i) => i.status === "open" && /L4/.test(i.title));
        if (inc) {
          inc.status = "resolved";
          await DB.put("incidents", inc);
        }
        await seal("simulacro F4: N17 asumió L4 en 4:12", "F4 drill: N17 assumed L4 in 4:12", actor());
        toast(
          L("Drill complete: N17 assumed L4 in 4:12. Sealed.", "Simulacro completo: N17 asumió L4 en 4:12. Sellado.")
        );
        render();
      }, 2200);
      return;
    }

    /* Drain or restore a node's traffic. */

    if (d.drain) {
      const n = find("nodes", d.drain);
      n.status = n.status === "draining" ? "ok" : "draining";
      await DB.put("nodes", n);
      await seal(
        `nodo ${n.id} ${n.status === "draining" ? "drenado" : "restaurado"}`,
        `node ${n.id} ${n.status === "draining" ? "drained" : "restored"}`,
        actor()
      );
      return render();
    }

    /* Restart a node's service. */

    if (d.restart) {
      const n = find("nodes", d.restart);
      toast(`${n.id}: ${L("restarting service…", "reiniciando servicio…")}`);
      setTimeout(async () => {
        n.tempC = Math.max(58, n.tempC - 12);
        n.status = "ok";
        await DB.put("nodes", n);
        await seal(`servicio reiniciado en ${n.id}`, `service restarted on ${n.id}`, actor());
        render();
      }, 1500);
      return;
    }

    /* Hand a node's role to N17. */

    if (d.hand) {
      const n = find("nodes", d.hand);
      const n17 = find("nodes", "N17");
      n17.role = n.role + " (assumed)";
      n.role = "spare";
      await DB.put("nodes", n);
      await DB.put("nodes", n17);
      await seal(`rol de ${n.id} pasado a N17`, `role of ${n.id} handed to N17`, actor());
      toast(L("Role handed to N17. Sealed.", "Rol pasado a N17. Sellado."));
      return render();
    }

    /* Retire a node (typed confirmation). */

    if (d.retire) {
      const n = find("nodes", d.retire);
      return confirmTyped("RETIRAR " + n.id, `${L("Retire node", "Retirar nodo")} ${n.id}`, async () => {
        n.status = "down";
        n.role = "retired";
        await DB.put("nodes", n);
        await seal(`nodo ${n.id} retirado; N17 asumió`, `node ${n.id} retired; N17 assumed`, actor());
        toast(`${n.id} ${L("retired. Sealed.", "retirado. Sellado.")}`);
        go("salud");
      });
    }

    /* ---- Energy ---- */

    if ("island" in d) {
      const p = S.power[0];
      if (!p.islanded)
        return confirmTyped(
          L("ISLAND", "ISLA"),
          L("Island mode (disconnect from grid)", "Modo isla (desconectar de la red)"),
          async () => {
            p.islanded = true;
            p.grid = "islanded";
            await DB.put("power", p);
            await seal("modo isla activado", "island mode engaged", actor());
            toast(L("Islanded. Sealed.", "En isla. Sellado."));
            render();
          }
        );
      p.islanded = false;
      p.grid = "standby";
      await DB.put("power", p);
      await seal("reconexión a red", "grid reconnect", actor());
      toast(L("Reconnected to grid. Sealed.", "Reconectado a la red. Sellado."));
      return render();

      /* [TIE-IN: inverter/gateway API] */

    }

    /* ---- Configuration planner and catalog ---- */

    if (d.cfg) {
      const [k, v] = d.cfg.split(":");
      state.plan = { ...cfgOf(), [k]: isNaN(+v) ? v : +v };
      return render();
    }

    /* Configuration planner: the October 512 GB override. */

    if ("cfgOct" in d) {
      const p = { ...cfgOf() };
      p.memory = p.memory === 512 ? 256 : 512;
      if (p.memory === 512) p.silicon = "m5u";
      state.plan = p;
      return render();
    }

    /* Configuration planner: back to installed. */

    if ("cfgReset" in d) {
      state.plan = null;
      const doc = S.settings.find((x) => x.id === "config");
      if (doc) {
        doc.target = { ...doc.installed };
        await DB.put("settings", doc);
      }
      return render();
    }

    /* Save the plan as the target configuration (typed confirmation, sealed). */

    if ("cfgSave" in d) {
      const plan = { ...cfgOf() };
      return confirmTyped(
        "OBJETIVO",
        L(
          "Save this plan as the target configuration? It becomes the bill of materials.",
          "¿Guardar este plan como configuración objetivo? Se convierte en la lista de materiales."
        ),
        async () => {
          const doc = S.settings.find((x) => x.id === "config") || { id: "config", installed: INSTALLED };
          doc.target = plan;
          await DB.put("settings", doc);
          state.plan = null;
          await seal(
            `configuración objetivo guardada: ${HW.silicon[plan.silicon].name} ${plan.memory} GB × ${plan.nodes}`,
            `target configuration saved: ${HW.silicon[plan.silicon].name} ${plan.memory} GB × ${plan.nodes}`,
            actor()
          );
          toast(L("Target configuration saved and sealed.", "Configuración objetivo guardada y sellada."));
          render();
        }
      );
    }

    /* Catalog: choose the precision. */

    if (d.bits) {
      state.bits = +d.bits;
      return render();
    }

    /* Catalog: stage a model for the installer's download step. */

    if (d.catStage) {
      const m = MODELS.find((x) => x.id === d.catStage);
      const ins = S.installer[0];
      ins.staged = [...new Set([...(ins.staged || []), m.name])];
      await DB.put("installer", ins);
      await seal(`modelo preparado para descarga: ${m.name}`, `model staged for download: ${m.name}`, actor());
      return toast(
        `${m.name}: ${L("staged for the installer's model step, sealed.", "preparado para el paso de modelos del instalador, sellado.")}`
      );
    }

    /* Run the UPS self-test, sealed. */

    if ("upsTest" in d) {
      const p = S.power[0];
      toast(L("Self-test running: on battery for ten seconds…", "Autoprueba en curso: en batería por diez segundos…"));
      setTimeout(async () => {
        p.upsTestedAt = nowISO();
        await DB.put("power", p);
        await seal("autoprueba de UPS completada", "UPS self-test completed", actor());
        toast(L("Self-test passed and sealed.", "Autoprueba superada y sellada."));
        render();
      }, 1500);
      return;
    }

    /* Toggle solar curtailment. */

    if ("curtail" in d) {
      const p = S.power[0];
      p.curtail = !p.curtail;
      await DB.put("power", p);
      await seal(
        `recorte solar ${p.curtail ? "activado" : "desactivado"}`,
        `solar curtailment ${p.curtail ? "on" : "off"}`,
        actor()
      );
      return render();
    }

    /* ---- Incidents ---- */

    if ("incNew" in d)
      return formDialog(
        L("Open an incident", "Abrir incidente"),
        [
          { k: "title", label: L("Title", "Título") },
          {
            k: "sev",
            label: L("Severity", "Severidad"),
            type: "select",
            value: "warn",
            options: [
              ["ok", "info"],
              ["warn", "warn"],
              ["crit", "crit"],
            ],
          },
        ],
        async (v) => {
          if (!v.title) return;
          await addIncident(v.title, v.sev);
          await seal(`incidente abierto: ${v.title}`, `incident opened: ${v.title}`, actor());
          render();
        }
      );

    /* Attend an incident. */

    if (d.attend) {
      const i = find("incidents", d.attend);
      i.status = "attending";
      i.assignee = actor();
      await DB.put("incidents", i);
      await seal(`incidente atendido: ${i.title}`, `incident attended: ${i.title}`, actor());
      return render();
    }

    /* Resolve an incident. */

    if (d.resolve) {
      const i = find("incidents", d.resolve);
      i.status = "resolved";
      await DB.put("incidents", i);
      await seal(`incidente resuelto: ${i.title}`, `incident resolved: ${i.title}`, actor());
      return render();
    }

    /* Reopen an incident. */

    if (d.incReopen) {
      const i = find("incidents", d.incReopen);
      i.status = "open";
      await DB.put("incidents", i);
      await seal(`incidente reabierto: ${i.title}`, `incident reopened: ${i.title}`, actor());
      return render();
    }

    /* Escalate an incident to critical. */

    if (d.incEscalate) {
      const i = find("incidents", d.incEscalate);
      i.sev = "crit";
      await DB.put("incidents", i);
      await seal(`incidente escalado: ${i.title}`, `incident escalated: ${i.title}`, actor());
      return render();

      /* [TIE-IN: incident bus] page the on-call */

    }

    /* ---- Update ---- */

    if ("updgo" in d) {
      const u = S.updates[0];
      u.stage = Math.min(3, u.stage + 1);
      await DB.put("updates", u);
      await seal(`actualización ${u.version}: etapa ${u.stage}`, `update ${u.version}: stage ${u.stage}`, actor());
      return render();
    }

    /* Pause or continue the update. */

    if ("updpause" in d) {
      const u = S.updates[0];
      u.paused = !u.paused;
      await DB.put("updates", u);
      await seal(
        `actualización ${u.paused ? "pausada" : "reanudada"}`,
        `update ${u.paused ? "paused" : "resumed"}`,
        actor()
      );
      return render();
    }

    /* Revert the update (typed confirmation). */

    if (d.updRevert)
      return confirmTyped("REVERTIR", `${L("Revert to", "Revertir a")} ${d.updRevert}`, async () => {
        const u = S.updates[0];
        u.history.unshift(u.version);
        u.version = "ARC " + d.updRevert.split(" ")[0];
        u.stage = 0;
        await DB.put("updates", u);
        await seal(`reversa de actualización a ${d.updRevert}`, `update reverted to ${d.updRevert}`, actor());
        render();
      });

    /* ---- Settings ---- */

    if ("userNew" in d)
      return formDialog(
        L("Add user", "Agregar usuario"),
        [
          { k: "id", label: L("User id", "Usuario") },
          { k: "name", label: L("Name", "Nombre") },
          {
            k: "role",
            label: L("Role", "Rol"),
            type: "select",
            value: "operator",
            options: Object.keys(ROLES).map((r) => [r, t(ROLES[r].label)]),
          },
        ],
        async (v) => {
          if (!v.id) return;
          await DB.put("users", { id: v.id.trim(), name: v.name, role: v.role, createdAt: nowISO() });
          await seal(`usuario creado: ${v.id} (${v.role})`, `user created: ${v.id} (${v.role})`, actor());
          render();
        }
      );

    /* Change a user's role. */

    if (d.userRole) {
      const u = find("users", d.userRole);
      return formDialog(
        u.id,
        [
          {
            k: "role",
            label: L("Role", "Rol"),
            type: "select",
            value: u.role,
            options: Object.keys(ROLES).map((r) => [r, t(ROLES[r].label)]),
          },
        ],
        async (v) => {
          u.role = v.role;
          await DB.put("users", u);
          await seal(`rol cambiado: ${u.id} → ${v.role}`, `role changed: ${u.id} → ${v.role}`, actor());
          render();
        }
      );
    }

    /* Remove a user (typed confirmation). */

    if (d.userDel) {
      const u = find("users", d.userDel);
      return confirmTyped("QUITAR", `${L("Remove user", "Quitar usuario")} ${u.id}`, async () => {
        await DB.del("users", u.id);
        await seal(`usuario eliminado: ${u.id}`, `user removed: ${u.id}`, actor());
        render();
      });
    }

    /* Revoke a user's token. */

    if (d.userToken) {
      const u = find("users", d.userToken);
      u.token = null;
      await DB.put("users", u);
      await seal(`token revocado: ${u.id}`, `token revoked: ${u.id}`, actor());
      return render();
    }

    /* ---- Policies ---- */

    if (d.polView) {
      const [id, v] = d.polView.split(":");
      return openPolicyVersion(id, v);
    }

    /* Open the editor for a new policy version. */

    if (d.polEdit) {
      if (!isAdmin()) return toast(L("Administrators only.", "Solo administradores."), true);
      state.policyEdit = d.polEdit;
      state.policyText = "";
      state.policyMajor = false;
      return render();
    }

    /* Show or hide a policy's history. */

    if (d.polHistory) {
      state.policyHistory = state.policyHistory === d.polHistory ? null : d.polHistory;
      return render();
    }

    /* Close the policy editor. */

    if ("polCancel" in d) {
      state.policyEdit = null;
      state.policyText = "";
      return render();
    }

    /* Start the editor from the current text. */

    if ("polLoad" in d) {
      state.policyText = policyOf(state.policyEdit).text;
      return render();
    }

    /* Paste the clipboard into the editor. */

    if ("polPaste" in d) {
      try {
        state.policyText = await navigator.clipboard.readText();
      } catch {
        toast(
          L("Clipboard not available; paste into the box.", "Portapapeles no disponible; pegue en el cuadro."),
          true
        );
      }
      return render();
    }

    /* Publish the policy with the authenticator, sealed. */

    if ("polPublish" in d) {
      const id = state.policyEdit;
      const p = policyOf(id);
      const cmp = comparePolicy(p.text, state.policyText || "");
      if (cmp.identical || cmp.chars < 200) return;
      const v = nextVersion(p.version, state.policyMajor);
      const ok = await authenticate(`${L("Publish", "Publicar")} ${POLICY_META()[id].name} v${v}`);
      if (!ok) return toast(L("Not approved; nothing was published.", "No aprobado; nada se publicó."), true);
      p.history.push({
        version: p.version,
        text: p.text,
        lang: p.lang,
        hash: p.hash,
        publishedAt: p.publishedAt,
        publishedBy: p.publishedBy,
      });
      p.version = v;
      p.text = state.policyText.trim();
      p.lang = state.policyLang || "es";
      p.hash = await sha256(p.text);
      p.publishedAt = nowISO();
      p.publishedBy = actor();
      await DB.put("policies", p);
      if (id === "guardrails") {
        const s = S.settings[0];
        s.guardrailsVersion = v;
        await DB.put("settings", s);
      }
      if (id === "terms") {
        const s = S.settings[0];
        s.termsVersion = v;
        await DB.put("settings", s);
      }
      await seal(
        `${POLICY_META()[id].name} v${v} publicada con aprobación del autenticador (+${cmp.added.length} −${cmp.removed.length} líneas)`,
        `${POLICY_META()[id].name} v${v} published with authenticator approval (+${cmp.added.length} −${cmp.removed.length} lines)`,
        actor(),
        { key: id, docHash: p.hash }
      );
      state.policyEdit = null;
      state.policyText = "";
      toast(`${POLICY_META()[id].name} v${v} ${L("published and sealed.", "publicada y sellada.")}`);
      return render();
    }

    /* Restore a previous policy version (typed confirmation and authenticator). */

    if (d.polRevert) {
      const [id, v] = d.polRevert.split(":");
      const p = policyOf(id);
      const h = p.history.find((x) => x.version === v);
      if (!h) return;
      return confirmTyped("RESTAURAR", `${L("Restore", "Restaurar")} ${POLICY_META()[id].name} v${v}`, async () => {
        const ok = await authenticate(`${L("Restore", "Restaurar")} ${POLICY_META()[id].name} v${v}`);
        if (!ok) return;
        p.history.push({
          version: p.version,
          text: p.text,
          lang: p.lang,
          hash: p.hash,
          publishedAt: p.publishedAt,
          publishedBy: p.publishedBy,
        });
        p.history = p.history.filter((x) => x !== h);
        Object.assign(p, {
          version: nextVersion(p.version, false),
          text: h.text,
          lang: h.lang,
          hash: h.hash,
          publishedAt: nowISO(),
          publishedBy: actor(),
        });
        await DB.put("policies", p);
        await seal(
          `${POLICY_META()[id].name}: texto de v${v} restaurado como v${p.version}`,
          `${POLICY_META()[id].name}: text of v${v} restored as v${p.version}`,
          actor(),
          { key: id }
        );
        render();
      });
    }

    /* (legacy) publish a guardrails version. */

    if ("guardBump" in d) {
      const s = S.settings[0];
      return confirmTyped(
        "PUBLICAR",
        L("Publish a new guardrails version", "Publicar nueva versión de guardarraíles"),
        async () => {
          s.guardrailsVersion = (parseFloat(s.guardrailsVersion) + 0.1).toFixed(1);
          await DB.put("settings", s);
          await seal(
            `guardarraíles v${s.guardrailsVersion} publicados`,
            `guardrails v${s.guardrailsVersion} published`,
            actor()
          );
          render();
        }
      );
    }

    /* (legacy) publish a terms version. */

    if ("termsBump" in d) {
      const s = S.settings[0];
      s.termsVersion = (parseFloat(s.termsVersion) + 0.1).toFixed(1);
      await DB.put("settings", s);
      await seal(`términos v${s.termsVersion} publicados`, `terms v${s.termsVersion} published`, actor());
      return render();
    }

    /* Toggle the human-approval policy; turning it off needs a typed confirmation. */

    if ("human" in d) {
      const s = S.settings[0];
      if (s.humanApproval)
        return confirmTyped(
          "HUMANO",
          L(
            "Turning this off lets batches run without a human request. Are you sure?",
            "Apagar esto permite lotes sin petición humana. ¿Seguro?"
          ),
          async () => {
            s.humanApproval = false;
            await DB.put("settings", s);
            await seal("aprobación humana desactivada", "human approval disabled", actor());
            render();
          }
        );
      s.humanApproval = true;
      await DB.put("settings", s);
      await seal("aprobación humana activada", "human approval enabled", actor());
      return render();
    }

    /* ---- Profile ---- */

    if ("tokenRotate" in d) {
      const u = find("users", actor()) || { id: actor(), name: actor(), role: state.role };
      u.token = "brg_" + uid().replace(/-/g, "").slice(0, 24);
      await DB.put("users", u);
      await seal("token de API rotado", "API token rotated", actor());
      return render();
    }

    /* ---- Installer ---- */

    if ("insback" in d) {
      const i = S.installer[0];
      i.step = Math.max(1, i.step - 1);
      await DB.put("installer", i);
      return render();
    }

    /* Installer: next step, or sign and seal the burn-in report at the end. */

    if ("insnext" in d) {
      const i = S.installer[0];
      if (i.step < 6) {
        i.step++;
        await DB.put("installer", i);
        return render();
      }
      i.done = true;
      await DB.put("installer", i);
      await seal("reporte de prueba de fuego firmado", "burn-in report signed", "instalador");
      toast(
        L(
          "Burn-in report signed and sealed. Bridge is ready.",
          "Reporte de prueba firmado y sellado. Bridge está listo."
        )
      );
      return go("login");
    }

    /* ---- Integrations wizard ---- */

    if ("wizStart" in d) {
      state.wiz = { step: 1, family: null, template: null, values: {}, test: null, mapping: {}, dry: null };
      return render();
    }

    /* API wizard: choose a family. */

    if (d.wizFamily) {
      state.wiz.family = d.wizFamily;
      state.wiz.template = null;
      return render();
    }

    /* API wizard: choose a template. */

    if (d.wizTemplate) {
      state.wiz.template = d.wizTemplate;
      state.wiz.values = {};
      state.wiz.test = null;
      state.wiz.dry = null;
      return render();
    }

    /* API wizard: back a step, or leave at step one. */

    if ("wizBack" in d) {
      if (state.wiz.step === 1) return back();
      state.wiz.step -= 1;
      return render();
    }

    /* API wizard: next step. */

    if ("wizNext" in d) {
      state.wiz.step = Math.min(7, state.wiz.step + 1);
      return render();
    }

    /* API wizard: paste the clipboard into a field. */

    if (d.wizPaste) {
      try {
        const txt = await navigator.clipboard.readText();
        state.wiz.values[d.wizPaste] = txt.trim();
      } catch {
        toast(L("Clipboard not available; type the value.", "Portapapeles no disponible; escriba el valor."), true);
      }
      return render();
    }

    /* API wizard: copy a field. */

    if (d.copyField) {
      await navigator.clipboard?.writeText(state.wiz.values[d.copyField] || "");
      return toast(L("Copied", "Copiado"));
    }

    /* API wizard: run the mock test call. */

    if ("wizTest" in d) {
      const fam = FAMILIES.find((f) => f.id === state.wiz.family);
      const tpl = fam.templates.find((x) => x.id === state.wiz.template);
      state.wiz.test = mockTest(tpl, state.wiz.values);
      await seal(
        `prueba de API: ${tpl.name} · ${state.wiz.test.ok ? "OK" : "falló"}`,
        `API test: ${tpl.name} · ${state.wiz.test.ok ? "OK" : "failed"}`,
        actor()
      );
      return render();

      /* [TIE-IN: integration hub] one read-only call through the cluster's egress gateway */

    }

    /* API wizard: run the dry run against both databases. */

    if ("wizDry" in d) {
      const fam = FAMILIES.find((f) => f.id === state.wiz.family);
      const tpl = fam.templates.find((x) => x.id === state.wiz.template);
      state.wiz.dry = Object.keys(tpl.record).map((k) => {
        const ext = tpl.record[k];
        const path = state.wiz.mapping[k] ?? tpl.map[k];
        const cl = path ? clusterValue(path) : undefined;
        return { k, ext, cl, res: cl === undefined ? "miss" : String(cl) === String(ext) ? "same" : "diff" };
      });
      return render();
    }

    /* API wizard: commit and seal; secrets go to the key store. */

    if ("wizCommit" in d) {
      const fam = FAMILIES.find((f) => f.id === state.wiz.family);
      const tpl = fam.templates.find((x) => x.id === state.wiz.template);
      const name = document.querySelector("[data-wiz-name]").value.trim() || tpl.name;
      const safe = Object.fromEntries(
        tpl.fields.filter(([, type]) => type !== "secret" && type !== "pem").map(([k]) => [k, state.wiz.values[k]])
      );
      const rec = {
        id: uid(),
        family: fam.id,
        template: tpl.name,
        name,
        status: "ok",
        endpoint: safe.endpoint || safe.issuer || safe.host || safe.webhookUrl || "",
        lastTest: nowISO(),
        fields: safe,
        mapping: { ...tpl.map, ...state.wiz.mapping },
        createdAt: nowISO(),
      };
      await DB.put("integrations", rec);
      await seal(`integración conectada: ${name}`, `integration connected: ${name}`, actor(), { key: fam.id });
      state.wiz = null;
      toast(
        L(
          "Connected and sealed. Secrets went to the key store.",
          "Conectada y sellada. Los secretos fueron al almacén de llaves."
        )
      );
      return go("integracion", { id: rec.id }, true);

      /* [TIE-IN: secrets] POST /keystore with the secret fields; only non-secret fields persist here */

    }

    /* Test a connected API. */

    if (d.intTest) {
      const i = find("integrations", d.intTest);
      const r = mockTest({ record: {} }, i.fields);
      i.status = r.ok ? "ok" : "warn";
      i.lastTest = nowISO();
      await DB.put("integrations", i);
      await seal(
        `prueba de integración: ${i.name} · ${r.ok ? "OK" : "falló"}`,
        `integration test: ${i.name} · ${r.ok ? "OK" : "failed"}`,
        actor()
      );
      toast(r.ok ? `${i.name}: OK · ${r.ms} ms` : `${i.name}: ${r.error}`, !r.ok);
      return render();
    }

    /* Validate a pasted record against both databases. */

    if (d.intValidate) return validateRecordDialog(find("integrations", d.intValidate));

    /* Edit a connected API's mapping. */

    if (d.intRemap) {
      const i = find("integrations", d.intRemap);
      const fields = Object.entries(i.mapping || {}).map(([k, v]) => ({ k, label: k, value: v }));
      return formDialog(L("Edit mapping", "Editar mapeo"), fields, async (v) => {
        i.mapping = v;
        await DB.put("integrations", i);
        await seal(`mapeo editado: ${i.name}`, `mapping edited: ${i.name}`, actor());
        render();
      });
    }

    /* Test every connected API. */

    if ("intTestAll" in d) {
      let ok = 0;
      for (const i of S.integrations) {
        const r = mockTest({ record: {} }, i.fields);
        i.status = r.ok ? "ok" : "warn";
        i.lastTest = nowISO();
        if (r.ok) ok++;
        await DB.put("integrations", i);
      }
      await seal(
        `prueba de todas las conexiones: ${ok}/${S.integrations.length} OK`,
        `all connections tested: ${ok}/${S.integrations.length} OK`,
        actor()
      );
      toast(`${ok}/${S.integrations.length} OK`, ok < S.integrations.length);
      return render();
    }

    /* Disconnect an API (typed confirmation). */

    if (d.intDel) {
      const i = find("integrations", d.intDel);
      return confirmTyped("DESCONECTAR", `${L("Disconnect", "Desconectar")} ${i.name}`, async () => {
        await DB.del("integrations", i.id);
        await seal(`integración desconectada: ${i.name}`, `integration disconnected: ${i.name}`, actor());
        if (state.route === "integracion") back();
        else render();
      });
    }
  } catch (err) {
    console.error(err);
    toast(L("Something failed: ", "Algo falló: ") + err.message, true);
  }
});

/* Keyboard: Escape closes notices and dialogs; Enter activates a focused card. */

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.querySelectorAll(".notice, .notice-veil").forEach((n) => n.remove());
    document.querySelectorAll("dialog[open]").forEach((dg) => {
      dg.close();
      dg.remove();
    });
  }
  if (e.key === "Enter" && e.target.matches("[role=button][data-open]")) e.target.click();
});

/* inputs: search filters, wizard fields and mappings, the reserve slider, file import */

app.addEventListener("input", async (e) => {
  const el = e.target;
  if (el.matches("[data-filter]")) {
    state.filter = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector("[data-filter]");
    if (again) {
      again.focus();
      again.setSelectionRange(pos, pos);
    }
    return;
  }
  if (el.matches("[data-wiz-field]")) {
    state.wiz.values[el.dataset.wizField] = el.value;
    state.wiz.test = null;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector(`[data-wiz-field="${el.dataset.wizField}"]`);
    if (again) {
      again.focus();
      try {
        again.setSelectionRange(pos, pos);
      } catch {}
    }
    return;
  }
  if (el.matches("[data-wiz-map]")) {
    state.wiz.mapping[el.dataset.wizMap] = el.value;
    state.wiz.dry = null;
    return;
  }
  if (el.matches("[data-wiz-name]")) {
    state.wiz.name = el.value;
    return;
  }
  if (el.matches("[data-st-field]")) {
    const k = el.dataset.stField;
    if (k === "scopeId") return;
    state.studio[k] = el.value;
    if (k === "instructions") {
      const pos = el.selectionStart;
      render();
      const again = document.querySelector('[data-st-field="instructions"]');
      if (again) {
        again.focus();
        try {
          again.setSelectionRange(pos, pos);
        } catch {}
      }
    } else if (el.tagName === "SELECT") render();
    return;
  }
  if (el.matches("[data-pol-text]")) {
    state.policyText = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector("[data-pol-text]");
    if (again) {
      again.focus();
      try {
        again.setSelectionRange(pos, pos);
      } catch {}
    }
    return;
  }
  if (el.matches("[data-pol-major]")) {
    state.policyMajor = el.checked;
    return render();
  }
  if (el.matches("[data-pol-lang]")) {
    state.policyLang = el.value;
    return;
  }
  if (el.matches("[data-reserve]")) {
    const p = S.power[0];
    p.reservePct = +el.value;
    const lbl = document.getElementById("resLbl");
    if (lbl) lbl.textContent = p.reservePct + "%";
    clearTimeout(state._resT);
    state._resT = setTimeout(async () => {
      await DB.put("power", p);
      await seal(`piso de reserva ${p.reservePct}%`, `reserve floor ${p.reservePct}%`, actor());
    }, 600);
    return;

    /* [TIE-IN: inverter API] debounced */

  }
});

/* Inputs: search filters, wizard fields and mappings, the reserve slider, AgentStudio fields, the policy editor. */

app.addEventListener("change", async (e) => {
  if (e.target.matches("[data-topo-view]")) {
    const t = S.topology[0] || { id: "main" };
    t.view = e.target.value;
    await DB.put("topology", t);
    return render();
  }
  if (e.target.matches('[data-st-field="scopeId"]')) {
    state.studio.scope.id = e.target.value;
    return render();
  }
  if (e.target.matches("[data-import-db]")) {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const json = JSON.parse(await f.text());
      await DB.import(json);
      toast(L("Imported.", "Importado."));
      render();
    } catch {
      toast(L("That file is not a Bridge export.", "Ese archivo no es una exportación de Bridge."), true);
    }
  }
});

/* Form submits: Taylor's chat, the studio assistant's question box, and the file restore. */

app.addEventListener("submit", async (e) => {
  if (e.target.matches("[data-chatform]")) {
    e.preventDefault();
    if (state.chatPending) return;
    const input = e.target.querySelector("input");
    const msg = input.value.trim();
    if (!msg) return;
    const chatId = await ensureChat();
    const c = find("chats", chatId);
    if (c.title === L("New chat", "Chat nuevo") || c.title === "New chat" || c.title === "Chat nuevo") {
      c.title = msg.slice(0, 40);
    }
    c.updatedAt = nowISO();
    await DB.put("chats", c);
    await DB.put("chat", { id: uid(), chatId, who: "user", text: msg, at: nowISO() });
    input.value = "";
    state.chatPending = { text: "", status: L("Thinking…", "Pensando…") };
    render();
    const history = S.chat.filter((m) => m.chatId === chatId).sort((a, b) => a.at.localeCompare(b.at));
    const r = await askTaylor(
      history,
      (partial) => {
        state.chatPending.text = partial;
        const live = document.getElementById("chatLive");
        if (live) live.textContent = partial;
        const log = document.getElementById("chatLog");
        if (log) log.scrollTop = log.scrollHeight;
      },
      (st) => {
        state.chatPending.status = st;
        const el = document.getElementById("chatStatus");
        if (el) el.textContent = st;
      }
    );
    await DB.put("chat", {
      id: uid(),
      chatId,
      who: "ai",
      text: r.text,
      at: nowISO(),
      via: r.via,
      viaName: r.name,
      left: r.left,
    });
    state.chatPending = null;
    render();
    const log = document.getElementById("chatLog");
    if (log) log.scrollTop = log.scrollHeight;
    return;

    /* [TIE-IN: ARC inference gateway] */

  }
  if (e.target.matches("[data-st-ask]")) {
    e.preventDefault();
    const input = e.target.querySelector("input");
    const q = input.value.trim();
    if (!q) return;
    const r = studioReply(q, state.studio);
    state.studio.chat.push({ who: "user", text: q }, { who: "ai", text: r.text });
    if (r.add) state.studio.instructions = (state.studio.instructions.trim() + "\n" + r.add).trim();
    return render();

    /* [TIE-IN: ARC inference gateway] */

  }
});

/* Live tick: solar drift and battery float so the screens breathe. [TIE-IN: telemetry stream] */

setInterval(async () => {
  const p = S.power[0];
  if (!p || !state.role) return;
  if (!p.islanded) p.solarKW = Math.max(3.2, Math.min(4.6, p.solarKW + (Math.random() - 0.5) * 0.2));
  else p.batteryPct = Math.round(Math.max(p.reservePct, p.batteryPct - 0.1) * 10) / 10;
  if (["home", "salud", "energia"].includes(state.route) && !document.querySelector("dialog[open]")) render();
}, 5000);

/* ==========================================================================
   SECTION 9 · BOOT · what happens when the page opens
   FOR THE NOVICE: open the database, load every card into S, seed if empty,
   then draw the first screen. If the database cannot open (a very old
   browser, or private mode with storage disabled) the page says so plainly.
   ========================================================================== */

(async () => {
  try {
    await DB.open();
    await DB.load();
    await seed();
    await seedPolicies();
    await seedEnterprise();
  } catch (err) {
    document.getElementById("app").innerHTML =
      `<main style="padding:40px"><h1>Bridge</h1><p>${esc(L("The browser database could not be opened: ", "No se pudo abrir la base de datos del navegador: "))}${esc(err.message)}</p></main>`;
    return;
  }
  render();
})();
</script>
