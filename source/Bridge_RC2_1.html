  READING GUIDE (start here if you are new to this)
    The whole application is one web page. There is no server; the page
    keeps its records in the browser's own database (IndexedDB) and draws
    every screen from those records.
    Three ideas explain everything:
      1. STATE  · `S` holds copies of every record (accounts, invoices, ...).
                  `state` holds where you are (which screen, which language,
                  which role) and what you have typed.
      2. RENDER · Every screen is a function that turns S and state into a
                  string of HTML. render() puts that string on the page.
                  Screens never change data; they only show it.
      3. EVENTS · One listener at the bottom watches every tap. It reads the
                  `data-*` attribute on what was tapped, changes the record,
                  saves it (DB.put), seals it (seal), shows a notice (toast),
                  and calls render() so the screen catches up.
    So to add a feature: give a button a data-attribute in a screen,
    handle that attribute in SECTION 8, and save whatever changed.

/* ==========================================================================
   SECTION 2 · DB · IndexedDB document store, seed data, hash chain
   --------------------------------------------------------------------------
   FOR THE NOVICE: IndexedDB is a database built into every browser. Think of
   it as folders (stores) of index cards (documents), each card with an `id`.
   S is a copy of every card in memory, so screens can read instantly;
   DB.put writes a card to both the copy and the database. seed() fills an
   empty database with a plausible bank so the demo has something to show.
   One store per collection, every document keyed by `id`. S mirrors the
   database in memory so renders are synchronous; every mutation goes through
   put()/del(), which write both. export()/import()/reset() under Datos.
   The ledger is a hash chain: seal() computes SHA-256 over
   (prevHash + timestamp + actor + payload); the dossier export verifies it.
   [TIE-IN: ARC persistence] in production these collections are views over the cluster's SQLite/Postgres.
   ========================================================================== */

const STORES = [
  "accounts",
  "invoices",
  "agents",
  "models",
  "ledger",
  "incidents",
  "nodes",
  "power",
  "updates",
  "users",
  "settings",
  "chat",
  "integrations",
  "jobs",
  "installer",
  "policies",
  "chats",
  "suppliers",
  "pos",
  "receipts",
  "bankrecs",
  "cases",
  "stores",
  "sites",
  "topology",
];

/* in-memory mirror */

const S = Object.fromEntries(STORES.map((s) => [s, []]));

/* The database module: opens IndexedDB, mirrors it into S, and exposes put, del, clearAll, export, import. */

const DB = (() => {
  let db;
  const open = () =>
    new Promise((res, rej) => {
      const r = indexedDB.open("bridge", 5);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: "id" });
      };
      r.onsuccess = () => {
        db = r.result;
        res(db);
      };
      r.onerror = () => rej(r.error);
    });
  const tx = (store, mode, fn) =>
    new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && "result" in q ? q.result : q);
      t.onerror = () => rej(t.error);
    });
  return {
    open,
    async load() {
      for (const s of STORES) S[s] = await tx(s, "readonly", (o) => o.getAll());
    },
    async put(store, doc) {
      const i = S[store].findIndex((d) => d.id === doc.id);
      if (i >= 0) S[store][i] = doc;
      else S[store].push(doc);
      await tx(store, "readwrite", (o) => o.put(doc));
      return doc;
    },
    async del(store, id) {
      S[store] = S[store].filter((d) => d.id !== id);
      await tx(store, "readwrite", (o) => o.delete(id));
    },
    async clearAll() {
      for (const s of STORES) {
        S[s] = [];
        await tx(s, "readwrite", (o) => o.clear());
      }
    },
    export() {
      return {
        schema: "armada-bridge",
        version: "0.2",
        exportedAt: new Date().toISOString(),
        ...Object.fromEntries(STORES.map((s) => [s, S[s]])),
      };
    },
    async import(json) {
      for (const s of STORES) if (Array.isArray(json[s])) for (const d of json[s]) await this.put(s, d);
    },
  };
})();

/* A unique id for a new record: the browser's UUID when available, a random string otherwise. */

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2));

/* The current moment as an ISO-8601 string, the timestamp format used on every record. */

const nowISO = () => new Date().toISOString();

/* Turns an ISO timestamp into HH:MM for compact display. */

const hhmm = (iso) => new Date(iso).toTimeString().slice(0, 5);

/* Today's date as YYYY-MM-DD, used in file names and daily figures. */

const today = () => nowISO().slice(0, 10);

/** SHA-256 for the chain. WebCrypto when the page is a secure context; a compact pure-JS SHA-256 otherwise
    (http:// on the LAN, some file:// cases), so the chain is the same algorithm everywhere. */

async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  if (globalThis.crypto?.subtle) {
    const b = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  return sha256js(bytes);
}

/* Pure-JavaScript SHA-256, used only when WebCrypto is unavailable (plain http:// pages); byte-for-byte the same digest. */

function sha256js(msg) {
  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98,
    0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
    0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8,
    0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819,
    0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
    0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7,
    0xc67178f2,
  ];
  let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const l = msg.length;
  const padded = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  padded.set(msg);
  padded[l] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 4, (l * 8) >>> 0);
  dv.setUint32(padded.length - 8, Math.floor((l * 8) / 4294967296));
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const W = new Uint32Array(64);
  for (let i = 0; i < padded.length; i += 64) {
    for (let j = 0; j < 16; j++) W[j] = dv.getUint32(i + j * 4);
    for (let j = 16; j < 64; j++) {
      const s0 = rotr(W[j - 15], 7) ^ rotr(W[j - 15], 18) ^ (W[j - 15] >>> 3);
      const s1 = rotr(W[j - 2], 17) ^ rotr(W[j - 2], 19) ^ (W[j - 2] >>> 10);
      W[j] = (W[j - 16] + s0 + W[j - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let j = 0; j < 64; j++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[j] + W[j]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g;
      g = f;
      f = e;
      e = (d + t1) >>> 0;
      d = c;
      c = b;
      b = a;
      a = (t1 + t2) >>> 0;
    }
    H = H.map((v, k) => (v + [a, b, c, d, e, f, g, h][k]) >>> 0);
  }
  return H.map((v) => v.toString(16).padStart(8, "0")).join("");
}

/** Seed: a plausible bank in operation. Idempotent; runs only when the ledger is empty. */

async function seed() {
  if (S.ledger.length) return;
  const accounts = [
    ["Distribuidora Norte SA", "…8C2F-41A7", "10:30", "ok"],
    ["Grupo Lomas", "…77B1-0D93", "11:00", "rep"],
    ["Aceros del Bravo", "…1F44-9AC2", "09:15", "ok"],
    ["Servicios Cumbre", "…C0D8-52E1", "16:40", "nores"],
    ["Cementos Valle", "…A1B2-3C4D", "12:10", "ok"],
    ["Farmacias Delta", "…9E8F-7A6B", "15:00", "rep"],
  ];
  for (const [name, uuid, next, st] of accounts)
    await DB.put("accounts", {
      id: uid(),
      name,
      uuid,
      next,
      status: st,
      touchesToday: st === "nores" ? 2 : 1,
      paused: false,
      escalated: st === "nores",
      history: [],
    });
  const stages = ["issued", "confirmed", "paid", "rep_pending", "rep_sealed"];
  const nums = [312, 298, 141, 37, 104];
  let n = 0;
  for (let i = 0; i < 5; i++)
    for (let k = 0; k < Math.min(8, nums[i]); k++)
      await DB.put("invoices", {
        id: uid(),
        uuid: "3F2A-" + (1000 + n++).toString(16).toUpperCase(),
        client: accounts[k % accounts.length][0],
        stage: stages[i],
        amount: 12000 + ((n * 731) % 90000),
        issued: today(),
        repDay: i === 3 ? 1 + (k % 4) : 0,
      });
  for (const [name, stage] of [
    ["Grupo Lomas", 3],
    ["Cementos Valle", 2],

/** Seal one event to the chain. Returns the entry.
    FOR THE NOVICE: a hash is a fingerprint of some text. Each sealed event stores the fingerprint of the
    previous event plus its own, so changing any old event would break every fingerprint after it.
    That is what makes the chain tamper-evident, and what verifyChain() checks. */

async function seal(es, en, actor, extra = {}, id) {
  for (const k of ["id", "seq", "at", "actor", "es", "en", "prevHash", "hash"])
    if (k in extra) {
      extra["x_" + k] = extra[k];
      delete extra[k];

      /* reserved names stay reserved */

    }
  const prev = S.ledger.length ? S.ledger.reduce((a, b) => (a.seq > b.seq ? a : b)) : null;
  const seq = prev ? prev.seq + 1 : 1;
  const at = nowISO();
  const payload = JSON.stringify({ es, en, actor, ...extra });
  const hash = await sha256((prev ? prev.hash : "genesis") + at + actor + payload);
  const entry = { id: id || uid(), seq, at, actor, es, en, ...extra, prevHash: prev ? prev.hash : "genesis", hash };

  /* [TIE-IN: ledger service] POST /seal; daily root anchored to NOM-151 constancia */

  await DB.put("ledger", entry);
  return entry;
}

/** Verify the whole chain; returns { ok, brokenAt }. */

async function verifyChain() {
  const chain = [...S.ledger].sort((a, b) => a.seq - b.seq);
  let prevHash = "genesis";
  for (const e of chain) {
    const { id: _id, seq, at, actor, es, en, prevHash: ph, hash, ...extra } = e;
    void _id;
    const payload = JSON.stringify({ es, en, actor, ...extra });
    if (ph !== prevHash || (await sha256(prevHash + at + actor + payload)) !== hash)
      return { ok: false, brokenAt: seq };
    prevHash = hash;
  }
  return { ok: true, length: chain.length };
}

/** Centered notice. Routine confirmations fade after 2.6 s and close on tap; alerts and errors (bad=true) wait for Close or Acknowledge. */

function toast(msg, bad = false, title) {
  document.querySelectorAll(".notice:not(.keep), .notice-veil:not(.keep)").forEach((n) => n.remove());
  const veil = document.createElement("div");
  veil.className = "notice-veil";
  const el = document.createElement("div");
  el.className = "notice " + (bad ? "bad" : "ok");
  el.setAttribute("role", bad ? "alertdialog" : "status");
  el.innerHTML = `<h3>${esc(title || (bad ? L("Attention", "Atención") : L("Done", "Listo")))}</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-notice-close>${esc(L("Close", "Cerrar"))}</button><button class="btn primary" data-notice-close>${esc(L("Acknowledge", "Enterado"))}</button></div>`;
  const close = () => {
    el.remove();
    veil.remove();
  };
  el.querySelectorAll("[data-notice-close]").forEach((b) => (b.onclick = close));
  veil.onclick = close;
  if (!bad)
    el.onclick = (e) => {
      if (!e.target.closest("button")) close();
    };
  document.body.append(veil, el);
  el.querySelector(".btn.primary").focus();
  if (!bad) setTimeout(close, 2600);
}

/** Typed confirmation for destructive actions. The confirm button stays disabled until the exact word is typed. */

function confirmTyped(word, message, onConfirm) {
  const dlg = document.createElement("dialog");
  dlg.innerHTML = `<p style="margin-top:0">${esc(message)}</p><p class="sub">${esc(t("confirm_word_hint"))} <b style="color:var(--warn)">${esc(word)}</b></p>
    <div class="field"><input aria-label="confirmation" autocomplete="off" /></div>
    <div class="row spread" style="margin-top:16px"><button class="btn" data-x>${esc(t("cancel"))}</button><button class="btn danger" data-ok disabled>${esc(t("ok"))}</button></div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  const input = dlg.querySelector("input"),
    ok = dlg.querySelector("[data-ok]");
  input.addEventListener("input", () => {
    ok.disabled = input.value.trim() !== word;
  });
  dlg.querySelector("[data-x]").onclick = () => {
    dlg.close();
    dlg.remove();
  };
  ok.onclick = () => {
    dlg.close();
    dlg.remove();
    onConfirm();
  };
  input.focus();
}

/** A small form dialog. fields: [{k,label,value,type}] → onSubmit(values). */

function formDialog(title, fields, onSubmit) {
  const dlg = document.createElement("dialog");
  dlg.innerHTML = `<h2>${esc(title)}</h2>${fields.map((f) => `<div class="field" style="margin-bottom:12px"><label>${esc(f.label)}</label>${f.type === "select" ? `<select name="${f.k}">${f.options.map((o) => `<option value="${esc(o[0])}" ${o[0] === f.value ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>` : `<input name="${f.k}" value="${esc(f.value ?? "")}" ${f.type ? `type="${f.type}"` : ""}/>`}</div>`).join("")}
    <div class="row spread" style="margin-top:8px"><button class="btn" data-x>${esc(t("cancel"))}</button><button class="btn primary" data-ok>${esc(t("ok"))}</button></div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  dlg.querySelector("[data-x]").onclick = () => {
    dlg.close();
    dlg.remove();
  };
  dlg.querySelector("[data-ok]").onclick = () => {
    const v = {};
    fields.forEach((f) => (v[f.k] = dlg.querySelector(`[name="${f.k}"]`).value));
    dlg.close();
    dlg.remove();
    onSubmit(v);
  };
}

/** Saves a file after a centered status window with a progress bar completes. All status windows close when the bar finishes. */

function download(name, text, type = "application/json") {

/** host: an open <dialog> to draw the status window inside (a modal dialog lives in the browser's top layer, so a window
    appended to the page would sit behind it); without a host the window is centered on the page. seconds: how long the bar takes. */

function downloadWithStatus(name, blob, verb, host, seconds) {
  const isPdf = /\.pdf$/i.test(name);
  const secs = seconds || (isPdf ? 7 : 2);
  const icon = isPdf
    ? `<svg viewBox="0 0 48 56" width="40" height="46" role="img" aria-label="PDF"><path d="M6 2 H30 L42 14 V54 H6 Z" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="2"/><path d="M30 2 V14 H42" fill="none" stroke="var(--text-2)" stroke-width="2"/><rect x="4" y="30" width="34" height="16" rx="3" fill="var(--crit)"/><text x="21" y="42" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">PDF</text></svg>`
    : `<svg viewBox="0 0 48 56" width="40" height="46" role="img" aria-label="file"><path d="M6 2 H30 L42 14 V54 H6 Z" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="2"/><path d="M30 2 V14 H42" fill="none" stroke="var(--text-2)" stroke-width="2"/><text x="24" y="40" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text-2)">${esc((name.split(".").pop() || "").toUpperCase())}</text></svg>`;
  const inside = !!host;
  const el = document.createElement("div");
  el.className = inside ? "status-in" : "status-win";
  el.setAttribute("role", "status");
  el.setAttribute("aria-live", "polite");
  const veil = inside ? document.createElement("div") : null;
  if (veil) veil.className = "status-veil";
  el.innerHTML = `<div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1"><h3>${esc(isPdf ? L("PDF downloading", "Descargando PDF") : verb + "…")}</h3><div class="file">${esc(name)} · ${(blob.size / 1024).toFixed(1)} KB</div><div class="bar" style="height:14px"><i class="dlBar" style="width:0%;transition:width ${secs}s linear"></i></div><div class="sub" style="margin:8px 0 0" data-dl-state>${esc(L("Preparing…", "Preparando…"))} <span data-dl-pct>0</span>%</div></div>${icon}</div>`;
  if (inside) host.append(veil, el);
  else document.body.appendChild(el);
  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      const b = el.querySelector(".dlBar");
      if (b) b.style.width = "100%";
    })
  );
  const started = Date.now();
  const tick = setInterval(() => {
    const p = el.querySelector("[data-dl-pct]");
    if (p) p.textContent = String(Math.min(99, Math.round(((Date.now() - started) / (secs * 1000)) * 100)));
  }, 200);
  setTimeout(() => {
    clearInterval(tick);
    const st = el.querySelector("[data-dl-state]");
    if (st) st.innerHTML = `<b style="color:var(--led)">${esc(L("Download complete", "Descarga completa"))}</b>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();

    /* [TIE-IN: native builds] Swift and Compose hand the bytes to the share sheet instead */

    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setTimeout(
      () =>
        document
          .querySelectorAll(".status-win, .status-in, .status-veil, .notice, .notice-veil")
          .forEach((n) => n.remove()),
      1400

      /* every open status window closes */

    );
  }, secs * 1000);
}

/* Navigation: Bridge keeps its own history. go() pushes the current screen; back() pops it.
   Detail screens are reachable only through their parents, so RBAC is checked on the parent route. */

const DETAIL_PARENT = {

  tienda: "tiendas",
  sitio: "topologia",
  studio: "agentes",
  politicas: "ajustes",
  "modelo-cat": "catalogo",

  evento: "cadena",
  incidente: "incidentes",
  usuario: "ajustes",
  integracion: "integraciones",
  conectar: "integraciones",
};

/* Navigates to a screen: checks the role, pushes the current screen onto Bridge's own history, resets filters, renders. */

function go(route, params = {}, replace = false) {
  const parent = DETAIL_PARENT[route] || route;
  const allowed = ROLES[state.role]?.screens.includes(parent) || ["login", "installer"].includes(route);
  if (!allowed) route = "home";
  if (
    !replace &&
    state.route !== "login" &&
    (state.route !== route || JSON.stringify(state.params) !== JSON.stringify(params))
  )
    state.stack.push({ route: state.route, params: state.params, filter: state.filter });
  if (state.stack.length > 40) state.stack.shift();
  state.route = route;
  state.params = params;
  state.filter = "";
  if (!["conectar"].includes(route)) state.wiz = null;
  render();
  window.scrollTo(0, 0);
}

/* Returns to the previous screen from Bridge's own history (never the browser's); Home when the stack is empty. */

function back() {
  const prev = state.stack.pop();
  if (!prev) return go("home", {}, true);
  state.route = prev.route;
  state.params = prev.params;
  state.filter = prev.filter || "";
  render();
  window.scrollTo(0, 0);
}

  const name = typeof ICONS !== "undefined" && ICONS[r] ? r : DETAIL_PARENT[r];
  const svg = name ? icon(name) : "";
  return svg ? `<span class="h1icon">${svg}</span>` : "";
};

/* The standard screen header: breadcrumb bar, title, and subtitle. */

const head = (title, sub) =>
  `${crumbs(title)}<div class="row" style="gap:12px;align-items:center;margin-bottom:2px">${headIcon()}<h1 style="margin:0">${esc(title)}</h1></div><p class="sub">${esc(sub)}</p>`;

/* A big-number card; when given a route it becomes tappable and opens that screen. */

const statCard = (num, label, color, open, iconSvg) =>
  `<div class="card ${open ? "link" : ""}" ${open ? `data-open="${esc(open)}" role="button" tabindex="0"` : ""} style="display:flex;align-items:center;gap:12px">${iconSvg || ""}<div><div class="stat" ${color ? `style="color:var(--${color})"` : ""}>${esc(num)}</div><div style="color:var(--text-2)">${esc(label)}</div></div></div>`;

/* The read-only banner shown to roles that may not change records. */

const roBanner = () => (canWrite() ? "" : `<div class="readonly-banner">${esc(t("readonly"))}</div>`);

/* A small colored status pill (ok, warn, crit, info). */

const status = (kind, text) => `<span class="status ${kind}">${esc(text)}</span>`;

/* The search field wired to state.filter; the input handler keeps the caret in place across re-renders. */

const searchBox = (ph) =>
  `<input class="search" data-filter value="${esc(state.filter)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"/>`;

/* True when a text matches the current search filter (case-insensitive) or there is no filter. */

const match = (s) => !state.filter || String(s).toLowerCase().includes(state.filter.toLowerCase());

/* A button that renders disabled for read-only roles; every mutating control goes through it. */

const wbtn = (attrs, label, cls = "btn sm") =>
  `<button class="${cls}" ${attrs} ${canWrite() ? "" : "disabled"}>${esc(label)}</button>`;
/* ==========================================================================
   SECTION 5b · GRAPHICS · the energy metric illustrations
   --------------------------------------------------------------------------
   FOR THE NOVICE
   These functions draw pictures with SVG (Scalable Vector Graphics): text
   that describes shapes. Each function takes a number (kilowatts, percent,
   minutes) and returns a string of SVG that the screen inserts into the page.
   Because the drawing is generated from the number, the picture always
   matches the data: the sun's gauge sweeps with the kilowatts, the battery
   fills to its percentage, the grid switch opens when islanded, the UPS ring
   counts down its minutes. Colors come from the token sheet at the top of
   the file (var(--led), var(--power), and so on), so the SwiftUI and Compose
   versions can redraw the same pictures from the same numbers.
   ========================================================================== */

const Gfx = (() => {

  /** Describes an arc of a circle as an SVG path: center (cx, cy), radius r, from angle a0 to a1 in degrees (0 = 3 o'clock, clockwise). */

  function arc(cx, cy, r, a0, a1) {
    const rad = (a) => (a * Math.PI) / 180;
    const x0 = cx + r * Math.cos(rad(a0)),
      y0 = cy + r * Math.sin(rad(a0));
    const x1 = cx + r * Math.cos(rad(a1)),
      y1 = cy + r * Math.sin(rad(a1));

    /* SVG needs to know if the arc is more than half a circle */

    const large = a1 - a0 > 180 ? 1 : 0;
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  /* --- SOLAR: a sun with eight rays over a half-circle gauge that sweeps from 0 to the array's peak (5 kW here). --- */

  function sun(kw, peakKw = typeof ENERGY !== "undefined" ? ENERGY.peakKW : 14.7) {
    const share = clamp(kw / peakKw, 0, 1);
    const rays = Array.from({ length: 8 }, (_, i) => {
      const a = (i * 45 * Math.PI) / 180;
      return `<line x1="${(60 + 17 * Math.cos(a)).toFixed(1)}" y1="${(44 + 17 * Math.sin(a)).toFixed(1)}" x2="${(60 + 23 * Math.cos(a)).toFixed(1)}" y2="${(44 + 23 * Math.sin(a)).toFixed(1)}"/>`;
    }).join("");
    return `<svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="${kw.toFixed(1)} kW solar">
      <path d="${arc(60, 62, 46, 180, 360)}" fill="none" stroke="var(--surface-2)" stroke-width="8" stroke-linecap="round"/>
      <path d="${arc(60, 62, 46, 180, 180 + 180 * share)}" fill="none" stroke="var(--power)" stroke-width="8" stroke-linecap="round"/>
      <g stroke="var(--power)" stroke-width="2.5" stroke-linecap="round">${rays}</g>
      <circle cx="60" cy="44" r="11" fill="var(--power)"/>
      <text x="60" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">0</text><text x="106" y="76" text-anchor="end" font-size="9" fill="var(--muted)">${peakKw} kW</text></svg>`;
  }

  /* --- BATTERY: a horizontal cell that fills to the percentage; a tick marks the reserve floor; color changes with the level. --- */

  function battery(pct, reservePct = 20) {
    const p = clamp(pct, 0, 100);
    const color = p <= reservePct ? "var(--crit)" : p < 40 ? "var(--warn)" : "var(--led)";
    const fillW = (84 * p) / 100;
    const tickX = 18 + (84 * clamp(reservePct, 0, 100)) / 100;
    return `<svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="battery ${p} percent">
      <rect x="16" y="26" width="88" height="34" rx="6" fill="none" stroke="var(--text-2)" stroke-width="2.5"/>
      <rect x="104" y="36" width="6" height="14" rx="2" fill="var(--text-2)"/>
      <rect x="18" y="28" width="${fillW.toFixed(1)}" height="30" rx="4" fill="${color}"/>
      <line x1="${tickX.toFixed(1)}" y1="22" x2="${tickX.toFixed(1)}" y2="64" stroke="var(--warn)" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="${tickX.toFixed(1)}" y="72" text-anchor="middle" font-size="9" fill="var(--warn)">${L("floor", "piso")} ${reservePct}%</text></svg>`;
  }

  /* --- GRID: a pylon on the left, the rack on the right, and a switch between them. Closed on standby (dotted), open when islanded. --- */

  function grid(state) {
    const islanded = state === "islanded";
    const importing = state === "importing";
    const lineStyle = islanded
      ? ""
      : importing
        ? `stroke="var(--led)" stroke-width="3"`
        : `stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="4 4"`;
    return `<svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="grid ${state}">
      <g stroke="var(--text-2)" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M14 66 L22 18 L30 18 L38 66"/><path d="M12 34 L40 34 M15 48 L37 48 M18 24 L34 24"/></g>
      <rect x="86" y="26" width="24" height="40" rx="4" fill="none" stroke="var(--text-2)" stroke-width="2.5"/><g fill="var(--led)"><rect x="91" y="32" width="14" height="5" rx="1"/><rect x="91" y="41" width="14" height="5" rx="1"/><rect x="91" y="50" width="14" height="5" rx="1"/></g>
      ${
        islanded
          ? `<path d="M40 46 L60 46" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/><path d="M60 46 L76 32" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/><path d="M78 46 L86 46" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/><text x="60" y="72" text-anchor="middle" font-size="9" fill="var(--warn)">${L("switch open", "interruptor abierto")}</text>`
          : `<path d="M40 46 L86 46" ${lineStyle} stroke-linecap="round" fill="none"/><text x="60" y="72" text-anchor="middle" font-size="9" fill="var(--muted)">${importing ? L("importing", "importando") : L("connected, unused", "conectada, sin uso")}</text>`
      }</svg>`;
  }

  /* --- UPS: a ring that shows minutes of bridge remaining out of the unit's rating, with a bolt in the middle. --- */

  function ups(minutes, ratedMinutes = 30) {
    const share = clamp(minutes / ratedMinutes, 0, 1);
    const color = share < 0.34 ? "var(--crit)" : share < 0.67 ? "var(--warn)" : "var(--led)";
    return `<svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="UPS ${minutes} minutes">
      <circle cx="60" cy="42" r="28" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
      ${share > 0 ? `<path d="${arc(60, 42, 28, -90, -90 + 359.9 * share)}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>` : ""}
      <path d="M63 26 L52 45 L60 45 L57 58 L69 38 L61 38 Z" fill="${color}"/>
      <text x="60" y="78" text-anchor="middle" font-size="9" fill="var(--muted)">${minutes} / ${ratedMinutes} min</text></svg>`;
  }

  /* --- A small flow strip for the Health screen: solar → batteries → rack, with the grid switch state. --- */

  function spine(p) {
    return `<svg viewBox="0 0 320 40" width="320" height="40" role="img" aria-label="power spine">
      <circle cx="20" cy="20" r="9" fill="var(--power)"/><text x="20" y="36" text-anchor="middle" font-size="8" fill="var(--muted)">${(p.solarKW || 0).toFixed(1)} kW</text>
      <path d="M32 20 L98 20" stroke="var(--power)" stroke-width="3" stroke-linecap="round"/>
      <rect x="100" y="12" width="36" height="16" rx="3" fill="none" stroke="var(--text-2)" stroke-width="2"/><rect x="102" y="14" width="${(32 * clamp(p.batteryPct || 0, 0, 100)) / 100}" height="12" rx="2" fill="var(--led)"/><text x="118" y="36" text-anchor="middle" font-size="8" fill="var(--muted)">${Math.round(p.batteryPct)}%</text>
      <path d="M140 20 L206 20" stroke="var(--led)" stroke-width="3" stroke-linecap="round"/>
      <rect x="208" y="8" width="26" height="24" rx="3" fill="none" stroke="var(--text-2)" stroke-width="2"/><text x="221" y="36" text-anchor="middle" font-size="8" fill="var(--muted)">rack</text>
      ${p.islanded ? `<path d="M250 20 L268 20 M282 8 L300 20" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/><text x="284" y="36" text-anchor="middle" font-size="8" fill="var(--warn)">${L("grid open", "red abierta")}</text>` : `<path d="M250 20 L300 20" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="4 4"/><text x="284" y="36" text-anchor="middle" font-size="8" fill="var(--muted)">${L("grid standby", "red en espera")}</text>`}</svg>`;
  }

  /* --- Glyphs for the Data screen: a chain link, accounts, an invoice, and a storage ring that shows the used share. --- */

  function chainIcon() {
    return `<svg viewBox="0 0 80 80" width="72" height="72" role="img" aria-label="sealed events"><g fill="none" stroke="var(--led)" stroke-width="4" stroke-linecap="round"><rect x="10" y="30" width="28" height="20" rx="10"/><rect x="42" y="30" width="28" height="20" rx="10"/><line x1="30" y1="40" x2="50" y2="40"/></g><circle cx="40" cy="14" r="5" fill="var(--led)"/><circle cx="40" cy="66" r="5" fill="var(--led)"/></svg>`;
  }
  function accountsIcon() {
    return `<svg viewBox="0 0 80 80" width="72" height="72" role="img" aria-label="accounts"><g fill="none" stroke="var(--text-2)" stroke-width="3.5" stroke-linecap="round"><circle cx="30" cy="28" r="10"/><path d="M10 64 C10 48 50 48 50 64"/><circle cx="56" cy="30" r="8"/><path d="M50 62 C52 50 72 50 72 62"/></g></svg>`;
  }
  function invoiceIcon() {
    return `<svg viewBox="0 0 80 80" width="72" height="72" role="img" aria-label="invoices"><path d="M20 8 H50 L62 20 V72 H20 Z" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="3"/><path d="M50 8 V20 H62" fill="none" stroke="var(--text-2)" stroke-width="3"/><g stroke="var(--text-2)" stroke-width="3" stroke-linecap="round"><line x1="28" y1="34" x2="54" y2="34"/><line x1="28" y1="44" x2="54" y2="44"/><line x1="28" y1="54" x2="44" y2="54"/></g><circle cx="52" cy="60" r="7" fill="var(--led)"/><path d="M48 60 L51 63 L56 57" fill="none" stroke="var(--bg)" stroke-width="2"/></svg>`;
  }

  /* The ring shows the used share of the cluster's storage; the number beside it is the percentage. */

  function storageRing(pct) {
    const share = clamp(pct, 0, 100) / 100;
    const color = share > 0.85 ? "var(--crit)" : share > 0.7 ? "var(--warn)" : "var(--led)";
    return `<svg viewBox="0 0 80 80" width="72" height="72" role="img" aria-label="storage ${Math.round(pct)} percent used"><circle cx="40" cy="40" r="30" fill="none" stroke="var(--surface-2)" stroke-width="9"/>${share > 0 ? `<path d="${arc(40, 40, 30, -90, -90 + 359.9 * share)}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"/>` : ""}<ellipse cx="40" cy="34" rx="11" ry="4" fill="none" stroke="var(--text-2)" stroke-width="2.5"/><path d="M29 34 V46 A11 4 0 0 0 51 46 V34" fill="none" stroke="var(--text-2)" stroke-width="2.5"/></svg>`;
  }

  /* --- Node screen glyphs: role, a thermometer that fills with the temperature, a memory ring, and a ledger check. --- */

  const nodeStatusColor = (n) =>
    n.status === "down" ? "var(--crit)" : n.status === "warn" || n.status === "draining" ? "var(--warn)" : "var(--led)";
  function roleIcon(role) {
    const kimi = /kimi/i.test(role),
      admin = /admin|spare/i.test(role);
    return `<svg viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="role"><rect x="8" y="10" width="32" height="28" rx="6" fill="var(--surface-2)" stroke="${admin ? "var(--led)" : "var(--text-2)"}" stroke-width="2.5"/>${kimi ? `<path d="M16 30 L24 16 L32 30 M19 25 H29" fill="none" stroke="var(--led)" stroke-width="2.5" stroke-linecap="round"/>` : admin ? `<path d="M16 24 L22 30 L32 18" fill="none" stroke="var(--led)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : `<path d="M17 16 V32 H31" fill="none" stroke="var(--led)" stroke-width="2.5" stroke-linecap="round"/>`}</svg>`;
  }
  function thermo(tempC) {
    const share = clamp((tempC - 30) / 60, 0, 1);
    const color = tempC >= 80 ? "var(--crit)" : tempC >= 70 ? "var(--warn)" : "var(--led)";
    return `<svg viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="${tempC} °C"><rect x="19" y="6" width="10" height="26" rx="5" fill="none" stroke="var(--text-2)" stroke-width="2.5"/><circle cx="24" cy="37" r="7" fill="${color}"/><rect x="22" y="${(30 - 22 * share).toFixed(1)}" width="4" height="${(22 * share + 2).toFixed(1)}" fill="${color}"/></svg>`;
  }
  function memRing(usedGB, totalGB) {
    const share = clamp(usedGB / totalGB, 0, 1);
    const color = share > 0.92 ? "var(--crit)" : share > 0.85 ? "var(--warn)" : "var(--led)";
    return `<svg viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="memory ${Math.round(share * 100)} percent"><circle cx="24" cy="24" r="17" fill="none" stroke="var(--surface-2)" stroke-width="6"/><path d="${arc(24, 24, 17, -90, -90 + 359.9 * share)}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"/><text x="24" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${Math.round(share * 100)}</text></svg>`;
  }
  function ledgerIcon(ok) {
    return `<svg viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="ledger"><rect x="6" y="18" width="16" height="12" rx="6" fill="none" stroke="var(--led)" stroke-width="2.5"/><rect x="26" y="18" width="16" height="12" rx="6" fill="none" stroke="var(--led)" stroke-width="2.5"/><path d="M18 24 H30" stroke="var(--led)" stroke-width="2.5"/><circle cx="36" cy="12" r="7" fill="${ok ? "var(--led)" : "var(--warn)"}"/><path d="M32 12 L35 15 L40 9" fill="none" stroke="var(--bg)" stroke-width="2"/></svg>`;
  }

  /* --- The cluster health map: two octets and the admin node, each node a tile with its status, temperature bar, and memory bar. --- */

  function clusterMap(nodes) {
    const admin = nodes.find((n) => /^N\d+$/.test(n.id));
    const groups = {};
    nodes
      .filter((n) => n !== admin)
      .forEach((n) => {
        (groups[n.id[0]] = groups[n.id[0]] || []).push(n);
      });
    const keys = Object.keys(groups);
    const labelOf = (k, list) => {
      const role = (list[0] || {}).role || "";
      if (k === "K" || /kimi/i.test(role))
        return [
          L("Kimi octet · one instance sharded across 8", "Octeto Kimi · una instancia repartida en 8"),
          L("escalation brain", "cerebro de escalación"),
        ];
      if (k === "L" || /llama/i.test(role))
        return [
          L("Llama octet · 8 independent instances", "Octeto Llama · 8 instancias independientes"),
          L("staff GPT and routine agents", "GPT de personal y agentes de rutina"),
        ];
      if (/replica/i.test(role))
        return [L("Replica nodes", "Nodos réplica"), L("recovery copy", "copia de recuperación")];
      return [`${L("Octet", "Octeto")} ${k}`, role];
    };
    const tile = (n, x, y) => {
      const c = nodeStatusColor(n);
      const t = clamp((n.tempC - 30) / 60, 0, 1),
        m = clamp(n.memGB / 256, 0, 1);
      return `<g data-open="nodo:${n.id}" role="button" tabindex="0" style="cursor:pointer" transform="translate(${x},${y})"><rect width="56" height="64" rx="8" fill="var(--surface-2)" stroke="${c}" stroke-width="${n.status === "ok" ? 1 : 2}"/><text x="28" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">${n.id}</text><circle cx="46" cy="10" r="3.5" fill="${c}"/>
      <rect x="8" y="24" width="8" height="32" rx="2" fill="var(--bg)"/><rect x="8" y="${(56 - 32 * t).toFixed(1)}" width="8" height="${(32 * t).toFixed(1)}" rx="2" fill="${n.tempC >= 80 ? "var(--crit)" : n.tempC >= 70 ? "var(--warn)" : "var(--led)"}"/>
      <rect x="20" y="24" width="8" height="32" rx="2" fill="var(--bg)"/><rect x="20" y="${(56 - 32 * m).toFixed(1)}" width="8" height="${(32 * m).toFixed(1)}" rx="2" fill="var(--info)"/>
      <text x="44" y="38" text-anchor="middle" font-size="8" fill="var(--muted)">${n.tempC}°</text><text x="44" y="52" text-anchor="middle" font-size="8" fill="var(--muted)">${n.memGB}G</text></g>`;
    };
    const octet = (list, x, y, label, sub) =>
      `<text x="${x}" y="${y - 10}" font-size="11" font-weight="700" fill="var(--text-2)">${label}</text><text x="${x}" y="${y + 84}" font-size="9" fill="var(--muted)">${sub}</text>${list.map((n, i) => tile(n, x + i * 62, y)).join("")}`;
    const online = nodes.filter((n) => n.status !== "down").length,
      avgT = Math.round(nodes.reduce((s, n) => s + n.tempC, 0) / nodes.length),
      avgM = Math.round((nodes.reduce((s, n) => s + n.memGB, 0) / nodes.length / 256) * 100);
    const ring = (cx, share, color, big, small) =>
      `<circle cx="${cx}" cy="36" r="24" fill="none" stroke="var(--surface-2)" stroke-width="7"/><path d="${arc(cx, 36, 24, -90, -90 + 359.9 * clamp(share, 0.001, 1))}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/><text x="${cx}" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${big}</text><text x="${cx}" y="76" text-anchor="middle" font-size="9" fill="var(--muted)">${small}</text>`;
    const rows = Math.max(1, keys.length);
    const height = 60 + rows * 116 + 40;
    return `<svg viewBox="0 0 800 ${height}" width="100%" role="img" aria-label="cluster health map">
      ${ring(60, online / nodes.length, online === nodes.length ? "var(--led)" : "var(--warn)", `${online}/${nodes.length}`, L("online", "en línea"))}${ring(140, avgT / 100, avgT >= 75 ? "var(--warn)" : "var(--led)", `${avgT}°`, L("avg temp", "temp. prom."))}${ring(220, avgM / 100, avgM > 90 ? "var(--warn)" : "var(--info)", `${avgM}%`, L("memory", "memoria"))}
      ${keys
        .map((k, r) => {
          const [label, sub] = labelOf(k, groups[k]);
          return `<g transform="translate(300,${r * 116})">${octet(groups[k], 0, 24, label, sub)}</g>`;
        })
        .join("")}
      ${admin ? `<g transform="translate(60,170)"><text x="0" y="14" font-size="11" font-weight="700" fill="var(--text-2)">${admin.id} · ${L("admin + spare", "admin + reserva")}</text>${tile(admin, 0, 24)}<text x="70" y="52" font-size="9" fill="var(--muted)">${esc(admin.role)}</text></g>` : ""}
      <g transform="translate(60,${height - 22})"><rect width="8" height="10" rx="2" fill="var(--led)"/><text x="12" y="9" font-size="9" fill="var(--muted)">${L("temperature bar", "barra de temperatura")}</text><rect x="110" width="8" height="10" rx="2" fill="var(--info)"/><text x="122" y="9" font-size="9" fill="var(--muted)">${L("memory bar", "barra de memoria")}</text><circle cx="212" cy="5" r="3.5" fill="var(--led)"/><text x="220" y="9" font-size="9" fill="var(--muted)">ok</text><circle cx="242" cy="5" r="3.5" fill="var(--warn)"/><text x="250" y="9" font-size="9" fill="var(--muted)">${L("warm or draining", "caliente o drenando")}</text><circle cx="342" cy="5" r="3.5" fill="var(--crit)"/><text x="350" y="9" font-size="9" fill="var(--muted)">${L("down", "caído")}</text></g></svg>`;
  }

  /* --- Small glyphs for the invoice stage cards: issued, confirmed, paid, REP pending, REP sealed. --- */

  function stageIcon(stage) {
    const base = (inner) =>
      `<span class="stage-icon"><svg viewBox="0 0 40 40" width="34" height="34" role="img" aria-label="${stage}">${inner}</svg></span>`;
    const doc = `<path d="M11 5 H24 L30 11 V35 H11 Z" fill="none" stroke="var(--text-2)" stroke-width="2"/><path d="M24 5 V11 H30" fill="none" stroke="var(--text-2)" stroke-width="2"/>`;
    if (stage === "issued")
      return base(
        doc + `<path d="M15 20 H26 M15 26 H26" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round"/>`
      );
    if (stage === "confirmed")
      return base(
        doc +
          `<path d="M15 24 L19 28 L27 19" fill="none" stroke="var(--led)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`
      );
    if (stage === "paid")
      return base(

            <div><div class="sub" style="margin:0;font-size:12px">${esc(L("Issuers on the 69-B list", "Emisores en la lista 69-B"))}</div><b style="color:var(--${b69 ? "crit" : "led"})">${b69}</b><div class="hash">${esc(L("30 days to prove receipt or the fiscal effect is lost", "30 días para probar la recepción o se pierde el efecto fiscal"))}</div></div>

/* ==========================================================================
   SECTION 6b · DETAIL SCREENS · one screen behind every touch
   --------------------------------------------------------------------------
   FOR THE NOVICE: a row, card, or chip carries data-open="screen:id". The
   event layer turns that into go(screen, { id }); the screen reads
   state.params.id, looks up the record with byId(), and shows it with its
   actions, its related records, and the sealed events that mention it.
   Each opens from a parent (row, card, chip) with params { id }, shows the
   record, related records, its own actions, and the way back.
   ========================================================================== */

const byId = (store, id) => S[store].find((d) => d.id === id);

/* Which screen glyph each API family borrows on the landing. */

const FAMILY_ICON = {
  identity: "perfil",
  ledger: "cadena",
  pac: "facturas",
  bank: "cobranza",
  messaging: "chat",
  energy: "energia",
  arc: "configuracion",
  models: "modelos",
  incidents: "incidentes",
  custom: "integraciones",
};

/* The screen shown when a detail record no longer exists, with a way back. */

const notFound = (what) =>
  chrome(
    "bridge.armada.local",
    sidebar() +
      `<main>${head(what, L("This record no longer exists.", "Este registro ya no existe."))}<button class="btn" data-back>‹ ${esc(L("Back", "Volver"))}</button></main>`
  );

/* A two-column key/value table used on every detail screen. */

const kv = (rows) =>
  `<table><tbody>${rows.map(([k, v]) => `<tr><td style="width:40%;color:var(--muted)">${esc(k)}</td><td><b>${v}</b></td></tr>`).join("")}</tbody></table>`;

/* A card listing related items, or a plain 'None' when there are none. */

const related = (title, items) =>
  `<div class="card"><h2>${esc(title)}</h2>${items.length ? items.join("") : `<p class="sub" style="margin:0">${esc(L("None.", "Ninguno."))}</p>`}</div>`;

/* The last sealed events that mention a key or a name, each tappable to the event page. */

const eventsFor = (key) =>
  [...S.ledger]
    .filter((e) => (e.key && String(e.key).includes(key)) || (e.es || "").includes(key) || (e.en || "").includes(key))
    .sort((a, b) => b.seq - a.seq)
    .slice(0, 8)
    .map(
      (e) =>
        `<div class="link" data-open="evento:${e.id}" style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer"><span class="hash">#${e.seq} · ${hhmm(e.at)}</span> ${esc(state.lang === "es" ? e.es : e.en)}</div>`
    );

/* ==========================================================================
   SECTION 6c · ENERGY DETAIL PAGES · one page behind each metric icon
   --------------------------------------------------------------------------
   FOR THE NOVICE: the four cards on Energía each open a page here. Every
   number on these pages is computed by the small functions in ENERGY from
   the live power record (S.power[0]) and a few physical constants. Move the
   reserve-floor slider, the curtail switch, or island mode, here or on
   Energía, and the numbers and the pictures follow, because they are all
   drawn from the same record. Nothing here is telemetry yet: each page says
   so at the bottom and lists the constants it assumes.
   [TIE-IN: inverter/gateway telemetry] replaces ENERGY's constants and S.power with live readings.
   ========================================================================== */

const ENERGY = {
  modules: 21,
  moduleW: 700,

  /* the array on the branch roof (solar prototype v0.4: 21 × 700 W bifacial) */

  peakKW: 14.7,

  /* battery bank capacity */

  bankKWh: 60,

  /* steady rack load: 17 Mac Studios plus network and cooling */

  rackKW: 2.6,
  upsKVA: 10,

  /* UPS rating and rated bridge at the rack load */

  upsRatedMin: 30,
  sunHours: 5.2,

  /* illustrative daily sun hours, and hours a day the bank is already full */

  fullBankHours: 2.5,

  /* derived figures, all from the live record p */

  solarShare: (p) => Math.min(1, p.solarKW / ENERGY.rackKW),

  /* Solar beyond the rack load, which charges the bank. */

  surplusKW: (p) => Math.max(0, p.solarKW - ENERGY.rackKW),

  /* True when curtailment is on and the bank is full (95 percent or more). */

  curtailing: (p) => p.curtail && p.batteryPct >= 95,

  /* Kilowatts curtailment would clip once the bank is full. */

  clippedKW: (p) => (p.curtail ? ENERGY.surplusKW(p) : 0),

  /* Energy given up to curtailment in a day (clipped kW × hours the bank is full). */

  clippedKWhToday: (p) => ENERGY.clippedKW(p) * ENERGY.fullBankHours,

  /* Illustrative solar energy for the day (kW × sun hours). */

  solarKWhToday: (p) => p.solarKW * ENERGY.sunHours,

  /* Battery energy above the reserve floor. */

  usableKWh: (p) => Math.max(0, ((p.batteryPct - p.reservePct) / 100) * ENERGY.bankKWh),

  /* Hours the bank carries the rack at its steady load. */

  autonomyH: (p) => ENERGY.usableKWh(p) / ENERGY.rackKW,

  /* Bank autonomy plus the UPS bridge. */

  totalAutonomyH: (p) => ENERGY.autonomyH(p) + p.upsMin / 60,

  /* Formats hours as '12.5 h' or '45 min'. */

  fmtH: (h) => (h >= 1 ? `${h.toFixed(1)} h` : `${Math.round(h * 60)} min`),
};

/* Illustrations: line drawings in the token palette, each generated from the live record so the picture matches the numbers. */

const Illus = {

  /* Illustration: the array on the roof; panels dim when curtailing. */

  solar(p) {
    const dim = ENERGY.curtailing(p) ? 0.35 : 1;
    const rows = 3,
      cols = 7;
    const panels = Array.from({ length: rows * cols }, (_, i) => {
      const r = Math.floor(i / cols),
        c = i % cols;
      return `<rect x="${40 + c * 34}" y="${60 + r * 22}" width="30" height="18" rx="2" fill="var(--power)" opacity="${dim}" stroke="var(--bg)" stroke-width="1.5"/>`;
    }).join("");
    return `<svg viewBox="0 0 320 160" width="100%" role="img" aria-label="solar array"><path d="M20 130 L160 40 L300 130 Z" fill="var(--surface-2)"/><rect x="24" y="130" width="272" height="20" fill="var(--surface-2)"/>
      <circle cx="270" cy="34" r="12" fill="var(--power)" opacity="${dim}"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<line x1="${(270 + 16 * Math.cos((a * Math.PI) / 180)).toFixed(1)}" y1="${(34 + 16 * Math.sin((a * Math.PI) / 180)).toFixed(1)}" x2="${(270 + 21 * Math.cos((a * Math.PI) / 180)).toFixed(1)}" y2="${(34 + 21 * Math.sin((a * Math.PI) / 180)).toFixed(1)}" stroke="var(--power)" stroke-width="2" opacity="${dim}"/>`).join("")}
      ${panels}<text x="160" y="156" text-anchor="middle" font-size="10" fill="var(--muted)">${ENERGY.modules} × ${ENERGY.moduleW} W · ${ENERGY.curtailing(p) ? L("curtailing", "recortando") : L("generating", "generando")}</text></svg>`;
  },

  /* Illustration: six cells filled to the state of charge with the floor line across them. */

  battery(p) {
    const cells = 6;
    const fill = p.batteryPct / 100;
    const floorY = 120 - 80 * (p.reservePct / 100);
    const rects = Array.from(
      { length: cells },
      (_, i) =>
        `<rect x="${44 + i * 40}" y="40" width="30" height="80" rx="3" fill="none" stroke="var(--text-2)" stroke-width="2"/><rect x="${46 + i * 40}" y="${(120 - 78 * fill).toFixed(1)}" width="26" height="${(78 * fill).toFixed(1)}" rx="2" fill="${p.batteryPct <= p.reservePct ? "var(--crit)" : p.batteryPct < 40 ? "var(--warn)" : "var(--led)"}"/>`
    ).join("");
    return `<svg viewBox="0 0 320 160" width="100%" role="img" aria-label="battery bank"><rect x="30" y="26" width="260" height="110" rx="10" fill="var(--surface-2)"/>${rects}
      <line x1="34" y1="${floorY.toFixed(1)}" x2="286" y2="${floorY.toFixed(1)}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/><text x="288" y="${(floorY + 4).toFixed(1)}" font-size="9" fill="var(--warn)">${p.reservePct}%</text>
      <text x="160" y="156" text-anchor="middle" font-size="10" fill="var(--muted)">${ENERGY.bankKWh} kWh · ${Math.round(p.batteryPct)}% · ${L("floor", "piso")} ${p.reservePct}%</text></svg>`;
  },

  /* Illustration: pylon, transformer, transfer switch (open when islanded), rack. */

  grid(p) {
    const open = p.islanded;
    return `<svg viewBox="0 0 320 160" width="100%" role="img" aria-label="substation"><g stroke="var(--text-2)" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M30 130 L42 30 L54 30 L66 130"/><path d="M26 60 L70 60 M30 85 L66 85 M36 44 L60 44"/></g>
      <rect x="110" y="70" width="60" height="60" rx="6" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="2"/><text x="140" y="104" text-anchor="middle" font-size="8" fill="var(--text-2)">${L("transformer", "transformador")}</text>
      <path d="M66 60 L110 90" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="${open ? "4 4" : "0"}"/>
      ${open ? `<path d="M170 100 L200 100 M220 78 L250 100" stroke="var(--warn)" stroke-width="3" stroke-linecap="round"/><circle cx="200" cy="100" r="4" fill="var(--warn)"/><text x="215" y="124" text-anchor="middle" font-size="10" fill="var(--warn)">${L("switch open", "interruptor abierto")}</text>` : `<path d="M170 100 L250 100" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 4"/><text x="215" y="124" text-anchor="middle" font-size="10" fill="var(--muted)">${L("switch closed · standby", "cerrado · en espera")}</text>`}
      <rect x="252" y="70" width="40" height="60" rx="5" fill="none" stroke="var(--text-2)" stroke-width="2"/><g fill="var(--led)"><rect x="259" y="78" width="26" height="8" rx="1"/><rect x="259" y="92" width="26" height="8" rx="1"/><rect x="259" y="106" width="26" height="8" rx="1"/></g><text x="272" y="146" text-anchor="middle" font-size="10" fill="var(--muted)">rack</text></svg>`;
  },

  /* Illustration: the UPS unit and a ring of bridge minutes. */

  ups(p) {
    const share = Math.min(1, p.upsMin / ENERGY.upsRatedMin);
    const color = share < 0.34 ? "var(--crit)" : share < 0.67 ? "var(--warn)" : "var(--led)";
    return `<svg viewBox="0 0 320 160" width="100%" role="img" aria-label="UPS unit"><rect x="40" y="26" width="110" height="110" rx="8" fill="var(--surface-2)" stroke="var(--text-2)" stroke-width="2"/><path d="M100 46 L84 84 L98 84 L92 116 L112 74 L98 74 Z" fill="${color}"/><text x="95" y="150" text-anchor="middle" font-size="10" fill="var(--muted)">${ENERGY.upsKVA} kVA</text>
      <circle cx="235" cy="80" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>${
        share > 0
          ? `<path d="${(() => {
              const a0 = -90,
                a1 = -90 + 359.9 * share;
              const r = (a) => (a * Math.PI) / 180;
              return `M ${(235 + 42 * Math.cos(r(a0))).toFixed(1)} ${(80 + 42 * Math.sin(r(a0))).toFixed(1)} A 42 42 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${(235 + 42 * Math.cos(r(a1))).toFixed(1)} ${(80 + 42 * Math.sin(r(a1))).toFixed(1)}`;
            })()}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>`
          : ""
      }<text x="235" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text)">${p.upsMin} min</text><text x="235" y="150" text-anchor="middle" font-size="10" fill="var(--muted)">${L("bridge at", "puente a")} ${ENERGY.rackKW} kW</text></svg>`;
  },
};

/* The estimator. Weights must be resident for MoE models, so total parameters set the fit; active parameters set the speed. */

const EST = {

  /* Weights in gigabytes: parameters × bits ÷ 8; MoE weights must all be resident. */

  weightsGB: (m, bits) => (m.total * bits) / 8,

  /* 15 percent kept for KV cache and the runtime */

  usableOctetGB: (cfg) => 8 * cfg.memory * 0.85,

  /* Memory one node can give a model (15 percent kept for the KV cache and the runtime). */

  usableNodeGB: (cfg) => cfg.memory * 0.85,

  /* Whether a model fits one node, one octet, or not at all, at the chosen precision. */

  fit(m, bits, cfg) {
    const w = this.weightsGB(m, bits);
    if (w <= this.usableNodeGB(cfg)) return { ok: true, where: "node", w };
    if (w <= this.usableOctetGB(cfg)) return { ok: true, where: "octet", w };
    return { ok: false, where: "none", w };
  },

  /* Estimated tokens per second: bandwidth × efficiency ÷ bytes per token of the active parameters. */

  toks(m, bits, cfg, where) {
    const bw = HW.silicon[cfg.silicon].bw;
    const eff = where === "node" ? 0.7 : 0.5;
    return (bw * eff) / ((m.active * bits) / 8);

    /* calibrated: Kimi K2 on an M3 Ultra octet ≈ 25 to 32 tok/s (Geerling, Dec 2025) */

  },

  /* The highest precision at which a model fits, with its speed. */

  best(m, cfg) {
    for (const b of [8, 4, 2]) {
      const f = this.fit(m, b, cfg);
      if (f.ok) return { bits: b, ...f, toks: this.toks(m, b, cfg, f.where) };
    }
    return null;
  },

  /* How many octets (model instances) a node count provides. */

  instances(cfg) {
    return HW.nodes[cfg.nodes].octets;
  },
};

/* ==========================================================================
   SECTION 6e · POLICIES · guardrails, terms of service, terms of use,
   company and community guidelines, each a versioned document
   --------------------------------------------------------------------------
   FOR THE NOVICE: a policy is a text with a version number. Publishing a new
   version means pasting the text, reading the comparison with the current
   one, and approving on the authenticator (mocked here: a number-matching
   prompt that approves itself after five seconds). The old version is kept
   in the history and can be restored with a typed word. Any version opens
   in a scrolling pop-up with a PDF download; the PDF is written by the small
   generator at the end of this section, no library needed.
   [TIE-IN: identity provider] the mock approval is replaced by a real push to Microsoft Authenticator.
   [TIE-IN: policy store] published versions are what agents and audits cite.
   ========================================================================== */

const POLICY_IDS = ["guardrails", "tos", "terms", "guidelines"];

/* Names and one-line purposes of the four policies, in the active language. */

const POLICY_META = () => ({
  guardrails: {
    name: L("Guardrails", "Guardarraíles"),
    what: L(
      "what the agents may and may not do; inherited by every agent on publish",
      "lo que los agentes pueden y no pueden hacer; heredado por cada agente al publicar"
    ),
  },
  tos: {
    name: L("Terms of service", "Términos del servicio"),

  },
  terms: {
    name: L("Terms of use", "Términos de uso"),

  },
  guidelines: {
    name: L("Company and community guidelines", "Lineamientos de empresa y comunidad"),
    what: L("conduct for staff and agents alike", "conducta para personal y agentes por igual"),

});

/* Seeds the four policies with short current versions so the comparison has something to compare against. */

async function seedPolicies() {
  if (S.policies.length) return;
  const seeds = {
    guardrails: [
      "1.4",
      "es",
      "1. Los agentes se identifican como software en el primer contacto.\n2. Máximo dos toques por cuenta por día, en horario hábil.\n3. Ninguna decisión de crédito la toma un agente; siempre un humano.\n4. Los lotes de pre-evaluación solo se ejecutan a petición humana.\n5. Toda acción consecuente se sella en la cadena.\n6. Ningún dato sale del clúster.\n7. Tono cortés y exacto; sin amenazas, sin urgencia artificial.",
    ],
    tos: [
      "2.0",
      "es",
      "1. ONE NanoScience y Armada Tech.AI prestan el clúster Génesis MSAI y la consola Bridge como servicio instalado en sitio.\n2. La disponibilidad objetivo es 99.5 por ciento mensual, medida en la cadena.\n3. Las tarifas se facturan según la tabla vigente y se revisan anualmente.\n4. Los datos del banco son del banco; el proveedor no los conserva.\n5. El soporte se atiende por la fila de incidentes con tiempos de respuesta por severidad.",
    ],
    terms: [
      "1.2",
      "es",
      "1. Cada usuario entra con su propia identidad y no la comparte.\n2. Toda acción queda registrada y sellada con su nombre.\n3. Las acciones destructivas exigen confirmación escrita.\n4. El uso del chat es interno; nada sale del clúster.\n5. El incumplimiento retira el acceso.",
    ],
    guidelines: [
      "1.0",
      "es",
      "1. Trato respetuoso con clientes, colegas y agentes.\n2. Nadie promete lo que el sistema no puede cumplir.\n3. Las dudas de cumplimiento se escalan, no se resuelven a solas.\n4. Los agentes siguen estos lineamientos como el personal.",
    ],
  };
  for (const id of POLICY_IDS) {
    const [version, lang, text] = seeds[id];
    const hash = await sha256(text);
    await DB.put("policies", {
      id,
      version,
      lang,
      text,
      hash,
      publishedAt: nowISO(),
      publishedBy: "sistema",
      history: [],
    });
  }
}

/* Finds a policy by id. */

const policyOf = (id) => S.policies.find((p) => p.id === id);

/* Bumps a version: minor by default, major on request. */

const nextVersion = (v, major) => {
  const [a, b] = String(v).split(".").map(Number);
  return major ? `${a + 1}.0` : `${a}.${(b || 0) + 1}`;
};

/* Comparison of two texts, line by line: what is new, what is gone, how many clauses. */

function comparePolicy(oldText, newText) {
  const norm = (t) =>
    t
      .split(/\r?\n/)
      .map((l) => l.trim())
      .filter(Boolean);
  const a = norm(oldText),
    b = norm(newText);
  const A = new Set(a),
    B = new Set(b);
  const clause = (l) => /^(\d+[.)]|[IVX]+\.|#|[A-ZÁÉÍÓÚÑ][^:]{2,40}:)/.test(l);
  return {
    added: b.filter((l) => !A.has(l)),
    removed: a.filter((l) => !B.has(l)),
    clauses: b.filter(clause).length,
    identical: a.join("\n") === b.join("\n"),
    chars: newText.trim().length,
  };
}

/* The authenticator mock: number matching, five seconds, self-approves. Resolves true on approval, false on cancel. */

function authenticate(actionLabel) {
  return new Promise((resolve) => {
    const number = String(10 + Math.floor(Math.random() * 90));
    const veil = document.createElement("div");
    veil.className = "notice-veil";
    const el = document.createElement("div");
    el.className = "notice";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-label", "authenticator");
    el.innerHTML = `<div class="row" style="gap:14px;align-items:flex-start"><svg viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="Microsoft Authenticator"><rect x="4" y="4" width="56" height="56" rx="12" fill="#0f6cbd"/><path d="M32 14 L46 20 V32 C46 41 40 47 32 50 C24 47 18 41 18 32 V20 Z" fill="#fff"/><path d="M25 32 L30 37 L40 27" fill="none" stroke="#0f6cbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex:1"><h3>${esc(L("Approve on your phone", "Apruebe en su teléfono"))}</h3><p style="margin-bottom:10px">${esc(actionLabel)}</p><p style="margin-bottom:8px">${esc(L("Open Microsoft Authenticator and tap the number you see here:", "Abra Microsoft Authenticator y toque el número que ve aquí:"))}</p>
      <div style="font-size:44px;font-weight:800;letter-spacing:4px;color:var(--text);margin:4px 0 10px" aria-live="polite">${number}</div>
      <div class="bar" style="margin-bottom:8px"><i id="authBar" style="width:0%;transition:width 5s linear;background:#0f6cbd"></i></div><div id="authState" class="sub" style="margin:0">${esc(L("Waiting for approval…", "Esperando aprobación…"))} <span id="authCount">5</span> s</div></div></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-auth-cancel>${esc(t("cancel"))}</button></div>`;
    document.body.append(veil, el);
    requestAnimationFrame(() => {
      const bar = el.querySelector("#authBar");
      if (bar) bar.style.width = "100%";
    });
    let left = 5;
    const tick = setInterval(() => {
      left--;
      const c = el.querySelector("#authCount");
      if (c) c.textContent = String(Math.max(0, left));
    }, 1000);
    const done = (ok) => {
      clearInterval(tick);
      clearTimeout(timer);
      el.remove();
      veil.remove();
      resolve(ok);
    };
    const timer = setTimeout(() => {
      const st = el.querySelector("#authState");
      if (st)
        st.innerHTML = `<span style="color:var(--led);font-weight:700">${esc(L("Approved", "Aprobado"))}</span> · ${esc(actor())} · iPhone`;
      setTimeout(() => done(true), 700);
    }, 5000);
    el.querySelector("[data-auth-cancel]").onclick = () => done(false);

    // [TIE-IN: identity provider] replace the timer with the push result from Microsoft Entra / Authenticator number matching

  });
}

/* A scrolling pop-up with the full text of one version and a PDF download. */

function openPolicyVersion(id, version) {
  const p = policyOf(id);
  const meta = POLICY_META()[id];
  const v = version === p.version ? p : p.history.find((h) => h.version === version);
  if (!v) return;
  const dlg = document.createElement("dialog");
  dlg.style.maxWidth = "820px";
  dlg.style.width = "94%";
  dlg.innerHTML = `<div class="row spread"><h2 style="margin:0">${esc(meta.name)} · v${esc(v.version)}</h2><span class="status ${v === p ? "ok" : ""}">${esc(v === p ? L("current", "vigente") : L("previous", "anterior"))}</span></div>
    <div class="sub" style="margin:6px 0 10px">${esc(L("Published", "Publicada"))} ${new Date(v.publishedAt).toLocaleString()} · ${esc(v.publishedBy)} · ${esc(v.lang.toUpperCase())} · <span class="hash">${esc(v.hash.slice(0, 24))}…</span></div>
    <div class="reading" tabindex="0" aria-label="${esc(meta.name)} v${esc(v.version)}">${esc(v.text)}</div>
    <div class="row spread" style="margin-top:14px"><button class="btn" data-x>${esc(L("Close", "Cerrar"))}</button><button class="btn primary" data-pdf>${esc(L("Download PDF", "Descargar PDF"))}</button></div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  dlg.querySelector("[data-x]").onclick = () => {
    dlg.close();
    dlg.remove();
  };
  dlg.querySelector("[data-pdf]").onclick = () => {
    const blob = makePDF(
      `${meta.name} v${v.version}`,

/* A minimal PDF writer: Helvetica, WinAnsi (accents survive), wrapped lines, several pages. Enough for a policy text. */

function makePDF(title, lines) {
  const wrap = (s, max = 92) => {
    const out = [];
    for (const raw of lines) {
      let l = String(raw);
      if (!l) {
        out.push("");
        continue;
      }
      while (l.length > max) {
        let cut = l.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(l.slice(0, cut));
        l = l.slice(cut).trimStart();
      }
      out.push(l);
    }
    return out;
  };
  const esc = (s) => s.replace(/[\\()]/g, (c) => "\\" + c).replace(/[^\x20-\x7e\xa0-\xff]/g, "?");
  const encode = (s) => {
    let out = "";
    for (const ch of s) {
      const c = ch.charCodeAt(0);
      out += c < 256 ? String.fromCharCode(c) : "?";
    }
    return out;
  };
  const all = wrap(null);
  const perPage = 52;
  const pages = [];
  for (let i = 0; i < all.length; i += perPage) pages.push(all.slice(i, i + perPage));
  if (!pages.length) pages.push([""]);
  const objs = [];
  const add = (s) => {
    objs.push(s);
    return objs.length;
  };
  const fontId = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const pageIds = [];
  const contentIds = [];
  for (const pg of pages) {
    let stream = "BT /F1 11 Tf 56 770 Td 14 TL\n";
    pg.forEach((l, i) => {
      stream += (i === 0 ? "" : "T* ") + "(" + esc(encode(l)) + ") Tj\n";
    });
    stream += "ET";
    const cid = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    contentIds.push(cid);
  }
  const pagesIdx = objs.length + pages.length + 1;
  pages.forEach((pg, i) => {
    pageIds.push(
      add(
        `<< /Type /Page /Parent ${pagesIdx} 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${contentIds[i]} 0 R >>`
      )
    );
  });
  add(`<< /Type /Pages /Kids [${pageIds.map((p) => p + " 0 R").join(" ")}] /Count ${pageIds.length} >>`);
  const catalogId = add(`<< /Type /Catalog /Pages ${pagesIdx} 0 R >>`);
  add(`<< /Title (${esc(encode(title))}) /Producer (Armada Bridge) >>`);
  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((o, i) => {
    offsets.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${o}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf +=
    `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` +
    offsets.map((o) => String(o).padStart(10, "0") + " 00000 n \n").join("") +
    `trailer\n<< /Size ${objs.length + 1} /Root ${catalogId} 0 R /Info ${objs.length} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type: "application/pdf" });
}

/* The studio assistant: reads plain-language instructions and returns rules, conflicts, tone notes, and a sample reply. Deterministic, so demos repeat. */

function studioAnalyze(draft) {
  const text = draft.instructions || "";
  const sentences = text
    .split(/(?<=[.!?\n])\s+/)
    .map((s) => s.trim())
    .filter((s) => s.length > 3);
  const rules = sentences
    .filter((s) => /\b(must|never|always|only|do not|don't|nunca|siempre|solo|sólo|debe|no )\b/i.test(s))
    .slice(0, 8);

  /* A forbidden term is a conflict only when the sentence tells the agent to do it. "Nunca uses amenazas" is a prohibition, not a conflict:
     a negation (nunca, never, no, jamás, do not, prohibido) that comes before the term in the same sentence turns it into a rule. */

  const negation = /\b(nunca|never|jamás|jamas|no|not|don't|do not|nadie|prohib\w*|evita\w*|avoid)\b/i;
  const conflicts = [];
  for (const sent of sentences) {
    const low = sent.toLowerCase();
    for (const [k, why] of FORBIDDEN) {
      const at = low.indexOf(k);
      if (at < 0) continue;
      const before = low.slice(0, at);
      if (negation.test(before)) continue;
      if (!conflicts.includes(why)) conflicts.push(why);
    }
  }
  const shouting = (text.match(/!/g) || []).length > 2 || /[A-ZÁÉÍÓÚ]{6,}/.test(text);
  const toneNote = shouting
    ? L(
        "The text shouts (exclamation marks or capitals); the tone setting says otherwise.",
        "El texto grita (signos de admiración o mayúsculas); el tono elegido dice lo contrario."
      )
    : L("The wording matches the chosen tone.", "La redacción coincide con el tono elegido.");
  const name = draft.name || L("the agent", "el agente");
  const greet =
    draft.tone === "formal"
      ? L("Dear customer,", "Estimado cliente,")
      : draft.tone === "warm"
        ? L("Hello!", "¡Hola!")
        : L("Good morning,", "Buenos días,");
  const sample = `${greet} ${L("this is", "le escribe")} ${name}, ${L("a software assistant for the institution.", "un asistente de software de la institución.")} ${L("Invoice", "La factura")} 3F2A-3E8 ${L("of", "por")} $48,000.00 MXN ${L("is due on the 26th. If it has already been paid, thank you; if not, the payment complement can be requested from this same message. I can only help with invoices and payments; a person from the bank handles anything else.", "vence el día 26. Si ya fue pagada, gracias; si no, el complemento de pago puede solicitarse desde este mismo mensaje. Solo puedo ayudar con facturas y pagos; una persona del banco atiende cualquier otro tema.")}`;
  const missing = [];
  if (!/software|asistente|assistant/i.test(text))
    missing.push(
      L(
        "says it is software (required by the guardrails; added automatically)",
        "dice que es software (lo exigen los guardarraíles; se añade automáticamente)"
      )
    );
  if (!/human|humano|persona|escal/i.test(text))
    missing.push(L("says when it hands off to a person", "dice cuándo entrega a una persona"));
  return { rules, conflicts, toneNote, sample, missing, words: text.split(/\s+/).filter(Boolean).length };
}
