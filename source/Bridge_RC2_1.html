/* One call to an OpenAI-compatible chat endpoint. Streams when the server streams; falls back to the plain reply. Returns the full text. */

async function openaiChat(url, headers, model, messages, onDelta, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...headers },
      body: JSON.stringify({ model, messages, stream: true, temperature: 0.6 }),
      signal: ctl.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("text/event-stream") && res.body && res.body.getReader) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "",
        out = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith("data:")) continue;
          const data = t.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta?.content || j.choices?.[0]?.text || "";
            if (delta) {
              out += delta;
              onDelta && onDelta(out);
            }
          } catch {}
        }
      }
      if (out) return out;
    }
    const text = await res.text();
    let j = null;
    try {
      j = JSON.parse(text);
    } catch {}
    const content =
      j?.choices?.[0]?.message?.content ||
      j?.choices?.[0]?.text ||
      j?.content ||
      (typeof j === "string" ? j : "") ||
      (!j && text ? text : "");
    if (!content) throw new Error("empty reply");
    onDelta && onDelta(content);
    return content;
  } finally {
    clearTimeout(timer);
  }
}

/* The provider ladder. Each rung returns { text, via, left } or throws; the first success wins. */

const PROVIDERS = {

  /* Rung: the cluster's own OpenAI-compatible endpoint; nothing leaves the room. */

  cluster: {
    name: L("the cluster", "el clúster"),
    left: false,
    async run(msgs, onDelta, cfg) {
      if (!cfg.cluster.url) throw new Error("not configured");
      const base = cfg.cluster.url.replace(/\/+$/, "");
      const url = /\/chat\/completions$/.test(base) ? base : base + "/chat/completions";
      return openaiChat(url, {}, cfg.cluster.model || "default", msgs, onDelta, cfg.timeoutMs);
    },

    /* [TIE-IN: ARC inference gateway] exo :52415/v1, LM Studio :1234/v1, Ollama :11434/v1 */

  },

  /* Rung: OpenRouter with the person's key. */

  openrouter: {
    name: "OpenRouter",
    left: true,
    async run(msgs, onDelta, cfg) {
      if (!cfg.openrouter.key) throw new Error("no key");
      return openaiChat(
        "https://openrouter.ai/api/v1/chat/completions",
        {
          Authorization: "Bearer " + cfg.openrouter.key,
          "HTTP-Referer": location.origin || "https://bridge.armada.local",
          "X-Title": "Armada Bridge",
        },
        cfg.openrouter.model || "openrouter/auto",
        msgs,
        onDelta,
        cfg.timeoutMs
      );
    },
  },

  /* Rung: Pollinations, keyless legacy endpoint first, then the new gateway with a publishable key. */

  pollinations: {
    name: "Pollinations",
    left: true,
    async run(msgs, onDelta, cfg) {
      const model = cfg.pollinations.model || "openai";
      if (cfg.pollinations.key)
        return openaiChat(
          "https://gen.pollinations.ai/v1/chat/completions",
          { Authorization: "Bearer " + cfg.pollinations.key },
          model,
          msgs,
          onDelta,
          cfg.timeoutMs

          /* publishable pk_ keys are meant for browsers */

        );
      try {
        return await openaiChat("https://text.pollinations.ai/openai", {}, model, msgs, onDelta, cfg.timeoutMs);
      } catch {
        const last = msgs.filter((m) => m.role === "user").pop()?.content || "";
        const sys = msgs.find((m) => m.role === "system")?.content || "";
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), cfg.timeoutMs);
        try {
          const res = await fetch(
            `https://text.pollinations.ai/${encodeURIComponent(last)}?model=${encodeURIComponent(model)}&system=${encodeURIComponent(sys)}`,
            { signal: ctl.signal }
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = (await res.text()).trim();
          if (!text) throw new Error("empty reply");
          onDelta && onDelta(text);
          return text;
        } finally {
          clearTimeout(timer);
        }
      }
    },
  },

  /* Rung: the built-in script, the last resort. */

  mock: {
    name: L("the built-in script", "el guion integrado"),
    left: false,
    async run(msgs, onDelta) {
      const text = taylorMock(msgs);
      onDelta && onDelta(text);
      return text;
    },
  },
};

/* Climbs the provider ladder in the configured order and returns the first answer with its label. */

async function askTaylor(history, onDelta, onStatus) {
  const cfg = aiCfg();
  const msgs = [
    { role: "system", content: TAYLOR_SYSTEM() },
    ...history.slice(-12).map((m) => ({ role: m.who === "user" ? "user" : "assistant", content: m.text })),
  ];
  const tried = [];
  for (const id of cfg.order) {
    const p = PROVIDERS[id];
    if (!p) continue;
    if (id === "device" && Device.status !== "ready") {
      tried.push(`${p.name}: ${L("not loaded", "no cargado")}`);
      continue;
    }
    onStatus && onStatus(`${L("Trying", "Probando")} ${p.name}…`);
    try {
      const text = await p.run(msgs, onDelta, cfg);
      return { text, via: id, name: p.name, left: p.left, tried };
    } catch (err) {
      tried.push(`${p.name}: ${err.message}`);
    }
  }
  return { text: taylorMock(msgs), via: "mock", name: PROVIDERS.mock.name, left: false, tried };
}

/* Taylor's script: answers the obvious, then steers, gently and persistently, toward the person's favorite vacation. */

function taylorMock(msgs) {
  const user = msgs.filter((m) => m.role === "user");
  const q = (user[user.length - 1]?.content || "").toLowerCase();
  const turn = user.length;
  const es = state.lang === "es";
  const said = user.map((m) => m.content.toLowerCase()).join(" ");
  const vacationMentioned = /vacaci|vacation|playa|beach|viaje|trip|holiday|montaña|mountain/.test(said);
  let answer = "";
  if (/hora|time/.test(q) && /qué|what|es|is/.test(q))
    answer = es
      ? `Son las ${new Date().toTimeString().slice(0, 5)} aquí en el clúster.`
      : `It is ${new Date().toTimeString().slice(0, 5)} here on the cluster.`;
  else if (/fecha|date|día es|day is/.test(q))
    answer = es
      ? `Hoy es ${new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" })}.`
      : `Today is ${new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}.`;
  else if (/factura|invoice|rep\b/.test(q))
    answer = es
      ? `Hay ${S.invoices.filter((i) => i.stage === "rep_pending").length} REP pendientes; tres pasan del día 3. Puedo listarlos o solicitar el complemento desde aquí.`
      : `There are ${S.invoices.filter((i) => i.stage === "rep_pending").length} REPs pending; three are past day 3. I can list them or request the complement from here.`;
  else if (/cobranza|collection|toque|touch/.test(q))
    answer = es
      ? `${S.accounts.reduce((n, a) => n + a.touchesToday, 0)} toques hoy, máximo dos por cuenta. Nadie recibe más, ni por mí.`
      : `${S.accounts.reduce((n, a) => n + a.touchesToday, 0)} touches today, two per account at most. Nobody gets more, not even from me.`;
  else if (/energ|solar|bater|battery|grid|red\b/.test(q)) {
    const p = S.power[0] || {};
    answer = es
      ? `Solar ${(p.solarKW || 0).toFixed(1)} kW, baterías ${p.batteryPct}%, red ${p.islanded ? "abierta" : "en espera"}. Electrones propios.`
      : `Solar ${(p.solarKW || 0).toFixed(1)} kW, batteries ${p.batteryPct}%, grid ${p.islanded ? "open" : "on standby"}. Owned electrons.`;
  } else if (/quién eres|who are you|qué eres|what are you|taylor/.test(q)) answer = TAYLOR_STORY();
  else if (/hola|hello|hi\b|buenos|good/.test(q) && turn <= 1)
    answer = es
      ? "Hola. Taylor. Nada de lo que digamos sale de esta sala."
      : "Hello. Taylor. Nothing we say leaves this room.";
  else if (/playa|beach/.test(q))
    answer = es
      ? "Playa. Estadísticamente la respuesta correcta. ¿Cuál, y con quién?"
      : "Beach. Statistically the correct answer. Which one, and with whom?";
  else if (/montaña|mountain|nieve|snow|esquí|ski/.test(q))
    answer = es
      ? "Montaña. Menor varianza en el clima, mayor en las rodillas. ¿Dónde?"
      : "Mountains. Lower variance in weather, higher in knees. Where?";
  else if (/ciudad|city|europa|europe|japón|japan|parís|paris|roma|rome/.test(q))
    answer = es
      ? "Una ciudad. Buen retorno por hora caminada. ¿Qué la hizo la favorita?"
      : "A city. Good return per hour walked. What made it the favorite?";
  else if (/no\b|nada|prefiero no|rather not|later|después|trabajo|work/.test(q) && vacationMentioned)
    answer = es
      ? "Registrado. Un quant no deja una variable sin observar."
      : "Noted. A quant never leaves a variable unobserved.";
  else
    answer = es
      ? "Entendido. Lo tengo anotado y sellado; nada salió del clúster."
      : "Understood. Noted and sealed; nothing left the cluster.";
  const nudges = es
    ? [
        "Cambiando de tema con toda intención: ¿cuál fue su mejor vacación?",
        "Sigo esperando el dato que importa: ¿playa, montaña o ciudad?",
        "Asumiré playa hasta que me corrija. ¿Me corrige?",
        "Última vez, lo prometo (no prometo): ¿a dónde volvería mañana sin pensarlo?",
      ]
    : [
        "Changing the subject on purpose: what was your best vacation?",
        "Still waiting on the variable that matters: beach, mountains, or a city?",
        "I will assume beach until corrected. Do you correct me?",
        "Last time, I promise (I do not): where would you go back to tomorrow without thinking?",
      ];
  const nudge =
    vacationMentioned &&
    /playa|beach|montaña|mountain|ciudad|city|europa|europe|japón|japan|parís|paris|roma|rome/.test(q)
      ? ""
      : nudges[Math.min(nudges.length - 1, Math.max(0, turn - 1))];
  return nudge ? `${answer} ${nudge}` : answer;
}

   works in any modern browser). Bridge tries them in that order, and within
   WebLLM tries the f16 model first and the f32 variant when the GPU lacks
   16-bit shaders (Safari sometimes). Everything downloads once and caches.
   Bringing the model in is an explicit tap, never automatic on first use.
   If you see "Importing a module script failed," the page is running inside

   open the same file in Safari or Chrome.

const WEBLLM_CDNS = [
  "https://esm.run/@mlc-ai/web-llm",
  "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
  "https://unpkg.com/@mlc-ai/web-llm?module",
];
const TRANSFORMERS_CDNS = [
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3",
  "https://esm.run/@huggingface/transformers@3",
  "https://unpkg.com/@huggingface/transformers@3?module",
];

/* Imports a module from the first CDN that answers; explains a blocked-scripts window when the import is refused. */

const importAny = async (urls, hookName) => {
  if (globalThis[hookName]) return globalThis[hookName]();
  let last;
  for (const url of urls) {
    try {

      /* webpackIgnore: true */

      return await import(url);
    } catch (e) {
      last = e;
    }
  }
  throw new Error(
    (last?.message || "import failed") +
      (/module script/i.test(last?.message || "")
        ? " · " +
          L(
            "this window blocks outside scripts; open the file in Safari or Chrome",
            "esta ventana bloquea scripts externos; abra el archivo en Safari o Chrome"
          )
        : "")
  );
};

/* The on-device engine: brings a model in through WebLLM or Transformers.js and answers from it. */

const Device = {
  backend: null,
  lib: null,
  engine: null,
  pipe: null,
  modelId: null,
  status: "idle",
  progress: 0,
  text: "",
  error: "",
  log: [],

  /* True when this browser can run a model at all (WebGPU or WebAssembly). */

  supported() {
    return !!(globalThis.navigator && (navigator.gpu || typeof WebAssembly !== "undefined"));
  },

  /* True when WebGPU is present. */

  hasGPU() {
    return !!(globalThis.navigator && navigator.gpu);
  },

  /* Keeps a short log of what the engine tried. */

  note(t) {
    this.log.push(t);
    if (this.log.length > 30) this.log.shift();
  },

  /* Uses the requested model id if the engine knows it, otherwise the closest small Qwen. */

  resolveModel(lib, wanted) {
    const list = (lib.prebuiltAppConfig?.model_list || []).map((m) => m.model_id);
    if (!list.length || list.includes(wanted)) return wanted;
    return list.find((id) => /^Qwen2\.5-1\.5B.*q4f16/.test(id)) || list.find((id) => /^Qwen/.test(id)) || list[0];
  },

  /** GPU path: WebLLM, f16 first, f32 when the adapter lacks shader-f16 or f16 fails. */

  async viaWebLLM(modelId, onProgress) {
    const lib = await importAny(WEBLLM_CDNS, "WebLLMLoader");
    this.lib = lib;
    onProgress && onProgress(0.02, "WebLLM " + L("engine ready", "motor listo"));
    let f16ok = true;
    try {
      const ad = await navigator.gpu.requestAdapter();
      f16ok = !!(ad && ad.features && ad.features.has && ad.features.has("shader-f16"));
    } catch {
      f16ok = true;
    }
    const candidates = [this.resolveModel(lib, modelId)];
    const f32 = candidates[0].replace("q4f16_1", "q4f32_1");
    if (f32 !== candidates[0]) {
      if (!f16ok) candidates.unshift(f32);
      else candidates.push(f32);
    }
    let last;
    for (const id of candidates) {
      try {
        this.note("WebLLM → " + id);
        if (this.engine) {
          try {
            await this.engine.unload();
          } catch {}
        }
        this.engine = await lib.CreateMLCEngine(id, {
          initProgressCallback: (r) => {
            this.progress = r.progress || 0;
            this.text = r.text || "";
            onProgress && onProgress(this.progress, r.text || "");
          },
        });
        this.modelId = id;
        this.backend = "webllm";
        return id;
      } catch (e) {
        last = e;
        this.note("WebLLM ✗ " + id + ": " + e.message);
      }
    }
    throw last || new Error("WebLLM failed");
  },

  /** CPU or GPU path through Transformers.js: works without WebGPU (WebAssembly), slower. */

  async viaTransformers(modelId, onProgress) {
    const tf = await importAny(TRANSFORMERS_CDNS, "TransformersLoader");
    onProgress && onProgress(0.02, "Transformers.js " + L("engine ready", "motor listo"));
    const m = DEVICE_MODELS.find((x) => x.id === modelId);
    const tfId = (m && m.tf) || "onnx-community/Qwen2.5-0.5B-Instruct";
    const device = this.hasGPU() ? "webgpu" : "wasm";
    const dtype = device === "webgpu" ? "q4f16" : "q4";
    this.note(`Transformers.js → ${tfId} · ${device} · ${dtype}`);
    this.pipe = await tf.pipeline("text-generation", tfId, {
      device,
      dtype,
      progress_callback: (p) => {
        if (p.status === "progress" && p.total) {
          this.progress = Math.min(0.99, (p.loaded || 0) / p.total);
          onProgress && onProgress(this.progress, `${p.file || ""} ${Math.round(this.progress * 100)}%`);
        } else if (p.status) onProgress && onProgress(this.progress, p.status + " " + (p.file || ""));
      },
    });
    this.tf = tf;
    this.modelId = tfId + " (" + device + ")";
    this.backend = "transformers";
    return this.modelId;
  },

  /* Loads a model: GPU engine first, CPU engine if that fails; reports progress. */

  async bringIn(modelId, onProgress) {
    this.status = "loading";
    this.progress = 0;
    this.error = "";
    this.log = [];
    const errors = [];
    if (this.hasGPU()) {
      try {
        const id = await this.viaWebLLM(modelId, onProgress);
        this.status = "ready";
        this.progress = 1;
        return id;
      } catch (e) {
        errors.push("WebLLM: " + e.message);
        onProgress &&
          onProgress(
            0,
            L("GPU engine failed, trying the CPU engine…", "Falló el motor GPU, probando el motor por CPU…")
          );
      }
    }
    try {
      const id = await this.viaTransformers(modelId, onProgress);
      this.status = "ready";
      this.progress = 1;
      return id;
    } catch (e) {
      errors.push("Transformers.js: " + e.message);
    }
    this.status = "error";
    this.error = errors.join(" | ");
    throw new Error(errors.join(" | "));
  },

  /* True when the GPU engine already has the model in its cache. */

  async cached(modelId) {
    try {
      if (!this.hasGPU()) return false;
      const lib = await importAny(WEBLLM_CDNS, "WebLLMLoader");
      return lib.hasModelInCache ? await lib.hasModelInCache(this.resolveModel(lib, modelId)) : false;
    } catch {
      return false;
    }
  },

  /* Answers from the loaded model, streaming, with any thinking blocks stripped. */

  async chat(messages, onDelta) {
    if (this.status !== "ready")
      throw new Error(
        L(
          "the model is not in the room yet; tap Bring Taylor in",
          "el modelo aún no está en la sala; toque Traer a Taylor"
        )
      );
    const clean = (s) => s.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    if (this.backend === "webllm") {
      const req = { messages, stream: true, temperature: 0.6, max_tokens: 320 };
      if (/^Qwen3/.test(this.modelId || "")) req.extra_body = { enable_thinking: false };
      const chunks = await this.engine.chat.completions.create(req);
      let out = "";
      for await (const c of chunks) {
        const d = c.choices?.[0]?.delta?.content || "";
        if (d) {
          out += d;
          onDelta && onDelta(clean(out));
        }
      }
      return clean(out) || L("(no answer)", "(sin respuesta)");
    }
    let out = "";
    const streamer = this.tf.TextStreamer
      ? new this.tf.TextStreamer(this.pipe.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (t) => {
            out += t;
            onDelta && onDelta(clean(out));
          },
        })
      : undefined;
    const res = await this.pipe(messages, { max_new_tokens: 256, do_sample: false, streamer });
    const final =
      out ||
      (Array.isArray(res) && res[0]?.generated_text
        ? Array.isArray(res[0].generated_text)
          ? res[0].generated_text.at(-1)?.content
          : String(res[0].generated_text)
        : "");
    return clean(final || "") || L("(no answer)", "(sin respuesta)");
  },
};

/* Rails that need a key but no server: OpenAI, Anthropic, Gemini, Groq; plus two keyless ones: Claude inside Claude's own artifact runtime, and Puter (free, signs the person in). */

async function anthropicChat(key, model, messages, onDelta, timeoutMs, extraHeaders = {}) {
  const system = messages.find((m) => m.role === "system")?.content || "";
  const msgs = messages.filter((m) => m.role !== "system");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const headers = { "content-type": "application/json", "anthropic-version": "2023-06-01", ...extraHeaders };
    if (key) {
      headers["x-api-key"] = key;
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({ model, max_tokens: 400, system, messages: msgs, stream: !!key }),
      signal: ctl.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (!key) {
      const j = await res.json();
      const text = (j.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("");
      if (!text) throw new Error("empty reply");
      onDelta && onDelta(text);
      return text;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "",
      out = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        try {
          const j = JSON.parse(line.slice(5).trim());
          if (j.type === "content_block_delta" && j.delta?.text) {
            out += j.delta.text;
            onDelta && onDelta(out);
          }
        } catch {}
      }
    }
    if (!out) throw new Error("empty reply");
    return out;
  } finally {
    clearTimeout(timer);
  }
}

/* Loads puter.js on demand and asks it for a reply (the person signs in on first use). */

async function puterChat(messages, onDelta, timeoutMs) {

  /* test hook */

  if (globalThis.PuterLoader) globalThis.puter = await globalThis.PuterLoader();
  if (!globalThis.puter) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://js.puter.com/v2/";
      s.onload = res;
      s.onerror = () => rej(new Error("puter.js could not load"));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error("puter.js timed out")), timeoutMs);
    });
  }
  const r = await puter.ai.chat(messages, { model: "gpt-5-nano" });
  const text = (r && (r.message?.content ?? r.text ?? r.toString())) || "";
  if (!text) throw new Error("empty reply");
  onDelta && onDelta(String(text));
  return String(text);
}

   --------------------------------------------------------------------------
   FOR THE NOVICE: an enterprise with stores runs Génesis in more than one
   place, buys from suppliers, and must match what it ordered, received, was
   billed and paid before it pays. These screens add that world on top of the

/* Deterministic checks for one case: each returns { rule, ok, detail }. Only what fails goes to the agent. */

function caseChecks(c) {
  const inv = S.invoices.find((x) => x.id === c.invoice) || {};
  const po = S.pos.find((x) => x.id === c.po) || {};
  const gr = S.receipts.find((x) => x.po === c.po) || {};
  const bk = S.bankrecs.find((x) => x.invoice === c.invoice);
  const sup = S.suppliers.find((x) => x.id === c.supplier) || {};
  const dup = S.invoices.filter((x) => x.type === "payable" && x.uuid === inv.uuid).length > 1;
  return [
    {
      rule: "M-01",
      name: L(
        "Quantity billed within tolerance of quantity received",
        "Cantidad facturada dentro de tolerancia de la recibida"
      ),
      ok: gr.qty !== undefined && Math.abs((inv.qty || 0) - gr.qty) <= gr.qty * MATCH_TOLERANCE,
      detail: `${L("ordered", "pedido")} ${po.qty} · ${L("received", "recibido")} ${gr.qty} · ${L("billed", "facturado")} ${inv.qty}`,
    },
    {
      rule: "M-02",
      name: L("Unit price matches the purchase order", "Precio unitario igual al de la orden"),
      ok: inv.price === po.price,
      detail: `${L("order", "orden")} $${po.price} · ${L("invoice", "factura")} $${inv.price}`,
    },
    {
      rule: "M-03",
      name: L("RFC on the CFDI matches the supplier of record", "RFC del CFDI igual al del proveedor registrado"),
      ok: inv.rfc === sup.rfc,
      detail: `${inv.rfc} · ${sup.rfc}`,
    },
    {
      rule: "M-04",
      name: L("UUID not seen before on a payable", "UUID no visto antes en una cuenta por pagar"),
      ok: !dup,
      detail: inv.uuid || "",
    },
    {
      rule: "M-05",
      name: L("CFDI in force at the SAT", "CFDI vigente ante el SAT"),
      ok: inv.sat === "vigente",
      detail: inv.sat || "",
    },
    {
      rule: "M-06",
      name: L("Issuer not on the 69-B list at issue date", "Emisor fuera de la lista 69-B en la fecha de emisión"),
      ok: sup.status !== "69B",
      detail:
        sup.status === "69B"
          ? L("on the list; 30 days to prove receipt", "en la lista; 30 días para probar la recepción")
          : L("clear", "limpio"),
    },
    {
      rule: "M-07",
      name: L(
        "Bank record equals the invoice amount, or no payment yet",
        "Registro bancario igual al monto, o sin pago aún"
      ),
      ok: !bk || Math.abs(bk.amount - inv.amount) < 1,
      detail: bk
        ? `${L("paid", "pagado")} ${money(bk.amount)} · ${L("billed", "facturado")} ${money(inv.amount)}`
        : L("no payment yet", "sin pago aún"),
    },
  ];
}

/* The agent's finding in plain words, from the failed checks, with the recommended action. Scripted; the cluster's model writes this in production. */

function caseFinding(c) {
  const failed = caseChecks(c).filter((k) => !k.ok);
  if (!failed.length)
    return {
      text: L(
        "All seven checks pass; the case can close and the invoice proceed to payment on its terms.",
        "Las siete verificaciones pasan; el caso puede cerrarse y la factura seguir a pago según sus términos."
      ),
      action: "close",
    };
  const first = failed[0].rule;
  const map = {
    "M-01": [
      "inquiry",
      L(
        "The supplier billed more than the distribution centre received. Draft the supplier inquiry with the receiving record attached; do not pay the difference.",
        "El proveedor facturó más de lo que recibió el centro de distribución. Redactar la consulta al proveedor con el registro de recepción adjunto; no pagar la diferencia."
      ),
    ],
    "M-02": [
      "inquiry",
      L(
        "The unit price differs from the order. Ask the supplier for the price agreement or a credit note.",
        "El precio unitario difiere de la orden. Pedir al proveedor el acuerdo de precio o una nota de crédito."
      ),
    ],
    "M-03": [
      "route",
      L(
        "The RFC does not match the supplier of record. Route to the regional team before anything else.",
        "El RFC no coincide con el proveedor registrado. Enviar al equipo regional antes que nada."
      ),
    ],
    "M-04": [
      "route",
      L(
        "This UUID has already been recorded on another payable. Treat as a probable duplicate; hold payment and route to central finance.",
        "Este UUID ya fue registrado en otra cuenta por pagar. Tratar como probable duplicado; retener el pago y enviar a finanzas central."
      ),
    ],
    "M-05": [
      "route",
      L(
        "The CFDI is cancelled at the SAT. Nothing on it can be paid or credited; route to central finance.",
        "El CFDI está cancelado ante el SAT. Nada de él puede pagarse ni acreditarse; enviar a finanzas central."
      ),
    ],
    "M-06": [
      "evidence",
      L(
        "The issuer is on the 69-B list. Gather receiving evidence within thirty days so the fiscal effect is preserved; hold payment.",
        "El emisor está en la lista 69-B. Reunir evidencia de recepción en treinta días para conservar el efecto fiscal; retener el pago."
      ),
    ],
    "M-07": [
      "inquiry",
      L(
        "The bank record and the invoice disagree. Reconcile before any further payment.",
        "El registro bancario y la factura no coinciden. Conciliar antes de cualquier pago adicional."
      ),
    ],
  };
  const [action, text] = map[first];
  return { text, action, failed: failed.map((k) => k.rule) };
}

    reg = by("regional"),
    sa = by("southam"),
    dr = by("recovery")[0];
  const tile = (s, x, y, w = 92) => {
    const color =
      s.kind === "core"
        ? "var(--accent)"

          ? "var(--surface-2)"

            ? "#1a2a3b"

    return `<g data-open="sitio:${s.id}" role="button" tabindex="0" style="cursor:pointer" transform="translate(${x},${y})"><rect width="${w}" height="64" rx="8" fill="${color}" stroke="var(--line)"/><text x="${w / 2}" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--text)">${esc(s.name)}</text><text x="${w / 2}" y="29" text-anchor="middle" font-size="8" fill="var(--led)">${s.nodes} ${L("nodes", "nodos")} · ${s.octets === 0 ? L("replica", "réplica") : s.octets === 1 ? L("single octet", "octeto simple") : s.octets === 2 ? L("dual octet", "octeto doble") : s.octets + " " + L("octets", "octetos")}</text><text x="${w / 2}" y="42" text-anchor="middle" font-size="7.5" fill="var(--muted)">${s.kind === "recovery" ? `${L("lag", "retraso")} ${s.lag} s` : `${s.stores} ${L("stores", "tiendas")}`}</text><text x="${w / 2}" y="55" text-anchor="middle" font-size="7.5" fill="var(--muted)">${s.kind === "recovery" ? L("replicated state", "estado replicado") : `${s.queued} ${L("queued", "en cola")} · ${s.latency} ms`}</text></g>`;
  };
  const totalNodes = S.sites.reduce((n, s) => n + s.nodes, 0),
    coreNodes = core.reduce((n, s) => n + s.nodes, 0) + (dr ? dr.nodes : 0);
  return `<svg viewBox="0 0 800 420" width="100%" role="img" aria-label="enterprise topology" style="min-height:300px">

    <text x="0" y="112" font-size="11" font-weight="700" fill="var(--text-2)">${esc(L("Regional clusters, Mexico", "Clústeres regionales, México"))}</text>${reg.map((s, i) => tile(s, i * 100, 122)).join("")}
    <text x="0" y="208" font-size="11" font-weight="700" fill="var(--text-2)">${esc(L("Dual-octet clusters, South America", "Clústeres de octeto doble, Sudamérica"))} · ${sa.length}</text>${sa.map((s, i) => tile(s, i * 100, 218)).join("")}
    <text x="0" y="304" font-size="11" font-weight="700" fill="var(--text-2)">${esc(L("Stores: connector state, aggregated by region", "Tiendas: estado del conector, agregado por región"))}</text>
    ${[...core, ...reg, ...sa]

/* A site's cluster map, generated from its node count: octets of eight plus the admin node. */

SCREENS.sitio = function () {
  const s = byId("sites", state.params.id);
  if (!s) return notFound(L("Site", "Sitio"));
  const nodes = Array.from({ length: s.nodes }, (_, i) => {
    const oct = Math.floor(i / 8);
    const last = i === s.nodes - 1 && s.nodes % 8 === 1;
    const id = last ? "N" + s.nodes : (s.kind === "recovery" ? "R" : String.fromCharCode(65 + oct)) + ((i % 8) + 1);
    const seed = (s.id.charCodeAt(0) + i * 7) % 23;
    return {
      id,
      role: last ? "Admin + spare" : s.kind === "recovery" ? "Replica" : oct === 0 ? "Kimi shard" : "Llama 4",
      status: seed === 5 ? "warn" : "ok",
      tempC: 56 + (seed % 9) + (seed === 5 ? 22 : 0),
      memGB: 200 - (seed % 6) * 7,
      serial: "SN " + (5200 + i),
    };
  });
  return chrome(
    `bridge.armada.local/topologia/${s.id}`,
    sidebar() +
      `<main>${head(s.name, `${s.city} · ${s.nodes} ${L("nodes", "nodos")} · ${s.kind === "recovery" ? L("replica", "réplica") : s.octets + " " + L("octet(s)", "octeto(s)")} · ${L("latency to core", "latencia al núcleo")} ${s.latency} ms`)}

/* Validators return "" when valid or a reason. Format only: no network. */

const VALID = {

  /* Validator: https:// or sftp:// with a host. */

  url: (v) =>
    /^https?:\/\/[\w.-]+(:\d+)?(\/\S*)?$/i.test(v) || /^sftp:\/\/[\w.-]+/i.test(v)
      ? ""
      : L(
          "Must start with https:// (or sftp://) and name a host.",
          "Debe iniciar con https:// (o sftp://) y nombrar un host."
        ),

  /* Validator: a host name without a scheme. */

  host: (v) =>
    /^[\w.-]+(\.[a-z]{2,})?$/i.test(v) ? "" : L("Host name only, no scheme.", "Solo el nombre del host, sin esquema."),

  /* Validator: a port from 1 to 65535. */

  port: (v) => (/^\d{1,5}$/.test(v) && +v > 0 && +v < 65536 ? "" : L("1 to 65535.", "De 1 a 65535.")),

  /* Validator: any non-empty text. */

  text: (v) => (v.trim() ? "" : L("Required.", "Obligatorio.")),

  /* Validator: at least eight characters; secrets go to the key store, never the browser database. */

  secret: (v) =>
    v.trim().length >= 8
      ? ""
      : L(
          "At least 8 characters; it is stored in the key store, never here.",
          "Al menos 8 caracteres; se guarda en el almacén de llaves, nunca aquí."
        ),

  /* Validator: a Mexican RFC (3 or 4 letters, 6 digits, 3 characters). */

  rfc: (v) =>
    /^([A-ZÑ&]{3,4})\d{6}[A-Z0-9]{3}$/.test(v.toUpperCase())
      ? ""
      : L(
          "RFC: 3 or 4 letters, 6 digits, 3 characters (BRE010101AAA).",
          "RFC: 3 o 4 letras, 6 dígitos, 3 caracteres (BRE010101AAA)."
        ),

  /* Validator: an 18-digit CLABE with its check digit verified. */

  clabe: (v) => {
    const d = v.replace(/\s/g, "");
    if (!/^\d{18}$/.test(d)) return L("CLABE has 18 digits.", "La CLABE tiene 18 dígitos.");
    const w = [3, 7, 1];
    const sum = [...d.slice(0, 17)].reduce((s, c, i) => s + ((+c * w[i % 3]) % 10), 0);
    return (10 - (sum % 10)) % 10 === +d[17]
      ? ""
      : L("CLABE check digit does not match.", "El dígito verificador de la CLABE no coincide.");
  },

  /* Validator: a complete PEM block, BEGIN to END. */

  pem: (v) =>
    /-----BEGIN [A-Z ]+-----[\s\S]+-----END [A-Z ]+-----/.test(v.trim())
      ? ""
      : L("Paste the whole PEM block, BEGIN to END.", "Pegue el bloque PEM completo, de BEGIN a END."),
};

/** Mock test call: deterministic by endpoint text so demos repeat. */

function mockTest(tpl, values) {
  const seedStr = Object.values(values).join("|");
  let h = 0;
  for (const c of seedStr) h = (h * 31 + c.charCodeAt(0)) >>> 0;

  /* one in seven configurations fails, on purpose, with a specific reason */

  const fail = h % 7 === 0;
  return fail
    ? {
        ok: false,
        ms: 812,
        error: L(
          "401 Unauthorized: the credential was rejected by the provider.",
          "401 No autorizado: el proveedor rechazó la credencial."
        ),
      }
    : { ok: true, ms: 120 + (h % 300), sample: tpl.record };
}

/** Read the cluster-side record referenced by a mapping path ("invoices.uuid") from the mock store. */

function clusterValue(path) {
  const [store, field] = path.split(".");
  const rows = S[store] || [];
  const row = rows[0];
  return row ? row[field] : undefined;
}
